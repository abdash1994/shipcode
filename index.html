  return code.split("\n").filter(l=>{const s=l.trim();return /^#\s*(\d+[.)]\s*)?\S+(\s+\S+){2,}/.test(s)&&!skip.has(s)&&!/^# Steps \(write|^# Redo from scratch/.test(s);}).length;}
let draftTimer=null;
function flushDraft(){const ed=document.getElementById("code");if(ed&&lab)saveDraft(draftKey(),ed.value);}

function openLab(id,redo){const L=labById(id);if(!L)return;
  const stage=redo?"redo":stageOf(L);
  lab={L,stage,redo:!!redo,phase:PHASES[stage][0],t0:Date.now(),ptries:0,pdone:false,order:[],runs:0,fails:0,result:null,running:false,showHint:false,showSol:false,resetArm:false,passed:false};
  if(!redo&&S.plans[L.id])lab.phase="code";
  markPractice();save();openSheet();
  if(lab.phase==="predict"&&!predictQ(L))nextPhase();else renderLab();
  clearInterval(labTimer);labTimer=setInterval(()=>{const el=document.getElementById("ltimer");if(el&&lab)el.textContent=mmss();},1000);
  (L.kind==="sql"?getSql():getPy()).catch(()=>{});
}
function taskCard(L){return `<section class="card"><span class="qkind">${kindLabel(L)} · Day ${L.day}${lab.redo?" · redo from scratch":""}</span><h2>${esc(L.title)}</h2><p>${L.task}</p>
  ${L.kind==="sql"?`<details class="tables" ${lab.phase!=="code"?"open":""}><summary>Tables (employees, customers, orders)</summary>${TABLES_HTML}</details>`:""}
  ${L.prelude?`<details><summary>Provided code (already loaded for you)</summary><pre>${esc(L.prelude)}</pre></details>`:""}</section>`;}
function phaseBar(){const seq=PHASES[lab.stage];if(seq.length<2)return "";const names={predict:"By hand",order:"Steps",pattern:"Pattern",code:"Code"};
  return `<div class="phasebar">${seq.map(p=>`<span class="${p===lab.phase?"on":seq.indexOf(p)<seq.indexOf(lab.phase)?"done":""}">${names[p]}</span>`).join("")}</div>`;}

const mmss=()=>{const s=Math.floor((Date.now()-lab.t0)/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
function renderLab(){
  const L=lab.L;
  const head=`<div class="sheet-head"><button class="xbtn" data-l="close" aria-label="Close lab">×</button>${phaseBar()||'<span style="flex:1"></span>'}<span class="pmeta" id="ltimer" title="Time on this lab">${mmss()}</span></div>`;
  let body="",foot="";
  if(lab.phase==="predict"){const P=predictQ(L);
    body=`${taskCard(L)}<section class="card"><span class="eyebrow">Step 1 · Solve one example by hand</span><p>${P.q}</p>
      ${P.multi?`<textarea class="code small" id="pred" spellcheck="false" autocapitalize="off" placeholder="One line per printed line" ${lab.pdone?"readonly":""}>${esc(lab.pval||"")}</textarea>`:`<input class="code" id="pred" ${P.num?'inputmode="numeric"':""} spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="${P.num?"Number of rows":"Type the value"}" value="${esc(lab.pval||"")}" ${lab.pdone?"readonly":""}>`}
      <div id="pfb"></div></section>`;
    foot=lab.pdone?`<button class="btn primary block" data-l="next">Continue</button>`:`<button class="btn primary block" data-l="pcheck">Check</button>`;}
  else if(lab.phase==="order"){
    if(L.free){body=`${taskCard(L)}<section class="card"><span class="eyebrow">Step 2 · The steps</span><p class="muted">These parts can be written in any order. Read each one and picture the line of code it becomes.</p><ol class="plan">${L.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>`;
      foot=`<button class="btn primary block" data-l="next">Continue</button>`;}
    else{if(!lab.pool){lab.pool=shuffled(L.steps.map((_,i)=>i),L.id+"p");if(lab.pool.every((x,i)=>x===i))lab.pool.reverse();}
      const left=lab.pool.filter(i=>!lab.order.includes(i));
      body=`${taskCard(L)}<section class="card"><span class="eyebrow">Step 2 · Break it into steps</span><p>Tap the steps in the order you'd do them. Tap a chosen step to take it back.</p>
        <ol class="plan chosen">${lab.order.map((i,pos)=>`<li><button class="stepbtn ${lab.marks?(lab.marks[pos]?"right":"wrong"):""}" data-l="unpick" data-i="${i}" ${lab.pdone?"disabled":""}>${esc(L.steps[i])}</button></li>`).join("")||'<li class="muted empty">Your plan appears here</li>'}</ol>
        ${left.length?`<div class="pool">${left.map(i=>`<button class="stepbtn" data-l="pick" data-i="${i}">${esc(L.steps[i])}</button>`).join("")}</div>`:""}<div id="pfb">${lab.pmsg||""}</div></section>`;
      foot=lab.pdone?`<button class="btn primary block" data-l="next">Continue</button>`:`<button class="btn primary block" data-l="ocheck" ${left.length?"disabled":""}>Check order</button>`;}}
  else if(lab.phase==="pattern"){if(!lab.popts)lab.popts=patOptions(L);
    body=`${taskCard(L)}<section class="card"><span class="eyebrow">Step ${lab.stage==="guided"?3:2} · Name the pattern</span><p>Which tool fits this problem? (The Think tab's pattern map helps.)</p>
      <div class="opts">${lab.popts.map((p,i)=>`<button class="opt ${lab.pdone?(p===L.pat?"right":i===lab.ppick?"wrong":""):""}" data-l="pat" data-i="${i}" ${lab.pdone?"disabled":""}><span class="k">${i+1}</span><span>${esc(p)}</span></button>`).join("")}</div><div id="pfb">${lab.pmsg||""}</div></section>`;
    foot=lab.pdone?`<button class="btn primary block" data-l="next">Start coding</button>`:"";}
  else{
    const code=drafts[draftKey()]!=null?drafts[draftKey()]:initialCode(L,lab.stage);
    const tip=L.kind==="sql"?"Fill in the recipe comments, then write the query under them.":lab.stage==="guided"?"Turn each plan comment into one or two lines of code. Run often.":lab.stage==="bug"?"Run it first and read the error or the failing test. Then fix it.":"Write at least 3 steps as comments first. Then code each one.";
    body=`${taskCard(L)}${lab.stage==="guided"&&L.steps?`<details class="card plancard"><summary>Your plan</summary><ol class="plan">${L.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></details>`:""}
      <section class="card editor-card"><p class="hint">${tip} Ctrl+Enter runs the tests.</p>
      <div class="ed"><pre class="gutter" id="gutter" aria-hidden="true"></pre><textarea id="code" class="codearea" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Code editor">${esc(code)}</textarea></div>
      <div class="row"><button class="btn primary" data-l="run" ${lab.running?"disabled":""}>${lab.running?"Running…":"Run tests"}</button><button class="btn small" data-l="hint">${lab.showHint?"Hide hint":"Hint"}</button>
        <button class="btn small" data-l="reset">${lab.resetArm?"Tap again to reset":"Reset"}</button>${(lab.fails>=3||lab.passed)&&!lab.redo?`<button class="btn small" data-l="sol">${lab.showSol?"Hide solution":"Solution"}</button>`:""}</div>
      ${lab.showHint?`<div class="fb"><p>${esc(L.hint)}</p></div>`:""}
      ${lab.showSol?`<div class="fb"><p><b>Read it, close it, then type it yourself.</b> It comes back as a redo from scratch.</p><pre>${esc(L.solution)}</pre></div>`:""}
      <div id="res">${resultsHTML()}</div></section>`;}
  sheetIn.innerHTML=`${head}<div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:""}`;
  if(lab.phase==="code")wireEditor();
  else{const p=document.getElementById("pred");if(p){setTimeout(()=>p.focus(),30);p.addEventListener("keydown",e=>{if(e.key==="Enter"&&(!P_multi()||e.ctrlKey||e.metaKey)){e.preventDefault();labAct("pcheck");}});}}
}
const P_multi=()=>{const P=predictQ(lab.L);return P&&P.multi;};

function wireEditor(){const ed=document.getElementById("code"),gut=document.getElementById("gutter");
  const lines=()=>{const n=ed.value.split("\n").length;gut.textContent=Array.from({length:n},(_,i)=>i+1).join("\n");gut.scrollTop=ed.scrollTop;};
  lines();
  ed.addEventListener("scroll",()=>{gut.scrollTop=ed.scrollTop;});
  ed.addEventListener("input",()=>{lines();lab.resetArm=false;clearTimeout(draftTimer);draftTimer=setTimeout(flushDraft,400);});
  ed.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();labAct("run");return;}
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();ed.setRangeText("    ",ed.selectionStart,ed.selectionEnd,"end");lines();return;}
    if(e.key==="Enter"&&!e.shiftKey){const v=ed.value,p=ed.selectionStart,ls=v.lastIndexOf("\n",p-1)+1,line=v.slice(ls,p);
      let ind=(line.match(/^[ \t]*/)||[""])[0];if(/:\s*(#.*)?$/.test(line)&&lab.L.kind==="py")ind+="    ";
      e.preventDefault();ed.setRangeText("\n"+ind,p,ed.selectionEnd,"end");lines();}
  });
}

function errTip(text){const last=String(text).trim().split("\n").pop()||"";const m=last.match(/^(\w+(?:Error|Exception))/);if(!m)return "";
  const r=ERR_ROWS.find(r=>r[0]===m[1]);const ln=(String(text).match(/File "solution\.py", line (\d+)/g)||[]).pop();
  return `<p class="hint">${r?`<b>${esc(m[1])}</b> usually means: ${esc(r[1].toLowerCase())}. Check first: ${esc(r[2].toLowerCase())}.`:""}${ln?` The problem is on <b>line ${esc(ln.split("line ")[1])}</b> of your code.`:""}</p>`;}
function tableHTML(res){if(!res.columns.length)return `<p class="muted">(no rows)</p>`;
  return `<div class="tablebox"><table class="mini"><thead><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${res.values.slice(0,30).map(r=>`<tr>${r.map(x=>`<td>${x===null?'<span class="muted">NULL</span>':esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
const NUDGES=["Stuck is where the learning happens. Shrink the example and trace it by hand, step by step.","Every engineer fails tests all day. The skill is reading exactly what the failure tells you.","Print the variables on the line just before it breaks, then compare them with what you expected.","Re-read your step comments. Is a step missing, or in the wrong order?"];
function nudge(){if(lab.fails<2||lab.passed)return "";const m=NUDGES[(lab.fails-2)%NUDGES.length],w=S.me&&S.me.why;
  return `<div class="nudge"><p>${esc(m)}${lab.fails>=3&&!lab.showHint&&!lab.redo?" The hint is there for exactly this moment.":""}</p>${w?`<p class="muted">Your why: “${esc(w)}”</p>`:""}</div>`;}
function resultsHTML(){const h=resultsCore();return lab.result&&!lab.result.loadFail&&!lab.running?h+nudge():h;}
function resultsCore(){const r=lab.result;
  if(lab.running)return `<p class="muted">${lab.loadingMsg||"Running…"}</p>`;
  if(!r)return "";
  if(r.loadFail){const tests=lab.L.kind==="py"?`<pre>${esc(lab.L.tests.map(t=>t.expr?`assert ${t.expr} == ${t.want}`:`# input: ${t.stdin.join(", ")}  ->  prints:\n# ${t.out.replace(/\n/g,"\n# ")}`).join("\n"))}</pre>`:"";
    return `<div class="fb bad"><b class="t">The code runner couldn't start here</b><p>${esc(r.msg)}${CSPV.length?" (blocked: "+esc(CSPV.slice(0,3).join("; "))+")":""}. Your code is saved. Try again, or open <code>index.html</code> from your Coding Handson folder in Chrome. You can also run it in VS Code${lab.L.kind==="py"?" with these checks at the bottom of your file":""}:</p>${tests}
      <div class="row"><button class="btn small" data-l="run">Try again</button><button class="btn small" data-l="self">I ran it myself and every check passes</button></div></div>`;}
  if(r.kind==="sql"){
    if(r.error)return `<div class="fb bad"><b class="t">SQL error</b><pre>${esc(r.error)}</pre><p class="hint">SQLite names the problem directly. Compare spellings with the tables above.</p></div>`;
    if(r.ok)return passHTML();
    return `<div class="fb bad"><b class="t">Not quite</b><p>${!r.got.values.length?`Your query returned no rows; the answer has ${r.want.values.length}.`:`${!r.colsOK?`Your query returns ${r.got.columns.length} column${r.got.columns.length===1?"":"s"}; the answer has ${r.want.columns.length}. `:""}${r.got.values.length!==r.want.values.length?`You got ${r.got.values.length} row${r.got.values.length===1?"":"s"}; the answer has ${r.want.values.length}.`:lab.L.ordered?"Check the values and the order.":"Same number of rows, but some values differ."}`}</p>${/(=|<>|!=)\s*NULL\b/i.test(r.code||"")?`<p class="hint"><b>Tip:</b> comparing with <code>= NULL</code> never matches anything in SQL, because NULL means "unknown". Use <code>IS NULL</code> or <code>IS NOT NULL</code>.</p>`:""}
      <p class="eyebrow">Your result</p>${tableHTML(r.got)}<p class="eyebrow">Expected</p>${tableHTML(r.want)}</div>`;}
  const tests=r.tests,passN=tests.filter(t=>t.ok).length,errs=tests.map(t=>t.error).filter(Boolean);
  if(passN===tests.length)return passHTML();
  const same=errs.length===tests.length&&errs.every(e=>e===errs[0]);
  return `<div class="fb bad"><b class="t">${passN} of ${tests.length} tests passed</b>
    ${same?`<pre class="tb">${esc(errs[0])}</pre>${errTip(errs[0])}`:""}
    <ul class="tests">${tests.map(t=>`<li class="${t.ok?"pass":"fail"}"><span class="mark">${t.ok?"✓":"✗"}</span><div><b>${esc(t.label)}</b>
      ${!t.ok&&!t.error?`<div class="cmp"><span class="muted">Expected</span><pre>${esc(t.want)}</pre><span class="muted">Got</span><pre>${esc(t.got)}</pre></div>`:""}
      ${t.error&&!same?`<pre class="tb">${esc(t.error)}</pre>${errTip(t.error)}`:""}
      ${t.printed&&!t.ok?`<span class="muted">Your print() output</span><pre>${esc(t.printed)}</pre>`:""}</div></li>`).join("")}</ul></div>`;}
function passHTML(){const s=Math.floor((Date.now()-lab.t0)/1000);const L=lab.L;
  return `<div class="fb ok pass"><b class="t">All tests passed · ${Math.floor(s/60)}m ${s%60}s</b>${labsPassedN()===1&&!lab.redo?`<p><b>Your first passing program here.</b> Everything else in the course builds on what you just did.</p>`:`<p class="muted">Labs passed so far: ${labsPassedN()} of ${ALL_LABS.length}.</p>`}
    ${L.steps&&["pattern","solo","redo","bug"].includes(lab.stage)?`<p>Compare your steps with a model breakdown:</p><ol class="plan">${L.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
    <p class="muted">${lab.redo?"Recall strengthened. The next redo of this lab is scheduled further out.":"This lab comes back as a redo from scratch in 2 days, then 5, 12 and 30."}</p>
    <button class="btn primary" data-l="close">Done</button></div>`;}

async function runLab(){
  if(lab.running)return;const L=lab.L,ed=document.getElementById("code");const code=ed?ed.value:"";flushDraft();
  if(needsSteps()&&countSteps(code,L)<3){lab.result=null;document.getElementById("res").innerHTML=`<div class="fb bad"><b class="t">Steps first</b><p>Write at least 3 steps as comments (each a few words, like <code># loop over the prices</code>) before running. This is the habit that gets you unstuck in interviews.</p></div>`;return;}
  lab.running=true;lab.loadingMsg=(L.kind==="py"?pyReady:sqlReady)?"Running…":L.kind==="py"?"Starting Python in your browser. The first time downloads about 10 MB, so give it a moment…":"Starting SQLite…";renderLab();
  await new Promise(r=>setTimeout(r,30));
  let ok=false;
  try{
    if(L.kind==="py"){const run=await getPy();const out=JSON.parse(run(JSON.stringify({code,prelude:L.prelude||"",tests:L.tests,files:L.files||{},limit:L.limit||3000000})));lab.result={kind:"py",tests:out};ok=out.every(t=>t.ok);}
    else{const SQL=await getSql();lab.result=runSqlLab(SQL,code,L);lab.result.code=code;ok=lab.result.ok;}
  }catch(e){lab.result={loadFail:true,msg:String(e&&e.message||e)};}
  lab.running=false;
  if(!lab.result.loadFail){lab.runs++;if(ok)onPass();else lab.fails++;}
  renderLab();
  const res=document.getElementById("res");if(res&&res.scrollIntoView)res.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function onPass(){if(lab.passed)return;lab.passed=true;labPassed(lab.L,lab.redo);markPractice();save();topStats();}

function labAct(a,btn){if(!lab)return;const L=lab.L;
  if(a==="close"){closeSheet();return;}
  if(a==="next"){nextPhase();return;}
  if(a==="pcheck"){const P=predictQ(L),el=document.getElementById("pred");if(!el||!el.value.trim())return;
    lab.pval=el.value;const ok=P.num?parseInt(el.value,10)===+P.a:pnorm(el.value)===pnorm(P.a);lab.ptries++;
    const fb=document.getElementById("pfb");
    if(ok||lab.ptries>=2){lab.pdone=true;renderLab();document.getElementById("pfb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b class="t">${ok?"Right. You just solved it by hand.":"Here's the answer"}</b><pre>${esc(P.a)}</pre><p>${ok?"Now notice what you did to get there: those are your steps.":"Trace it once more by hand until you see why. That's the reasoning your code has to repeat."}</p></div>`;}
    else fb.innerHTML=`<div class="fb bad"><b class="t">Not quite</b><p>Go slower: write out each step on paper. One more try.</p></div>`;
    return;}
  if(a==="pick"){lab.order=[...lab.order,+btn.dataset.i];lab.marks=null;lab.pmsg="";renderLab();return;}
  if(a==="unpick"){lab.order=lab.order.filter(i=>i!==+btn.dataset.i);lab.marks=null;lab.pmsg="";renderLab();return;}
  if(a==="ocheck"){lab.ptries++;lab.marks=lab.order.map((i,pos)=>i===pos);const ok=lab.marks.every(Boolean);
    if(ok){lab.pdone=true;lab.pmsg=`<div class="fb ok"><b class="t">That's a working plan</b><p>It becomes the comments in your editor.</p></div>`;}
    else if(lab.ptries>=2){lab.pdone=true;lab.order=L.steps.map((_,i)=>i);lab.marks=lab.order.map(()=>true);lab.pmsg=`<div class="fb bad"><b class="t">Here's a working order</b><p>Read it top to bottom and ask why each step must come before the next one.</p></div>`;}
    else lab.pmsg=`<div class="fb bad"><b class="t">Some steps are out of order</b><p>The red ones are in the wrong place. Tap them to take them back, then try again.</p></div>`;
    renderLab();return;}
  if(a==="pat"){const i=+btn.dataset.i;lab.ppick=i;lab.pdone=true;const ok=lab.popts[i]===L.pat;
    lab.pmsg=`<div class="fb ${ok?"ok":"bad"}"><b class="t">${ok?"Right":"It's "+esc(L.pat)}</b><p>Use this when ${esc(PATWHY[L.pat]||"it fits the problem")}.</p></div>`;renderLab();return;}
  if(a==="run"){runLab();return;}
  if(a==="hint"){flushDraft();lab.showHint=!lab.showHint;renderLab();return;}
  if(a==="sol"){flushDraft();lab.showSol=!lab.showSol;renderLab();return;}
  if(a==="reset"){if(!lab.resetArm){flushDraft();lab.resetArm=true;renderLab();return;}lab.resetArm=false;delete drafts[draftKey()];saveDraft(draftKey(),initialCode(L,lab.stage));lab.result=null;renderLab();return;}
  if(a==="self"){onPass();lab.result=null;renderLab();document.getElementById("res").innerHTML=passHTML();return;}
}
const PATWHY={"read input & print": "you read the lines you're given, convert them, and print results", "loop & build a list": "you go through items one by one and collect results", "while loop": "you repeat until a condition changes and don't know the count in advance", "string methods": "split, join, strip, lower and slicing can do the heavy lifting", "hash map / set": "you need to count things or ask \"have I seen this?\" instantly", "try/except": "some inputs will fail and you must handle them instead of crashing", "running total": "each answer builds on the one before it", "track best so far": "one pass is enough if you remember the best (or lowest) value seen so far", "class with methods": "some data and the actions on it belong together", "file reading": "you open a file with with, read it, and it closes automatically", "two pointers": "the data is sorted and you move one end or the other", "sliding window": "you need a contiguous stretch that grows on the right and shrinks on the left", "stack": "the most recent item must be handled first, as with brackets or the next warmer day", "binary search": "the data is sorted and you need O(log n): halve the range each step", "linked list pointers": "you rewire next pointers carefully, often with a dummy head", "recursion": "the answer for a node comes from the answers for its children", "BFS/DFS": "you explore connected cells or nodes, marking what you've visited", "dynamic programming": "the answer for n is built from answers for smaller n", "sort then scan": "after sorting, the items that interact sit next to each other", "heap": "you repeatedly need the smallest item, or the k largest", "prefix sums": "sums or products of stretches come from running totals", "validation rules": "you check each rule in turn and collect what's wrong", "loop with retries": "you try, catch the failure, and try again up to a limit", "string search & parse": "you find positions in text, cut out the part you need, and parse it", "slicing": "you take a piece of a list or string by position", "math formula": "you apply a known formula carefully, piece by piece", "agent loop": "you ask the model, run what it asks for, feed the result back, and repeat", "guard clauses": "you reject anything unsafe early and allow only what's left"};

sheetIn.addEventListener("click",ev=>{
  const c=ev.target.closest("[data-c]");if(c&&celebrateDay!==null){celebrateAct(c.dataset.c);return;}
  const l=ev.target.closest("[data-l]");if(l&&lab){labAct(l.dataset.l,l);return;}
  if(!sess)return;
  const o=ev.target.closest(".opt");
  if(o&&!sess.answered){sess.picked=+o.dataset.o;sheetIn.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",b===o));const c=sheetIn.querySelector('[data-s="check"]');c.disabled=false;c.focus();return;}
  const b=ev.target.closest("[data-s]");if(!b)return;
  if(b.dataset.s==="close")closeSheet();
  else if(b.dataset.s==="check")check();
  else if(b.dataset.s==="next"){sess.i++;renderDrill();}
});
document.addEventListener("keydown",ev=>{
  if(sheet.hidden)return;
  if(ev.key==="Escape"){closeSheet();return;}
  if(lab&&lab.phase==="pattern"&&!lab.pdone&&/^[1-4]$/.test(ev.key)&&document.activeElement.tagName!=="TEXTAREA"){const btn=sheetIn.querySelector(`[data-l="pat"][data-i="${+ev.key-1}"]`);if(btn)btn.click();return;}
  if(!sess)return;
  const it=sess.queue[sess.i];
  if(it&&it.d.k==="mcq"&&!sess.answered&&/^[1-4]$/.test(ev.key)){const btn=sheetIn.querySelector(`.opt[data-o="${+ev.key-1}"]`);if(btn)btn.click();}
});

route();
connectCloud();
