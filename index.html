eces they need."], ["Trade-off", "Improving one property costs another (faster but more expensive, fresher but more load). A good answer names the trade-off and picks a side with a reason."]]},STARTER={"README.md": "# Expenses API (mini capstone starter)\n\nA tiny web API that reads `data/expenses.csv` and answers questions about it.\nYour job: finish three TODOs in `app/main.py` until `pytest` passes, run it, put it in Docker, and deploy it.\n\n## Checklist\n- [ ] TODO 1 `load_rows()` reads the CSV\n- [ ] TODO 2 `totals_by_category()` adds up amounts per category\n- [ ] TODO 3 `/category/{name}` returns a total, or 404 for an unknown category\n- [ ] `pytest` shows 4 passed\n- [ ] `uvicorn app.main:app --reload` runs and http://127.0.0.1:8000/docs works\n- [ ] `docker build -t expenses .` then `docker run -p 8000:8000 expenses` works\n- [ ] Deployed, and the live URL answers `/health`\n- [ ] Replace the sections below with your own words\n\n## What it does\n(One paragraph: who would use this and why.)\n\n## Architecture\n```\nbrowser or curl  ->  FastAPI app (app/main.py)  ->  data/expenses.csv\n```\n\n## Run it locally\n```\npython -m venv .venv\nsource .venv/bin/activate        # Windows: .venv\\Scripts\\activate\npip install -r requirements.txt\npytest\nuvicorn app.main:app --reload\n```\n\n## How it is checked\n(Describe the tests and what they prove.)\n\n## Known limits and next steps\n(For example: reads the whole file on every request. What would you change for a million rows?)\n", "requirements.txt": "fastapi\nuvicorn\nhttpx\npytest\n", ".gitignore": ".venv/\n__pycache__/\n*.pyc\n.pytest_cache/\n", "conftest.py": "# Keeps the project root importable, so tests can write: from app.main import app\n", "Dockerfile": "FROM python:3.12-slim\nWORKDIR /code\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY . .\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n", "data/expenses.csv": "date,category,amount\n2026-01-02,food,12.5\n2026-01-03,transport,30\n2026-01-05,food,20\n2026-01-09,rent,500\n2026-01-12,fun,25\n2026-01-15,food,15\n2026-01-20,transport,18.25\n2026-01-28,fun,40\n", "app/__init__.py": "", "app/main.py": "\"\"\"Mini capstone: a tiny expenses API. Fill in the three TODOs, then run: pytest\"\"\"\nimport csv\nfrom collections import defaultdict\nfrom pathlib import Path\n\nfrom fastapi import FastAPI, HTTPException\n\napp = FastAPI(title=\"Expenses API\")\nDATA = Path(__file__).parent.parent / \"data\" / \"expenses.csv\"\n\n\ndef load_rows():\n    \"\"\"Read expenses.csv into a list of dicts, with \"amount\" as a float.\"\"\"\n    # TODO 1: open DATA, read it with csv.DictReader, convert each row's \"amount\" to float,\n    # and return the list of rows.\n    raise NotImplementedError\n\n\ndef totals_by_category(rows):\n    \"\"\"Return {category: total amount}, each total rounded to 2 decimals.\"\"\"\n    # TODO 2: add up \"amount\" per \"category\". Hint: defaultdict(float).\n    raise NotImplementedError\n\n\n@app.get(\"/health\")\ndef health():\n    return {\"status\": \"ok\"}\n\n\n@app.get(\"/summary\")\ndef summary():\n    rows = load_rows()\n    return {\"count\": len(rows), \"by_category\": totals_by_category(rows)}\n\n\n@app.get(\"/category/{name}\")\ndef category(name: str):\n    # TODO 3: return {\"category\": name, \"total\": <that category's total>}.\n    # If the category is not in the data, raise HTTPException(status_code=404, detail=\"unknown category\").\n    raise NotImplementedError\n", "tests/test_app.py": "from fastapi.testclient import TestClient\n\nfrom app.main import app, totals_by_category\n\nclient = TestClient(app)\n\n\ndef test_health():\n    assert client.get(\"/health\").json() == {\"status\": \"ok\"}\n\n\ndef test_totals_by_category():\n    rows = [{\"category\": \"food\", \"amount\": 10.0}, {\"category\": \"food\", \"amount\": 5.5}, {\"category\": \"rent\", \"amount\": 100.0}]\n    assert totals_by_category(rows) == {\"food\": 15.5, \"rent\": 100.0}\n\n\ndef test_summary_reads_the_csv():\n    data = client.get(\"/summary\").json()\n    assert data[\"count\"] == 8\n    assert data[\"by_category\"][\"food\"] == 47.5\n\n\ndef test_category_found_and_unknown():\n    assert client.get(\"/category/rent\").json() == {\"category\": \"rent\", \"total\": 500.0}\n    assert client.get(\"/category/nope\").status_code == 404\n"};
const HARNESS="import sys, io, json, linecache, traceback, copy, random, ast\n\ndef _make():\n    \"\"\"Everything the grader uses lives inside this function, so learner code can't swap pieces out by name.\"\"\"\n    _loads, _dumps = json.loads, json.dumps\n    def _raises(fn, exc=Exception):\n        try:\n            fn()\n        except exc:\n            return True\n        return False\n\n    def _fmt(e):\n        frames = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == \"solution.py\"]\n        lines = []\n        if frames:\n            lines.append(\"Traceback (most recent call last):\\n\")\n            lines += traceback.format_list(frames)\n        lines += traceback.format_exception_only(type(e), e)\n        return \"\".join(lines).rstrip()\n\n    def _short(v, n=300):\n        s = repr(v)\n        return s if len(s) <= n else s[:n] + \"...\"\n\n\n    _NUM = (int, float, bool)\n    _PRIM = (str, int, float, bool, type(None))\n\n    def _prim(v):\n        if type(v) in _PRIM:\n            return True\n        if type(v) in (tuple, frozenset):\n            return all(_prim(x) for x in v)\n        return False\n\n    def _same(got, want):\n        \"\"\"Compare without trusting the answer's own __eq__, so a look-alike object can't pass.\"\"\"\n        tw = type(want)\n        if (type(got).__module__ or \"\").startswith(\"numpy\") and getattr(got, \"ndim\", 1) == 0 and hasattr(got, \"item\"):\n            got = got.item()\n        if want is None:\n            return got is None\n        if tw in _NUM:\n            return type(got) in _NUM and got == want\n        if tw is str:\n            return type(got) is str and got == want\n        if tw in (list, tuple):\n            if not isinstance(got, tw):\n                return False\n            items = [x for x in tw.__iter__(got)]\n            return len(items) == len(want) and all(_same(a, b) for a, b in zip(items, want))\n        if tw is dict:\n            if not isinstance(got, dict):\n                return False\n            keys = [x for x in dict.__iter__(got)]\n            if len(keys) != len(want) or not all(_prim(x) for x in keys):\n                return False\n            return all(x in want and _same(dict.__getitem__(got, x), want[x]) for x in keys)\n        if tw in (set, frozenset):\n            if not isinstance(got, (set, frozenset)):\n                return False\n            items = [x for x in (set if isinstance(got, set) else frozenset).__iter__(got)]\n            return all(_prim(x) for x in items) and frozenset(items) == frozenset(want)\n        return type(got) is tw and got == want\n\n    class _Probe(list):\n        \"\"\"A big sorted list for speed tests: index lookups only, and only a few of them.\"\"\"\n        def __init__(self, it, budget=80):\n            list.__init__(self, it)\n            self._n, self._budget = 0, budget\n        def _no(self, what):\n            raise TimeoutError(\"Too slow for a list of \" + str(list.__len__(self)) + \" items: \" + what + \" looks at every item. Use lo and hi indexes and halve the range each step (binary search).\")\n        def __getitem__(self, i):\n            if isinstance(i, slice):\n                self._no(\"slicing\")\n            self._n += 1\n            if self._n > self._budget:\n                raise TimeoutError(\"Too slow: you looked at more than \" + str(self._budget) + \" items of a \" + str(list.__len__(self)) + \"-item list. Binary search needs about 17. Halve the range each step.\")\n            return list.__getitem__(self, i)\n        def __iter__(self): self._no(\"looping over the list (or min, max, sorted, in)\")\n        def __contains__(self, x): self._no(\"the in operator\")\n        def __reversed__(self): self._no(\"reversed\")\n        def index(self, *a): self._no(\"index()\")\n        def count(self, *a): self._no(\"count()\")\n        def copy(self): self._no(\"copy()\")\n        def sort(self, *a, **k): self._no(\"sort()\")\n\n    class _Out(io.StringIO):\n        def write(self, s):\n            if self.tell() > 20000:\n                return len(s)\n            return io.StringIO.write(self, s[:20000])\n\n    _SNAP = {}\n    def _snap():\n        for name in (\"builtins\", \"json\", \"json.encoder\", \"json.decoder\", \"io\", \"traceback\", \"linecache\", \"copy\", \"random\"):\n            mod = sys.modules.get(name)\n            if mod is not None:\n                _SNAP[name] = (mod, dict(vars(mod)))\n    def _restore():\n        \"\"\"Undo anything the last run changed in the modules the grader relies on.\"\"\"\n        for mod, saved in _SNAP.values():\n            d = vars(mod)\n            for key in [x for x in d if x not in saved]:\n                del d[key]\n            d.update(saved)\n        sys.setrecursionlimit(1000)\n        sys.settrace(None)\n\n    def _fuzz(p, ns_user, limit, results):\n        fn, gen = p[\"fuzz\"]\n        ref = {\"__name__\": \"__main__\"}\n        if p.get(\"prelude\"):\n            exec(compile(p[\"prelude\"], \"provided.py\", \"exec\"), ref)\n        exec(compile(p[\"ref\"], \"reference.py\", \"exec\"), ref)\n        rng = random.Random()\n        r = {\"label\": \"random inputs (new every run)\", \"ok\": True, \"got\": \"25 random inputs matched\", \"want\": \"25 random inputs matched\"}\n        for _ in range(25):\n            args = eval(gen, {\"R\": rng})\n            want = ref[fn](*copy.deepcopy(args))\n            call = fn + \"(\" + \", \".join(_short(a, 80) for a in args) + \")\"\n            steps = [0]\n            def tracer(frame, event, arg):\n                steps[0] += 1\n                if steps[0] > limit:\n                    raise TimeoutError(\"Stopped: your code ran too many steps on a random input.\")\n                return tracer\n            try:\n                sys.settrace(tracer)\n                try:\n                    got = ns_user[fn](*copy.deepcopy(args))\n                finally:\n                    sys.settrace(None)\n            except BaseException as e:\n                _restore()\n                r = {\"label\": \"random input: \" + call, \"ok\": False, \"error\": _fmt(e)}\n                break\n            if not _same(got, want):\n                r = {\"label\": \"random input: \" + call, \"ok\": False, \"got\": _short(got), \"want\": _short(want)}\n                break\n        results.append(r)\n\n    def _run(payload):\n        _restore()\n        p = _loads(payload)\n        code, prelude = p[\"code\"], p.get(\"prelude\", \"\")\n        files, limit = p.get(\"files\", {}), p.get(\"limit\", 3000000)\n        linecache.cache[\"solution.py\"] = (len(code), None, code.splitlines(True), \"solution.py\")\n        results = []\n        for t in p[\"tests\"]:\n            for name, content in files.items():\n                with open(name, \"w\") as f:\n                    f.write(content)\n            stdin = list(t.get(\"stdin\", []))\n            def _input(prompt=\"\"):\n                if not stdin:\n                    raise EOFError(\"input() was called more times than the test gives input lines\")\n                return stdin.pop(0)\n            ns = {\"__name__\": \"__main__\", \"input\": _input, \"_raises\": _raises, \"_Probe\": _Probe}\n            steps = [0]\n            def tracer(frame, event, arg):\n                steps[0] += 1\n                if steps[0] > limit:\n                    raise TimeoutError(\"Stopped: your code ran too many steps. Either a loop never ends, or it is too slow for this input size: if the loop does end, look for a faster approach (a dict, a set, or fewer nested loops).\")\n                return tracer\n            out = _Out()\n            old = sys.stdout\n            r = {\"label\": t[\"label\"], \"ok\": False}\n            try:\n                sys.stdout = out\n                if prelude:\n                    exec(compile(prelude, \"provided.py\", \"exec\"), ns)\n                sys.settrace(tracer)\n                try:\n                    exec(compile(code, \"solution.py\", \"exec\"), ns)\n                    ns[\"_raises\"], ns[\"_Probe\"] = _raises, _Probe\n                    got = eval(t[\"expr\"], ns) if \"expr\" in t else None\n                finally:\n                    _restore()\n                if \"expr\" in t:\n                    want = eval(t[\"want\"], {})\n                    r[\"ok\"] = _same(got, want)\n                    r[\"got\"], r[\"want\"] = _short(got), _short(want)\n                else:\n                    text = \"\\n\".join(l.rstrip() for l in out.getvalue().strip().splitlines())\n                    want = t[\"out\"].strip()\n                    r[\"ok\"] = text == want\n                    r[\"got\"], r[\"want\"] = text, want\n            except BaseException as e:\n                _restore()\n                r[\"ok\"] = False\n                r[\"error\"] = _fmt(e)\n            finally:\n                sys.stdout = old\n            printed = out.getvalue()\n            if printed and \"expr\" in t:\n                r[\"printed\"] = printed[-1500:]\n            results.append(r)\n            last_ns = ns\n        if p.get(\"fuzz\") and p.get(\"ref\") and results and all(x[\"ok\"] for x in results):\n            old = sys.stdout\n            try:\n                sys.stdout = _Out()\n                _fuzz(p, last_ns, limit, results)\n            except BaseException as e:\n                results.append({\"label\": \"random inputs\", \"ok\": False, \"error\": _fmt(e)})\n            finally:\n                sys.stdout = old\n                sys.settrace(None)\n        _restore()\n        return _dumps(results)\n\n    # ---------- \"Watch it run\": record each line, the variables and the output ----------\n    class _StopTrace(Exception):\n        pass\n\n    def _show(v, depth=0):\n        try:\n            if hasattr(v, \"val\") and hasattr(v, \"next\") and not hasattr(v, \"left\"):\n                parts, seen, n = [], set(), v\n                whil     const id=await user.id(); if(!id)return;
    const ref=db.doc("data/users/"+id+"/progress");
    const snap=await ref.get();
    const before=JSON.stringify(S);
    if(snap.exists){const R=clean(snap.data());S=freshAtLoad&&R.t?R:merge(S,R);}
    dbRef=ref;setSync("cloud");saveLocal();
    const remote=snap.exists?JSON.stringify(clean(snap.data())):null;
    if(remote!==JSON.stringify(S)&&(S.t||S.start||S.done.length||Object.keys(S.solved).length))scheduleCloud();
    if(JSON.stringify(S)!==before)route();
  }catch(e){setSync("local");}
}

function shift(iso,k){const t=new Date(iso+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+k);return t.toISOString().slice(0,10);}
const diffDays=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);
function norm(s,sql){let t=String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/"/g,"'").replace(/\s+/g,"").replace(/;+$/,"");
  return sql?t.toUpperCase().replace(/(LEFT|RIGHT|FULL)OUTERJOIN/g,"$1JOIN").replace(/INNERJOIN/g,"JOIN"):t;}
/* Also accepts the answer with a leading "return" or "name =" when the question didn't ask for that name. */
function isCorrect(d,input){const accN=(d.acc||[]).map(a=>norm(a,d.sql));const n=norm(input,d.sql);const c=[n];

  return c.some(x=>(d.re&&d.re.test(x))||accN.includes(x));}
function streak(){const set=new Set(S.dates);let d=todayISO(),n=0,lastRest=null;if(!set.has(d))d=shift(d,-1);
  for(let g=0;g<400;g++){if(set.has(d)){n++;d=shift(d,-1);continue;}
    if(!isStrict()&&(lastRest===null||diffDays(d,lastRest)>=7)&&set.has(shift(d,-1))){lastRest=d;d=shift(d,-1);continue;}break;}
  return n;}

/* ---------- Habit and plan: destination, depth, rhythm, honest dates ---------- */

    deep,deepDay:h.deepDay===0?0:6,goal:GOALS.some(g=>g.id===h.goal)?h.goal:"full",depth:h.depth==="core"?"core":"full"};}

/* Scope and order: the destination's lessons come first; the rest of the course follows in order. */
const scopeDays=id=>goalById(id||habitOf().goal).days;

const scopeN=()=>scopeDays().length;

function totalMin(goalId,depth,remainingOnly){const g=goalById(goalId),n=(remainingOnly?remainingDays(goalId):g.days).length;
  return n*lessonMin(depth)+(g.gym&&n?GYM_MIN:0);}
const weeklyMin=h=>h.min*h.dpw+(h.deep||0);
const calDaysFor=(min,wk)=>Math.max(1,Math.ceil(min/wk*7));

function ladderFor(h){const g=goalById(h.goal),days=remainingDays(h.goal),n=days.length;if(!n)return [];

function bestGoalWithin(days,h){const order=[...GOALS].sort((a,b)=>totalMin(b.id,h.depth,true)-totalMin(a.id,h.depth,true));
  return order.find(g=>remainingDays(g.id).length&&calDaysFor(totalMin(g.id,h.depth,true),weeklyMin(h))<=days)||null;}
function deepNeeded(h,days){for(const d of [60,120,180,240,300]){if(calDaysFor(totalMin(h.goal,h.depth,true),weeklyMin({...h,deep:d,dpw:Math.min(h.dpw,6)}))<=days)return d;}return 0;}

function route(){

  else if(/^(sql|py|spark|sys|dep|ai)(-[1-5])?$/.test(h)){tab="gyms";const mm=/^([a-z]+)(?:-(\d))?$/.exec(h);renderGym(mm[1],mm[2]?+mm[2]:0);}
  else if(h==="report"){tab="path";renderReport();}
  else if(h==="exam"){tab="path";renderExam();}
  else if(h==="review"){tab="path";renderReview();}
  else if(h==="portfolio"){tab="path";renderPortfolio();}
  else if(h==="path"){tab="path";renderPath();}
  else if(h==="think"){tab="think";renderThink();}
  else if(h==="errors"){tab="errors";renderErrors();}
  else if(h==="ref"){tab="ref";renderRef();}
  else if(h==="plan"){tab="path";obInit(true);renderOnboarding();}
  else if(h==="diag"){renderDiag();}
  else if(!S.start){obInit(false);renderOnboarding();}
  else renderToday(currentDay());
  document.body.classList.toggle("onboarding",!S.start&&!/^(day-|sql|path|think|errors|ref|report|exam|review|portfolio|diag)/.test(h));

function startSession(drills,label){if(!drills.length)return;
  sess={label,queue:drills.map(d=>({d,tries:0})),i:0,first:0,total:drills.length,picked:null,answered:false,gained:0};
  markPractice();save();openSheet();renderDrill();}
const drillNote=d=>{if(S.solved[d.id]||/Warm-up/.test((sess&&sess.label)||""))return "";const nw=drillNew(d,d.day);return nw.length?`<div class="newsyn"><b>New today</b>: first time you meet this syntax, so here it is<ul>${nw.map(e=>`<li><code>${esc(e[0])}</code>: ${esc(e[1])}</li>`).join("")}</ul></div>`:"";};
function renderDrill(){
  const s=sess;
  if(s.i>=s.queue.length){
    if(/Warm-up/.test(s.label)&&S.warmDay!==todayISO()){S.warmDay=todayISO();save();}
    sheetIn.innerHTML=`<div class="sheet-head"><button class="xbtn" data-s="close" aria-label="Close">×</button><div class="sprog"><span style="width:100%"></span></div></div>
      <div class="summary"><span class="eyebrow">${esc(s.label)} complete</span><div class="big">+${s.gained} XP</div>
      <p>${s.first} of ${s.total} right on the first try.</p><p class="muted">${s.first===s.total?"Clean run. Next up: the code labs.":"Every miss is saved and comes back in your warm-up. That repetition is how syntax sticks."}</p>
      <button class="btn primary" data-s="close" style="min-width:200px">Continue</button></div>`;
    sheetIn.querySelector(".btn.primary").focus();return;}
  const it=s.queue[s.i],d=it.d,pct=Math.round(s.i/s.queue.length*100);s.picked=null;s.answered=false;
  const label=d.k==="mcq"?(d.code&&/Error|Exception/.test(d.code)?"Fix the error":d.code?"Predict the output":"Choose"):(d.sql?"Write the SQL":"Write the code");
  sheetIn.innerHTML=`<div class="sheet-head"><button class="xbtn" data-s="close" aria-label="Close drills">×</button><div class="sprog" aria-hidden="true"><span style="width:${pct}%"></span></div><span class="pmeta">${s.i+1}/${s.queue.length}</span></div>
    <div class="sheet-body"><span class="qkind">${label}${it.tries?" · try again":""}</span>${drillNote(d)}<div class="q">${d.q}</div>
      ${d.code?`<pre>${esc(d.code)}</pre>`:""}
      ${d.k==="mcq"?`<div class="opts">${shuffled(d.o.map((_,i)=>i),d.id||d.q).map((i,k)=>`<button class="opt" data-o="${i}"><span class="k">${k+1}</span><span>${esc(d.o[i])}</span></button>`).join("")}</div>`
        :`<textarea class="code" id="ans" aria-label="Your answer" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type your answer…"></textarea><p class="hint">${runnable(d)?"Your answer is run on real data and compared with a model answer, so any correct way of writing it passes.":"Spacing doesn't matter."} Press Ctrl+Enter or tap Check.</p>`}
    </div>
    <div class="sheet-foot" id="foot"><button class="btn primary block" data-s="check" disabled>Check</button></div>`;
  const ta=document.getElementById("ans");
  if(ta){ta.addEventListener("input",()=>{sheetIn.querySelector('[data-s="check"]').disabled=!ta.value.trim();});
    ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&ta.value.trim()){e.preventDefault();check();}});
    setTimeout(()=>ta.focus(),30);}
  if(runnable(d))(d.sql?getSql():getPy().then(P=>d.pkgs?P.need():0)).catch(()=>{});
}
async function check(){
  const s=sess,it=s.queue[s.i],d=it.d;if(s.answered||s.checking)return;
  let ok,run=null,typed="";
  if(d.k==="mcq"){if(s.picked===null)return;ok=s.picked===d.a;
    sheetIn.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=+b.dataset.o;if(i===d.a)b.classList.add("right");else if(i===s.picked)b.classList.add("wrong");});}
  else{const ta=document.getElementById("ans");typed=ta.value;ta.readOnly=true;
    if(runnable(d)){s.checking=true;document.getElementById("foot").innerHTML=`<p class="hint" role="status">Running your answer${d.pkgs&&!pyReady?" (loading Python and pandas the first time, about 20 MB)":d.pkgs?" (pandas loads the first time, about 8 MB)":""}…</p>`;
      try{run=await gradeRun(d,typed);ok=run.ok;}catch(e){run=null;ok=isCorrect(d,typed);}
      s.checking=false;if(sess!==s||s.queue[s.i]!==it)return;}
    else ok=isCorrect(d,typed);}
  s.answered=true;
  if(!it.tries)srsHit(d.id,ok);
  if(ok){if(!it.tries)s.first++;const g=it.tries?5:10;s.gained+=g;S.xp+=g;S.solved={...S.solved,[d.id]:1};S.missed=S.missed.filter(x=>x!==d.id);}
  else{it.tries++;if(!S.missed.includes(d.id))S.missed=[...S.missed,d.id];if(it.tries<3)s.queue.push({d,tries:it.tries});}
  save();topStats();
  const ans=d.k==="mcq"?`<p>Answer: <code>${esc(d.o[d.a])}</code></p>`:`<pre>${esc(d.ans)}</pre>`;
  document.getElementById("foot").innerHTML=`<div class="fb ${ok?"ok":"bad"}" role="status"><b class="t">${ok?"Correct":"Not quite"}</b>${run&&!ok&&(run.error||run.msg)?`<pre class="runmsg">${esc(run.error||run.msg)}</pre><p class="hint">A model answer:</p>`:""}${run&&ok&&norm(typed,d.sql)!==norm(d.ans,d.sql)?`<p class="hint">Yours works. Another common way to write it:</p>`:""}${ok&&d.k==="mcq"?"":ans}<p>${d.why}</p>${!ok&&it.tries<3?'<p class="hint">This one comes back at the end.</p>':""}</div>
    <button class="btn primary block" data-s="next">Continue</button>`;
  document.querySelector('[data-s="next"]').focus();
}

function wireEditor(){const ed=document.getElementById("code"),gut=document.getElementById("gutter");
  const lines=()=>{const n=ed.value.split("\n").length;gut.textContent=Array.from({length:n},(_,i)=>i+1).join("\n");gut.scrollTop=ed.scrollTop;};
  lines();
  ed.addEventListener("scroll",()=>{gut.scrollTop=ed.scrollTop;});
  ed.addEventListener("input",()=>{lines();lab.resetArm=false;clearTimeout(draftTimer);draftTimer=setTimeout(flushDraft,400);});
  ed.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();labAct("run");return;}
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();ed.setRangeText("    ",ed.selectionStart,ed.selectionEnd,"end");lines();return;}
    if(e.key==="Enter"&&!e.shiftKey){const v=ed.value,p=ed.selectionStart,ls=v.lastIndexOf("\n",p-1)+1,line=v.slice(ls,p);
      let ind=(line.match(/^[ \t]*/)||[""])[0];if(/:\s*(#.*)?$/.test(line)&&lab.L.kind==="py")ind+="    ";
      e.preventDefault();ed.setRangeText("\n"+ind,p,ed.selectionEnd,"end");lines();}
  });
}

function errTip(text){const last=String(text).trim().split("\n").pop()||"";const m=last.match(/^(\w+(?:Error|Exception))/);if(!m)return "";

function resultsHTML(){const h=resultsCore();return lab.result&&!lab.result.loadFail&&!lab.running?h+nudge():h;}
function resultsCore(){const r=lab.result;
  if(lab.running)return `<p class="muted">${lab.loadingMsg||"Running…"}</p>`;
  if(!r)return "";
  if(r.loadFail){const tests=lab.L.kind==="py"?`<pre>${esc(lab.L.tests.map(t=>t.expr?`assert ${t.expr} == ${t.want}`:`# input: ${t.stdin.join(", ")}  ->  prints:\n# ${t.out.replace(/\n/g,"\n# ")}`).join("\n"))}</pre>`:"";
    return `<div class="fb bad"><b class="t">The code runner couldn't start here</b><p>${esc(r.msg)}${CSPV.length?" (blocked: "+esc(CSPV.slice(0,3).join("; "))+")":""}. Your code is saved. Try again, or open <code>index.html</code> from your Coding Handson folder in Chrome. You can also run it in VS Code${lab.L.kind==="py"?" with these checks at the bottom of your file":""}:</p>${tests}
      <div class="row"><button class="btn small" data-l="run">Try again</button><button class="btn small" data-l="self">I ran it myself and every check passes</button></div></div>`;}
  if(r.kind==="sql"){
    if(r.error)return `<div class="fb bad"><b class="t">SQL error</b><pre>${esc(r.error)}</pre><p class="hint">SQLite names the problem directly. Compare spellings with the tables above.</p></div>`;
    if(r.ok)return passHTML();
    if(r.hidden)return `<div class="fb bad"><b class="t">Right on these tables, wrong on a second set</b><p>Your result matches here, but the query is also run on a hidden set of rows with the same columns, and there it gives a different answer from the correct query. That usually means one of three things: <b>ties</b> (two rows share the top value), <b>NULLs</b>, or a value <b>exactly on the boundary</b> (<code>&gt;</code> vs <code>&gt;=</code>). Re-read the task word by word and check each condition.</p>${lab.L.trap?`<p><b>Likely cause here:</b> ${lab.L.trap}</p>`:""}</div>`;
    return `<div class="fb bad"><b class="t">Not quite</b><p>${!r.got.values.length?`Your query returned no rows; the answer has ${r.want.values.length}.`:`${!r.colsOK?`Your query returns ${r.got.columns.length} column${r.got.columns.length===1?"":"s"}; the answer has ${r.want.columns.length}. `:""}${r.got.values.length!==r.want.values.length?`You got ${r.got.values.length} row${r.got.values.length===1?"":"s"}; the answer has ${r.want.values.length}.`:lab.L.ordered?"Check the values and the order.":"Same number of rows, but some values differ."}`}</p>${/(=|<>|!=)\s*NULL\b/i.test(r.code||"")?`<p class="hint"><b>Tip:</b> comparing with <code>= NULL</code> never matches anything in SQL, because NULL means "unknown". Use <code>IS NULL</code> or <code>IS NOT NULL</code>.</p>`:""}
      <p class="eyebrow">Your result</p>${tableHTML(r.got)}<p class="eyebrow">Expected</p>${tableHTML(r.want)}</div>`;}
  const tests=r.tests,passN=tests.filter(t=>t.ok).length,errs=tests.map(t=>t.error).filter(Boolean);

    <ul class="tests">${tests.map(t=>`<li class="${t.ok?"pass":"fail"}"><span class="mark">${t.ok?"✓":"✗"}</span><div><b>${esc(t.label)}</b>

const briefHTML=L=>`<blockquote class="brief"><span class="eyebrow">Message from the customer</span><p>${esc(L.brief)}</p></blockquote>`;
function replyHTML(L){if(lab.replyShown)return `<div class="replybox"><span class="eyebrow">Your reply</span><p>${esc(lab.replyTxt)}</p><span class="eyebrow">A model reply</span><p>${esc(L.reply)}</p><p class="hint">A good reply says what was wrong in plain words, what you changed, and asks one question back. That's most of the job.</p></div>`;

async function runLab(){
  if(lab.running)return;const L=lab.L,ed=document.getElementById("code");const code=(ed?ed.value:"").replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'");flushDraft();
  if(needsSteps()&&countSteps(code,L)<3){lab.result=null;document.getElementById("res").innerHTML=`<div class="fb bad"><b class="t">Steps first</b><p>Write at least 3 steps as comments (each a few words, like <code># loop over the prices</code>) before running. This is the habit that gets you unstuck in interviews.</p></div>`;return;}
  lab.running=true;lab.loadingMsg=(L.kind==="py"?pyReady:sqlReady)?"Running…":L.kind==="py"?"Starting Python in your browser. The first time downloads about 10 MB, so give it a moment…":"Starting SQLite…";renderLab();
  await new Promise(r=>setTimeout(r,30));
  let ok=false;
  try{
    if(L.kind==="py"){const P=await getPy();let out;if(L.pkgs)await P.need();
      try{out=JSON.parse(await P.call("_run",JSON.stringify({code,prelude:L.prelude||"",tests:L.tests,files:L.files||{},limit:L.limit||3000000,fuzz:L.fuzz||null,ref:L.fuzz?L.solution:""})));}
      catch(e){if(String(e&&e.message)!=="PYKILL")throw e;out=[{label:"your code",ok:false,error:KILLMSG}];}
      lab.result={kind:"py",tests:out};ok=out.every(t=>t.ok);}
    else{const SQL=await getSql();lab.result=runSqlLab(SQL,code,L);lab.result.code=code;ok=lab.result.ok;}
  }catch(e){lab.result={loadFail:true,msg:String(e&&e.message||e)};}
  lab.running=false;
  if(!lab.result.loadFail){lab.runs++;if(ok)onPass();else{lab.fails++;logErrors(lab.result);save();}}
  renderLab();
  const res=document.getElementById("res");if(res&&res.scrollIntoView)res.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function onPass(){if(lab.passed)return;lab.passed=true;const L=lab.L;if(lab.redo&&!lab.mixed&&!warmIds().length&&!dueLabs().filter(x=>x.id!==L.id).slice(0,2).length){S.warmDay=todayISO();}lab.before=areaStatus(areaOf(L)).score;
  if(!S.labs[L.id])S.lstat={...S.lstat,[L.id]:{fails:lab.fails,helped:!!lab.helped}};
  const firstPass=S.labs[L.id]&&typeof S.labs[L.id]==="string"?S.labs[L.id]:null;
  logEv("pass",{id:L.id,redo:!!lab.redo,blank:!!(lab.redo&&!lab.mixed&&!lab.helped),helped:!!lab.helped,fails:lab.fails,secs:Math.round((Date.now()-lab.t0)/1000),mixed:!!lab.mixed,ck:lab.checkpoint||"",gap:firstPass&&lab.redo?Math.round((new Date(todayISO())-new Date(firstPass))/864e5):null});
  saveCode(L,(document.getElementById("code")||{}).value);
  if(lab.checkpoint)recordCheck(lab,true);
  labPassed(L,lab.redo&&!lab.helped);
  if(lab.mixed)S.mocks=[...S.mocks,{id:L.id,secs:Math.round((Date.now()-lab.t0)/1000),target:lab.target*60,helped:!!lab.helped,d:todayISO()}].slice(-200);
  markPractice();save();topStats();}

const VIZ={
 hashmap:{title:"Hash map: have I seen it?",day:4,blurb:"Two Sum in one pass. For each number, ask the dict whether its partner was already seen. Each lookup is instant, so it's O(n).",
  build(){const nums=[2,7,11,15],t=9,seen={},F=[];F.push({nums,i:-1,seen:{},say:`Find two numbers that add up to <b>${t}</b>. Start with an empty dict.`});
   for(let i=0;i<nums.length;i++){const x=nums[i],need=t-x;
     if(need in seen){F.push({nums,i,seen:{...seen},hit:seen[need],say:`x = <b>${x}</b>. Need ${t} − ${x} = <b>${need}</b>. Is ${need} in the dict? <b>Yes</b>, at index ${seen[need]}. Return <b>[${seen[need]}, ${i}]</b>.`});break;}
     F.push({nums,i,seen:{...seen},say:`x = <b>${x}</b>. Need ${t} − ${x} = <b>${need}</b>. Is ${need} in the dict? No.`});
     seen[x]=i;F.push({nums,i,seen:{...seen},say:`Remember it: store <b>${x} → ${i}</b> and move on.`});}
   return F;},
  render(f){return cells(f.nums,{cls:f.nums.map((_,k)=>k===f.i?"cur":k===f.hit?"hit":k<f.i?"done":""),ptr:{[f.i]:"x"}})+kv("seen (value → index)",f.seen);}},
 twoptr:{title:"Two pointers",day:16,blurb:"In a sorted array, put one pointer at each end. Sum too small: move left up. Too big: move right down.",
  build(){const a=[1,3,4,6,8,11],t=10,F=[];let l=0,r=a.length-1;
   while(l<r){const s=a[l]+a[r];
     if(s===t){F.push({a,l,r,done:true,say:`${a[l]} + ${a[r]} = <b>${s}</b>. That's the target. Done in one pass.`});break;}
     F.push({a,l,r,say:`${a[l]} + ${a[r]} = <b>${s}</b>. ${s<t?`Too small, so move <b>left</b> up.`:`Too big, so move <b>right</b> down.`}`});
     if(s<t)l++;else r--;}
   F.unshift({a,l:0,r:a.length-1,say:`Target <b>${t}</b>. The array is sorted, so start at both ends.`});return F;},
  render(f){return cells(f.a,{cls:f.a.map((_,k)=>(k===f.l||k===f.r)?(f.done?"hit":"cur"):(k<f.l||k>f.r)?"out":""),ptr:{[f.l]:"left",[f.r]:f.l===f.r?"left/right":"right"}});}},
 window:{title:"Sliding window",day:16,blurb:"Longest substring without repeats. The window grows on the right; on a repeat, the left edge jumps past the earlier copy.",
  build(){const s="abcabcbb".split(""),F=[];const seen={};let left=0,best=0;
   F.push({s,left:0,right:-1,best:0,say:`Find the longest run of letters with no repeats in "<b>abcabcbb</b>".`});
   for(let right=0;right<s.length;right++){const ch=s[right];let say;
     if(ch in seen&&seen[ch]>=left){say=`"${ch}" is already in the window (index ${seen[ch]}). Move left to <b>${seen[ch]+1}</b>.`;left=seen[ch]+1;}
     else say=`"${ch}" is new. Grow the window.`;
     seen[ch]=right;best=Math.max(best,right-left+1);F.push({s,left,right,best,say:`${say} Window length ${right-left+1}, best <b>${best}</b>.`});}
   return F;},
  render(f){return cells(f.s,{cls:f.s.map((_,k)=>k>=f.left&&k<=f.right?(k===f.right?"cur":"win"):k<f.left?"out":""),ptr:{[f.left]:f.right>=0?"left":"",[Math.max(f.right,0)]:f.right>=0?(f.left===f.right?"left/right":"right"):""}})+`<p class="vz-stat">best so far: <b>${f.best}</b></p>`;}},
 bsearch:{title:"Binary search",day:17,blurb:"Halve the range every step. 8 items take at most 4 looks; a million take about 20.",
  build(){const a=[1,3,5,7,9,11,13,15],t=11,F=[];let lo=0,hi=a.length-1;F.push({a,lo,hi,mid:-1,say:`Find <b>${t}</b> in a sorted list.`});
   while(lo<=hi){const mid=Math.floor((lo+hi)/2);
     if(a[mid]===t){F.push({a,lo,hi,mid,found:true,say:`mid = (${lo} + ${hi}) // 2 = ${mid}. a[${mid}] = ${a[mid]}. <b>Found it.</b>`});break;}
     F.push({a,lo,hi,mid,say:`mid = (${lo} + ${hi}) // 2 = ${mid}. a[${mid}] = ${a[mid]} is ${a[mid]<t?"too small, so drop the left half":"too big, so drop the right half"}.`});
     if(a[mid]<t)lo=mid+1;else hi=mid-1;}
   return F;},
  render(f){const p={};p[f.lo]="lo";p[f.hi]=(p[f.hi]?p[f.hi]+"/":"")+"hi";if(f.mid>=0)p[f.mid]=(p[f.mid]?p[f.mid]+"/":"")+"mid";
   return cells(f.a,{cls:f.a.map((_,k)=>k===f.mid?(f.found?"hit":"cur"):(k<f.lo||k>f.hi)?"out":"win"),ptr:p});}},
 stack:{title:"Stack: matching brackets",day:17,blurb:"Openers go on the stack. A closer must match the top. The stack must be empty at the end.",
  build(){const s="([]{})".split(""),F=[],st=[],pair={")":"(","]":"[","}":"{"};F.push({s,i:-1,st:[],say:"Check whether <b>([]{})</b> is valid."});
   s.forEach((ch,i)=>{if(pair[ch]){const top=st.pop();F.push({s,i,st:[...st],say:`"${ch}" is a closer. Pop the top: "${top}". ${top===pair[ch]?"They match.":"They don't match: invalid."}`});}
     else{st.push(ch);F.push({s,i,st:[...st],say:`"${ch}" is an opener. Push it.`});}});
   F.push({s,i:s.length,st:[],say:"The stack is empty at the end, so the string is <b>valid</b>."});return F;},
  render(f){return `<div class="vz-row">${cells(f.s,{cls:f.s.map((_,k)=>k===f.i?"cur":k<f.i?"done":""),idx:false})}<div class="vz-stack"><span class="eyebrow">stack</span>${f.st.length?f.st.slice().reverse().map((c,k)=>`<div class="vz-sc ${k===0?"top":""}">${esc(c)}</div>`).join(""):'<div class="muted">empty</div>'}</div></div>`;}},
 recursion:{title:"Recursion tree",day:20,blurb:"climb(4) calls climb(3) and climb(2), and so on down to the base cases. Notice climb(2) is worked out twice: that waste is why dynamic programming remembers answers.",
  build(){const nodes=[],F=[];let leaf=0;
   const mk=(n,depth)=>{const node={n,depth,kids:[],id:nodes.length};nodes.push(node);if(n>1){node.kids=[mk(n-1,depth+1),mk(n-2,depth+1)];node.x=(node.kids[0].x+node.kids[1].x)/2;}else node.x=leaf++;return node;};
   const root=mk(4,0);const state={};
   const walk=node=>{state[node.id]="call";F.push({state:{...state},say:`Call <b>climb(${node.n})</b>${node.n<=1?". Base case: return 1.":`. It needs climb(${node.n-1}) + climb(${node.n-2}).`}`});
     let v=1;if(node.kids.length){v=walk(node.kids[0])+walk(node.kids[1]);}
     state[node.id]="done:"+v;const dup=node.n===2&&nodes.filter(m=>m.n===2&&String(state[m.id]||"").startsWith("done")).length>1;
     F.push({state:{...state},say:`climb(${node.n}) returns <b>${v}</b>.${dup?" That's the <b>second</b> time climb(2) was worked out.":""}`});return v;};
   walk(root);F.push({state:{...state},say:"climb(4) = <b>5</b> ways. Remembering each answer (memoization) makes every call happen once: that's dynamic programming."});
   this.nodes=nodes;this.leaves=leaf;return F;},
  render(f){const N=this.nodes,W=Math.max(this.leaves-1,1),dx=280/W,X=n=>20+n.x*dx,Y=n=>24+n.depth*58;
   const lines=N.flatMap(n=>n.kids.map(k=>`<line x1="${X(n)}" y1="${Y(n)}" x2="${X(k)}" y2="${Y(k)}"/>`)).join("");
   const dots=N.map(n=>{const s=f.state[n.id]||"",done=s.startsWith("done");return `<g class="vz-node ${done?"done":s?"call":""}"><circle cx="${X(n)}" cy="${Y(n)}" r="17"/><text x="${X(n)}" y="${Y(n)+4}">c(${n.n})</text>${done?`<text class="vz-ret" x="${X(n)}" y="${Y(n)+32}">=${s.split(":")[1]}</text>`:""}</g>`;}).join("");
   return `<svg class="vz-tree" viewBox="0 0 320 ${Y({depth:4})+40}" role="img" aria-label="Recursion tree for climb(4)">${lines}${dots}</svg>`;}},
 bfs:{title:"BFS on a grid",day:19,blurb:"Number of Islands. Scan every cell. On land, count an island and flood its connected land with a queue so it isn't counted again.",
  build(){const g=["11000","11000","00100","00011"].map(r=>r.split("")),R=g.length,C=g[0].length,F=[],mark=g.map(r=>r.map(()=>0));let count=0;
   const snap=(q,cur,say)=>F.push({g:g.map(r=>r.slice()),mark:mark.map(r=>r.slice()),q:q.map(p=>`(${p})`),cur,count,say});
   snap([],null,"1 is land, 0 is water. Scan the grid row by row.");
   for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(g[r][c]==="1"&&!mark[r][c]){count++;mark[r][c]=count;const q=[[r,c]];snap(q,[r,c],`New land at (${r},${c}): island <b>#${count}</b>. Put it in the queue.`);
     while(q.length){const [i,j]=q.shift();const add=[];for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=i+di,b=j+dj;if(a>=0&&a<R&&b>=0&&b<C&&g[a][b]==="1"&&!mark[a][b]){mark[a][b]=count;q.push([a,b]);add.push(`(${a},${b})`);}}
       snap(q,[i,j],`Visit (${i},${j}). ${add.length?`Neighbouring land ${add.join(" ")} joins the queue.`:"No new land next to it."}`);}}
   snap([],null,`Scan finished: <b>${count} islands</b>. Each land cell was visited once.`);return F;},
  render(f){return `<div class="vz-row"><div class="vz-grid" style="grid-template-columns:repeat(${f.g[0].length},34px)">${f.g.flatMap((row,r)=>row.map((v,c)=>`<div class="vz-g ${v==="1"?"land":"water"} ${f.mark[r][c]?"isl"+((f.mark[r][c]-1)%3):""} ${f.cur&&f.cur[0]===r&&f.cur[1]===c?"cur":""}">${v}</div>`)).join("")}</div>
   <div class="vz-box"><span class="eyebrow">queue</span><div class="vz-kv">${f.q.length?f.q.map(x=>`<span class="vz-pair">${x}</span>`).join(""):'<span class="muted">empty</span>'}</div><p class="vz-stat">islands: <b>${f.count}</b></p></div></div>`;}},
 join:{title:"SQL LEFT JOIN, then IS NULL",day:10,blurb:"LEFT JOIN keeps every customer. Customers with no orders get NULLs, and WHERE o.id IS NULL keeps exactly those.",
  build(){const C=[[1,"Acme"],[2,"Bolt"],[3,"Cora"],[4,"Dune"],[5,"Echo"]],O=[[1,1,120],[2,1,80],[3,2,40],[4,3,300],[5,1,55.5],[6,3,20],[7,5,75]],F=[],res=[];
   F.push({C,O,ci:-1,om:[],res:[],say:"customers LEFT JOIN orders ON o.customer_id = c.id. Go through customers one at a time."});
   C.forEach(([id,name],ci)=>{const m=O.filter(o=>o[1]===id),before=res.length;
     if(m.length)m.forEach(o=>res.push([name,o[0]]));else res.push([name,null]);
     F.push({C,O,ci,om:m.map(o=>o[0]),res:res.slice(),added:res.length-before,say:m.length?`<b>${name}</b> matches ${m.length} order${m.length>1?"s":""}: one result row each.`:`<b>${name}</b> matches no orders. LEFT JOIN still keeps it, with <b>NULL</b> for the order.`});});
   F.push({C,O,ci:-1,om:[],res:res.slice(),filter:true,say:"Now WHERE o.id IS NULL keeps only the rows with no order: <b>Dune</b>, the customer who never ordered."});return F;},
  render(f){const t=(head,rows,cls)=>`<table class="mini vz-t"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r,k)=>`<tr class="${cls(r,k)}">${r.map(v=>`<td>${v===null?'<span class="null">NULL</span>':esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
   if(f.filter)return `<span class="eyebrow">result after WHERE o.id IS NULL</span>${t(["name","o.id"],f.res,r=>r[1]===null?"hit":"gone")}`;
   return `<div class="vz-row">${t(["c.id","name"],f.C,(r,k)=>k===f.ci?"cur":"")}${t(["o.id","cust","amt"],f.O,r=>f.om.includes(r[0])?"hit":"")}</div><span class="eyebrow">result so far (${f.res.length} rows)</span>${t(["name","o.id"],f.res,(r,k)=>k>=f.res.length-(f.added||0)?"hit":"")}`;}},
};

function flowViz(title,day,blurb,nodes,steps){return {title,day,blurb,arch:true,
  build(){return steps.map(([on,say],k)=>({on,seen:steps.slice(0,k+1).map(x=>x[0]),say}));},
  render(f){return `<div class="fl">${nodes.map(([name,d,side],i)=>`<div class="fl-n ${i===f.on?"cur":f.seen.includes(i)?"seen":""} ${side?"side":""}"><b>${esc(name)}</b>${d?`<span class="fl-d">Day ${d}</span>`:""}</div>`).join("")}</div>`;}};}

/* ---------- "Watch it run": step through your own code ---------- */
let pyTrace=null;
async function startTrace(testIdx){
  const L=lab.L,ed=document.getElementById("code");const code=(ed?ed.value:"").replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'");flushDraft();
  if(testIdx==null){const r=lab.result;const f=r&&r.tests?r.tests.findIndex(t=>!t.ok):-1;testIdx=f>=0?f:0;}
  lab.trace={loading:true,testIdx,code,i:0,quiz:lab.trace?lab.trace.quiz:false,answered:{},ask:null,fb:""};renderStepper();
  try{const P=await getPy();if(L.pkgs)await P.need();
    const res=JSON.parse(await P.call("_trace",JSON.stringify({code,prelude:L.prelude||"",test:L.tests[testIdx],files:L.files||{},max:300}),15000));
    Object.assign(lab.trace,{loading:false,res,cps:checkpoints(res.steps)});
  }catch(e){Object.assign(lab.trace,{loading:false,res:{steps:[],error:String(e&&e.message)==="PYKILL"?KILLMSG:"The runner couldn't start: "+(e&&e.message||e)}});}
  renderStepper();const el=document.getElementById("spBox");if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest",behavior:"smooth"});
}
/* Steps where a short variable changes: good moments to ask "what is it now?" */
function checkpoints(steps){const c=[];
  for(let k=1;k<steps.length;k++){const a=steps[k-1],b=steps[k];if(a.fn!==b.fn||b.ev!=="line")continue;
    const ch=Object.keys(b.vars).filter(n=>a.vars[n]!==b.vars[n]&&String(b.vars[n]).length<=24);if(ch.length)c.push({k,name:ch[ch.length-1]});}
  if(c.length<=5)return c;const out=[];for(let j=0;j<5;j++)out.push(c[Math.round(j*(c.length-1)/4)]);return out;}
const unq=s=>pnorm(s).replace(/^'(.*)'$/,"$1");
function spGo(i){const T=lab.trace;if(!T||!T.res)return;const n=T.res.steps.length;i=Math.max(0,Math.min(n-1,i));
  if(T.quiz&&i===T.i+1){const cp=T.cps.find(c=>c.k===i);if(cp&&!(i in T.answered)){T.ask=cp;T.fb="";renderStepper();setTimeout(()=>{const a=document.getElementById("spAns");if(a)a.focus();},30);return;}}
  T.i=i;T.ask=null;renderStepper();}
function spCheck(skip){const T=lab.trace,cp=T.ask;if(!cp)return;const want=T.res.steps[cp.k].vars[cp.name];
  const el=document.getElementById("spAns"),ok=!skip&&el&&el.value.trim()&&unq(el.value)===unq(want);
  T.answered[cp.k]=ok;T.fb=skip?`It's <code>${esc(want)}</code>.`:ok?`<b>Right.</b> <code>${esc(cp.name)}</code> is <code>${esc(want)}</code>.`:`<b>Not quite.</b> It's <code>${esc(want)}</code>. Look at line ${T.res.steps[cp.k-1].line} again: what did it change?`;
  T.i=cp.k;T.ask=null;renderStepper();}
function renderStepper(){const el=document.getElementById("spBox");if(el)el.innerHTML=stepperHTML();}
function stepperHTML(){
  const T=lab&&lab.trace;if(!T)return "";
  const head=`<div class="sp-head"><span class="eyebrow">Watch it run</span>
    <select id="spTest" aria-label="Which test to watch">${lab.L.tests.map((t,k)=>`<option value="${k}" ${k===T.testIdx?"selected":""}>Test: ${esc(t.label)}</option>`).join("")}</select>
    <button class="btn small" data-l="sp-rerun" title="Record again with the code that's in the editor now">Re-record</button><button class="btn small" data-l="sp-close">Close</button></div>`;
  if(T.loading)return `<div class="stepper">${head}<p class="muted">${pyReady?"Recording your code…":"Starting Python in your browser. The first time downloads about 10 MB…"}</p></div>`;
  const r=T.res,steps=r.steps||[];

let lastMixed=null;
function pickMixed(areaId){const cur=reachedDay();
  const held=L=>(CHECK_SETS.post.includes(L.id)&&!(S.checks||{}).post)||(CHECK_SETS.pre.includes(L.id)&&!(S.checks||{}).pre&&!S.done.length);
  const ok=L=>!L.bug&&!L.form&&L.kind!=="design"&&!held(L)&&(!areaId||areaOf(L).id===areaId);
  const met=L=>S.labs[L.id]||isDone(L.day)||L.day===currentDay();
  let pool=ALL_LABS.filter(L=>ok(L)&&(L.gym?S.labs[L.id]:L.day<cur&&met(L)));if(!pool.length)pool=ALL_LABS.filter(L=>ok(L)&&(L.gym?S.labs[L.id]:L.day<=cur&&met(L)));
  /* Unsolved unseen problems come first: three times the weight of a lab you've already met. */
  pool=[...pool,...UNSEEN.filter(L=>ok(L)&&L.day<cur&&!S.labs[L.id]&&isDone(L.day))];if(!pool.length)return null;
  const w=pool.map(L=>(105-labScore(L))*(L.unseen?3:1)*(L.id===lastMixed?0.1:1)),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}return pool[pool.length-1];}

const ERR_EXTRA={"Wrong result":["No crash, but the answer didn't match","Watch it run and find the first value that's off"],"SQL error":["SQLite couldn't run the query","Check names against the tables; read the message word by word"]};
function logErrors(r){if(!r||r.loadFail)return;const add=k=>{S.errs={...S.errs,[k]:(S.errs[k]||0)+1};};
  if(r.kind==="sql"){if(r.error)add("SQL error");else if(!r.ok)add("Wrong result");return;}
  const types=new Set();(r.tests||[]).forEach(t=>{if(t.error){const m=(t.error.trim().split("\n").pop()||"").match(/^(\w+(?:Error|Exception))/);if(m)types.add(m[1]);}else if(!t.ok)types.add("Wrong result");});
  types.forEach(add);}
function journalCard(){const top=Object.entries(S.errs||{}).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<section class="card journal"><span class="eyebrow">Your error journal</span>

      return `<li><div><b>${esc(k)}</b> <span class="chip">${n}×</span>${row?`<p class="hint">${esc(row[1])}. Check first: ${esc(row[2].charAt(0).toLowerCase()+row[2].slice(1))}.</p>`:""}</div>${pid?`<button class="btn small" data-act="practice" data-lab="${pid}">Practise</button>`:""}</li>`;}).join("")}</ul>`
      :`<p class="muted">Every error you hit in a lab is logged here automatically, with a practice lab for the common ones. Nothing yet.</p>`}</section>`;}

/* ---------- Stuck ladder: rebuild the solution from scrambled lines ---------- */
function pzStart(){const lines=lab.L.solution.split("\n").filter(l=>l.trim());
  let pool=shuffled(lines.map((_,i)=>i),lab.L.id+"z"+Date.now());if(pool.every((x,i)=>x===i))pool.reverse();
  lab.pz={lines,pool,order:[],tries:0,marks:null,done:false};markHelped();}
function pzHTML(){const P=lab.pz;if(!P)return "";const left=P.pool.filter(i=>!P.order.includes(i));
  return `<div class="pz"><span class="eyebrow">Rebuild from scrambled lines</span><p class="hint">These are the solution's lines, shuffled. Tap them in order; indentation shows which block each line belongs to. This counts as help, so the lab comes back sooner as a redo.</p>
    <ol class="pz-chosen">${P.order.map((i,pos)=>`<li><button class="pzl ${P.marks?(P.marks[pos]?"right":"wrong"):""}" data-l="pz-unpick" data-i="${i}" ${P.done?"disabled":""}>${esc(P.lines[i])}</button></li>`).join("")||'<li class="muted">Your code appears here</li>'}</ol>
    ${left.length?`<div class="pz-pool">${left.map(i=>`<button class="pzl" data-l="pz-pick" data-i="${i}">${esc(P.lines[i])}</button>`).join("")}</div>`:""}
    ${P.msg||""}
    <div class="row">${P.done?"":`<button class="btn small primary" data-l="pz-check" ${left.length?"disabled":""}>Check order</button>`}<button class="btn small" data-l="pz-close">Close</button></div></div>`;}
function renderPz(){const el=document.getElementById("pzBox");if(el)el.innerHTML=pzHTML();}
function pzAct(a,btn){const P=lab.pz;
  if(a==="parsons"){if(!P)pzStart();renderPz();const el=document.getElementById("pzBox");if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest",behavior:"smooth"});return true;}
  if(!P)return false;
  if(a==="pz-close"){lab.pz=null;renderPz();return true;}
  if(a==="pz-pick"){P.order=[...P.order,+btn.dataset.i];P.marks=null;P.msg="";renderPz();return true;}
  if(a==="pz-unpick"){P.order=P.order.filter(i=>i!==+btn.dataset.i);P.marks=null;P.msg="";renderPz();return true;}
  if(a==="pz-check"){P.tries++;P.marks=P.order.map((i,pos)=>P.lines[i]===P.lines[pos]);
    const self=P.marks.every(Boolean);
    if(self||P.tries>=3){if(!self){P.order=P.lines.map((_,i)=>i);P.marks=P.order.map(()=>true);}
      P.done=true;const ed=document.getElementById("code");if(ed){ed.value=P.lines.join("\n")+"\n";ed.dispatchEvent(new Event("input"));}flushDraft();
      P.msg=`<div class="fb ${self?"ok":"bad"}"><p><b>${self?"That's the working order.":"Here's the right order."}</b> It's now in your editor. Read it line by line, tap Watch it run to see it work, then run the tests.</p></div>`;}
    else P.msg=`<div class="fb bad"><p>The red lines are in the wrong place. Tap them to take them back.</p></div>`;
    renderPz();return true;}
  return false;}

function labAct(a,btn){if(!lab)return;const L=lab.L;
  if((a==="trace"||a.startsWith("sp-"))&&spAct(a,btn))return;
  if((a==="parsons"||a.startsWith("pz-"))&&pzAct(a,btn))return;
  if(a==="appr"){const el=document.getElementById("appr"),v=el?el.value.trim():"";if(v.split(/\s+/).filter(Boolean).length<12){const h=document.getElementById("apprHint");if(h){h.textContent="A bit more: at least 12 words. Name the data structure and why it fits.";h.classList.add("warn");}return;}lab.appr=v;nextPhase();return;}
  if(a==="close"){closeSheet();return;}
  if(a==="sym"){const ed=document.getElementById("code");if(!ed)return;const c=btn.dataset.c,i=ed.selectionStart,j=ed.selectionEnd;ed.value=ed.value.slice(0,i)+c+ed.value.slice(j);ed.selectionStart=ed.selectionEnd=i+c.length;ed.focus();ed.dispatchEvent(new Event("input"));return;}
  if(a==="next"){nextPhase();return;}
  if(a==="cpick"){lab.cpick=+btn.dataset.i;renderLab();return;}
  if(a==="qtog"){const i=+btn.dataset.i;lab.qsel=lab.qsel.includes(i)?lab.qsel.filter(x=>x!==i):[...lab.qsel,i];renderLab();return;}
  if(a==="qcheck"){lab.qdone=true;lab.qscore=L.questions.filter(([,g],i)=>g===lab.qsel.includes(i)).length;renderLab();return;}
  if(a==="tpick"){lab.tpick=+btn.dataset.i;if(lab.tpick===L.trade[lab.ti||0].a)lab.tright=(lab.tright||0)+1;renderLab();return;}
  if(a==="tnext"){lab.tpick=null;lab.ti=(lab.ti||0)+1;if(lab.ti>=L.trade.length){if((lab.tright||0)<L.trade.length-1)markHelped();nextPhase();}else renderLab();return;}
  if(a==="dsum"){const el=document.getElementById("dsum"),v=el?el.value.trim():"";lab.dsum=v;if(new Set(v.toLowerCase().split(/\s+/).filter(Boolean)).size<22){const h=document.getElementById("dsumHint");if(h){h.textContent="A bit more: at least 30 words, mostly different ones. Cover the clarifying questions, the boxes, one trade-off and how you'd measure it.";h.classList.add("warn");}return;}
    const miss=(L.keys||[]).filter(([,re])=>!new RegExp(re,"i").test(v)).map(x=>x[0]),need=Math.ceil((L.keys||[]).length*0.6);
    lab.dtries=(lab.dtries||0)+1;
    if(L.keys&&L.keys.length-miss.length<need){if(lab.dtries<3){const h=document.getElementById("dsumHint");if(h){h.textContent="Not there yet. Your summary doesn't seem to cover: "+miss.slice(0,3).join("; ")+". Use any wording you like: these are ideas, not exact words to match.";h.classList.add("warn");}return;}markHelped();}
    lab.dmiss=miss;onPass();renderLab();return;}
  if(a==="reply"){const el=document.getElementById("replyTxt"),v=el?el.value.trim():"";if(v.split(/\s+/).filter(Boolean).length<12){const h=document.getElementById("replyHint");if(h){h.textContent="At least 12 words. Write it as if you're sending it.";h.classList.add("warn");}return;}
    lab.replyTxt=v;lab.replyShown=true;const r=document.getElementById("res");if(r)r.innerHTML=resultsHTML();return;}
  if(a==="pcheck"){const P=predictQ(L),el=document.getElementById("pred");if(!el||!el.value.trim())return;
    lab.pval=el.value;const ok=P.num?parseInt(el.value,10)===+P.a:pnorm(el.value)===pnorm(P.a);lab.ptries++;
    const fb=document.getElementById("pfb");
    if(ok||lab.ptries>=2){lab.pdone=true;renderLab();document.getElementById("pfb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b class="t">${ok?"Right. You just solved it by hand.":"Here's the answer"}</b><pre>${esc(P.a)}</pre><p>${ok?"Now notice what you did to get there: those are your steps.":"Trace it once more by hand until you see why. That's the reasoning your code has to repeat."}</p></div>`;}
    else fb.innerHTML=`<div class="fb bad"><b class="t">Not quite</b><p>Go slower: write out each step on paper. One more try.</p></div>`;
    return;}
  if(a==="pick"){lab.order=[...lab.order,+btn.dataset.i];lab.marks=null;lab.pmsg="";renderLab();return;}
  if(a==="unpick"){lab.order=lab.order.filter(i=>i!==+btn.dataset.i);lab.marks=null;lab.pmsg="";renderLab();return;}
  if(a==="ocheck"){lab.ptries++;lab.marks=lab.order.map((i,pos)=>i===pos);const ok=lab.marks.every(Boolean);
    if(ok){lab.pdone=true;lab.pmsg=`<div class="fb ok"><b class="t">${lab.stage==="design"?"That's the request path":"That's a working plan"}</b><p>${lab.stage==="design"?"This is the diagram you'd draw on the whiteboard, box by box.":"It becomes the comments in your editor."}</p></div>`;}
    else if(lab.ptries>=2){lab.pdone=true;if(lab.stage==="design")markHelped();lab.order=L.steps.map((_,i)=>i);lab.marks=lab.order.map(()=>true);lab.pmsg=`<div class="fb bad"><b class="t">Here's a working order</b><p>Read it top to bottom and ask why each step must come before the next one.</p></div>`;}
    else lab.pmsg=`<div class="fb bad"><b class="t">Some steps are out of order</b><p>The red ones are in the wrong place. Tap them to take them back, then try again.</p></div>`;
    renderLab();return;}
  if(a==="pat"){const i=+btn.dataset.i;lab.ppick=i;lab.pdone=true;const ok=lab.popts[i]===L.pat;
    lab.pmsg=`<div class="fb ${ok?"ok":"bad"}"><b class="t">${ok?"Right":"It's "+esc(L.pat)}</b><p>Use this when ${esc(PATWHY[L.pat]||"it fits the problem")}.</p></div>`;renderLab();return;}
  if(a==="run"){runLab();return;}
  if(a==="hint"){flushDraft();lab.showHint=!lab.showHint;if(lab.showHint)markHelped();renderLab();return;}
  if(a==="sol"){flushDraft();lab.showSol=!lab.showSol;if(lab.showSol)markHelped();renderLab();return;}
  if(a==="reset"){if(!lab.resetArm){flushDraft();lab.resetArm=true;renderLab();return;}lab.resetArm=false;delete drafts[draftKey()];saveDraft(draftKey(),initialCode(L,lab.stage));lab.result=null;renderLab();return;}
  if(a==="self"){markHelped();onPass();lab.result=null;renderLab();document.getElementById("res").innerHTML=passHTML();return;}
}
const PATWHY={"read input & print": "you read the lines you're given, convert them, and print results", "loop & build a list": "you go through items one by one and collect results", "while loop": "you repeat until a condition changes and don't know the count in advance", "string methods": "split, join, strip, lower and slicing can do the heavy lifting", "hash map / set": "you need to count things or ask \"have I seen this?\" instantly", "try/except": "some inputs will fail and you must handle them instead of crashing", "running total": "each answer builds on the one before it", "track best so far": "one pass is enough if you remember the best (or lowest) value seen so far", "class with methods": "some data and the actions on it belong together", "file reading": "you open a file with with, read it, and it closes automatically", "two pointers": "the data is sorted and you move one end or the other", "sliding window": "you need a contiguous stretch that grows on the right and shrinks on the left", "stack": "the most recent item must be handled first, as with brackets or the next warmer day", "binary search": "the data is sorted and you need O(log n): halve the range each step", "linked list pointers": "you rewire next pointers carefully, often with a dummy head", "recursion": "the answer for a node comes from the answers for its children", "BFS/DFS": "you explore connected cells or nodes, marking what you've visited", "dynamic programming": "the answer for n is built from answers for smaller n", "sort then scan": "after sorting, the items that interact sit next to each other", "heap": "you repeatedly need the smallest item, or the k largest", "prefix sums": "sums or products of stretches come from running totals", "validation rules": "you check each rule in turn and collect what's wrong", "loop with retries": "you try, catch the failure, and try again up to a limit", "string search & parse": "you find positions in text, cut out the part you need, and parse it", "slicing": "you take a piece of a list or string by position", "math formula": "you apply a known formula carefully, piece by piece", "agent loop": "you ask the model, run what it asks for, feed the result back, and repeat", "guard clauses": "you reject anything unsafe early and allow only what's left", "dedupe & clean": "real exports repeat rows and mix formats, so decide what makes a record unique before you add anything up", "flatten nested data": "the data is nested JSON and you need flat rows, so walk down safely with .get", "regex redaction": "you need to find text by its shape (an email, a phone number) and replace it", "evaluation metrics": "someone asks \"is it good?\" and you answer with a number you compute per case and average", "token bucket": "you allow bursts up to a limit but refill slowly over time", "filter, select, sort": "the question is \"which rows, which columns, in what order\": the same three moves in SQL, pandas and PySpark", "group & aggregate": "the question says per category, per customer or for each: group, then sum, count or average", "clean, join, aggregate": "the data is messy and split across two tables: clean first, join second, add up last"};

sheetIn.addEventListener("click",ev=>{
  const v=ev.target.closest("[data-v]");if(v&&vz){vizAct(v.dataset.v);return;}
  const c=ev.target.closest("[data-c]");if(c&&celebrateDay!==null){celebrateAct(c.dataset.c);return;}
  const l=ev.target.closest("[data-l]");if(l&&lab){labAct(l.dataset.l,l);return;}
  if(!sess)return;
  const o=ev.target.closest(".opt");
  if(o&&!sess.answered){sess.picked=+o.dataset.o;sheetIn.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",b===o));const c=sheetIn.querySelector('[data-s="check"]');c.disabled=false;c.focus();return;}
  const b=ev.target.closest("[data-s]");if(!b)return;
  if(b.dataset.s==="close")closeSheet();
  else if(b.dataset.s==="check")check();
  else if(b.dataset.s==="next"){sess.i++;renderDrill();}
});
document.addEventListener("keydown",ev=>{
  if(sheet.hidden)return;
  if(ev.key==="Escape"){closeSheet();return;}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName||"")&&document.activeElement.id!=="spRange";
  if(vz&&!typing&&(ev.key==="ArrowRight"||ev.key==="ArrowLeft")){vizAct(ev.key==="ArrowRight"?"next":"prev");return;}
  if(lab&&lab.trace&&lab.trace.res&&!lab.trace.ask&&!typing&&(ev.key==="ArrowRight"||ev.key==="ArrowLeft")){ev.preventDefault();spAct(ev.key==="ArrowRight"?"sp-next":"sp-prev");return;}
  if(lab&&lab.phase==="pattern"&&!lab.pdone&&/^[1-4]$/.test(ev.key)&&document.activeElement.tagName!=="TEXTAREA"){const btn=sheetIn.querySelector(`[data-l="pat"][data-i="${+ev.key-1}"]`);if(btn)btn.click();return;}
  if(!sess)return;
  const it=sess.queue[sess.i];
  if(it&&it.d.k==="mcq"&&!sess.answered&&/^[1-4]$/.test(ev.key)){const btn=sheetIn.querySelectorAll(".opt")[+ev.key-1];if(btn)btn.click();}
});

function copyText(txt,btn){const done=()=>{if(btn){const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>{btn.textContent=o;},1500);}};
  try{navigator.clipboard.writeText(txt).then(done,()=>{window.prompt("Copy this text",txt);});}catch(e){window.prompt("Copy this text",txt);}}

const EXAM_MIN=100,EXAM_PASS=9,EXAM_TOTAL=12;
const exAtts=()=>((S.exam||{}).at)||[];
const exLast=()=>{const a=exAtts();return a[a.length-1];};
const exLive=att=>!!att&&!att.fin&&Date.now()<att.t0+EXAM_MIN*60000;
const exFinished=att=>!!att&&(!!att.fin||Date.now()>=att.t0+EXAM_MIN*60000||att.ids.every(id=>att.res[id]));
function exScore(att){const r={total:0,sql:0,pyEasy:0,pyMed:0};
  for(const id of att.ids){if(!(att.res[id]&&att.res[id].ok))continue;const L=labById(id);r.total++;
    if(L.kind==="sql")r.sql++;else if(L.lvl==="easy")r.pyEasy++;else r.pyMed++;}
  r.pass=r.total>=EXAM_PASS;r.sqlOK=r.sql>=3;r.pyOK=r.pyEasy>=3;r.barOK=r.pass&&r.pyMed>=3;return r;}

function examStart(){const a=exAtts(),last=a[a.length-1];if(exLive(last))return;
  const used=a.map(x=>x.form),form=!used.includes("A")?"A":!used.includes("B")?"B":(last.form==="A"?"B":"A");
  S.exam={...(S.exam||{}),at:[...a,{form,t0:Date.now(),d:todayISO(),ids:EXAM_FORMS[form].slice(),res:{}}].slice(-8)};logEv("exam_start",{form});save();route();}
function openExam(id){const att=exLast();if(!exLive(att)||att.res[id]||!att.ids.includes(id))return;
  openLab(id,"mixed");lab.checkpoint="exam";lab.target=Math.round(EXAM_MIN/EXAM_TOTAL);lab.phase="code";renderLab();}
function recordExam(l,ok){const a=exAtts(),att=a[a.length-1];if(!att||att.res[l.L.id]||!att.ids.includes(l.L.id))return;
  if(Date.now()>att.t0+EXAM_MIN*60000+60000)return;
  att.res[l.L.id]={ok:!!ok&&!l.helped,passed:!!ok,helped:!!l.helped,secs:Math.round((Date.now()-l.t0)/1000)};
  if(att.ids.every(id=>att.res[id])){att.fin=true;att.d2=todayISO();logEv("exam_done",{form:att.form,score:exScore(att).total});}
  S.exam={...S.exam,at:[...a]};save();}
const mmssLeft=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function examCard(){const att=exLast(),live=exLive(att);
  if(live){const sc=exScore(att),done=att.ids.filter(id=>att.res[id]).length;
    return `<section class="card"><span class="eyebrow">Exam in progress · form ${att.form}</span><h2>Time left: <span id="exclock">${mmssLeft(att.t0+EXAM_MIN*60000-Date.now())}</span></h2>
    <p class="muted">${done} of ${EXAM_TOTAL} attempted · ${sc.total} solved without help so far. You need ${EXAM_PASS} to pass. Each problem can be attempted once: closing one counts it as not solved. Hints and answers count as help.</p>
    <ul class="labs">${att.ids.map((id,i)=>{const r=att.res[id],L=labById(id);return `<li><button class="labrow ${r&&r.ok?"passed":""}" ${r?"disabled":`data-act="exopen" data-id="${id}"`}><span class="lk">Problem ${i+1}</span><span class="lt">${L.kind==="sql"?"SQL":"Python"} · ${r?(r.ok?"solved without help":r.passed?"solved with help (not counted)":"not solved"):"tap to start"}</span><span class="chip ${r&&r.ok?"ok":""}">${r?Math.floor(r.secs/60)+"m "+(r.secs%60)+"s":"to do"}</span></button></li>`;}).join("")}</ul></section>`;}
  const taken=exAtts().length;
  return `<section class="card"><span class="eyebrow">The exam</span><h2>12 problems you have never seen, 100 minutes</h2>
    <p class="muted">4 SQL and 8 Python, half easier and half harder. A blank editor, no pattern prompts, no hints. <b>Pass: ${EXAM_PASS} of ${EXAM_TOTAL} solved without help (75%, since 70% of 12 is 8.4).</b> The three tracks above are earned by parts of the exam, not by the calendar.</p>
    <ul class="muted"><li>The clock starts when you press start and does not pause. Close the tab and it keeps running.</li><li>Take it when you feel ready. A bad score is information, not a penalty.</li><li>There are two forms (A and B, 12 different problems each). From the third attempt, problems repeat, so a third score means less.</li><li>It is an honour-system self-test: the reference answers are readable in the page's source and nothing stops you using another tool. A real interview or a person watching is the true test.</li></ul>
    <button class="btn primary block" data-act="exstart">${taken?"Start another attempt":"Start the exam"}</button></section>`;}
function examHistory(){const done=exAtts().filter(exFinished);if(!done.length)return "";
  return `<section class="card"><span class="eyebrow">Your attempts</span><div class="tablebox"><table><thead><tr><th>Date</th><th>Form</th><th>Total</th><th>SQL</th><th>Py easy</th><th>Py harder</th><th></th></tr></thead><tbody>${done.map(a=>{const s=exScore(a);return `<tr><td>${esc(a.d)}</td><td>${a.form}</td><td><b>${s.total}/12</b></td><td>${s.sql}/4</td><td>${s.pyEasy}/4</td><td>${s.pyMed}/4</td><td>${s.pass?'<span class="chip ok">pass</span>':'<span class="chip">not yet</span>'}</td></tr>`;}).join("")}</tbody></table></div>
    <p class="hint">Look at which section is low. Practise that area with reps, then retake in about a week.</p></section>`;}
function tracksCard(compact){return `<section class="card"><span class="eyebrow">Tracks · the exam decides when you are done</span>
  ${TRACKS.map(t=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><b>${esc(t.name)}</b><span class="chip ${trackDone(t)?"ok":""}">${trackDone(t)?"earned":"not yet"}</span></div>
    <p class="hint" style="margin:2px 0">Planning estimate: ${t.span}. These durations are my estimates, not measured on learners. To earn it: ${t.rule}.</p>
    ${compact?"":`<ul>${t.plan.map(p=>`<li>${p}</li>`).join("")}</ul><a href="${t.link[0]}" class="btn small">${t.link[1]}</a>`}</div>`).join("")}
  ${compact?`<a class="btn small" href="#exam">Tracks and exam</a>`:""}</section>`;}
function renderExam(){app.innerHTML=`<div class="view"><section style="display:flex;flex-direction:column;gap:8px"><a href="#path" class="muted">← Path</a><span class="eyebrow">Tracks and exam</span><h1>What does “done” mean?</h1>
  <p class="muted">“Pro” needs a definition you can test. Here it is: three tracks, earned by solving unseen problems under time, without help.</p></section>${tracksCard(false)}${examCard()}${examHistory()}</div>`;}
setInterval(()=>{const el=document.getElementById("exclock"),att=exLast();if(!el)return;if(!exLive(att)){route();return;}el.textContent=mmssLeft(att.t0+EXAM_MIN*60000-Date.now());},1000);

/* ---------- Daily mixed reps ---------- */
const repsToday=()=>(S.log||[]).filter(e=>e.ev==="pass"&&e.mixed&&!e.ck&&e.d===todayISO()).length;
function repSetCard(){if(!mixedUnlocked())return "";const n=repsToday(),goal=3;
  return `<section class="card"><span class="eyebrow">Daily mixed reps</span><h3>${n>=goal?"Today's reps are done":n+" of "+goal+" done today"}</h3>
  <div class="drills-dots">${Array.from({length:goal},(_,i)=>`<span class="dot ${i<n?"ok":""}"></span>`).join("")}</div>
  <p class="muted">Unlabelled problems from earlier days and unseen ones, weakest areas first, about 10 minutes each. This is the repetition that makes a skill survive past the day you learned it.</p>
  <div class="row"><button class="btn small primary" data-act="mixed">${n>=goal?"One more":"Start a rep"}</button><button class="btn small" data-act="mixed" data-area="sql">SQL rep</button></div></section>`;}

/* ---------- Day notes: dense and survey days ---------- */
const DAY_NOTES={
 12:["Dense day","pandas brings a lot of new names at once. Treat today as two sittings: drills and the first two labs, then the rest later. The aim is to run each pattern once and know where to look, not to memorise every method."],
 13:["Dense day","PySpark is a lot of new names, and the labs here run on a pandas-based stand-in, not on Spark. Do it in two sittings. The aim today is the shape of a Spark job and the common calls. Real Spark errors will differ."],
 23:["Survey day","The aim today is to run one small working example and say in a sentence what it is for. You will not yet be able to build this from a blank file. The capstone (Day 29) and the interview-bar reps are where building is practised. If you are behind, pass the labs and skip the extended hands-on."],
 24:["Survey day","The aim today is one working call to a language model and an explanation of what it returns. Building from a blank file comes later, through the capstone and the reps."],
 25:["Survey day","The aim today is to see the retrieval idea work once and explain it. Do not expect to build a retrieval system from nothing yet."],
 26:["Survey day","The aim today is to follow one agent loop end to end and explain each step. Building your own comes later."],
 27:["Survey day","The aim today is to read and explain a container recipe and know what each line does. The container image in the capstone starter has not been built or run by the author of this app; be prepared to debug."]};
const dayNote=n=>DAY_NOTES[n]?`<section class="card" style="border-left:3px solid var(--acc)"><span class="eyebrow">${DAY_NOTES[n][0]}</span><p>${DAY_NOTES[n][1]}</p></section>`:"";

/* ---------- Portfolio: one showable card per day, kept on this device ---------- */
const CKEY="blankfile-code-v1";let codes={};try{codes=JSON.parse(localStorage.getItem(CKEY)||"{}")||{};}catch(e){codes={};}
function saveCode(L,code){if(!code||!String(code).trim())return;codes[L.id]={c:String(code).slice(0,6000),d:todayISO()};try{localStorage.setItem(CKEY,JSON.stringify(codes));}catch(e){}}
const stripTags=s=>String(s).replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
function dayMarkdown(n){const d=DAYS[n-1],ls=labsOf(n).filter(L=>L.kind!=="design"&&codes[L.id]&&S.labs[L.id]);
  return `# Day ${n}: ${d.t}\n\n*Completed ${(S.doneOn||{})[n]||"(not yet)"}*\n\n**After this day I can** ${d.can}\n\n`+
   (ls.length?ls.map(L=>`## ${L.title}\n\n${stripTags(L.task)}\n\n\`\`\`${L.kind==="sql"?"sql":"python"}\n${codes[L.id].c.replace(/\s+$/,"")}\n\`\`\`\n`).join("\n"):"*No lab code saved on this device for this day.*\n");}
function portfolioFiles(){const f={"README.md":"# My ShipCode portfolio\n\nOne file per day: what I can do after that day, and the code I wrote that passed the tests.\nGenerated from ShipCode on "+todayISO()+".\n"};
  S.done.slice().sort((a,b)=>a-b).forEach(n=>{f["day-"+String(n).padStart(2,"0")+".md"]=dayMarkdown(n);});return f;}
function renderPortfolio(){const done=S.done.slice().sort((a,b)=>a-b);
  app.innerHTML=`<div class="view"><section style="display:flex;flex-direction:column;gap:8px"><a href="#path" class="muted">← Path</a><span class="eyebrow">Portfolio</span><h1>Something to show</h1>
  <p class="muted">One card per finished day: what you can now do, and the code you wrote that passed the tests. Paste them into a GitHub repo as <code>day-01.md</code>, <code>day-02.md</code> and so on. The code is kept on this device only, so copy it out before you clear your browser.</p></section>
  <section class="card">${done.length?`<ul class="labs">${done.map(n=>{const k=labsOf(n).filter(L=>codes[L.id]&&S.labs[L.id]).length;return `<li><div class="labrow"><span class="lk">Day ${n}</span><span class="lt">${esc(DAYS[n-1].t)} · ${k} solution${k===1?"":"s"} saved</span><button class="btn small" data-act="daycopy" data-day="${n}">Copy</button></div></li>`;}).join("")}</ul>
  <div class="row"><button class="btn small primary" data-act="portcopy">Copy everything</button><button class="btn small" data-act="portzip">Download .zip</button></div>`:`<p class="muted">Finish a day and its card appears here.</p>`}</section></div>`;}

/* ---------- Weekly review with a person ---------- */
const lastReview=()=>((S.reviews||[]).slice(-1)[0]);
const reviewDue=()=>S.done.length>=3&&(!lastReview()||lastReview().d<shift(todayISO(),-6));
function reviewData(){const t=todayISO(),from=shift(t,-6),inW=d=>d>=from&&d<=t,log=S.log||[],ps=log.filter(e=>e.ev==="pass"&&inW(e.d)&&!e.ck);
  return {from,to:t,days:Object.entries(S.doneOn||{}).filter(([,d])=>inW(d)).map(([n])=>+n),labs:ps.length,blank:ps.filter(e=>e.blank).length,reps:ps.filter(e=>e.mixed).length,helped:ps.filter(e=>e.helped).length,topErr:Object.entries(S.errs||{}).sort((a,b)=>b[1]-a[1])[0]};}
function reviewText(win,stuck){const r=reviewData();return `ShipCode weekly review (${r.from} to ${r.to})\n\nDays finished: ${r.days.length?r.days.join(", "):"none"}\nLabs passed: ${r.labs} (${r.helped} needed help)\nRedone from a blank editor without help: ${r.blank}\nMixed reps: ${r.reps}\nMost frequent error: ${r.topErr?r.topErr[0]:"none logged"}\n\nSomething I can do now that I couldn't a week ago:\n${win||"(fill in)"}\n\nWhere I am stuck / what I want to ask you:\n${stuck||"(fill in)"}\n\nWhat I'd like you to do (30 min): pick any lab I passed and ask me to explain it without looking; give me a small variation to code from a blank file; ask me to read an error out loud and fix it.`;}
function renderReview(){const r=reviewData(),last=lastReview();
  app.innerHTML=`<div class="view"><section style="display:flex;flex-direction:column;gap:8px"><a href="#path" class="muted">← Path</a><span class="eyebrow">Weekly review</span><h1>Show it to a person</h1>
  <p class="muted">An app can check your code, but it cannot hear you explain it. Once a week, spend 30 minutes with a friend, colleague or mentor who codes (or learns with you). This page prepares the sheet. It cannot make the meeting happen: that part is up to you.</p></section>
  <section class="card"><h3>This week (${esc(r.from)} to ${esc(r.to)})</h3><ul><li>Days finished: <b>${r.days.length}</b></li><li>Labs passed: <b>${r.labs}</b> (${r.helped} with help)</li><li>Redone from a blank editor without help: <b>${r.blank}</b></li><li>Mixed reps: <b>${r.reps}</b></li></ul>
  <label class="hint" for="rvwin">Something you can do now that you couldn't a week ago</label><textarea id="rvwin" class="code small" rows="2" maxlength="300">${esc((last&&last.d===todayISO()&&last.win)||"")}</textarea>
  <label class="hint" for="rvstuck">Where you are stuck, or what you want to ask</label><textarea id="rvstuck" class="code small" rows="2" maxlength="300">${esc((last&&last.d===todayISO()&&last.stuck)||"")}</textarea>
  <div class="row"><button class="btn small primary" data-act="revcopy">Copy the sheet to send</button><button class="btn small" data-act="revsave">I did the review with a person</button></div>
  <p class="hint">${last?"Last review logged: "+esc(last.d)+(last.person?" (with a person)":"")+".":"No review logged yet."} “I did the review” is an honour-system log for your own record.</p></section>
  <section class="card"><h3>For the person helping you</h3><ol><li>Pick any lab the learner passed. Ask them to explain it out loud without looking at the code (2 minutes).</li><li>Change the requirement slightly and watch them write it from a blank editor.</li><li>Have them read one error message aloud and say what it means before fixing it.</li><li>Ask for the Big-O of one solution and why.</li><li>Agree one goal for next week.</li></ol>
  <p class="hint">You do not need to be an engineer for items 1, 3 and 5. A study partner who is also learning works.</p></section></div>`;}
function reviewDueCard(){if(!reviewDue())return "";return `<section class="card"><span class="eyebrow">Weekly review</span><p>It has been a week. Show your work to a person: 30 minutes.</p><a class="btn small primary" href="#review">Prepare the sheet</a></section>`;}

route();
connectCloud();

</script>

</body></html>
