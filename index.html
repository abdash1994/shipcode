<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one centered 680px column, fixed bottom tab bar; drills open in a full-screen sheet. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --fg:#141B26; --muted:#5B667A; --line:#DCE1EA;
  --accent:#2B50C8; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --ok:#1C7C54; --ok-soft:#DDF2E7; --bad:#B93A27; --bad-soft:#FBE3DE; --warn:#95560B; --warn-soft:#F9ECD8;
  --code:#ECEFF5;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --fg:#E5E9F0; --muted:#98A3B5; --line:#283242;
  --accent:#8DA8F6; --accent-ink:#0E131B; --accent-soft:#1E2946;
  --ok:#5CC796; --ok-soft:#13302A; --bad:#F08A78; --bad-soft:#3A1E1A; --warn:#E8A65E; --warn-soft:#382713;
  --code:#1C2431; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --fg:#E5E9F0; --muted:#98A3B5; --line:#283242;
  --accent:#8DA8F6; --accent-ink:#0E131B; --accent-soft:#1E2946;
  --ok:#5CC796; --ok-soft:#13302A; --bad:#F08A78; --bad-soft:#3A1E1A; --warn:#E8A65E; --warn-soft:#382713;
  --code:#1C2431; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code);padding:1px 5px;border-radius:4px}
pre{margin:0;background:var(--code);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:.84rem;line-height:1.55;white-space:pre}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.col{max-width:680px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .col{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;flex:1}
.brand span{font-family:var(--f-mono);font-weight:500;color:var(--accent);margin-right:4px}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums}
.stat svg{width:16px;height:16px}
.stat.streak{color:var(--warn)} .stat.xp{color:var(--accent)}

main{padding-block:20px 24px}
.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:44px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.small{padding:7px 12px;min-height:36px;font-size:.88rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:.76rem;padding:3px 9px;border-radius:99px;background:var(--code);color:var(--muted)}
.syn{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}.syn th,.syn td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line,#ddd)}.syn code{white-space:normal}
.newsyn{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:.9rem}.newsyn ul{margin:6px 0 0 18px;padding:0}
.gymcard{display:block;text-decoration:none;color:inherit}.gymlesson pre{overflow:auto}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

.pace{border-left:3px solid var(--accent)}
.pace.behind{border-left-color:var(--warn);background:var(--warn-soft)}
.pace.ahead{border-left-color:var(--ok)}
.pacebar{height:8px;background:var(--line);border-radius:99px;position:relative;overflow:hidden}
.pacebar .fill{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:99px}
.pacebar .target{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.onboard .row .btn{flex:1 1 220px;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.onboard .btn small{font-weight:400;color:var(--muted)}

.lesson p{max-width:66ch}
.drills-dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks li{border-top:1px solid var(--line)}
.tasks li:first-child{border-top:0}
.tasks label{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:10px 0;cursor:pointer;align-items:start}
.tasks input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.tasks .kind{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.tasks .gate .kind{color:var(--ok)}
.tasks input:checked + span .txt{color:var(--muted);text-decoration:line-through}
.daynav{display:flex;justify-content:space-between;gap:10px}

/* path */
.week{display:flex;flex-direction:column;gap:8px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--fg)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--accent-soft)}
.node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.prow.done .node{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.prow.current .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.prow.target .ptitle::after{content:"today's target";margin-left:8px;font-family:var(--f-mono);font-size:.68rem;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.ptitle{font-weight:500;min-width:0}
.pmeta{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* reference tables */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td:first-child{font-family:var(--f-mono);color:var(--accent);white-space:nowrap}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
pre .hl{color:var(--bad);font-weight:500} pre .note{color:var(--muted)}
.sync{font-family:var(--f-mono);font-size:.8rem}
.confirm{background:var(--bad-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .col{display:grid;grid-template-columns:repeat(6,1fr)} .tabs a{padding:9px 2px!important;font-size:.7rem!important}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;color:var(--muted);text-decoration:none;font-size:.74rem;font-weight:500}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}

/* drill sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.sheet-head{display:flex;align-items:center;gap:12px;padding-block:12px}
.xbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;line-height:1}
.sprog{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.sprog span{display:block;height:100%;background:var(--ok);transition:width .25s}
.sheet-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:8px 16px;min-height:0}
.qkind{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.q{font-size:1.15rem;font-weight:600;font-family:var(--f-display)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:.9rem;min-height:52px}
.opt .k{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
textarea.code{width:100%;min-height:96px;font-family:var(--f-mono);font-size:.95rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical}
textarea.code:focus{border-color:var(--accent);outline:none}
.hint{font-size:.82rem;color:var(--muted)}
.sheet-foot{padding-block:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b.t{font-family:var(--f-display);font-size:1.05rem}
.fb.ok b.t{color:var(--ok)} .fb.bad b.t{color:var(--bad)}
.fb pre{background:var(--surface)}
.summary{align-items:center;text-align:center;justify-content:center;flex:1;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-size:3rem;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}

.proof input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font:inherit;margin:4px 0}
.proof ul{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.proof li.y::before{content:"✓ ";color:var(--ok);font-weight:700}.proof li.n::before{content:"✗ ";color:var(--bad);font-weight:700}
.card.back{border-left:4px solid var(--accent)}.card.back blockquote{margin:8px 0;padding-left:12px;border-left:2px solid var(--line);font-style:italic}

.runmsg{white-space:pre-wrap;word-break:break-word;max-height:9.5em;overflow:auto;font-size:.82rem;margin:6px 0}

.symrow{display:flex;gap:6px;overflow-x:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.sym{flex:0 0 auto;min-width:40px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-mono);font-size:1rem;color:inherit}
@media (hover:hover) and (pointer:fine){.symrow{display:none}}

.brief{margin:8px 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.brief p{margin:4px 0 0;font-style:italic}
.replybox{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:6px}
.replybox p{margin:0}
.fl{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.fl-n{position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-size:.86rem;transition:background .2s,border-color .2s}
.fl-n:not(:last-child):not(.side)::after{content:"↓";position:absolute;left:50%;bottom:-15px;color:var(--muted);font-size:.75rem}
.fl-n.side{margin-top:10px;border-style:dashed}
.fl-n.seen{border-color:var(--ok);background:var(--ok-soft)}
.fl-n.cur{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.fl-d{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px}

[hidden]{display:none!important}
/* motivation */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.hero h1{font-size:clamp(2rem,7vw,2.8rem)}
.lead{font-size:1.06rem;line-height:1.6}
.how{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:h}
.how li{display:grid;grid-template-columns:34px 1fr;gap:4px 12px;counter-increment:h}
.how li::before{content:counter(h);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500}
.how b{font-family:var(--f-display)} .how span{color:var(--muted);font-size:.95rem}
.field{display:flex;flex-direction:column;gap:8px}
.chipbtn{font:inherit;font-size:.88rem;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:40px}
.chipbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dayhead{display:flex;flex-direction:column;gap:8px}
.dayhead .can{font-size:1.02rem} .dayhead .can b{color:var(--ok)}
.dayhead .why{color:var(--muted);font-size:.93rem;border-left:3px solid var(--line);padding-left:10px}
.session{border:2px solid var(--accent)}
.sbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.sbar span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.parts li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.parts li:first-child{border-top:0}
.pk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.parts li.done .pk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.parts li.done .pn{color:var(--muted)}
.parts li.next .pk{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.parts li.next .pn{font-weight:600}
.pt{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.big-cta{min-height:52px;font-size:1.02rem}
.lesson>summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;gap:10px}
.lesson>summary::-webkit-details-marker{display:none}
.lesson[open]>summary{margin-bottom:4px}
.selfcheck{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer;padding-top:4px}
.selfcheck input{width:20px;height:20px;accent-color:var(--ok)}
.labrow.passed{border-color:var(--ok-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;text-align:center}
.stats b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;max-width:220px}
.heat span{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat span.on{background:var(--ok)} .heat span.today{outline:2px solid var(--accent);outline-offset:1px}
.skills{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.skills li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.93rem}
.sk{font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:99px;background:var(--code);color:var(--muted);white-space:nowrap}
.sk.ok{background:var(--ok-soft);color:var(--ok)}
.skills.locked{opacity:.65;border-top:1px dashed var(--line);padding-top:10px}
.celebrate{align-items:center;text-align:center;gap:14px;padding-top:16px}
.celebrate .stats{width:100%}
.celebrate .tomorrow,.celebrate .share,.celebrate .lvl{width:100%;text-align:left}
.share{display:flex;flex-direction:column;gap:8px}
.burst{width:84px;height:84px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-size:2.4rem;font-weight:800;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.levelup{background:var(--accent-soft);border-radius:12px;padding:12px 18px;width:100%}
.levelup h2{color:var(--accent)}
.fb.pass{animation:pop .35s ease-out both}
.nudge{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.92rem;margin-top:8px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.burst,.fb.pass{animation:none}}

/* watch it run */
.stepper{border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.sp-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp-head select{flex:1 1 160px;min-width:0;font:inherit;font-size:.85rem;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:36px}
.sp-code{padding:8px 0;max-height:260px;overflow:auto;font-size:.82rem;line-height:1.55}
.sp-code span{display:block;padding:0 12px 0 0;white-space:pre;border-left:4px solid transparent}
.sp-code i{display:inline-block;width:2.4em;text-align:right;margin-right:12px;color:var(--muted);font-style:normal;user-select:none}
.sp-code span.cur{background:var(--accent-soft);border-left-color:var(--accent);font-weight:500}
.sp-code span.ret{background:var(--ok-soft);border-left-color:var(--ok)}
.sp-code span.was{background:color-mix(in srgb,var(--line) 45%,transparent)}
.sp-note{font-size:.9rem}
.sp-vars table{min-width:0}
.sp-vars td:first-child{color:var(--accent)}
.sp-vars td{font-family:var(--f-mono);font-size:.82rem;word-break:break-word}
.sp-vars tr.chg td{background:var(--warn-soft)} .sp-vars tr.chg td:last-child{font-weight:600}
.sp-out{max-height:120px;overflow:auto;font-size:.8rem}
.sp-ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sp-ctrl input[type=range]{flex:1 1 120px;accent-color:var(--accent);min-height:36px}
.sp-ask{background:var(--accent-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sp-fb{font-size:.9rem;background:var(--bg);border-radius:8px;padding:8px 10px}
.sp-end p{font-size:.92rem}
/* pattern diagrams */
.vz-open{justify-content:flex-start;text-align:left}
.vz-list{display:flex;flex-direction:column;gap:8px}
.vz-stage{display:flex;flex-direction:column;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 14px;overflow-x:auto}
.vz-say{font-size:1.02rem;line-height:1.5;min-height:3.2em}
.vz-arr{display:flex;gap:6px;padding-bottom:22px}
.vz-cell{position:relative;width:40px;height:44px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--f-mono);transition:background .25s,border-color .25s}
.vz-v{font-weight:600}
.vz-i{position:absolute;top:-17px;font-size:.66rem;color:var(--muted)}
.vz-p{position:absolute;bottom:-21px;font-family:var(--f-mono);font-size:.66rem;color:var(--accent);white-space:nowrap;font-weight:600}
.vz-cell.cur{border-color:var(--accent);background:var(--accent-soft)}
.vz-cell.hit{border-color:var(--ok);background:var(--ok-soft)}
.vz-cell.win{border-color:var(--accent)}
.vz-cell.done{opacity:.75} .vz-cell.out{opacity:.3}
.vz-box{display:flex;flex-direction:column;gap:6px}
.vz-kv{display:flex;flex-wrap:wrap;gap:6px}
.vz-pair{font-family:var(--f-mono);font-size:.82rem;padding:4px 9px;border-radius:99px;background:var(--code)}
.vz-stat{font-family:var(--f-mono);font-size:.85rem}
.vz-row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.vz-stack{display:flex;flex-direction:column-reverse;gap:4px;min-width:60px;align-items:center}
.vz-stack .eyebrow{order:-1}
.vz-sc{width:44px;height:30px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;background:var(--bg)}
.vz-sc.top{border-color:var(--accent);background:var(--accent-soft)}
.vz-stack{flex-direction:column}
.vz-tree{width:100%;max-width:380px;height:auto}
.vz-tree line{stroke:var(--line);stroke-width:2}
.vz-node circle{fill:var(--bg);stroke:var(--line);stroke-width:2}
.vz-node text{font-family:var(--f-mono);font-size:10px;text-anchor:middle;fill:var(--muted)}
.vz-node.call circle{stroke:var(--accent);fill:var(--accent-soft)} .vz-node.call text{fill:var(--fg)}
.vz-node.done circle{stroke:var(--ok);fill:var(--ok-soft)} .vz-node.done text{fill:var(--fg)}
.vz-node text.vz-ret{fill:var(--ok);font-weight:700}
.vz-grid{display:grid;gap:4px}
.vz-g{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;border:2px solid transparent}
.vz-g.water{background:var(--code);color:var(--muted)} .vz-g.land{background:var(--line)}
.vz-g.isl0{background:var(--accent-soft);color:var(--accent)} .vz-g.isl1{background:var(--ok-soft);color:var(--ok)} .vz-g.isl2{background:var(--warn-soft);color:var(--warn)}
.vz-g.cur{border-color:var(--fg)}
.vz-t{min-width:0;width:auto} .vz-t td,.vz-t th{padding:4px 9px}
.vz-t tr.cur td{background:var(--accent-soft)} .vz-t tr.hit td{background:var(--ok-soft)} .vz-t tr.gone td{opacity:.3;text-decoration:line-through}
.vz-t td:first-child{color:var(--fg)}
.null{color:var(--bad);font-family:var(--f-mono);font-weight:600}

/* readiness, reps, journal, rebuild */
.areas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.areas li{display:flex;flex-direction:column;gap:4px}
.areas .an{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;font-weight:500}
.areas li.upcoming{opacity:.5}
.areas li.ready .sbar span{background:var(--ok)} .areas li.solid .sbar span{background:var(--accent)} .areas li.building .sbar span{background:var(--warn)}
.sbar.sm{height:6px}
.jl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.jl li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.jl li:first-child{border-top:0}
#ltimer.over{color:var(--warn);font-weight:600}
.hint.warn{color:var(--warn);font-weight:500}
.pz{border:2px dashed var(--warn);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pz-chosen{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:4px}
.pz-pool{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.pzl{width:100%;text-align:left;font-family:var(--f-mono);font-size:.8rem;white-space:pre;overflow-x:auto;padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;min-height:36px}
.pzl:hover{border-color:var(--accent)} .pzl.right{border-color:var(--ok);background:var(--ok-soft)} .pzl.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* labs */
.warm{border-left:3px solid var(--warn)}
.labs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.labrow{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;min-height:48px}
.labrow:hover{border-color:var(--accent)}
.lk{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.lt{font-weight:600;min-width:0}
.expect summary,.card details summary,details.tables summary{cursor:pointer;font-weight:600}
.expect ul{margin-top:8px}
.phasebar{flex:1;display:flex;gap:4px;min-width:0}
.phasebar span{flex:1;text-align:center;font-family:var(--f-mono);font-size:.68rem;padding:4px 2px;border-radius:6px;background:var(--line);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phasebar span.on{background:var(--accent);color:var(--accent-ink)} .phasebar span.done{background:var(--ok-soft);color:var(--ok)}
.plan{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.plan .empty{list-style:none;margin-left:-22px}
.pool{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.stepbtn{width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:.92rem;min-height:44px}
.stepbtn:hover{border-color:var(--accent)} .stepbtn.right{border-color:var(--ok);background:var(--ok-soft)} .stepbtn.wrong{border-color:var(--bad);background:var(--bad-soft)}
input.code{width:100%;font-family:var(--f-mono);font-size:.95rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);min-height:48px}
input.code:focus{border-color:var(--accent);outline:none}
textarea.code.small{min-height:80px}
.ed{display:grid;grid-template-columns:auto 1fr;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ed:focus-within{border-color:var(--accent)}
.gutter{margin:0;padding:12px 8px;background:var(--code);color:var(--muted);text-align:right;user-select:none;overflow:hidden;border-radius:0;font-size:.85rem;line-height:1.5;min-width:2.6em;height:340px}
.codearea{display:block;width:100%;height:340px;resize:vertical;border:0;outline:none;padding:12px;font-family:var(--f-mono);font-size:.85rem;line-height:1.5;background:transparent;color:var(--fg);white-space:pre;overflow:auto;tab-size:4}
.tests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tests li{display:grid;grid-template-columns:20px 1fr;gap:8px;min-width:0}
.tests li div{min-width:0;display:flex;flex-direction:column;gap:4px}
.tests .mark{font-weight:700} .tests .pass .mark{color:var(--ok)} .tests .fail .mark{color:var(--bad)}
pre.tb{color:var(--bad);background:var(--surface)}
.cmp pre{background:var(--surface)}
table.mini{min-width:0;font-size:.8rem} table.mini td,table.mini th{padding:5px 8px} table.mini td:first-child{color:var(--fg)}
details.tables{display:flex;flex-direction:column;gap:6px}
details.tables .tablebox{margin-bottom:8px}
.method{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.editor-card{gap:10px}
@media (max-width:420px){.gutter,.codearea{height:300px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Modern theme: soft surfaces, chunky buttons, journey path, sidebar on desktop ===== */
:root{
  --bg:#F4F5FC; --surface:#FFFFFF; --fg:#151936; --muted:#626A86; --line:#E4E7F4;
  --accent:#5550E8; --accent-deep:#3B35B5; --accent-ink:#FFFFFF; --accent-soft:#ECEBFF;
  --grad:linear-gradient(135deg,#5550E8 0%,#7B4FE6 100%);
  --ok:#128A58; --ok-soft:#DDF5EA; --bad:#D63A3F; --bad-soft:#FDE7E8; --warn:#B86A00; --warn-soft:#FFF0D3;
  --code:#EFF0FA; --glow1:#DDDBFF; --glow2:#FFE2F0;
  --shadow:0 1px 2px rgba(25,25,80,.05),0 12px 28px -14px rgba(50,45,150,.25);
  --r:20px;
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0E1B; --surface:#151834; --fg:#ECEEFF; --muted:#A0A6C9; --line:#262A4E;
  --accent:#9A97FF; --accent-deep:#3D37B8; --accent-soft:#23265A;
  --grad:linear-gradient(135deg,#6560F0 0%,#8A58EC 100%);
  --ok:#5CD39B; --ok-soft:#12332A; --bad:#FF8C90; --bad-soft:#3C1D22; --warn:#F2B25C; --warn-soft:#3A2A10;
  --code:#1B1F42; --glow1:#1E1F5C; --glow2:#3A1A44; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E1B; --surface:#151834; --fg:#ECEEFF; --muted:#A0A6C9; --line:#262A4E;
  --accent:#9A97FF; --accent-deep:#3D37B8; --accent-soft:#23265A;
  --grad:linear-gradient(135deg,#6560F0 0%,#8A58EC 100%);
  --ok:#5CD39B; --ok-soft:#12332A; --bad:#FF8C90; --bad-soft:#3C1D22; --warn:#F2B25C; --warn-soft:#3A2A10;
  --code:#1B1F42; --glow1:#1E1F5C; --glow2:#3A1A44; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.6);color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 420px at 8% -8%,var(--glow1),transparent 62%),radial-gradient(700px 380px at 100% 0%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{background:transparent}
h1,h2,h3{letter-spacing:-.02em}
h1{font-weight:800} h2{font-weight:800;font-size:1.3rem} h3{font-weight:700}
.eyebrow{font-family:var(--f-body);font-weight:700;font-size:.72rem;letter-spacing:.1em}
pre,code,textarea.code,input.code{font-family:var(--f-mono)}

/* top bar */
.top{background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:0}
.top .col{padding-block:12px}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:var(--f-mono);margin-right:6px}
.stat{background:var(--surface);border-radius:99px;padding:5px 12px;box-shadow:var(--shadow);font-family:var(--f-body);font-weight:700;font-size:.9rem}
.stat.streak{color:#E5671B} .stat.xp{color:var(--accent)}

/* cards */
main{padding-block:14px 28px}
.view{gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.session{border:1px solid var(--line);box-shadow:var(--shadow),0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.hint{font-size:.84rem}
.muted{color:var(--muted)}

/* buttons: chunky and tactile */
.btn{border-radius:14px;min-height:48px;font-weight:700;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.primary:disabled{opacity:.5;box-shadow:0 4px 0 var(--accent-deep)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.small{min-height:38px;border-radius:12px}
.btn.danger{box-shadow:0 2px 0 var(--bad-soft)}
.big-cta{min-height:56px;font-size:1.05rem;border-radius:16px}
.grow{flex:1 1 auto}
.chipbtn{border-radius:99px;font-weight:600;border:1px solid var(--line);min-height:42px;padding:8px 16px;transition:transform .08s}
.chipbtn:active{transform:scale(.96)}
.chipbtn.on{background:var(--grad);border-color:transparent;color:#fff}
input.code,textarea.code{border:2px solid var(--line);border-radius:14px;background:var(--surface)}
input.code{width:100%;padding:13px 14px;font-size:1rem;color:var(--fg)}
input.code:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
input.timein{font-family:var(--f-body);font-size:1.4rem;font-weight:700;max-width:180px}

/* day header becomes a banner */
.dayhead{background:var(--grad);color:#fff;border-radius:24px;padding:22px 20px;box-shadow:0 18px 34px -18px rgba(85,80,232,.7)}
.dayhead .eyebrow{color:rgba(255,255,255,.82)}
.dayhead h1{color:#fff}
.dayhead .can{color:#fff} .dayhead .can b{color:#FFE9A8}
.dayhead .why{color:rgba(255,255,255,.88);border-left-color:rgba(255,255,255,.4)}

/* session + bites */
.sbar{height:12px;background:var(--accent-soft);border-radius:99px}
.sbar span{background:var(--grad)}
.parts li{border-top:1px dashed var(--line)}
.parts .pk{border-radius:50%}
.parts li.done .pk{background:var(--ok);border-color:var(--ok);color:#fff}
.bites{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--accent-soft) 55%,var(--surface)))}
.bitelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bitelist li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.bitelist .bk{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
.bitelist .bn{font-weight:600}
.bitelist .pt,.parts .pt{font-size:.8rem;color:var(--muted);font-weight:600}
.wk{display:flex;align-items:center;gap:5px}
.wd{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:var(--muted);font-size:.68rem;font-weight:700}
.wd i{font-style:normal}
.wd.on{background:var(--ok);color:#fff}
.wd.today{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent)}
.wk small{margin-left:4px;font-weight:700}

/* pace card */
.pace{border-left:0;border:1px solid var(--line)}
.pace.behind{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pacebar{height:12px;background:var(--accent-soft)}
.pacebar .fill{background:var(--grad)}
.plan-sum{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}

/* setup wizard */
.wiz{gap:18px;max-width:640px;margin:0 auto;width:100%}
.wiz-dots{display:flex;gap:6px}
.wiz-dots span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.wiz-dots span.on{background:var(--grad)}
.hero h1{font-size:clamp(1.9rem,7vw,2.7rem)}
.wiz-foot{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:6px}
.wiz-foot .btn.primary{flex:1 1 200px}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s,border-color .15s,background .15s;font:inherit;color:inherit}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.choice b{font-size:1.08rem}
.choice span{color:var(--muted);font-size:.92rem}
.choice em{font-style:normal;font-weight:700;font-size:.88rem;color:var(--accent);margin-top:4px}
.choice .tier{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.choice.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.card.note p+p{margin-top:4px}

/* path: a journey with a connecting line */
.path{border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
.prow{position:relative;padding:12px 16px;border-top:0}
.prow::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:3px;background:var(--line)}
.prow:first-child::before{top:50%} .prow:last-child::before{bottom:50%}
.prow.done::before{background:var(--ok)}
.prow .node{position:relative;z-index:1;width:40px;height:40px;background:var(--surface);border-width:3px;font-family:var(--f-body);font-weight:800}
.prow.done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.prow.current .node{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 0 5px var(--accent-soft)}
.prow:hover{background:var(--accent-soft)}
.prow .ptitle{font-weight:600}
.week h2{font-size:1.15rem}

/* bottom nav: floating pill on phones */
.tabs{background:transparent;border-top:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs .col{pointer-events:auto;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 34px -12px rgba(30,30,100,.35);padding:6px;max-width:560px;gap:2px}
.tabs a{border-radius:18px;padding:8px 2px;font-size:.7rem;font-weight:700;gap:3px;transition:background .15s,color .15s}
.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* sheet (drills, labs) */
.sheet{background:radial-gradient(800px 360px at 10% -10%,var(--glow1),transparent 60%),var(--bg)}
.sprog{height:14px;background:var(--accent-soft)}
.sprog span{background:var(--grad)}
.opt{border-radius:16px;border-width:2px;box-shadow:0 3px 0 var(--line);font-weight:600}
.opt.sel{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.opt.right{box-shadow:0 3px 0 var(--ok)} .opt.wrong{box-shadow:0 3px 0 var(--bad)}
.fb{border-radius:16px}
.labrow{border-radius:14px}
.tablebox{border-radius:var(--r);box-shadow:var(--shadow)}
pre{border-radius:14px}
.chip{font-family:var(--f-body);font-weight:700;font-size:.72rem}

/* tablets */
@media (min-width:700px){
  .col{max-width:720px}
  .tabs .col{max-width:600px}
}
/* desktop: sidebar navigation, wider canvas */
@media (min-width:1000px){
  body{padding-left:calc(248px + 24px);padding-right:24px;padding-bottom:40px}
  .tabs{top:0;bottom:0;left:0;right:auto;width:248px;padding:18px 14px;pointer-events:auto;background:var(--surface);border-right:1px solid var(--line)}
  .tabs .col{display:flex;flex-direction:column;gap:6px;max-width:none;border:0;border-radius:0;box-shadow:none;background:transparent;padding:64px 0 0;-webkit-backdrop-filter:none;backdrop-filter:none}
  .tabs .col a{flex-direction:row;gap:14px;padding:13px 16px;font-size:1rem;border-radius:14px}
  .tabs .col a svg{width:22px;height:22px}
  .top{position:sticky;margin-left:-24px;padding-left:24px}
  .top .col,main.col{max-width:820px}
  .brand{position:fixed;top:20px;left:24px;flex:none;font-size:1.35rem;z-index:7}
  .top .col{justify-content:flex-end}
  .wiz-foot{bottom:16px}
  .dayhead{padding:28px 28px}
}
@media (min-width:1280px){ .top .col,main.col{max-width:900px} }
@media (prefers-reduced-motion:reduce){.btn,.choice,.chipbtn{transition:none}}

body.onboarding .tabs{display:none}
body.onboarding{padding-bottom:40px}
@media (min-width:1000px){body.onboarding{padding-left:24px}}
.wiz-foot{background:linear-gradient(to bottom,transparent,var(--bg) 40%);padding-bottom:12px;margin-inline:-4px;padding-inline:4px}
.top{margin-inline:-16px;padding-inline:16px}
@media (min-width:1000px){.top{margin-left:-24px;margin-right:-24px;padding-inline:24px}}

/* plan builder: tiles, ladder, nudges */
.choices.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.choices.two{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:12px 12px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:0 3px 0 var(--line);font:inherit;color:inherit;text-align:left;position:relative;transition:transform .08s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile b{font-size:1.15rem;font-weight:800}
.tile small{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile em{font-style:normal;font-weight:700;font-size:.82rem;color:var(--accent);margin-top:4px}
.tile .fit{font-style:normal;font-size:.68rem;font-weight:800;color:var(--ok);margin-top:2px}
.tile.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;position:relative}
.ladder li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0 10px 0;position:relative;align-items:start}
.ladder li::before{content:"";position:absolute;left:70px;top:0;bottom:0;width:2px;background:var(--line)}
.ladder li:first-child::before{top:18px} .ladder li:last-child::before{bottom:calc(100% - 18px)}
.ladder .ld{font-weight:800;font-size:.86rem;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:1px}
.ladder .ll{padding-left:22px;position:relative;font-weight:600;line-height:1.35}
.ladder .ll::before{content:"";position:absolute;left:-1px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-left:-8px}
.ladder li.win .ll::before{background:var(--ok);border-color:var(--ok)}
.ladder li.end .ll::before{background:var(--grad);border-color:transparent}
.nudge{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.nudge.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.nudge ul{gap:8px;padding-left:18px}
.linkbtn{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.reached{background:var(--grad);color:#fff;border:0}
.reached .eyebrow,.reached .muted{color:rgba(255,255,255,.85)}
.reached .btn.primary{background:#fff;color:var(--accent-deep);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.parts li.opt .pn{color:var(--muted)}

const DAYS=[
{t:"Setup and first programs",
 lesson:"Python runs your file from top to bottom. <code>input()</code> always returns text (a <code>str</code>), so convert it with <code>int()</code> or <code>float()</code> before doing math. f-strings put variables straight into text.",
 ex:`width = float(input("Width: "))
height = float(input("Height: "))
print(f"Area is {width * height}")
print(7 // 2, 7 % 2, 7 / 2)   # 3 1 3.5`,
 build:"Phone only, no laptop? Skip the install: write the scripts in the practice lab below, which runs real Python in your browser. (Install Python from python.org and VS Code once you have a laptop, before Day 6.) With a laptop: install the latest stable Python 3 from python.org and VS Code, then write 10 tiny scripts: tip calculator, Celsius to Fahrenheit, age in days, simple interest.",
 solve:["HackerRank: Say \"Hello, World!\" with Python","HackerRank: Arithmetic Operators","HackerRank: Python: Division"],
 gate:"Write a script that asks for two numbers and prints their sum, difference and average, with nothing open but your editor.",
 drills:[
  M("The user types 20. What is the type of x?",["int","str","float","It raises an error"],1,"<code>input()</code> always returns a string. Wrap it in <code>int()</code> to get a number.",`x = input("Age: ")`),
  T("Print <b>Hello, </b> followed by the variable <code>name</code>, using an f-string.",[`print(f"Hello, {name}")`,`print(f"Hello {name}")`],`print(f"Hello, {name}")`,"An f-string starts with <code>f</code> before the quote, and variables go inside <code>{ }</code>."),
  M("What does this print?",["3 1 3.5","3.5 1 3","3 0 3.5","4 1 3.5"],0,"<code>//</code> is floor division, <code>%</code> is the remainder, and <code>/</code> always returns a float.",`print(7 // 2, 7 % 2, 7 / 2)`),
  T("Convert the string <code>s</code> to an integer and store it in <code>n</code>.",[`n = int(s)`],`n = int(s)`,"<code>int()</code> converts text like <code>\"42\"</code> into the number 42."),
  M("This crashes. What's the fix?",["print(age + \"1\")","print(int(age) + 1)","print(age.int() + 1)","print(str(age) + 1)"],1,"The TypeError says you can't add an int to a str. Convert <code>age</code> to a number first.",`age = input("Age: ")
print(age + 1)

TypeError: can only concatenate str (not "int") to str`)
 ]},
{t:"Conditions and loops",
 lesson:"<code>if/elif/else</code> runs exactly one branch. A <code>for</code> loop walks over anything iterable; <code>range(start, stop, step)</code> stops <em>before</em> stop. A <code>while</code> loop repeats until its condition becomes false.",
 ex:`for n in range(1, 16):
    if n % 15 == 0:
        print("FizzBuzz")
    elif n % 3 == 0:
        print("Fizz")
    elif n % 5 == 0:
        print("Buzz")

 build:"Number guessing game; multiplication table printer; sum of the digits of a number.",
 solve:["LC 412 Fizz Buzz","HackerRank: Python If-Else","HackerRank: Loops","LC 1281 Subtract the Product and Sum of Digits of an Integer"],
 gate:"FizzBuzz from a blank file in under 5 minutes, with no errors on the first run.",
 drills:[
  M("What does this print?",["1 4 7","1 3 6 9","1 4 7 10","0 3 6 9"],0,"Start at 1 and step by 3. It stops before 10, so 10 is excluded.",`for i in range(1, 10, 3):

  T("Write a loop that prints 0, 1, 2, 3, 4 using <code>range</code> and the variable <code>i</code>.",[`for i in range(5): print(i)`,`for i in range(0, 5): print(i)`],`for i in range(5):
    print(i)`,"<code>range(5)</code> gives 0 to 4. The loop body is indented under the <code>for</code> line."),
  M("In FizzBuzz, which check must come first?",["n % 3 == 0","n % 5 == 0","n % 15 == 0","The order doesn't matter"],2,"15 is divisible by both 3 and 5. If you check 3 first, 15 prints \"Fizz\" and never reaches the FizzBuzz branch."),
  M("What does this print?",["True","False","5","It raises an error"],1,"<code>x &gt; 3</code> is True but <code>x &lt; 4</code> is False, and <code>and</code> needs both to be True.",`x = 5
print(x > 3 and x < 4)`),
  M("What does this print?",["3","1","0","-1"],2,"The loop runs while n &gt; 0: 3→2→1→0. At 0 the condition fails and the loop exits.",`n = 3
while n > 0:
    n -= 1
print(n)`)
 ]},
{t:"Strings and lists",
 lesson:"Strings and lists share indexing and slicing: <code>s[start:stop:step]</code>, with stop excluded. Strings can't be changed in place. List methods like <code>sort()</code> change the list itself and return <code>None</code>.",
 ex:`s = "  Hello World  "

  M("What does this print?",["['a', 'b', 'c']","['a', 'b', '', 'c']","['a,b,,c']","['a', 'b', None, 'c']"],1,"Two commas in a row produce an empty string between them.",`print("a,b,,c".split(","))`),
  T("Join the list <code>words</code> into one string <code>s</code> with a space between each word.",[`s = " ".join(words)`],`s = " ".join(words)`,"<code>join</code> is a method on the separator string and takes the list as its argument."),
  T("Using a list comprehension, make <code>sq</code> the squares of every number in <code>nums</code>.",[],`sq = [x * x for x in nums]`,"The pattern is <code>[expression for item in list]</code>. <code>x**2</code> works too.",{re:/^sq=\[(\w+)(?:\*\*2|\*\1)for\1innums\]$/}),
  M("What does this print?",["[1, 2, 3]","[3, 1, 2]","None","It raises an error"],2,"<code>sort()</code> sorts in place and returns None. Use <code>sorted(xs)</code> to get a new list.",`xs = [3, 1, 2]
ys = xs.sort()

 ]},
{t:"Dicts, sets and your first pattern",
 lesson:"A dict maps keys to values, and looking up a key is nearly instant however big the dict is. That turns many O(n²) \"check every pair\" problems into a single pass. A set is like a dict with only keys, which makes it ideal for \"have I seen this already?\"",
 ex:`def first_repeat(items):
    seen = set()                   # values met so far
    for x in items:
        if x in seen:
            return x
        seen.add(x)
    return None

last_seen = {}                     # value -> index of its latest position
for i, x in enumerate(["a", "b", "a"]):
    last_seen[x] = i               # {'a': 2, 'b': 1}`,
 build:"A character frequency counter; find the elements two lists have in common.",
 solve:["LC 1 Two Sum","LC 217 Contains Duplicate","LC 242 Valid Anagram","LC 383 Ransom Note"],
 gate:"Two Sum with a dict from a blank file, then explain why it's O(n) while the double loop is O(n²).",

  T("Increase the count for word <code>w</code> in the dict <code>counts</code>, starting from 0 if it's missing.",[`counts[w] = counts.get(w, 0) + 1`],`counts[w] = counts.get(w, 0) + 1`,"<code>.get(key, default)</code> returns the default instead of raising KeyError."),
  M("What happens?",["It prints None","It prints 0","KeyError: 'b'","It prints an empty string"],2,"Square brackets on a missing key raise KeyError. Use <code>d.get('b')</code> to get None instead.",`d = {"a": 1}
print(d["b"])`),
  M("In the one-pass Two Sum, what do you store in the dict?",["index → value","value → index","value → count","target → index"],1,"You look up <code>target - x</code> by value and need its index back."),
  M("What does this print?",["5","3","2","It raises an error"],1,"A set keeps only unique items: {1, 2, 3}.",`print(len(set([1, 1, 2, 3, 3])))`),
  T("Import <code>Counter</code> from the standard library.",[`from collections import Counter`],`from collections import Counter`,"<code>Counter(list)</code> counts everything in one line. It's in <code>collections</code>.")
 ]},
{t:"Functions and reading errors",
 lesson:"A function takes inputs and returns a value. If it has no <code>return</code>, it gives back <code>None</code>. When code crashes, Python prints a traceback: read the <b>last line</b> first, then find the last line that points at <b>your</b> file. The Errors tab has the full guide.",
 ex:`def safe_int(text, default=0):
    try:
        return int(text)

        return default

print(safe_int("42"), safe_int("abc"))   # 42 0`,
 build:"Rewrite Days 1–4 as functions. Then break code on purpose to trigger 8 different errors from the Errors tab, and fix each one.",

    x * 2
print(f(3))`),
  M("A traceback is 20 lines long. Where do you look first?",["The first line","The last line","The middle","The longest line"],1,"The last line holds the error type and message. Then go up to the last line in your own file."),
  M("Which except clause catches <code>int(\"abc\")</code>?",["except TypeError","except KeyError","except ValueError","except SyntaxError"],2,"The type (str) is fine, but the value can't become an int, so Python raises ValueError."),
  M("What does <code>greet()</code> return?",["\"Hi \"","\"Hi there\"","None","TypeError: missing argument"],1,"With no argument passed, the default value \"there\" is used.",`def greet(name="there"):
    return "Hi " + name`),
  M("What does this error mean?",["You misspelled a variable","Lines inside a block aren't indented consistently","A module is missing","You divided by zero"],1,"Python uses indentation to define blocks. Use 4 spaces and never mix tabs with spaces.",`IndentationError: expected an indented block after 'if' statement on line 3`)
 ]},
{t:"Files, modules, pip and venv",
 lesson:"Give every project its own virtual environment so its libraries don't clash with other projects. Activate it, then <code>pip install</code>. Open files with <code>with open()</code> so they close automatically.",

  M("What's the difference between json.load and json.loads?",["None","load reads from a file; loads reads from a string","loads is faster","load is for lists only"],1,"The s stands for string. The same goes for dump and dumps."),

{t:"Classes and Week 1 review",review:true,
 lesson:"A class bundles data with the functions that use it. <code>__init__</code> runs when you create an object, and <code>self</code> is that object. <code>@dataclass</code> writes <code>__init__</code> and a readable print format for you.",

 ]},
{t:"SQL basics",
 lesson:"You write SQL as SELECT, FROM, WHERE, but it <b>runs</b> as FROM → WHERE → SELECT → ORDER BY → LIMIT. NULL means \"no value\", so test it with <code>IS NULL</code>, never <code>= NULL</code>.",
 ex:`SELECT name, salary

WHERE dept = 'Sales' AND manager_id IS NOT NULL
ORDER BY salary DESC
LIMIT 5;`,

 drills:[
  T("Select the <code>name</code> of users older than 30 from table <code>users</code>.",[`SELECT name FROM users WHERE age > 30`],`SELECT name FROM users WHERE age > 30;`,"Clause order: SELECT, then FROM, then WHERE.",{sql:true}),

{t:"Two pointers and sliding window",
 lesson:"Two pointers start at both ends of sorted data and walk inward. A sliding window grows on the right and shrinks on the left while keeping a condition true.",
 ex:`def shortest_at_least(nums, target):      # positive numbers only
    left, total, best = 0, 0, None
    for right, x in enumerate(nums):
        total += x                     # grow the window on the right
        while total >= target:         # shrink from the left while still valid
            size = right - left + 1
            best = size if best is None else min(best, size)
            total -= nums[left]
            left += 1
    return best`,

{t:"Stacks and binary search",
 lesson:"A stack is last-in, first-out, which suits matching brackets and \"next greater\" questions. Binary search halves a sorted range at every step, so it's O(log n).",
 ex:`def int_sqrt(n):                      # largest r with r * r <= n: binary search on the answer
    lo, hi = 0, n
    while lo < hi:
        mid = (lo + hi + 1) // 2
        if mid * mid <= n:
            lo = mid
        else:
            hi = mid - 1
    return lo`,

{t:"Linked lists and recursion",
 lesson:"A linked list is a chain of nodes, each pointing to the next. Most problems are careful pointer rewiring, so draw boxes and arrows on paper first. A dummy head node removes the special cases at the start of the list.",
 ex:`class ListNode:
    def __init__(self, val, next=None):
        self.val, self.next = val, next

def insert_after(node, val):
    node.next = ListNode(val, node.next)   # rewire two pointers: new node first, then the link

def middle(head):
    slow = fast = head
    while fast and fast.next:
        slow = slow.next               # moves 1 step
        fast = fast.next.next          # moves 2 steps
    return slow`,

{t:"Trees and graphs (BFS/DFS)",
 lesson:"Tree problems are solved with recursion: solve for the children, then combine the answers at the node. Graphs and grids use BFS (a queue, level by level) or DFS (recursion or a stack), always with a visited check.",
 ex:`from collections import deque
def shortest_path(graph, start, goal):     # graph: {node: [neighbours]}
    q, seen = deque([(start, 0)]), {start}
    while q:
        node, dist = q.popleft()
        if node == goal:
            return dist
        for nxt in graph[node]:
            if nxt not in seen:
                seen.add(nxt); q.append((nxt, dist + 1))
    return -1`,

{t:"Heaps, intervals and intro to DP",
 lesson:"<code>heapq</code> gives you a min-heap: the smallest item is always at <code>h[0]</code>. Interval problems start by sorting on start time. Dynamic programming is recursion plus remembering answers you've already computed.",
 ex:`def lis_length(nums):
    dp = [1] * len(nums)           # dp[i] = longest increasing run ending at i
    for i in range(len(nums)):
        for j in range(i):
            if nums[j] < nums[i]:
                dp[i] = max(dp[i], dp[j] + 1)
    return max(dp) if dp else 0`,

{t:"RAG: answering from your own documents",
 lesson:"RAG (retrieval-augmented generation) lets a model answer from your documents. Split them into chunks, turn each chunk into an embedding, and store them. At question time, retrieve the closest chunks and put them in the prompt.",
 ex:`# Chroma-style vector store API
chunks = split_into_chunks(text, size=800, overlap=100)
store.add(ids=ids, documents=chunks)            # the store embeds them
hits = store.query(query_texts=[question], n_results=4)
context = "\\n\\n".join(hits["documents"][0])
prompt = f"Answer only from this context and cite it.\\n\\n{context}\\n\\nQ: {question}"`,
 build:"\"Chat with your PDFs\": ingest documents, retrieve the top-k chunks, answer with citations, and test on 10 questions.",
 solve:["Compare answer quality at two different chunk sizes","Write down 2 failure cases and why they happen"],
 gate:"Draw the RAG pipeline from memory and explain where each failure can happen.",
 drills:[
  M("What's the right order?",["Generate → retrieve → embed","Chunk → embed → store → retrieve → generate","Embed → generate → chunk","Retrieve → chunk → store"],1,"Ingestion (chunk, embed, store) happens once; retrieve and generate happen per question."),
  M("What's the downside of very large chunks?",["None","Less precise retrieval and more tokens in every prompt","The embeddings fail","Faster answers"],1,"Too small loses context; too large adds noise. Test sizes rather than guessing."),
  M("An embedding is…",["A compressed PDF","A list of numbers that captures meaning, so similar text lands close together","A database index","A prompt template"],1,"Similarity search finds the chunks whose vectors are closest to the question's vector."),
  M("The answer is wrong but the document contains it. What do you check first?",["Change models","Check whether the right chunk was retrieved","Raise the temperature","Add more documents"],1,"Most RAG failures are retrieval failures. Log the retrieved chunks for every question.")
 ]},
{t:"Agents and tool use",
 lesson:"An agent is a loop: the model asks to call a tool, your code runs it, you send back the result, and you repeat until the model gives a final answer. Your code, not the model, is responsible for safety.",
 ex:`for step in range(MAX_STEPS):
    resp = client.messages.create(model=MODEL, max_tokens=1000,
                                  tools=TOOLS, messages=messages)
    if resp.stop_reason != "tool_use":
        break                                   # final answer
    messages.append({"role": "assistant", "content": resp.content})
    results = []
    for block in resp.content:
        if block.type == "tool_use":
            output = run_tool(block.name, block.input)   # validate inside!
            results.append({"type": "tool_result",
                            "tool_use_id": block.id, "content": output})
    messages.append({"role": "user", "content": results})`,
 build:"A data agent: the model gets a run_sql tool over your Week 2 SQLite database and answers business questions asked in plain English.",
 solve:["Block destructive SQL (allow SELECT only)","Retry when the model writes invalid SQL, sending the error back"],
 gate:"Explain why the agent needs validation, and what could go wrong without it.",
 drills:[
  M("Who actually runs the tool?",["The model","Your code","The API provider","The database"],1,"The model only asks for a call. You execute it and return the result."),
  M("What's the safest way to let a model query your database?",["Give it admin access","Use a read-only connection and allow only SELECT","Trust the prompt","Let it write and roll back"],1,"Enforce limits in code and permissions, never only in the prompt."),
  M("The model calls a tool with invalid arguments. What should your code do?",["Crash","Return a clear error message as the tool result so the model can fix it","Ignore it silently","Restart the conversation"],1,"Models recover well from specific error messages."),
  M("Why have MAX_STEPS?",["It's required","It stops endless loops and runaway costs","For speed","For logging"],1,"Always cap iterations and tell the user when the cap is hit.")
 ]},

COPY . .
CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

 drills:[

{t:"System design",
 lesson:"System design interviews test trade-offs, not one right answer. Start with requirements and scale, sketch the components, follow one request through the system, then discuss bottlenecks, failures and cost.",
 ex:`Support bot for 10k customers
Client → API (FastAPI, autoscaled) → cache (repeat questions)
                     ↓
          Retriever → vector DB (company docs)
                     ↓
                 LLM API (streaming)

Watch: p95 latency, cost per answer, eval score, thumbs-down rate`,
 build:"Write a one-page design for \"a support chatbot for 10,000 customers using company docs\", with a diagram.",

 drills:[
  M("What's a cache for in an AI app?",["Storing API keys","Avoiding repeated work, like identical questions or LLM calls","Backups","Logging"],1,"It cuts latency and cost. Decide how long cached answers stay valid."),
  M("Why put document ingestion behind a queue?",["It's required","Slow work happens in the background, so uploads stay fast and retries are easy","Queues are cheaper than databases","For security"],1,"A queue separates fast user requests from slow processing."),
  M("What's the first step in a design interview?",["Draw boxes","Clarify requirements and scale (users, data size, latency)","Pick a database","Talk about Kubernetes"],1,"Every later choice depends on these numbers."),
  M("Users complain the bot feels slow. What's the quickest win?",["A bigger model","Stream tokens, and cache common answers","More servers only","Remove retrieval"],1,"Streaming makes it feel faster immediately. A smaller model for easy questions also helps."),
  M("How do you know RAG quality in production?",["You can't","An eval set of real questions, plus monitoring of feedback and failures","Ask the model","Count requests"],1,"FDEs are judged on outcomes, so measure them.")
 ]},

zz\"<\/code> for multiples of 3, <code>\"Buzz\"<\/code> for multiples of 5, <code>\"FizzBuzz\"<\/code> for both, otherwise the number as a string.", "starter": "def fizzbuzz(n):\n    result = []\n    # your loop here\n    return result\n", "solution": "def fizzbuzz(n):\n    result = []\n    for i in range(1, n + 1):\n        if i % 15 == 0:\n            result.append(\"FizzBuzz\")\n        elif i % 3 == 0:\n            result.append(\"Fizz\")\n        elif i % 5 == 0:\n            result.append(\"Buzz\")\n        else:\n            result.append(str(i))\n    return result\n", "hint": "range(1, n + 1) includes n. Check 15 first. Use str(i) for plain numbers.", "tests": [{"label": "fizzbuzz(5)", "expr": "fizzbuzz(5)", "want": "['1', '2', 'Fizz', '4', 'Buzz']"}, {"label": "fizzbuzz(15)[-1]", "expr": "fizzbuzz(15)[-1]", "want": "'FizzBuzz'"}, {"label": "fizzbuzz(0)", "expr": "fizzbuzz(0)", "want": "[]"}], "fuzz": ["fizzbuzz", "(R.randint(1, 40),)"], "new": [["xs.append(v)", "add v to the end of the list xs"], ["str(n)", "turn a number into text: str(5) is '5'"]], "pat": "loop & build a list", "steps": ["Make an empty result list", "Loop i from 1 to n, including n", "If i divides by 15 add FizzBuzz, else by 3 add Fizz, else by 5 add Buzz", "Otherwise add str(i)", "Return the list"]}, {"kind": "py", "title": "Digit sum with a while loop", "task": "Write <code>digit_sum(n)<\/code> that returns the sum of the digits of a non-negative integer, using a <code>while<\/code> loop with <code>% 10<\/code> and <code>// 10<\/code> (no converting to a string).", "starter": "def digit_sum(n):\n    total = 0\n    \n    return total\n", "solution": "def digit_sum(n):\n    total = 0\n    while n > 0:\n        total += n % 10\n        n //= 10\n    return total\n", "hint": "n % 10 is the last digit. n // 10 removes it. Stop when n reaches 0.", "tests": [{"label": "digit_sum(1234)", "expr": "digit_sum(1234)", "want": "10"}, {"label": "digit_sum(9)", "expr": "digit_sum(9)", "want": "9"}, {"label": "digit_sum(0)", "expr": "digit_sum(0)", "want": "0"}, {"label": "digit_sum(1000001)", "expr": "digit_sum(1000001)", "want": "2"}], "fuzz": ["digit_sum", "(R.randint(0, 10**6),)"], "pat": "while loop", "steps": ["Start total at 0", "Repeat while n is above 0", "Add the last digit (n % 10) to total", "Remove the last digit (n // 10)", "Return total"]}, {"kind": "py", "title": "Fix the bug: the loop that never ends", "task": "Run this. It never finishes, so the runner stops it. Find out why and fix it so <code>countdown(3)<\/code> returns <code>[3, 2, 1]<\/code>.", "starter": "def countdown(n):\n    out = []\n    while n > 0:\n        out.append(n)\n    return out\n", "solution": "def countdown(n):\n    out = []\n    while n > 0:\n        out.append(n)\n        n -= 1\n    return out\n", "hint": "The condition n > 0 never becomes False because n never changes inside the loop.", "tests": [{"label": "countdown(3)", "expr": "countdown(3)", "want": "[3, 2, 1]"}, {"label": "countdown(0)", "expr": "countdown(0)", "want": "[]"}], "bug": true, "new": [["xs.append(v)", "add v to the end of the list xs"]]}], "3": [{"kind": "py", "title": "Reverse the words", "task": "Write <code>reverse_words(s)<\/code>: return the words of <code>s<\/code> in reverse order, separated by single spaces, with no spaces at the ends. (LeetCode 151.)", "starter": "def reverse_words(s):\n    pass\n", "solution": "def reverse_words(s):\n    return \" \".join(s.split()[::-1])\n", "hint": "split() with no argument handles any amount of whitespace. Then reverse the list and join it.", "tests": [{"label": "'the sky is blue'", "expr": "reverse_words('the sky is blue')", "want": "'blue is sky the'"}, {"label": "extra spaces", "expr": "reverse_words('  hello   world  ')", "want": "'world hello'"}, {"label": "one word", "expr": "reverse_words('a')", "want": "'a'"}], "fuzz": ["reverse_words", "(''.join(R.choice(['a', 'bb', 'sky', 'blue', ' ', '  ']) for _ in range(R.randint(0, 7))),)"], "pat": "string me so makes the membership check O(1).", "tests": [{"label": "dedupe([1, 2, 1, 3, 2])", "expr": "dedupe([1, 2, 1, 3, 2])", "want": "[1, 2, 3]"}, {"label": "strings", "expr": "dedupe(['b', 'a', 'b'])", "want": "['b', 'a']"}, {"label": "empty", "expr": "dedupe([])", "want": "[]"}], "bug": true, "new": [["[f(x) for x in xs if cond]", "a list comprehension: build a new list in one line ('if cond' is optional)"], ["s.add(v)", "add v to a set (a set keeps one copy of each value)"], ["set(xs)", "the unique values of xs"]]}], "4": [{"kind": "py", "title": "Two Sum in one pass", "task": "Write <code>two_sum(nums, target)<\/code>: return the indexes <code>[i, j]<\/code> (i &lt; j) of the two numbers that add up to target. Exactly one answer exists. Aim for O(n) with a dict. (LeetCode 1.)", "starter": "def two_sum(nums, target):\n    seen = {}   # value -> index\n    \n", "solution": "def two_sum(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target - x in seen:\n            return [seen[target - x], i]\n        seen[x] = i\n", "hint": "For each x, check whether target - x is already in the dict before you store x.", "tests": [{"label": "[2,7,11,15], 9", "expr": "two_sum([2, 7, 11, 15], 9)", "want": "[0, 1]"}, {"label": "[3,2,4], 6", "expr": "two_sum([3, 2, 4], 6)", "want": "[1, 2]"}, {"label": "[3,3], 6", "expr": "two_sum([3, 3], 6)", "want": "[0, 1]"}, {"label": "negatives", "expr": "two_sum([-3, 4, 3, 90], 0)", "want": "[0, 2]"}, {"label": "large input (must be fast)", "expr": "two_sum(list(range(3000)), 5997)", "want": "[2998, 2999]"}], "pat": "hash map / set", "steps": ["Make an empty dict of value to index", "Loop over nums with their indexes", "If target minus x is already in the dict, return [its index, i]", "Otherwise store x with its index i"]}, {"kind": "py", "title": "Word count", "task": "Write <code>word_count(text)<\/code>: return a dict mapping each lowercase word to how many times it appears. Words are separated by whitespace.", "starter": "def word_count(text):\n    counts = {}\n    \n    return counts\n", "solution": "def word_count(text):\n    counts = {}\n    for w in text.lower().split():\n        counts[w] = counts.get(w, 0) + 1\n    return counts\n", "hint": "Lowercase first, split, then counts[w] = counts.get(w, 0) + 1.", "tests": [{"label": "'The cat the'", "expr": "word_count('The cat the')", "want": "{'the': 2, 'cat': 1}"}, {"label": "empty", "expr": "word_count('')", "want": "{}"}, {"label": "spacing", "expr": "word_count('a  b\\na')", "want": "{'a': 2, 'b': 1}"}], "fuzz": ["word_count", "(' '.join(R.choice(['The', 'the', 'cat', 'Cat', 'a']) for _ in range(R.randint(0, 6))),)"], "new": [["d.get(k, 0)", "the value for key k, or 0 if k is missing (no KeyError)"]], "pat": "hash map / set", "steps": ["Make an empty dict", "Lowercase the text and split it into words", "For each word, add 1 to its count (starting from 0)", "Return the dict"]}, {"kind": "py", "title": "Valid anagram", "task": "Write <code>is_anagram(s, t)<\/code>: True if t uses exactly the same letters as s, the same number of times. (LeetCode 242.)", "starter": "def is_anagram(s, t):\n    pass\n", "solution": "from collections import Counter\n\ndef is_anagram(s, t):\n    return Counter(s) == Counter(t)\n", "hint": "Compare letter counts: Counter(s) == Counter(t), or sorted(s) == sorted(t).", "tests": [{"label": "anagram/nagaram", "expr": "is_anagram('anagram', 'nagaram')", "want": "True"}, {"label": "rat/car", "expr": "is_anagram('rat', 'car')", "want": "False"}, {"label": "different lengths", "expr": "is_anagram('aa', 'a')", "want": "False"}], "fuzz": ["is_anagram", "(''.join(R.choice('abc') for _ in range(R.randint(0, 4))), ''.join(R.choice('abc') for _ in range(R.randint(0, 4))))"], "new": [["import json", "load a module; 'from collections import Counter' loads just one name from it"], ["Counter(xs)", "counts how many times each item appears, like a dict of item to count"]], "pat": "hash map / set", "steps": ["Count the letters in s", "Count the letters in t", "Return whether the two counts match"]}], "5": [{"kind": "py", "title": "Safe divide", "task": "Write <code>safe_divide(a, b)<\/code>: return <code>a / b<\/code>, or <code>None<\/code> if b is zero. Use <code>try/except<\/code> with the specific error type, not a bare <code>except<\/code>.", "starter": "def safe_divide(a, b):\n    pass\n", "solution": "def safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n", "hint": "Dividing by zero raises ZeroDivisionError.", "tests": [{"label": "10 / 4", "expr": "safe_divide(10, 4)", "want": "2.5"}, {"label": "divide by zero", "expr": "safe_divide(1, 0)", "want": "None"}, {"label": "negative", "expr": "safe_divide(-9, 3)", "want": "-3.0"}], "pat": "try/except", "steps": ["Try to return a divided by b", "If ZeroDivisionError happens, return None"]}, {"kind": "py", "title": "Fix the bug: KeyError", "task": "Run it and read the traceback. Fix <code>total_by_category<\/code> so it returns the total amount for each category.", "starter": "def total_by_category(rows):\n    totals = {}\n    for r in rows:\n        totals[r[\"category\"]] += r[\"amount\"]\n    return totals\n", "solution": "def total_by_category(rows):\n    totals = {}\n    for r in rows:\n        totals[r[\"category\"]] = totals.get(r[\"category\"], 0) + r[\"amount\"]\n    return totals\n", "hint": "The first time a category appears it isn't in the dict yet, so += fails. Use .get(key, 0).", "tests": [{"label": "food and rent", "expr": "total_by_category([{'category': 'food', 'amount': 10}, {'category': 'rent', 'amount': 100}, {'category': 'food', 'amount': 5}])", "want": "{'food': 15, 'rent': 100}"}, {"label": "no rows", "expr": "total_by_category([])", "want": "{}"}], "bug": true}, {"kind": "py", "title": "Running sum", "task": "Write <code>running_sum(nums)<\/code>: element i of the result is the sum of nums[0] through nums[i]. (LeetCode 1480.)", "starter": "def running_sum(nums):\n    pass\n", "solution": "def running_sum(nums):\n    out, total = [], 0\n    for x in nums:\n        total += x\n        out.append(total)\n    return out\n", "hint": "Keep a running total and append it each step.", "tests": [{"label": "[1,2,3,4]", "expr": "running_sum([1, 2, 3, 4])", "want": "[1, 3, 6, 10]"}, {"label": "[3,1,2,10,1]", "expr": "running_sum([3, 1, 2, 10, 1])", "want": "[3, 4, 6, 16, 17]"}, {"label": "empty", "expr": "running_sum([])", "want": "[]"}], "fuzz": ["running_sum", "([R.randint(-5, 9) for _ in range(R.randint(0, 7))],)"], "pat": "running total", "steps": ["Start an empty result list and a total of 0", "For each number, add it to total", "Append the total to the result", "Return the result"]}], "6": [{"kind": "py", "title": "Totals from a CSV file", "task": "A file <code>expenses.csv<\/code> exists with columns <code>date,category,amount<\/code>. Write <code>category_totals(path)<\/code> that reads it with <code>csv.DictReader<\/code> and returns a dict of category to total amount (as a float). <b>Skip rows whose amount is blank.<\/b>", "starter": "import csv\n\ndef category_totals(path):\n    totals = {}\n    \n    return totals\n", "solution": "import csv\n\ndef category_totals(path):\n    totals = {}\n    with open(path) as f:\n        for row in csv.DictReader(f):\n            if not row[\"amount\"].strip():\n                continue\n            amt = float(row[\"amount\"])\n            totals[row[\"category\"]] = totals.get(row[\"category\"], 0) + amt\n    return totals\n", "hint": "Every value from DictReader is a string. Check for a blank amount before float(), or you get ValueError.", "tests": [{"label": "expenses.csv", "expr": "category_totals('expenses.csv')", "want": "{'food': 22.5, 'travel': 40.0}"}, {"label": "returns floats", "expr": "type(category_totals('expenses.csv')['travel']).__name__", "want": "'float'"}], "files": {"expenses.csv": "date,category,amount\n2026-01-01,food,12.50\n2026-01-02,travel,40\n2026-01-03,food,\n2026-01-04,food,10\n"}, "pat": "file reading", "steps": ["Open the file with with open()", "Read the rows with csv.DictReader", "Skip a row if its amount is blank", "Convert the amount to float and add it to that category's total", "Return the totals"]}, {"kind": "py", "title": "Save and load JSON", "task": "Write <code>save(data, path)<\/code> that writes a dict to a JSON file, and <code>load(path)<\/code> that reads it back and returns the dict. Use <code>with open()<\/code> and the <code>json<\/code> module.", "starter": "import json\n\ndef save(data, path):\n    pass\n\ndef load(path):\n    pass\n", "solution": "import json\n\ndef save(data, path):\n    with open(path, \"w\") as f:\n        json.dump(data, f)\n\ndef load(path):\n    with open(path) as f:\n        return json.load(f)\n", "hint": "Open with \"w\" to write. json.dump(data, f) writes; json.load(f) reads. (dumps/loads are for strings.)", "tests": [{"label": "round trip", "expr": "(save({'total': 3.5, 'items': [1, 2]}, 'out.json'), load('out.json'))[1]", "want": "{'total': 3.5, 'items': [1, 2]}"}, {"label": "overwrites", "expr": "(save({'a': 1}, 'o.json'), save({'b': 2}, 'o.json'), load('o.json'))[2]", "want": "{'b': 2}"}], "new": [["json.load(f)", "read JSON straight from an open file"]], "pat": "file reading", "steps": ["save: open the path for writing", "save: json.dump the data into the file", "load: open the path for reading", "load: return json.load of the file"], "free": true}, {"kind": "design", "scope": true, "title": "Scope it: the weekly report nobody trusts", "task": "<b>From Ops:<\/b> \"Every Monday someone spends 3 hours merging CSVs from the shared drive into a report, and it's often wrong. Can you automate it?\" Turn this into a plan before you write a line of code.", "questions": [["What exact numbers does the report show, and who reads it?", true], ["Where do the CSVs come from, and do their columns ever change?", true], ["What does \"wrong\" mean: missing files, duplicates, o
