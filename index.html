n the result"], "fuzz": ["merge_sorted", "(sorted(R.randint(0, 9) for _ in range(R.randint(0, 6))), sorted(R.randint(0, 9) for _ in range(R.randint(0, 6))))"], "gym": 2, "gk": "py", "gname": "Python Gym", "area": "py2"}], "53": [{"kind": "py", "title": "Fix the bug: average of nothing", "task": "<code>average(nums)<\/code> should return the mean of the numbers, or <code>None<\/code> when the list is empty. It crashes on an empty list. Fix it.", "starter": "def average(nums):\n    return sum(nums) / len(nums)\n", "solution": "def average(nums):\n    if not nums:\n        return None\n    return sum(nums) / len(nums)\n", "hint": "Check for the empty list before dividing.", "tests": [{"label": "basic", "expr": "average([2, 4, 6])", "want": "4.0"}, {"label": "empty gives None", "expr": "average([])", "want": "None"}, {"label": "one number", "expr": "average([5])", "want": "5.0"}, {"label": "decimals", "expr": "average([1, 2])", "want": "1.5"}], "steps": [], "bug": true, "gym": 3, "gk": "py", "gname": "Python Gym", "area": "py3"}, {"kind": "py", "title": "Fix the bug: remove negatives", "task": "<code>remove_negatives(nums)<\/code> should return the numbers that are zero or more, in order. It skips some negatives when two are next to each other. Fix it (hint: do not change a list while looping over it).", "starter": "def remove_negatives(nums):\n    for x in nums:\n        if x < 0:\n            nums.remove(x)\n    return nums\n", "solution": "def remove_negatives(nums):\n    return [x for x in nums if x >= 0]\n", "hint": "Build a new list of the numbers to keep.", "tests": [{"label": "basic", "expr": "remove_negatives([3, -1, 2])", "want": "[3, 2]"}, {"label": "neighbours", "expr": "remove_negatives([-1, -2, -3, 4])", "want": "[4]"}, {"label": "all negative", "expr": "remove_negatives([-5, -6])", "want": "[]"}, {"label": "empty", "expr": "remove_negatives([])", "want": "[]"}], "steps": [], "bug": true, "gym": 3, "gk": "py", "gname": "Python Gym", "area": "py3"}, {"kind": "py", "title": "Parse a number safely", "task": "Write <code>safe_int(value, default=0)<\/code>: return <code>value<\/code> as a whole number. It may be an int, a string with spaces like <code>' 42 '<\/code>, a float string like <code>'4.9'<\/code> (round down to 4), or garbage / <code>None<\/code> (return <code>default<\/code>).", "starter": "def safe_int(value, default=0):\n    pass\n", "solution": "def safe_int(value, default=0):\n    try:\n        return int(float(str(value).strip()))\n    except (ValueError, TypeError):\n        return default\n", "hint": "int('4.9') fails, so go through float() first. int() cuts toward zero.", "tests": [{"label": "int", "expr": "safe_int(7)", "want": "7"}, {"label": "spaces", "expr": "safe_int(' 42 ')", "want": "42"}, {"label": "float text", "expr": "safe_int('4.9')", "want": "4"}, {"label": "garbage", "expr": "safe_int('abc')", "want": "0"}, {"label": "None", "expr": "safe_int(None, -1)", "want": "-1"}, {"label": "negative float", "expr": "safe_int('-2.5')", "want": "-2"}], "steps": ["Try to convert: strip the text, make a float, then an int", "If it raises ValueError, return the default", "Return the number otherwise"], "gym": 3, "gk": "py", "gname": "Python Gym", "area": "py3"}, {"kind": "py", "title": "Fix the bug: shared bag", "task": "<code>add_item(item, bag=None)<\/code> should add the item to <code>bag<\/code> and return the bag. When no bag is given it must start a <b>new<\/b> empty bag each time. The buggy version shares one list between calls. Fix it.", "starter": "def add_item(item, bag=[]):\n    bag.append(item)\n    return bag\n", "solution": "def add_item(item, bag=None):\n    if bag is None:\n        bag = []\n    bag.append(item)\n    return bag\n", "hint": "Default to None and create the list inside the function.", "tests": [{"label": "first call", "expr": "add_item('a')", "want": "['a']"}, {"label": "second call is fresh", "expr": "(add_item('a'), add_item('b'))[1]", "want": "['b']"}, {"label": "uses a gi pr": "two_sum([2, 7, 11, 15], 9)", "want": "[0, 1]"}, {"label": "later pair", "expr": "two_sum([3, 2, 4], 6)", "want": "[1, 2]"}, {"label": "none", "expr": "two_sum([1, 2], 10)", "want": "[]"}, {"label": "same value twice", "expr": "two_sum([3, 3], 6)", "want": "[0, 1]"}, {"label": "100,000 numbers (must be fast)", "expr": "two_sum(list(range(100000)), 199997)", "want": "[99998, 99999]"}], "limit": 3000000, "steps": ["Keep a dict from value to its position", "For each number, ask if target - number was already seen", "If yes, return both positions", "Otherwise record this number's position"], "fuzz": ["two_sum", "([R.randint(0, 8) for _ in range(R.randint(0, 8))], R.randint(0, 14))"], "gym": 4, "gk": "py", "gname": "Python Gym", "area": "py4"}, {"kind": "py", "title": "Longest stretch without repeats", "task": "Write <code>longest_unique(s)<\/code>: return the length of the longest run of neighbouring characters in <code>s<\/code> with no character repeated. It must handle 100,000 characters.", "starter": "def longest_unique(s):\n    pass\n", "solution": "def longest_unique(s):\n    last = {}\n    left = best = 0\n    for right, ch in enumerate(s):\n        if ch in last and last[ch] >= left:\n            left = last[ch] + 1\n        last[ch] = right\n        best = max(best, right - left + 1)\n    return best\n", "hint": "Never move the left edge backwards.", "tests": [{"label": "basic", "expr": "longest_unique('abcabcbb')", "want": "3"}, {"label": "all same", "expr": "longest_unique('bbbb')", "want": "1"}, {"label": "empty", "expr": "longest_unique('')", "want": "0"}, {"label": "tricky", "expr": "longest_unique('abba')", "want": "2"}, {"label": "100,000 characters (must be fast)", "expr": "longest_unique('abcdefghij' * 10000)", "want": "10"}], "limit": 3000000, "steps": ["Keep left edge and a dict of each character's last position", "Move right across the text", "If the character was seen inside the window, jump left past it", "Track the best window size"], "fuzz": ["longest_unique", "(''.join(R.choice('abc') for _ in range(R.randint(0, 9))),)"], "gym": 4, "gk": "py", "gname": "Python Gym", "area": "py4"}, {"kind": "py", "title": "Merge overlapping meetings", "task": "Write <code>merge_intervals(intervals)<\/code>: each interval is <code>[start, end]<\/code>. Return the intervals with overlapping or touching ones merged, sorted by start. It must handle 50,000 intervals.", "starter": "def merge_intervals(intervals):\n    pass\n", "solution": "def merge_intervals(intervals):\n    out = []\n    for start, end in sorted(intervals):\n        if out and start <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], end)\n        else:\n            out.append([start, end])\n    return out\n", "hint": "After sorting, only the last output interval can overlap the next one.", "tests": [{"label": "basic", "expr": "merge_intervals([[1, 3], [2, 6], [8, 10]])", "want": "[[1, 6], [8, 10]]"}, {"label": "touching", "expr": "merge_intervals([[1, 2], [2, 3]])", "want": "[[1, 3]]"}, {"label": "unsorted", "expr": "merge_intervals([[5, 6], [1, 2], [1, 4]])", "want": "[[1, 4], [5, 6]]"}, {"label": "empty", "expr": "merge_intervals([])", "want": "[]"}, {"label": "50,000 intervals (must be fast)", "expr": "len(merge_intervals([[i * 2, i * 2 + 1] for i in range(50000)]))", "want": "50000"}], "limit": 3000000, "steps": ["Sort the intervals by start", "Keep an output list", "If the next start is within the last output end, extend that end", "Otherwise append a new interval"], "fuzz": ["merge_intervals", "([[a, a + R.randint(0, 3)] for a in [R.randint(0, 9) for _ in range(R.randint(0, 6))]],)"], "gym": 4, "gk": "py", "gname": "Python Gym", "area": "py4"}], "55": [{"kind": "py", "title": "A stack that knows its minimum", "task": "Write a class <code>MinStack<\/code> with <code>push(x)<\/code>, <code>pop()<\/code> (returns the removed value), <code>top()<\/code> and <code>get_min()<\/code>. All four must be fast (constant time), even with 100,000 items.", "starter": "class MinStack:\n    def __init__(self):\n        pass\n\n    def push(self, x):\n        pass\n\n    def pop(self):\n        pass\n\n    def top(self):\n        pass\n\n    def get_min(self):\n        pass\n", "solution": "class MinStack:\n    def __init__(self):\n        self.items = []\n        self.mins = []\n    def push(self, x):\n        self.items.append(x)\n        self.mins.append(x if not self.mins else min(x, self.mins[-1]))\n    def pop(self):\n        self.mins.pop()\n        return self.items.pop()\n    def top(self):\n        return self.items[-1]\n    def get_min(self):\n        return self.mins[-1]\n", "hint": "Store the smallest value seen so far next to every item.", "tests": [{"label": "basic", "expr": "(lambda s: [s.push(3), s.push(1), s.push(2), s.get_min(), s.pop(), s.get_min(), s.pop(), s.get_min()])(MinStack())", "want": "[None, None, None, 1, 2, 1, 1, 3]"}, {"label": "top", "expr": "(lambda s: [s.push(5), s.push(9), s.top()])(MinStack())[-1]", "want": "9"}, {"label": "duplicates of the min", "expr": "(lambda s: [s.push(1), s.push(1), s.pop(), s.get_min()])(MinStack())[-1]", "want": "1"}, {"label": "100,000 items (must be fast)", "expr": "(lambda s: [s.push(i) for i in range(100000, 0, -1)] and s.get_min())(MinStack())", "want": "1"}], "limit": 3000000, "steps": ["Keep the items in one list", "Keep a second list with the minimum so far at each depth", "push adds to both; pop removes from both", "get_min reads the end of the second list"], "gym": 5, "gk": "py", "gname": "Python Gym", "area": "py5"}, {"kind": "py", "title": "Retry decorator", "task": "Write a decorator <code>retry(times)<\/code>: the wrapped function is tried up to <code>times<\/code> times in total; if it raises, try again; if the last try raises, let that error escape. Return the first successful result.", "starter": "def retry(times):\n    pass\n", "solution": "def retry(times):\n    def decorate(fn):\n        def wrapper(*args, **kwargs):\n            for attempt in range(times):\n                try:\n                    return fn(*args, **kwargs)\n                except Exception:\n                    if attempt == times - 1:\n                        raise\n        return wrapper\n    return decorate\n", "hint": "Three nested functions: retry -> decorate -> wrapper.", "tests": [{"label": "succeeds on third try", "expr": "retry(5)(make_flaky(3))()", "want": "('ok', 3)"}, {"label": "works on the first try", "expr": "retry(3)(make_flaky(1))()", "want": "('ok', 1)"}, {"label": "gives up after the limit", "expr": "fails(retry(2)(make_flaky(9)))", "want": "True"}, {"label": "tries exactly `times` times", "expr": "(lambda f: (fails(retry(3)(f)), f.state['n']))(make_flaky(99))", "want": "(True, 3)"}, {"label": "passes arguments through", "expr": "retry(2)(lambda a, b=1: a + b)(4, b=5)", "want": "9"}], "prelude": "class Boom(Exception):\n    pass\ndef make_flaky(ok_on):\n    state = {'n': 0}\n    def f():\n        state['n'] += 1\n        if state['n'] < ok_on:\n            raise Boom('not yet')\n        return ('ok', state['n'])\n    f.state = state\n    return f\ndef fails(fn):\n    try:\n        fn()\n    except Boom:\n        return True\n    return False\n", "steps": ["retry(times) returns a decorator", "The decorator returns a wrapper that loops up to times", "Return the result as soon as the call works", "On the final failed attempt, raise the error"], "gym": 5, "gk": "py", "gname": "Python Gym", "area": "py5"}, {"kind": "py", "title": "Process in chunks without loading everything", "task": "Write a generator <code>chunks(items, size)<\/code>: yield lists of up to <code>size<\/code> items from <code>items<\/code> (any iterable, possibly huge) one chunk at a time, without building the whole thing first.", "starter": "def chunks(items, size):\n    pass\n", "solution": "def chunks(items, size):\n    batch = []\n    for x in items:\n        batch.append(x)\n        if len(batch) == size:\n            yield batch\n            batch = []\n    if batch:\n        yield batch\n", "hint": "yield hands back one chunk and pauses; the stream is never fully read.", "tests": [{"label": "basic", "expr": "list(chunks([1, 2, 3, 4, 5], 2))", "want": "[[1, 2], [3, 4], [5]]"}, {"label": "exact fit", "expr": "list(chunks([1, 2, 3, 4], 2))", "want": "[[1, 2], [3, 4]]"}, {"label": "empty", "expr": "list(chunks([], 3))", "want": "[]"}, {"label": "lazy: first chunk of an endless stream", "expr": "next(chunks(iter(range(10 ** 12)), 3))", "want": "[0, 1, 2]"}], "steps": ["Keep a batch list", "For each item, append it", "When the batch reaches size, yield it and start a new one", "After the loop, yield what is left"], "gym": 5, "gk": "py", "gname": "Python Gym", "area": "py5"}, {"kind": "py", "title": "All-or-nothing updates", "task": "Write a class <code>Transaction<\/code> used as <code>with Transaction(d) as t:<\/code>. Inside the block, changes made to the dict <code>d<\/code> are kept if the block ends normally; if the block raises any error, <code>d<\/code> must be put back exactly as it was and the error must still escape.", "starter": "class Transaction:\n    def __init__(self, data):\n        pass\n", "solution": "class Transaction:\n    def __init__(self, data):\n        self.data = data\n        self.backup = None\n    def __enter__(self):\n        self.backup = dict(self.data)\n        return self\n    def __exit__(self, exc_type, exc, tb):\n        if exc_type is not None:\n            self.data.clear()\n            self.data.update(self.backup)\n        return False\n", "hint": "Copy on enter, restore on exit if exc_type is not None.", "tests": [{"label": "keeps changes on success", "expr": "run_ok()", "want": "{'a': 2}"}, {"label": "rolls back on error", "expr": "run_failing()", "want": "{'a': 1}"}, {"label": "error still escapes", "expr": "escapes()", "want": "True"}, {"label": "restores deleted keys", "expr": "run_delete()", "want": "{'a': 1, 'b': 2}"}], "prelude": "def run_failing():\n    d n key?", true], ["Which cloud are we on?", false], ["Who wrote the job?", false], ["Is the logo updated?", false]], "steps": ["Open the Spark UI: find the slow stage and compare task durations", "Notice one task reads far more data than the others", "Count rows per join key to confirm a hot key", "Broadcast the small campaigns table so the big table is not shuffled", "If a hot key remains in an aggregation, salt it and combine", "Re-run, compare stage times, and add a skew check to the pipeline"], "trade": [{"q": "One task is 100x slower than the median. Most likely?", "o": ["Data skew on a key", "Network cable", "Missing import", "The cache is full"], "a": 0, "why": "When one partition has most rows, one task does most of the work."}, {"q": "The campaigns table is 30 MB. Best join strategy?", "o": ["Broadcast join", "Shuffle both sides", "Cross join", "Sort-merge on disk"], "a": 0, "why": "A small table copied to every machine means the big table is not shuffled."}, {"q": "How do you stop this surprising you again?", "o": ["Monitor per-stage time and key distribution, alert on change", "Hope", "Run on weekends", "Delete the launch data"], "a": 0, "why": "Cheap checks on skew and runtime catch data changes before users do."}], "model": ["Diagnose before changing anything: Spark UI stage and task times, then key counts.", "The signature of skew: one long task, others short, one key with a huge share of rows.", "Fix: broadcast the 30 MB table; salt the hot key if an aggregation is still skewed.", "Verify with before/after stage times and row counts.", "Add monitoring on runtime and key distribution."], "keys": [["looking at the Spark UI", "spark ui|stage|task|duration|metrics|profile|look at|measure|diagnos"], ["confirming skew", "skew|hot key|key (count|distribution)|uneven|one partition|group by key|count per key"], ["broadcast join", "broadcast|small table|30 ?mb|avoid (the )?shuffle"], ["salting", "salt|split the key|spread|random suffix"], ["verifying the fix", "verify|compare|before|after|re.?run|row count|same result|test"], ["monitoring", "monitor|alert|check|track|dashboard|regress"]], "gym": 5, "gk": "spark", "gname": "PySpark Gym", "area": "spark5"}], "71": [{"kind": "py", "title": "Peak requests per second", "task": "Write <code>peak_qps(requests_per_day, peak_factor=3)<\/code>: return the peak requests per second, rounded to 1 decimal: the daily average per second (86,400 seconds in a day) times the peak factor.", "starter": "def peak_qps(requests_per_day, peak_factor=3):\n    pass\n", "solution": "def peak_qps(requests_per_day, peak_factor=3):\n    return round(requests_per_day / 86400 * peak_factor, 1)\n", "hint": "86,400 seconds per day.", "tests": [{"label": "a million a day", "expr": "peak_qps(1000000)", "want": "34.7"}, {"label": "one per second on average", "expr": "peak_qps(86400, 2)", "want": "2.0"}, {"label": "zero", "expr": "peak_qps(0)", "want": "0.0"}, {"label": "a billion a day", "expr": "peak_qps(10 ** 9, 2)", "want": "23148.1"}], "steps": ["Divide by seconds in a day", "Multiply by the peak factor", "Round to 1 decimal"], "fuzz": ["peak_qps", "(R.randint(0, 5000000), R.choice([1, 2, 3, 4]))"], "gym": 1, "gk": "sys", "gname": "System Design Gym", "area": "sys1"}, {"kind": "py", "title": "How much storage?", "task": "Write <code>storage_tb(records_per_day, bytes_per_record, days, copies=3)<\/code>: return the storage needed in terabytes (1 TB = 10**12 bytes), rounded to 3 decimals.", "starter": "def storage_tb(records_per_day, bytes_per_record, days, copies=3):\n    pass\n", "solution": "def storage_tb(records_per_day, bytes_per_record, days, copies=3):\n    return round(records_per_day * bytes_per_record * days * copies / 10 ** 12, 3)\n", "hint": "Replication multiplies storage.", "tests": [{"label": "a year of a million 1 KB records", "expr": "storage_tb(10 ** 6, 1000, 365)", "want": "1.095"}, {"label": "one copy", "expr": "storage_tb(10 ** 6, 1000, 365, copies=1)", "want": "0.365"}, {"label": "nothing", "expr": "storage_tb(0, 500, 30)", "want": "0.0"}, {"label": "big", "expr": "storage_tb(10 ** 8, 2000, 365 * 5)", "want": "1095.0"}], "steps": ["Multiply records, bytes, days and copies", "Convert bytes to terabytes", "Round to 3 decimals"], "fuzz": ["storage_tb", "(R.randint(0, 10 ** 7), R.randint(1, 5000), R.randint(1, 800), R.randint(1, 3))"], "gym": 1, "gk": "sys", "gname": "System Design Gym", "area": "sys1"}, {"kind": "py", "title": "Bandwidth", "task": "Write <code>bandwidth_mbps(qps, response_kb)<\/code>: return the outgoing bandwidth in megabits per second (1 KB = 8 kilobits, 1000 kilobits = 1 megabit), rounded to 2 decimals.", "starter": "def bandwidth_mbps(qps, response_kb):\n    pass\n", "solution": "def bandwidth_mbps(qps, response_kb):\n    return round(qps * response_kb * 8 / 1000, 2)\n", "hint": "Bytes become bits at x 8.", "tests": [{"label": "basic", "expr": "bandwidth_mbps(100, 50)", "want": "40.0"}, {"label": "zero", "expr": "bandwidth_mbps(0, 10)", "want": "0.0"}, {"label": "small", "expr": "bandwidth_mbps(3, 1)", "want": "0.02"}, {"label": "large", "expr": "bandwidth_mbps(5000, 200)", "want": "8000.0"}], "steps": ["Multiply qps by response size in KB", "Convert KB to kilobits (x 8)", "Convert to megabits (/ 1000) and round"], "fuzz": ["bandwidth_mbps", "(R.randint(0, 9000), R.randint(1, 400))"], "gym": 1, "gk": "sys", "gname": "System Design Gym", "area": "sys1"}, {"kind": "py", "title": "How many servers?", "task": "Write <code>servers_needed(peak_qps, qps_per_server, headroom=0.3)<\/code>: each server should only be loaded to <code>1 - headroom<\/code> of what it can handle. Return the number of servers (a whole number, rounded up) but never fewer than 2.", "starter": "def servers_needed(peak_qps, qps_per_server, headroom=0.3):\n    pass\n", "solution": "def servers_needed(peak_qps, qps_per_server, headroom=0.3):\n    import math\n    usable = qps_per_server * (1 - headroom)\n    return max(2, math.ceil(peak_qps / usable))\n", "hint": "math.ceil rounds up; max(2, ...) guarantees redundancy.", "tests": [{"label": "basic", "expr": "servers_needed(700, 100)", "want": "10"}, {"label": "tiny load still needs two", "expr": "servers_needed(5, 100)", "want": "2"}, {"label": "no headroom", "expr": "servers_needed(1000, 100, headroom=0)", "want": "10"}, {"label": "exact fit rounds up", "expr": "servers_needed(71, 100)", "want": "2"}], "steps": ["Usable capacity per server = qps_per_server x (1 - headroom)", "Divide peak by usable and round up", "Return at least 2"], "fuzz": ["servers_needed", "(R.randint(0, 5000), R.randint(50, 300), R.choice([0, 0.2, 0.3, 0.5]))"], "gym": 1, "gk": "sys", "gname": "System Design Gym", "area": "sys1"}], "72": [{"kind": "py", "title": "Short codes for URLs", "task": "Write <code>to_base62(n)<\/code>: convert a whole number (0 or more) to text using the digits <code>0-9<\/code>, then <code>a-z<\/code>, then <code>A-Z<\/code> (in that order, so 'a' is 10 and 'A' is 36). 0 is <code>'0'<\/code>.", "starter": "def to_base62(n):\n    pass\n", "solution": "def to_base62(n):\n    chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'\n    if n == 0:\n        return '0'\n    out = ''\n    while n > 0:\n        n, r = divmod(n, 62)\n        out = chars[r] + out\n    return out\n", "hint": "divmod(n, 62) gives the next digit and what is left.", "tests": [{"label": "zero", "expr": "to_base62(0)", "want": "'0'"}, {"label": "small", "expr": "to_base62(61)", "want": "'Z'"}, {"label": "two characters", "expr": "to_base62(62)", "want": "'10'"}, {"label": "a big id", "expr": "to_base62(125)", "want": "'21'"}, {"label": "billions fit in 6 characters", "expr": "len(to_base62(56_800_235_583))", "want": "6"}], "steps": ["Handle 0 first", "Repeatedly divide by 62, keeping the remainder", "Look each remainder up in the alphabet", "Build the text from last remainder to first"], "fuzz": ["to_base62", "(R.randint(0, 10 ** 6),)"], "gym": 2, "gk": "sys", "gname": "System Design Gym", "area": "sys2"}, {"kind": "py", "title": "Consistent hash ring", "task": "Write a class <code>HashRing(nodes, vnodes=50)<\/code> with <code>get(key)<\/code> returning the node that owns the key. Put each node on the ring <code>vnodes<\/code> times (hash the text <code>node + '#' + str(i)<\/code>), hash the key the same way, and pick the first ring point at or after the key's hash, wrapping to the start. Use <code>zlib.crc32(text.encode())<\/code> as the hash.", "starter": "import zlib\nfrom bisect import bisect_left\n\nclass HashRing:\n    def __init__(self, nodes, vnodes=50):\n        pass\n\n    def get(self, key):\n        pass\n", "solution": "import zlib\nfrom bisect import bisect_left\n\nclass HashRing:\n    def __init__(self, nodes, vnodes=50):\n        self.ring = sorted((zlib.crc32((n + '#' + str(i)).encode()), n) for n in nodes for i in range(vnodes))\n        self.points = [p for p, _ in self.ring]\n    def get(self, key):\n        h = zlib.crc32(key.encode())\n        i = bisect_left(self.points, h)\n        if i == len(self.points):\n            i = 0\n        return self.ring[i][1]\n", "hint": "bisect_left on the sorted hash list gives the next point clockwise.", "tests": [{"label": "every node gets some keys", "expr": "len(set(HashRing(['a', 'b', 'c']).get('k%d' % i) for i in range(300)))", "want": "3"}, {"label": "same key, same node, whatever the node order", "expr": "HashRing(['a', 'b', 'c']).get('user42') == HashRing(['c', 'b', 'a']).get('user42')", "want": "True"}, {"label": "adding a node moves only a minority of keys", "expr": "(lambda r3, r4: sum(1 for i in range(1000) if r3.get('k%d' % i) != r4.get('k%d' % i)) < 400)(HashRing(['a', 'b', 'c']), HashRing(['a', 'b', 'c', 'd']))", "want": "True"}, {"label": "keys that move go to the new node only", "expr": "(lambda r3, r4: all(r4.get('k%d' % i) == 'd' for i in range(1000) if r3.get('k%d' % i) != r4.get('k%d' % i)))(HashRing(['a', 'b', 'c']), HashRing(['a', 'b', 'c', 'd']))", "want": "True"}, {"label": "a single node owns everything", "expr": "HashRing(['solo']).get('anything')", "want": "'solo'"}], "steps": ["Build a sorted list of (hash, node) points: vnodes per node", "Keep just the hashes for searching", "Hash the key and find the first point at or after it (bisect_left)", "If you run past the end, wrap to index 0; return that point's node"], "gym": 2, "gk": "sys", "gname": "System Design Gym", "area": "sys2"}, {"kind": "py", "title": "Least-connections balancer", "task": "Write a class <code>LeastConnections(servers)<\/code>: <code>acquire()<\/code> returns the server with the fewest active connections (ties go to the earlier server in the list) and counts a new connection on it; <code>release(server)<\/code> counts one connection fewer on that server.", "starter": "class LeastConnections:\n    def __init__(self, servers):\n        pass\n\n    def acquire(self):\n        pass\n\n    def release(self, server):\n        pass\n", "solution": "class LeastConnections:\n    def __init__(self, servers):\n        self.servers = list(servers)\n        self.active = {s: 0 for s in self.servers}\n    def acquire(self):\n        best = min(self.servers, key=lambda s: self.active[s])\n        self.active[best] += 1\n        return best\n    def release(self, server):\n        self.active[server] -= 1\n", "hint": "min(servers, key=...) returns the first minimum.", "tests": [{"label": "takes turns when equal", "expr": "(lambda b: [b.acquire() for _ in range(4)])(LeastConnections(['a', 'b']))", "want": "['a', 'b', 'a', 'b']"}, {"label": "avoids the busy one", "expr": "(lambda b: [b.acquire(), b.acquire(), b.release('a'), b.acquire()])(LeastConnections(['a', 'b']))[-1]", "want": "'a'"}, {"label": "tie goes to the first", "expr": "LeastConnections(['x', 'y', 'z']).acquire()", "want": "'x'"}, {"label": "three servers", "expr": "(lambda b: [b.acquire() for _ in range(7)])(LeastConnections(['a', 'b', 'c']))", "want": "['a', 'b', 'c', 'a', 'b', 'c', 'a']"}], "steps": ["Keep a count of active connections per server", "acquire: pick the server with the smallest count (first wins ties) and add 1", "release: subtract 1"], "gym": 2, "gk": "sys", "gname": "System Design Gym", "area": "sys2"}, {"kind": "py", "title": "Cache with expiry", "task": "Write a class <code>TTLCache(ttl, clock)<\/code> where <code>clock()<\/code> returns the current time in seconds. <code>put(key, value)<\/code> stores it; <code>get(key)<\/code> returns the value, or <code>None<\/code> if the key is missing or <b>ttl seconds or more<\/b> have passed since it was stored (and removes it).", "starter": "class TTLCache:\n    def __init__(self, ttl, clock):\n        pass\n\n    def put(self, key, value):\n        pass\n\n    def get(self, key):\n        pass\n", "solution": "class TTLCache:\n    def __init__(self, ttl, clock):\n        self.ttl = ttl\n        self.clock = clock\n        self.data = {}\n    def put(self, key, value):\n        self.data[key] = (value, self.clock())\n    def get(self, key):\n        if key not in self.data:\n            return None\n        value, stored = self.data[key]\n        if self.clock() - stored >= self.ttl:\n            del self.data[key]\n            return None\n        return value\n", "hint": "Injecting the clock is what makes time testable.", "tests": [{"label": "fresh value", "expr": "(lambda t, c: (c.put('a', 1), c.get('a'))[1])([0], TTLCache(10, lambda: 0))", "want": "1"}, {"label": "expires exactly at ttl", "expr": "(lambda t: (t.append(0), c := TTLCache(10, lambda: t[0]), c.put('a', 1), t.__setitem__(0, 10), c.get('a'))[-1])([])", "want": "None"}, {"label": "still alive just before", "expr": "(lambda t: (t.append(0), c := TTLCache(10, lambda: t[0]), c.put('a', 1), t.__setitem__(0, 9), c.get('a'))[-1])([])", "want": "1"}, {"label": "missing key", "expr": "TTLCache(5, lambda: 0).get('nope')", "want": "None"}, {"label": "overwrite restarts the clock", "expr": "(lambda t: (t.append(0), c := TTLCache(10, lambda: t[0]), c.put('a', 1), t.__setitem__(0, 8), c.put('a', 2), t.__setitem__(0, 15), c.get('a'))[-1])([])", "want": "2"}], "steps": ["Store (value, time stored) per key", "On get, return None if the key is missing", "If clock() - stored >= ttl, delete it and return None", "Otherwise return the value"], "gym": 2, "gk": "sys", "gname": "System Design Gym", "area": "sys2"}], "73": [{"kind": "py", "title": "Charge once", "task": "Write a class <code>Payments<\/code> with <code>charge(key, amount)<\/code>. The first call with a key returns <code>{'amount': amount, 'replay': False}<\/code> and adds amount to the running total. A later call with the <b>same key<\/b> returns the first result with <code>replay<\/code> set to True, ignores the new amount, and does not change the total. <code>total()<\/code> returns the money charged so far.", "starter": "class Payments:\n    def __init__(self):\n        pass\n\n    def charge(self, key, amount):\n        pass\n\n    def total(self):\n        pass\n", "solution": "class Payments:\n    def __init__(self):\n        self.results = {}\n        self._total = 0\n    def charge(self, key, amount):\n        if key in self.results:\n            first = self.results[key]\n            return {'amount': first['amount'], 'replay': True}\n        self.results[key] = {'amount': amount, 'replay': False}\n        self._total += amount\n        return {'amount': amount, 'replay': False}\n    def total(self):\n        return self._total\n", "hint": "A dict from key to first result is the whole trick.", "tests": [{"label": "first charge", "expr": "Payments().charge('k1', 50)", "want": "{'amount': 50, 'replay': False}"}, {"label": "retry returns the same result", "expr": "(lambda p: [p.charge('k1', 50), p.charge('k1', 50)])(Payments())", "want": "[{'amount': 50, 'replay': False}, {'amount': 50, 'replay': True}]"}, {"label": "retry does not double charge", "expr": "(lambda p: (p.charge('k1', 50), p.charge('k1', 50), p.total()))(Payments())[2]", "want": "50"}, {"label": "different keys both count", "expr": "(lambda p: (p.charge('a', 10), p.charge('b', 20), p.total()))(Payments())[2]", "want": "30"}, {"label": "a replay ignores a changed amount", "expr": "(lambda p: (p.charge('k', 10), p.charge('k', 999)))(Payments())[1]", "want": "{'amount': 10, 'replay': True}"}], "steps": ["Remember each key's first result", "If the key is known, return that result with replay True", "Otherwise record the result and add to the total"], "gym": 3, "gk": "sys", "gname": "System Design Gym", "area": "sys3"}, {"kind": "py", "title": "Don't lose an update", "task": "Write a class <code>VersionedStore<\/code>. <code>get(key)<\/code> returns <code>(value, version)<\/code>; a key that was never written is <code>(None, 0)<\/code>. <code>put(key, value, expected_version)<\/code> writes only if the current version equals <code>expected_version<\/code>: it then stores the value, makes the version one higher and returns True; otherwise it changes nothing and returns False.", "starter": "class VersionedStore:\n    def __init__(self):\n        pass\n\n    def get(self, key):\n        pass\n\n    def put(self, key, value, expected_version):\n        pass\n", "solution": "class VersionedStore:\n    def __init__(self):\n        self.data = {}\n    def get(self, key):\n        return self.data.get(key, (None, 0))\n    def put(self, key, value, expected_version):\n        _, version = self.get(key)\n        if version != expected_version:\n            return False\n        self.data[key] = (value, version + 1)\n        return True\n", "hint": "The version is the whole concurrency check.", "tests": [{"label": "new key", "expr": "VersionedStore().get('a')", "want": "(None, 0)"}, {"label": "first write", "expr": "(lambda s: (s.put('a', 'x', 0), s.get('a')))(VersionedStore())", "want": "(True, ('x', 1))"}, {"label": "stale write is rejected", "expr": "(lambda s: (s.put('a', 'x', 0), s.put('a', 'y', 0), s.get('a')))(VersionedStore())", "want": "(True, False, ('x', 1))"}, {"label": "fresh write works", "expr": "(lambda s: (s.put('a', 'x', 0), s.put('a', 'y', 1), s.get('a')))(VersionedStore())", "want": "(True, True, ('y', 2))"}, {"label": "two writers race", "expr": "(lambda s: (s.put('c', 1, 0), [s.put('c', 5, 1), s.put('c', 7, 1)], s.get('c')))(VersionedStore())", "want": "(True, [True, False], (5, 2))"}], "steps": ["Store (value, version) per key", "get returns (None, 0) for unknown keys", "put compares the stored version with expected_version", "If equal, store with version + 1 and return True; else return False"], "gym": 3, "gk": "sys", "gname": "System Design Gym", "area": "sys3"}, {"kind": "py", "title": "Page through a feed", "task": "Write <code>page(items, cursor, limit)<\/code>. <code>items<\/code> are dicts with an integer <code>id<\/code>, sorted by id ascending. Return <code>(rows, next_cursor)<\/code>: the next <code>limit<\/code> rows whose id is greater than <code>cursor<\/code> (<code>None<\/code> means start from the beginning), and the id to pass next time, or <code>None<\/code> if nothing is left after these rows.", "starter": "def page(items, cursor, limit):\n    pass\n", "solution": "def page(items, cursor, limit):\n    rest = [x for x in items if cursor is None or x['id'] > cursor]\n    rows = rest[:limit]\n    more = len(rest) > limit\n    return rows, (rows[-1]['id'] if more else None)\n", "hint": "Compare ids, not positions.", "tests": [{"label": "first page", "expr": "page(FEED, None, 2)", "want": "([{'id': 10}, {'id': 20}], 20)"}, {"label": "second page", "expr": "page(FEED, 20, 2)", "want": "([{'id': 30}, {'id': 40}], 40)"}, {"label": "last page has no cursor", "expr": "page(FEED, 40, 2)", "want": "([{'id': 50}], None)"}, {"label": "exact fit", "expr": "page(FEED, None, 5)", "want": "([{'id': 10}, {'id': 20}, {'id': 30}, {'id': 40}, {'id': 50}], None)"}, {"label": "new item arrives mid-way", "expr": "page(FEED + [{'id': 25}], 20, 2)", "want": "([{'id': 30}, {'id': 40}], 40)"}], "prelude": "FEED = [{'id': 10}, {'id': 20}, {'id': 30}, {'id': 40}, {'id': 50}]\n", "steps": ["Keep rows after the cursor (or all rows if cursor is None)", "Take limit rows", "If more rows remain, next cursor = last returned id", "Otherwise next cursor is None"], "fuzz": ["page", "(sorted([{'id': i} for i in R.sample(range(1, 30), R.randint(0, 8))], key=lambda x: x['id']), R.choice([None, 5, 12, 20]), R.randint(1, 4))"], "gym": 3, "gk": "sys", "gname": "System Design Gym", "area": "sys3"}], "74": [{"kind": "py", "title": "How many keys move?", "task": "Write <code>moved_with_modulo(keys, old_n, new_n)<\/code>: <code>keys<\/code> are whole numbers placed on shard <code>key % n<\/code>. Return how many keys land on a different shard when the cluster grows from <code>old_n<\/code> to <code>new_n<\/code> shards.", "starter": "def moved_with_modulo(keys, old_n, new_n):\n    pass\n", "solution": "def moved_with_modulo(keys, old_n, new_n):\n    return sum(1 for k in keys if k % old_n != k % new_n)\n", "hint": "A large fraction moves: that is why consistent hashing exists.", "tests": [{"label": "4 to 5 shards", "expr": "moved_with_modulo(range(1000), 4, 5)", "want": "800"}, {"label": "no change", "expr": "moved_with_modulo(range(100), 3, 3)", "want": "0"}, {"label": "doubling", "expr": "moved_with_modulo(range(1000), 4, 8)", "want": "500"}, {"label": "empty", "expr": "moved_with_modulo([], 2, 3)", "want": "0"}], "steps": ["For each key, compute both shard numbers", "Count the keys where they differ"], "fuzz": ["moved_with_modulo", "(list(range(R.randint(0, 40))), R.randint(1, 6), R.randint(1, 7))"], "gym": 4, "gk": "sys", "gname": "System Design Gym", "area": "sys4"}, {"kind": "py", "title": "Sliding-window rate limit", "task": "Write a class <code>SlidingWindowLimiter(limit, window, clock)<\/code>. <code>allow()<\/code> returns True and records the time if fewer than <code>limit<\/code> allowed requests happened in the last <code>window<\/code> seconds (a request exactly <code>window<\/code> seconds old no longer counts); otherwise False and nothing is recorded.", "starter": "from collections import deque\n\nclass SlidingWindowLimiter:\n    def __init__(self, limit, window, clock):\n        pass\n\n    def allow(self):\n        pass\n", "solution": "from collections import deque\n\nclass SlidingWindowLimiter:\n    def __init__(self, limit, window, clock):\n        self.limit, self.window, self.clock = limit, window, clock\n        self.times = deque()\n    def allow(self):\n        now = self.clock()\n        while self.times and now - self.times[0] >= self.window:\n            self.times.popleft()\n        if len(self.times) < self.limit:\n            self.times.append(now)\n            return True\n        return False\n", "hint": "A deque lets you drop from the front in O(1).", "tests": [{"label": "allows up to the limit", "expr": "(lambda t: (t.append(0), l := SlidingWindowLimiter(2, 10, lambda: t[0]), [l.allow(), l.allow(), l.allow()])[-1])([])", "want": "[True, True, False]"}, {"label": "rejected requests are not recorded", "expr": "(lambda t: (t.append(0), l := SlidingWindowLimiter(1, 10, lambda: t[0]), l.allow(), t.__setitem__(0, 5), l.allow(), t.__setitem__(0, 10), l.allow())[-1])([])", "want": "True"}, {"label": "old requests fall out of the window", "expr": "(lambda t: (t.append(0), l := SlidingWindowLimiter(2, 10, lambda: t[0]), l.allow(), l.allow(), t.__setitem__(0, 10), [l.allow(), l.allow(), l.allow()])[-1])([])", "want": "[True, True, False]"}, {"label": "limit of zero blocks everything", "expr": "SlidingWindowLimiter(0, 5, lambda: 0).allow()", "want": "False"}], "steps": ["Keep a queue of times of allowed requests", "Drop times that are window seconds old or older", "If fewer than limit remain, record now and return True", "Otherwise return False"], "gym": 4, "gk": "sys", "gname": "System Design Gym", "area": "sys4"}, {"kind": "py", "title": "Circuit breaker", "task": "Write a class <code>CircuitBreaker(fail_max, reset_after, clock)<\/code> with <code>call(fn)<\/code>. While closed it calls <code>fn()<\/code> and returns the result; after <code>fail_max<\/code> failures in a row (fn raised) the breaker opens. While open, <code>call<\/code> raises <code>CircuitOpen<\/code> without calling fn. Once <code>reset_after<\/code> seconds have passed since it opened, one trial call is allowed: if it succeeds the breaker closes (failure count reset), if it fails the breaker opens again from that moment. A success always resets the failure count. The error from fn is re-raised to the caller.", "starter": "class CircuitBreaker:\n    def __init__(self, fail_max, reset_after, clock):\n        pass\n\n    def call(self, fn):\n        pass\n", "solution": "class CircuitBreaker:\n    def __init__(self, fail_max, reset_after, clock):\n        self.fail_max, self.reset_after, self.clock = fail_max, reset_after, clock\n        self.fails = 0\n        self.opened_at = None\n    def call(self, fn):\n        if self.opened_at is not None:\n            if self.clock() - self.opened_at < self.reset_after:\n                raise CircuitOpen('open')\n        try:\n            result = fn()\n        except Exception:\n            self.fails += 1\n            if self.opened_at is not None or self.fails >= self.fail_max:\n                self.opened_at = self.clock()\n            raise\n        self.fails = 0\n        self.opened_at = None\n        return result\n", "hint": "Two pieces of state: failure count and opened_at.", "tests": [{"label": "passes results through", "expr": "CircuitBreaker(2, 10, lambda: 0).call(ok)", "want": "'fine'"}, {"label": "opens after fail_max failures", "expr": "trip(2)", "want": "['ERR', 'ERR', 'OPEN']"}, {"label": "open means fail fast without calling", "expr": "fast_fail()", "want": "('OPEN', 1)"}, {"label": "trial after reset_after closes it", "expr": "recovers()", "want": "['fine', 'fine']"}, {"label": "a failed trial reopens it", "expr": "trial_fails()", "want": "['ERR', 'OPEN']"}, {"label": "success resets the count", "expr": "reset_count()", "want": "['ERR', 'fine', 'ERR', 'fine']"}], "prelude": "class CircuitOpen(Exception):\n    pass\ndef ok():\n    return 'fine'\ndef bad():\n    raise ValueError('down')\ndef _try(cb, fn):\n    try:\n        return cb.call(fn)\n    except CircuitOpen:\n        return 'OPEN'\n    except ValueError:\n        return 'ERR'\ndef trip(n):\n    cb = CircuitBreaker(n, 10, lambda: 0)\n    return [_try(cb, bad) for _ in range(n + 1)]\ndef fast_fail():\n    calls = []\n    def f():\n        calls.append(1)\n        raise ValueError('x')\n    cb = CircuitBreaker(1, 10, lambda: 0)\n    _try(cb, f)\n    out = _try(cb, f)\n    return (out, len(calls))\ndef recovers():\n    t = [0]\n    cb = CircuitBreaker(1, 10, lambda: t[0])\n    _try(cb, bad)\n    t[0] = 10\n    return [_try(cb, ok), _try(cb, ok)]\ndef trial_fails():\n    t = [0]\n    cb = CircuitBreaker(1, 10, lambda: t[0])\n    _try(cb, bad)\n    t[0] = 10\n    first = _try(cb, bad)\n    t[0] = 15\n    return [first, _try(cb, ok)]\ndef reset_count():\n    cb = CircuitBreaker(2, 10, lambda: 0)\n    return [_try(cb, bad), _try(cb, ok), _try(cb, bad), _try(cb, ok)]\n", "steps": ["Count consecutive failures", "When the count reaches fail_max, remember when it opened", "While open and not yet reset_after seconds old, raise CircuitOpen without calling fn", "After that allow one trial: success closes, failure reopens from now"], "gym": 4, "gk": "sys", "gname": "System Design Gym", "area": "sys4"}], "75": [{"kind": "design", "title": "Design: a URL shortener", "task": "Design a service that turns long links into short ones (like sho.rt/aZ3kP9) and redirects visitors. Assume 100 million new links a month and 100 reads for every write.", "questions": [["How many redirects per second at peak, and how fast must a redirect be?", true], ["Can a short code ever expire or be deleted, and can users pick custom codes?", true], ["Do we need click analytics, and how fresh must they be?", true], ["Which programming language is best?", false], ["Should the logo be blue?", false], ["Do we need a mobile app first?", false]], "steps": ["Client sends a long URL to the create API", "API generates a unique short code (counter encoded in base62)", "Store code to long URL in a key-value database", "Return the short link", "On a visit, the redirect service looks in the cache first", "On a miss, read the database and fill the cache", "Return an HTTP redirect; log the click asynchronously for analytics"], "trade": [{"q": "How do you generate unique short codes without collisions at scale?", "o": ["A counter (or ID ranges per server) encoded in base62", "Random 3 characters", "Hash the URL and hope", "Ask the user"], "a": 0, "why": "A counter never collides; give each server a block of IDs to avoid a single bottleneck. Random or truncated hashes need collision checks."}, {"q": "Reads are 100 times writes. What helps most?", "o": ["A cache in front of the database", "More write servers", "A bigger logo", "Moving to a graph database"], "a": 0, "why": "Popular links are read again and again; a cache serves them from memory."}, {"q": "Click analytics are slowing redirects. Fix?", "o": ["Publish click events to a queue and process them in the background", "Write analytics before every redirect, synchronously", "Remove analytics", "Cache the analytics page"], "a": 0, "why": "Keep the redirect path short and move slow work off the request."}], "model": ["Clarify: about 100M writes a month is ~40 writes/s, and ~4,000 reads/s average; redirects must be fast; expiry and custom codes are product choices.", "Create path: API, unique ID from a counter, base62, store code to URL in a key-value store.", "Read path: cache first, database on a miss, return a redirect; the cache absorbs most traffic.", "Analytics via a queue so they never slow the redirect.", "Failure and scale: replicate the database, shard by code, rate-limit creation to stop abuse, monitor redirect latency and error rate."], "keys": [["scale and speed numbers", "qps|per second|peak|latency|100 ?m|million|reads? (are|is)|ratio|how many|ms"], ["unique code generation", "counter|base ?62|unique|collision|id range|hash|snowflake|generate"], ["cache for reads", "cache|redis|memcach|hot link|popular|in memory"], ["storage choice", "key.?value|database|store|nosql|dynamo|sql|shard|replic"], ["async analytics", "queue|async|kafka|background|log|analytics|event"], ["abuse and failure", "rate.?limit|abuse|spam|fail|monitor|expir|replica|availab|backup|alert"]], "gym": 5, "gk": "sys", "gname": "System Design Gym", "area": "sys5"}, {"kind": "design", "title": "Design: a news feed", "task": "Design the home feed for a social app: users follow others and see their latest posts. 50 million daily users, an average user follows 200 accounts, a few celebrities have 20 million followers.", "questions": [["How fresh must the feed be, and how many posts does a user scroll through?", true], ["How many posts are written per day and how many feed reads per second?", true], ["What do celebrity accounts with millions of followers do to the design?", true], ["Should the app use dark mode?", false], ["Which fonts are used?", false], ["Who is the CEO?", false]], "steps": ["User publishes a post through the post API", "Post is saved in the post store", "A fan-out worker (from a queue) adds the post id to each follower's feed list", "Celebrity posts skip fan-out and are merged in at read time", "User opens the app: feed service reads the precomputed feed list from the cache", "Merge in celebrity posts, rank, and fetch post details in a batch", "Return the first page with a cursor for the next page"], "trade": [{"q": "A normal user posts. Followers' feeds should be...", "o": ["Precomputed at write time (fan-out on write)", "Computed by scanning every followed account on every open", "Not updated", "Rebuilt nightly only"], "a": 0, "why": "Most users have few followers, so writing the post id into each feed is cheap and makes reads fast."}, {"q": "A celebrity with 20 million followers posts. Fan-out on write would...", "o": ["Create 20 million writes at once, so skip it and merge at read time", "Work perfectly", "Be free", "Reduce latency"], "a": 0, "why": "The hybrid approach: fan out for normal users, pull celebrity posts when a follower reads."}, {"q": "How should the feed be paged?", "o": ["Cursor (last post id/time seen)", "Offset page numbers", "Download everything", "Random order"], "a": 0, "why": "New posts keep arriving; a cursor stays stable where offsets shift."}], "model": ["Clarify freshness (seconds are fine), scale (50M daily users, read-heavy) and the celebrity problem.", "Post path: save the post, enqueue fan-out to followers' feed lists in a cache or key-value store.", "Read path: fetch the feed list, merge celebrity posts at read time, rank, hydrate post details in a batch, return a page with a cursor.", "Trade-off: fan-out on write makes reads fast but costs writes; the hybrid avoids the celebrity blow-up.", "Failure and scale: shard feed lists by user, tolerate a few seconds of staleness, monitor fan-out lag."], "keys": [["freshness and scale numbers", "fresh|second|latency|read.?heavy|50 ?m|million|qps|per second|scroll|how many"], ["fan-out on write", "fan.?out|precompute|push|write time|feed list|timeline|inbox"], ["the celebrity problem", "celebrit|millions of followers|hybrid|read time|pull|hot|20 ?million"], ["cache or fast store for feeds", "cache|redis|key.?value|in.?memory|store"], ["queue for the fan-out", "queue|worker|async|kafka|background"], ["pagination and ranking", "cursor|page|pagina|rank|merge|sort"]], "gym": 5, "gk": "sys", "gname": "System Design Gym", "area": "sys5"}, {"kind": "design", "title": "Design: a notification system", "task": "Design a service that sends push, email and SMS notifications for many apps: order updates, OTP codes and marketing. Millions a day, with bursts when a sale starts. OTPs must arrive in seconds; marketing s and channel providers.", "Reliability: retries with exponential backoff, provider failover, dead-letter queue.", "Trade-off: queue separation costs complexity but protects urgent messages from floods.", "Observe: delivery status, queue depth and age per priority, provider error rates, alerts."], "keys": [["priority and latency needs", "priority|urgent|otp|seconds|marketing|delay|latency|sla"], ["queue and workers", "queue|worker|kafka|sqs|async|consumer"], ["idempotency and duplicates", "idempot|duplicate|twice|dedupe|at.?least.?once|unique key"], ["retries, backoff and failover", "retry|backoff|fail.?over|backup provider|second provider|dead.?letter|dlq"], ["preferences and rate limits", "opt.?out|preference|rate.?limit|per user|consent|throttl"], ["monitoring", "monitor|metric|alert|status|delivery|queue (depth|age)|dashboard|track"]], "gym": 5, "gk": "sys", "gname": "System Design Gym", "area": "sys5"}], "81": [{"kind": "py", "title": "Read a .env file", "task": "Write <code>parse_env(text)<\/code>: return a dict from the lines of a .env file. Each setting is <code>KEY=value<\/code>. Ignore blank lines and lines starting with <code>#<\/code>. Trim spaces around the key and value. If a value is wrapped in matching single or double quotes, remove the quotes. Only split on the <b>first<\/b> <code>=<\/code> (a value may contain more). Lines without <code>=<\/code> are skipped.", "starter": "def parse_env(text):\n    pass\n", "solution": "def parse_env(text):\n    out = {}\n    for line in text.splitlines():\n        line = line.strip()\n        if not line or line.startswith('#') or '=' not in line:\n            continue\n        key, value = line.split('=', 1)\n        key, value = key.strip(), value.strip()\n        if len(value) >= 2 and value[0] == value[-1] and value[0] in '\"\\'':\n            value = value[1:-1]\n        out[key] = value\n    return out\n", "hint": "line.split('=', 1) splits once.", "tests": [{"label": "basic", "expr": "parse_env('A=1\\nB=two')", "want": "{'A': '1', 'B': 'two'}"}, {"label": "comments and blanks", "expr": "parse_env('# note\\n\\nA=1')", "want": "{'A': '1'}"}, {"label": "quotes removed", "expr": "parse_env('URL=\"http://x\"\\nN=\\'hi\\'')", "want": "{'URL': 'http://x', 'N': 'hi'}"}, {"label": "value with equals", "expr": "parse_env('TOKEN=abc==')", "want": "{'TOKEN': 'abc=='}"}, {"label": "spaces trimmed", "expr": "parse_env('  KEY =  val  ')", "want": "{'KEY': 'val'}"}, {"label": "line without equals", "expr": "parse_env('oops\\nOK=1')", "want": "{'OK': '1'}"}], "steps": ["Go through each line, trimmed", "Skip blanks, comments and lines with no =", "Split on the first = only", "Strip matching quotes from the value; store it"], "fuzz": ["parse_env", "('\\n'.join(R.choice(['A=1', '# c', '', 'B = \"x y\"', 'bad', 'C=d=e']) for _ in range(R.randint(0, 5))),)"], "gym": 1, "gk": "dep", "gname": "Deployment Gym", "area": "dep1"}, {"kind": "py", "title": "Typed settings", "task": "Write <code>get_setting(env, name, cast=str, default=None)<\/code>: <code>env<\/code> is a dict of text values. If <code>name<\/code> is missing return <code>default<\/code>. Otherwise convert with <code>cast<\/code>. When <code>cast<\/code> is <code>bool<\/code>, the text <code>'1'<\/code>, <code>'true'<\/code>, <code>'yes'<\/code>, <code>'on'<\/code> (any case) mean True and everything else False.", "starter": "def get_setting(env, name, cast=str, default=None):\n    pass\n", "solution": "def get_setting(env, name, cast=str, default=None):\n    if name not in env:\n        return default\n    value = env[name]\n    if cast is bool:\n        return value.strip().lower() in ('1', 'true', 'yes', 'on')\n    return cast(value)\n", "hint": "bool('false') is True, so bool needs its own rule.", "tests": [{"label": "text", "expr": "get_setting({'HOST': 'db'}, 'HOST')", "want": "'db'"}, {"label": "number", "expr": "get_setting({'PORT': '8080'}, 'PORT', int)", "want": "8080"}, {"label": "missing uses default", "expr": "get_setting({}, 'PORT', int, 3000)", "want": "3000"}, {"label": "bool true", "expr": "get_setting({'DEBUG': 'True'}, 'DEBUG', bool)", "want": "True"}, {"label": "bool false", "expr": "get_setting({'DEBUG': 'false'}, 'DEBUG', bool)", "want": "False"}, {"label": "float", "expr": "get_setting({'RATE': '0.5'}, 'RATE', float)", "want": "0.5"}], "steps": ["Return the default when the name is missing", "Handle bool as a special case with a set of true words", "Otherwise call cast on the text"], "gym": 1, "gk": "dep", "gname": "Deployment Gym", "area": "dep1"}, {"kind": "py", "title": "Fail fast on missing settings", "task": "Write <code>check_required(env, required)<\/code>: return the sorted list of names in <code>required<\/code> that are missing from <code>env<\/code> or are empty text (or only spaces). Return <code>[]<\/code> when all are fine.", "starter": "def check_required(env, required):\n    pass\n", "solution": "def check_required(env, required):\n    return sorted(n for n in required if not str(env.get(n, '')).strip())\n", "hint": "str(...).strip() makes spaces count as empty.", "tests": [{"label": "all present", "expr": "check_required({'A': '1', 'B': 'x'}, ['A', 'B'])", "want": "[]"}, {"label": "missing", "expr": "check_required({'A': '1'}, ['B', 'A', 'C'])", "want": "['B', 'C']"}, {"label": "empty counts as missing", "expr": "check_required({'A': '', 'B': '  '}, ['A', 'B'])", "want": "['A', 'B']"}, {"label": "nothing required", "expr": "check_required({}, [])", "want": "[]"}], "steps": ["For each required name, look it up (empty if absent)", "Keep the names whose value is blank", "Return them sorted"], "fuzz": ["check_required", "({k: R.choice(['', ' ', 'x']) for k in R.sample(['A', 'B', 'C'], R.randint(0, 3))}, R.sample(['A', 'B', 'C', 'D'], R.randint(0, 4)))"], "gym": 1, "gk": "dep", "gname": "Deployment Gym", "area": "dep1"}, {"kind": "py", "title": "Mask secrets in logs", "task": "Write <code>mask_secrets(config)<\/code>: return a copy of the dict where the value of any key whose name contains <code>KEY<\/code>, <code>SECRET<\/code>, <code>TOKEN<\/code> or <code>PASSWORD<\/code> (any case) is replaced by <code>'****'<\/code>. If the secret has 5 or more characters keep the last 2: <code>'****ab'<\/code>. Other values are unchanged. The original dict must not change.", "starter": "def mask_secrets(config):\n    pass\n", "solution": "def mask_secrets(config):\n    out = {}\n    for k, v in config.items():\n        if any(w in k.upper() for w in ('KEY', 'SECRET', 'TOKEN', 'PASSWORD')):\n            s = str(v)\n            out[k] = '****' + (s[-2:] if len(s) >= 5 else '')\n        else:\n            out[k] = v\n    return out\n", "hint": "Check the upper-cased key name for any of the four words.", "tests": [{"label": "masks the secret", "expr": "mask_secrets({'API_KEY': 'abcdef', 'HOST': 'db'})", "want": "{'API_KEY': '****ef', 'HOST': 'db'}"}, {"label": "short secret fully hidden", "expr": "mask_secrets({'password': 'abc'})", "want": "{'password': '****'}"}, {"label": "original untouched", "expr": "(lambda d: (mask_secrets(d), d)[1])({'TOKEN': 'abcdef'})", "want": "{'TOKEN': 'abcdef'}"}, {"label": "no secrets", "expr": "mask_secrets({'PORT': 80})", "want": "{'PORT': 80}"}], "steps": ["Make a new dict", "If the key name looks secret, mask the value", "Keep the last 2 characters only for values of 5+ characters", "Copy other values as they are"], "fuzz": ["mask_secrets", "({R.choice(['API_KEY', 'host', 'DB_PASSWORD', 'port']): R.choice(['abcdefg', 'abc', 'x']) for _ in range(R.randint(0, 4))},)"], "gym": 1, "gk": "dep", "gname": "Deployment Gym", "area": "dep1"}], "82": [{"kind": "py", "title": "Read a Dockerfile", "task": "Write <code>parse_dockerfile(text)<\/code>: return a list of <code>(INSTRUCTION, arguments)<\/code> pairs. Ignore blank lines and lines starting with <code>#<\/code>. A line ending in a backslash continues on the next line (join them with a single space after trimming). The instruction is upper-cased; arguments are the rest of the line, trimmed.", "starter": "def parse_dockerfile(text):\n    pass\n", "solution": "def parse_dockerfile(text):\n    out = []\n    cur = ''\n    for raw in text.splitlines():\n        line = raw.strip()\n        if not cur and (not line or line.startswith('#')):\n            continue\n        if line.endswith('\\\\'):\n            cur += line[:-1].strip() + ' '\n            continue\n        cur += line\n        parts = cur.strip().split(None, 1)\n        out.append((parts[0].upper(), parts[1].strip() if len(parts) > 1 else ''))\n        cur = ''\n    return out\n", "hint": "line.split(None, 1) splits off the first word.", "tests": [{"label": "basic", "expr": "parse_dockerfile('FROM python:3.12\\nCOPY . .')", "want": "[('FROM', 'python:3.12'), ('COPY', '. .')]"}, {"label": "comments and blanks", "expr": "parse_dockerfile('# hi\\n\\nFROM x:1')", "want": "[('FROM', 'x:1')]"}, {"label": "continuation lines", "expr": "parse_dockerfile('RUN a \\\\\\n  b \\\\\\n  c\\nCMD go')", "want": "[('RUN', 'a b c'), ('CMD', 'go')]"}, {"label": "lower-case instruction", "expr": "parse_dockerfile('from alpine:3')", "want": "[('FROM', 'alpine:3')]"}, {"label": "realistic file", "expr": "[i for i, _ in parse_dockerfile(DOCKERFILE)]", "want": "['FROM', 'WORKDIR', 'COPY', 'RUN', 'COPY', 'CMD']"}], "prelude": "DOCKERFILE = '# build the app\\nFROM python:3.12-slim\\nWORKDIR /app\\nCOPY requirements.txt .\\nRUN pip install \\\\\\n    --no-cache-dir -r requirements.txt\\nCOPY . .\\nCMD [\"python\", \"app.py\"]\\n'\n", "steps": ["Skip blank lines and comments", "If a line ends in a backslash, remember it and join the next line", "Split the finished line into instruction and arguments", "Upper-case the instruction"], "gym": 2, "gk": "dep", "gname": "Deployment Gym", "area": "dep2"}, {"kind": "py", "title": "Lint a Dockerfile", "task": "Write <code>lint_dockerfile(text)<\/code>: return the sorted list of problem codes found. Use <code>parse_dockerfile<\/code> (provided). Codes: <code>'unpinned-base'<\/code> if any FROM image has no tag or uses <code>:latest<\/code> (ignore <code>scratch<\/code> and image names containing <code>@sha256<\/code>), <code>'runs-as-root'<\/code> if there is no USER instruction, <code>'uses-add'<\/code> if ADD appears, <code>'secret-in-env'<\/code> if an ENV line mentions PASSWORD, SECRET or TOKEN (any case), <code>'no-healthcheck'<\/code> if there is no HEALTHCHECK instruction.", "starter": "def lint_dockerfile(text):\n    pass\n", "solution": "def lint_dockerfile(text):\n    ins = parse_dockerfile(text)\n    names = [i for i, _ in ins]\n    found = set()\n    for i, a in ins:\n        if i == 'FROM':\n            img = a.split()[0]\n            if img != 'scratch' and '@sha256' not in img:\n                last = img.rsplit('/', 1)[-1]\n                if ':' not in last or last.endswith(':latest'):\n                    found.add('unpinned-base')\n        if i == 'ENV' and any(w in a.upper() for w in ('PASSWORD', 'SECRET', 'TOKEN')):\n            found.add('secret-in-env')\n    if 'USER' not in names:\n        found.add('runs-as-root')\n    if 'ADD' in names:\n        found.add('uses-add')\n    if 'HEALTHCHECK' not in names:\n        found.add('no-healthcheck')\n    return sorted(found)\n", "hint": "A port in a registry name (host:5000/app) is not an image tag: look at the part after the last /.", "tests": [{"label": "clean file except healthcheck and user", "expr": "lint_dockerfile(DOCKERFILE)", "want": "['no-healthcheck', 'runs-as-root']"}, {"label": "latest tag", "expr": "lint_dockerfile('FROM node:latest\\nUSER app\\nHEALTHCHECK CMD true')", "want": "['unpinned-base']"}, {"label": "no tag", "expr": "lint_dockerfile('FROM node\\nUSER app\\nHEALTHCHECK CMD true')", "want": "['unpinned-base']"}, {"label": "registry with port is not a tag", "expr": "lint_dockerfile('FROM localhost:5000/app\\nUSER a\\nHEALTHCHECK CMD x')", "want": "['unpinned-base']"}, {"label": "everything wrong", "expr": "lint_dockerfile('FROM ubuntu\\nADD app.tar /app\\nENV DB_PASSWORD=hunter2')", "want": "['no-healthcheck', 'runs-as-root', 'secret-in-env', 'unpinned-base', 'uses-add']"}, {"label": "good file", "expr": "lint_dockerfile('FROM python:3.12-slim\\nUSER app\\nHEALTHCHECK CMD curl -f http://localhost/ || exit 1')", "want": "[]"}], "prelude": "DOCKERFILE = '# build the app\\nFROM python:3.12-slim\\nWORKDIR /app\\nCOPY requirements.txt .\\nRUN pip install \\\\\\n    --no-cache-dir -r requirements.txt\\nCOPY . .\\nCMD [\"python\", \"app.py\"]\\n'\ndef parse_dockerfile(text):\n    out = []\n    cur = ''\n    for raw in text.splitlines():\n        line = raw.strip()\n        if not cur and (not line or line.startswith('#')):\n            continue\n        if line.endswith('\\\\'):\n            cur += line[:-1].strip() + ' '\n            continue\n        cur += line\n        parts = cur.strip().split(None, 1)\n        out.append((parts[0].upper(), parts[1].strip() if len(parts) > 1 else ''))\n        cur = ''\n    return out\n", "steps": ["Parse the file into instructions", "Check each FROM for a pinned tag", "Look for ENV lines that hold secrets", "Check which instructions are missing or present; return sorted codes"], "gym": 2, "gk": "dep", "gname": "Deployment Gym", "area": "dep2"}, {"kind": "py", "title": "Is the build cache friendly?", "task": "Write <code>cache_friendly(text)<\/code>: return True when the Dockerfile installs dependencies <b>before<\/b> copying the application code. That means: the first <code>COPY<\/code> that copies a dependency file (its arguments mention <code>requirements<\/code>, <code>package.json<\/code> or <code>pyproject<\/code>) comes before the first <code>COPY . <\/code> (copying everything), and a <code>RUN<\/code> containing <code>install<\/code> sits between them. If the file never copies everything (<code>COPY . <\/code>) or never has a dependency copy, return False. Use <code>parse_dockerfile<\/code> (provided).", "starter": "def cache_friendly(text):\n    pass\n", "solution": "def cache_friendly(text):\n    ins = parse_dockerfile(text)\n    dep = whole = None\n    for n, (i, a) in enumerate(ins):\n        if i == 'COPY':\n            if dep is None and any(w in a for w in ('requirements', 'package.json', 'pyproject')):\n                dep = n\n            if whole is None and a.startswith('. '):\n                whole = n\n    if dep is None or whole is None or dep > whole:\n        return False\n    return any(i == 'RUN' and 'install' in a for i, a in ins[dep:whole])\n", "hint": "Compare the positions of the two COPY lines.", "tests": [{"label": "friendly", "expr": "cache_friendly(DOCKERFILE)", "want": "True"}, {"label": "copies everything first", "expr": "cache_friendly('FROM x:1\\nCOPY . .\\nRUN pip install -r requirements.txt')", "want": "False"}, {"label": "no install between", "expr": "cache_friendly('FROM x:1\\nCOPY requirements.txt .\\nCOPY . .\\nRUN pip install -r requirements.txt')", "want": "False"}, {"label": "node style", "expr": "cache_friendly('FROM node:20\\nCOPY package.json .\\nRUN npm install\\nCOPY . .')", "want": "True"}, {"label": "never copies everything", "expr": "cache_friendly('FROM x:1\\nCOPY requirements.txt .\\nRUN pip install x')", "want": "False"}], "prelude": "DOCKERFILE = '# build the app\\nFROM python:3.12-slim\\nWORKDIR /app\\nCOPY requirements.txt .\\nRUN pip install \\\\\\n    --no-cache-dir -r requirements.txt\\nCOPY . .\\nCMD [\"python\", \"app.py\"]\\n'\ndef parse_dockerfile(text):\n    out = []\n    cur = ''\n    for raw in text.splitlines():\n        line = raw.strip()\n        if not cur and (not line or line.startswith('#')):\n            continue\n        if line.endswith('\\\\'):\n            cur += line[:-1].strip() + ' '\n            continue\n        cur += line\n        parts = cur.strip().split(None, 1)\n        out.append((parts[0].upper(), parts[1].strip() if len(parts) > 1 else ''))\n        cur = ''\n    return out\n", "steps": ["Parse the file", "Find the first dependency-file COPY and the first COPY of everything", "Dependency copy must come first", "A RUN with 'install' must sit between them"], "gym": 2, "gk": "dep", "gname": "Deployment Gym", "area": "dep2"}], "83": [{"kind": "py", "title": "Bump the version", "task": "Write <code>bump(version, part)<\/code>: <code>version<\/code> is text like <code>'2.4.1'<\/code>; <code>part<\/code> is <code>'major'<\/code>, <code>'minor'<\/code> or <code>'patch'<\/code>. Return the new version text. A bigger part resets the smaller ones to 0. Raise <code>ValueError<\/code> for an unknown part.", "starter": "def bump(version, part):\n    pass\n", "solution": "def bump(version, part):\n    major, minor, patch = (int(x) for x in version.split('.'))\n    if part == 'major':\n        return '%d.0.0' % (major + 1)\n    if part == 'minor':\n        return '%d.%d.0' % (major, minor + 1)\n    if part == 'patch':\n        return '%d.%d.%d' % (major, minor, patch + 1)\n    raise ValueError('unknown part: ' + str(part))\n", "hint": "Convert to int, not text: '9' + 1 would fail and '10' > '9' is False as text.", "tests": [{"label": "patch", "expr": "bump('2.4.1', 'patch')", "want": "'2.4.2'"}, {"label": "minor resets patch", "expr": "bump('2.4.1', 'minor')", "want": "'2.5.0'"}, {"label": "major resets both", "expr": "bump('2.4.1', 'major')", "want": "'3.0.0'"}, {"label": "numbers compare as numbers", "expr": "bump('1.9.9', 'patch')", "want": "'1.9.10'"}, {"label": "two digits", "expr": "bump('0.10.9', 'minor')", "want": "'0.11.0'"}, {"label": "unknown part", "expr": "_bad()", "want": "'ValueError'"}], "prelude": "def _bad():\n    try:\n        bump('1.0.0', 'huge')\n    except ValueError:\n        return 'ValueError'\n    return 'no error'\n", "steps": ["Split the version on dots and make numbers", "Increase the chosen part", "Reset the smaller parts to 0", "Raise ValueError otherwise"], "gym": 3, "gk": "dep", "gname": "Deployment Gym", "area": "dep3"}, {"kind": "py", "title": "Order the pipeline jobs", "task": "Write <code>job_order(jobs)<\/code>: <code>jobs<\/code> maps a job name to the list of job names it <b>needs<\/b> first, for example <code>{'deploy': ['build'], 'build': ['test', 'lint'], 'test': [], 'lint': []}<\/code>. Return a list of all jobs in an order where every job comes after the jobs it needs. When several jobs are ready, pick them in alphabetical order. Raise <code>ValueError<\/code> if there is a cycle or a job needs one that does not exist.", "starter": "def job_order(jobs):\n    pass\n", "solution": "def job_order(jobs):\n    for name, needs in jobs.items():\n        for n in needs:\n            if n not in jobs:\n                raise ValueError('unknown job: ' + n)\n    left = {name: set(needs) for name, needs in jobs.items()}\n    order = []\n    while left:\n        ready = sorted(n for n, needs in left.items() if not needs)\n        if not ready:\n            raise ValueError('cycle')\n        pick = ready[0]\n        order.append(pick)\n        del left[pick]\n        for needs in left.values():\n            needs.discard(pick)\n    return order\n", "hint": "This is a topological sort (Kahn's algorithm).", "tests": [{"label": "basic", "expr": "job_order({'deploy': ['build'], 'build': ['test', 'lint'], 'test': [], 'lint': []})", "want": "['lint', 'test', 'build', 'deploy']"}, {"label": "independent jobs alphabetical", "expr": "job_order({'b': [], 'a': [], 'c': []})", "want": "['a', 'b', 'c']"}, {"label": "chain", "expr": "job_order({'c': ['b'], 'b': ['a'], 'a': []})", "want": "['a', 'b', 'c']"}, {"label": "cycle", "expr": "_err({'a': ['b'], 'b': ['a']})", "want": "'ValueError'"}, {"label": "unknown dependency", "expr": "_err({'a': ['ghost']})", "want": "'ValueError'"}, {"label": "empty", "expr": "job_order({})", "want": "[]"}], "prelude": "def _err(j):\n    try:\n        job_order(j)\n    except ValueError:\n        return 'ValueError'\n    return 'no error'\n", "steps": ["Check every need exists", "Repeatedly find jobs with nothing left to wait for", "Pick the alphabetically first, record it, remove it from others' needs", "If none are ready but jobs remain, there is a cycle"], "gym": 3, "gk": "dep", "gname": "Deployment Gym", "area": "dep3"}, {"kind": "py", "title": "What needs rebuilding?", "task": "Write <code>services_to_build(changed_files, mapping)<\/code>: <code>mapping<\/code> maps a folder prefix (like <code>'services/api/'<\/code>) to a service name. Return the sorted list of services that have at least one changed file whose path starts with their prefix. A file under <code>'shared/'<\/code> affects <b>every<\/b> service. Files that match nothing are ignored.", "starter": "def services_to_build(changed_files, mapping):\n    pass\n", "solution": "def services_to_build(changed_files, mapping):\n    if any(f.startswith('shared/') for f in changed_files):\n        return sorted(set(mapping.values()))\n    hit = set()\n    for f in changed_files:\n        for prefix, name in mapping.items():\n            if f.startswith(prefix):\n                hit.add(name)\n    return sorted(hit)\n", "hint": "str.startswith with the prefix.", "tests": [{"label": "one service", "expr": "services_to_build(['services/api/app.py'], MAP)", "want": "['api']"}, {"label": "two services", "expr": "services_to_build(['services/api/a.py', 'services/web/b.js'], MAP)", "want": "['api', 'web']"}, {"label": "shared code affects all", "expr": "services_to_build(['shared/utils.py'], MAP)", "want": "['api', 'web', 'worker']"}, {"label": "docs only", "expr": "services_to_build(['README.md'], MAP)", "want": "[]"}, {"label": "no changes", "expr": "services_to_build([], MAP)", "want": "[]"}], "prelude": "MAP = {'services/api/': 'api', 'services/web/': 'web', 'services/worker/': 'worker'}\n", "steps": ["If any file is under shared/, return every service", "Otherwise match each file against each prefix", "Collect service names in a set; return sorted"], "gym": 3, "gk": "dep", "gname": "Deployment Gym", "area": "dep3"}], "84": [{"kind": "py", "title": "Overall health", "task": "Write <code>health_status(checks, critical)<\/code>: <code>checks<\/code> maps a dependency name to True (healthy) or False. <code>critical<\/code> is a list of names that must be healthy. Return <code>'down'<\/code> if any critical check is failing (or missing from checks), else <code>'degraded'<\/code> if any other check fails, else <code>'ok'<\/code>.", "starter": "def health_status(checks, critical):\n    pass\n", "solution": "def health_status(checks, critical):\n    if any(not checks.get(n, False) for n in critical):\n        return 'down'\n    if not all(checks.values()):\n        return 'degraded'\n    return 'ok'\n", "hint": "checks.get(name, False) treats a missing check as failing.", "tests": [{"label": "all fine", "expr": "health_status({'db': True, 'cache': True}, ['db'])", "want": "'ok'"}, {"label": "non-critical failing", "expr": "health_status({'db': True, 'cache': False}, ['db'])", "want": "'degraded'"}, {"label": "critical failing", "expr": "health_status({'db': False, 'cache': True}, ['db'])", "want": "'down'"}, {"label": "critical missing counts as down", "expr": "health_status({'cache': True}, ['db'])", "want": "'down'"}, {"label": "nothing to check", "expr": "health_status({}, [])", "want": "'ok'"}], "steps": ["If any critical check is false or missing, return down", "Else if any check fails, return degraded", "Otherwise ok"], "fuzz": ["health_status", "({k: R.choice([True, False]) for k in R.sample(['db', 'cache', 'queue'], R.randint(0, 3))}, R.sample(['db', 'cache'], R.randint(0, 2)))"], "gym": 4, "gk": "dep", "gname": "Deployment Gym", "area": "dep4"}, {"kind": "py", "title": "Plan a rolling update", "task": "Write <code>rolling_batches(instances, batch_size)<\/code>: return a list of lists: the instance names split in order into batches of at most <code>batch_size<\/code>, the order in which they will be replaced. Also write <code>min_capacity(total, batch_size)<\/code>: the fewest instances serving traffic while a full batch is being replaced (never below 0).", "starter": "def rolling_batches(instances, batch_size):\n    pass\n\n\ndef min_capacity(total, batch_size):\n    pass\n", "solution": "def rolling_batches(instances, batch_size):\n    return [instances[i:i + batch_size] for i in range(0, len(instances), batch_size)]\n\ndef min_capacity(total, batch_size):\n    return max(0, total - batch_size)\n", "hint": "range(0, n, step) with slicing.", "tests": [{"label": "batches", "expr": "rolling_batches(['a', 'b', 'c', 'd', 'e'], 2)", "want": "[['a', 'b'], ['c', 'd'], ['e']]"}, {"label": "one at a time", "expr": "rolling_batches(['a', 'b'], 1)", "want": "[['a'], ['b']]"}, {"label": "batch bigger than fleet", "expr": "rolling_batches(['a', 'b'], 5)", "want": "[['a', 'b']]"}, {"label": "empty fleet", "expr": "rolling_batches([], 2)", "want": "[]"}, {"label": "capacity during rollout", "expr": "min_capacity(10, 3)", "want": "7"}, {"label": "capacity never negative", "expr": "min_capacity(2, 5)", "want": "0"}], "steps": ["Slice the list in steps of batch_size", "Capacity while a batch is out = total - batch_size (not below 0)"], "gym": 4, "gk": "dep", "gname": "Deployment Gym", "area": "dep4"}, {"kind": "py", "title": "Canary: promote or roll back?", "task": "Write <code>canary_decision(old_errors, old_total, new_errors, new_total, min_requests=100, tolerance=0.01)<\/code>: error rate = errors / total. If the canary has fewer than <code>min_requests<\/code> total requests return <code>'wait'<\/code>. If the canary's error rate is more than <code>tolerance<\/code> above the old version's rate return <code>'rollback'<\/code>, otherwise <code>'promote'<\/code>. (If old_total is 0, treat the old rate as 0.)", "starter": "def canary_decision(old_errors, old_total, new_errors, new_total, min_requests=100, tolerance=0.01):\n    pass\n", "solution": "def canary_decision(old_errors, old_total, new_errors, new_total, min_requests=100, tolerance=0.01):\n    if new_total < min_requests:\n        return 'wait'\n    old_rate = old_errors / old_total if old_total else 0.0\n    new_rate = new_errors / new_total\n    if new_rate > old_rate + tolerance:\n        return 'rollback'\n    return 'promote'\n", "hint": "Compare new_rate with old_rate + tolerance.", "tests": [{"label": "not enough traffic yet", "expr": "canary_decision(10, 1000, 0, 50)", "want": "'wait'"}, {"label": "healthy canary", "expr": "canary_decision(10, 1000, 1, 200)", "want": "'promote'"}, {"label": "clearly worse", "expr": "canary_decision(10, 1000, 20, 200)", "want": "'rollback'"}, {"label": "slightly worse within tolerance", "expr": "canary_decision(10, 1000, 4, 200)", "want": "'promote'"}, {"label": "just over tolerance", "expr": "canary_decision(10, 1000, 6, 200)", "want": "'rollback'"}, {"label": "no history for the old version", "expr": "canary_decision(0, 0, 0, 500)", "want": "'promote'"}], "steps": ["Wait when the canary has too little traffic", "Compute both error rates", "Roll back if the canary is worse by more than the tolerance", "Otherwise promote"], "fuzz": ["canary_decision", "(R.randint(0, 20), R.randint(0, 2000), R.randint(0, 10), R.randint(0, 400))"], "gym": 4, "gk": "dep", "gname": "Deployment Gym", "area": "dep4"}, {"kind": "py", "title": "Read the logs", "task": "Write <code>log_summary(lines)<\/code>: each line looks like <code>'2025-03-01 10:00:01 ERROR payment timeout'<\/code> (date, time, level, message). Return a dict with <code>'errors'<\/code> (how many ERROR lines), <code>'total'<\/code> (how many valid lines) and <code>'top_error'<\/code> (the most common ERROR message, ties broken A to Z, or <code>None<\/code> if no errors). Skip blank or malformed lines (fewer than 4 parts).", "starter": "def log_summary(lines):\n    pass\n", "solution": "def log_summary(lines):\n    total = errors = 0\n    counts = {}\n    for line in lines:\n        parts = line.split(None, 3)\n        if len(parts) < 4:\n            continue\n        total += 1\n        if parts[2] == 'ERROR':\n            errors += 1\n            counts[parts[3]] = counts.get(parts[3], 0) + 1\n    top = None\n    if counts:\n        top = sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[0][0]\n    return {'errors': errors, 'total': total, 'top_error': top}\n", "hint": "line.split(None, 3) keeps the message in one piece.", "tests": [{"label": "basic", "expr": "log_summary(LOG)", "want": "{'errors': 3, 'total': 5, 'top_error': 'payment timeout'}"}, {"label": "no errors", "expr": "log_summary(['2025-03-01 10:00:01 INFO started'])", "want": "{'errors': 0, 'total': 1, 'top_error': None}"}, {"label": "empty", "expr": "log_summary([])", "want": "{'errors': 0, 'total': 0, 'top_error': None}"}, {"label": "malformed lines skipped", "expr": "log_summary(['', 'garbage', '2025-03-01 10:00:01 ERROR boom'])", "want": "{'errors': 1, 'total': 1, 'top_error': 'boom'}"}, {"label": "ties go to A to Z", "expr": "log_summary(['d t ERROR b', 'd t ERROR a'])", "want": "{'errors': 2, 'total': 2, 'top_error': 'a'}"}], "prelude": "LOG = ['2025-03-01 10:00:01 INFO started', '2025-03-01 10:00:02 ERROR payment timeout', '2025-03-01 10:00:03 WARN slow query', '2025-03-01 10:00:04 ERROR payment timeout', '2025-03-01 10:00:05 ERROR db connection refused', '']\n", "steps": ["Split each line into date, time, level, message", "Skip lines with fewer than 4 parts", "Count totals and ERROR lines", "Count messages and pick the most common (ties A to Z)"], "fuzz": ["log_summary", "([R.choice(['d t ERROR a', 'd t INFO ok', 'd t ERROR b', 'bad', '']) for _ in range(R.randint(0, 6))],)"], "gym": 4, "gk": "dep", "gname": "Deployment Gym", "area": "dep4"}], "85": [{"kind": "design", "title": "Design: ship an API with no downtime", "task": "You built a customer-facing API. Design how it is built, tested, released and rolled back, so a bad release never takes the service down for long.", "questions": [["How much downtime is acceptable and how fast must a rollback be
