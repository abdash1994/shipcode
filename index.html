aptop."], ["talk through a system design and its trade-offs.", "FDE interviews test whether you can design something real, not just code one function."], ["ship an end-to-end project and explain it to a non-technical customer.", "This becomes your portfolio piece and your strongest interview story."], ["run a full mock interview loop and know exactly what to practise next.", "You walk into real interviews having already done one."]],WEEK_SHARE={"1": "Week 1 of my 30-day plan from non-coder to AI engineer is done. I can now write Python from a blank file: loops, dicts, functions, files and classes, and I can read a traceback and fix it. Next up: SQL and data.", "2": "Week 2 of my 30-day coding plan is done: SQL from filters to joins and window functions, pandas, and a small data pipeline that doesn't crash on bad rows. Next: interview problem solving.", "3": "Week 3 of my 30-day coding plan is done: hash maps, two pointers, sliding windows, stacks, binary search, trees, graphs and my first dynamic programming solutions, finished with a timed mock. Next: AI engineering.", "4": "30 days ago I couldn't write code from a blank file. Today I finished my plan with a deployed AI project: an LLM feature with retrieval and an agent, served with FastAPI in Docker. On to real interviews."};

  else if(behind>0){cls="behind";msg=`<b>${behind} day${behind>1?"s":""} behind your plan.</b> That happens to almost everyone, and it's fine. Keep going at your pace, or re-plan: your finish date moves to <b>${fmtDate(shift(replanStart(),S.pace-1))}</b>, and nothing is lost.`;btn=`<button class="btn small" data-act="replan">Re-plan from here</button>`;}

function sessionParts(n){const d=DAYS[n-1],labs=labsOf(n),ho=[n+"-b",...d.solve.map((_,i)=>n+"-s"+i)];
  const warm=n===currentDay()?warmIds().length+Math.min(2,dueLabs().length):0,parts=[],warmDone=S.warmDay===todayISO();
  if(warm||warmDone)parts.push({k:"warm",name:"Warm-up",time:"10–20 min",done:warmDone,sub:warmDone?"done today":`${warm} to review today (the rest wait for tomorrow)`});
  parts.push({k:"concept",name:"Concept",time:"10 min",done:!!S.tasks[n+"-c"]});
  parts.push({k:"drills",name:"Drills",time:"10 min",done:drillsDone(n),sub:`${drillCount(n)}/${d.drills.length}`});
  if(labs.length)parts.push({k:"labs",name:"Code labs",time:"60–90 min",done:labsDone(n),sub:`${labCount(n)}/${labs.length}`});
  parts.push({k:"hands",name:"Hands-on",time:"2–3 hrs",done:ho.every(k=>S.tasks[k]),sub:`${ho.filter(k=>S.tasks[k]).length}/${ho.length}`});
  parts.push({k:"gate",name:"Done-when check",time:"15 min",done:!!S.tasks[n+"-g"]});
  return parts;}
function sessionCard(n){
  const parts=sessionParts(n),dn=parts.filter(p=>p.done).length,next=parts.find(p=>!p.done),pct=isDone(n)?100:Math.round(dn/parts.length*100);

  return `<section class="card session"><div class="row" style="justify-content:space-between"><span class="eyebrow">Today's session${S.me&&S.me.time?` · ${esc(S.me.time)}`:""}</span><span class="pmeta">${pct}%</span></div>

    <ol class="parts">${parts.map(p=>`<li class="${p.done||isDone(n)?"done":p===next?"next":""}"><span class="pk" aria-hidden="true">${p.done||isDone(n)?"✓":""}</span><span class="pn">${p.name}${p.sub?` <span class="muted">${p.sub}</span>`:""}</span><span class="pt">${p.time}</span></li>`).join("")}</ol>
    ${isDone(n)?`<p class="muted">Day ${n} is complete.</p>`:`<button class="btn primary block big-cta" data-act="next" data-day="${n}" data-part="${next?next.k:"complete"}">${label} →</button>`}

}
function goPart(n,part){
  if(part==="warm"){const ids=warmIds();if(ids.length)startSession(ids.map(findDrill).filter(Boolean),"Warm-up");else{const L=dueLabs()[0];if(L)openLab(L.id,true);}return;}
  if(part==="drills"){startSession(DAYS[n-1].drills,"Day "+n);return;}
  if(part==="labs"){const L=labsOf(n).find(L=>!S.labs[L.id]);if(L)openLab(L.id,false);return;}

}

const HELPED=new Set();function markHelped(){lab.helped=true;if(!lab.redo)HELPED.add(lab.L.id);}
function startSession(drills,label){if(!drills.length)return;
  sess={label,queue:drills.map(d=>({d,tries:0})),i:0,first:0,total:drills.length,picked:null,answered:false,gained:0};

function renderDrill(){
  const s=sess;

    if(/Warm-up/.test(s.label)&&S.warmDay!==todayISO()){S.warmDay=todayISO();save();}

      <button class="btn primary" data-s="close" style="min-width:200px">Continue</button></div>`;
    sheetIn.querySelector(".btn.primary").focus();return;}
  const it=s.queue[s.i],d=it.d,pct=Math.round(s.i/s.queue.length*100);s.picked=null;s.answered=false;

        :`<textarea class="code" id="ans" aria-label="Your answer" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type your answer…"></textarea><p class="hint">${runnable(d)?"Your answer is run on real data and compared with a model answer, so any correct way of writing it passes.":"Spacing doesn't matter."} Press Ctrl+Enter or tap Check.</p>`}
    </div>

    setTimeout(()=>ta.focus(),30);}
  if(runnable(d))(d.sql?getSql():getPy().then(P=>d.pkgs?P.need():0)).catch(()=>{});
}
async function check(){
  const s=sess,it=s.queue[s.i],d=it.d;if(s.answered||s.checking)return;
  let ok,run=null,typed="";
  if(d.k==="mcq"){if(s.picked===null)return;ok=s.picked===d.a;
    sheetIn.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=+b.dataset.o;if(i===d.a)b.classList.add("right");else if(i===s.picked)b.classList.add("wrong");});}
  else{const ta=document.getElementById("ans");typed=ta.value;ta.readOnly=true;
    if(runnable(d)){s.checking=true;document.getElementById("foot").innerHTML=`<p class="hint" role="status">Running your answer${d.pkgs&&!pyReady?" (loading Python and pandas the first time, about 20 MB)":d.pkgs?" (pandas loads the first time, about 8 MB)":""}…</p>`;
      try{run=await gradeRun(d,typed);ok=run.ok;}catch(e){run=null;ok=isCorrect(d,typed);}
      s.checking=false;if(sess!==s||s.queue[s.i]!==it)return;}
    else ok=isCorrect(d,typed);}
  s.answered=true;
  if(!it.tries)srsHit(d.id,ok);
  if(ok){if(!it.tries)s.first++;const g=it.tries?5:10;s.gained+=g;S.xp+=g;S.solved={...S.solved,[d.id]:1};S.missed=S.missed.filter(x=>x!==d.id);}

  return `<p class="hint">${r?`<b>${esc(m[1])}</b> usually means: ${esc(r[1].toLowerCase())}. Check first: ${esc(r[2].toLowerCase())}.`:""}${ln?` The problem is on <b>line ${esc(ln.split("line ")[1])}</b> of your code.`:""}</p>`;}
function tableHTML(res){if(!res.columns.length)return `<p class="muted">(no rows)</p>`;
  return `<div class="tablebox"><table class="mini"><thead><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${res.values.slice(0,30).map(r=>`<tr>${r.map(x=>`<td>${x===null?'<span class="muted">NULL</span>':esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
const NUDGES=["Tap Watch it run and step through your code. Find the first line where a value isn't what you expected.","Stuck is where the learning happens. Shrink the example and trace it by hand, step by step.","Every engineer fails tests all day. The skill is reading exactly what the failure tells you.","Print the variables on the line just before it breaks, then compare them with what you expected.","Re-read your step comments. Is a step missing, or in the wrong order?"];
function nudge(){if(lab.fails<2||lab.passed)return "";const m=NUDGES[(lab.fails-2)%NUDGES.length],w=S.me&&S.me.why;
  return `<div class="nudge"><p>${esc(m)}${lab.fails>=3&&!lab.showHint&&!lab.redo?" The hint is there for exactly this moment.":""}</p>${w?`<p class="muted">Your why: “${esc(w)}”</p>`:""}</div>`;}
function resultsHTML(){const h=resultsCore();return lab.result&&!lab.result.loadFail&&!lab.running?h+nudge():h;}
function resultsCore(){const r=lab.result;
  if(lab.running)return `<p class="muted">${lab.loadingMsg||"Running…"}</p>`;
  if(!r)return "";
  if(r.loadFail){const tests=lab.L.kind==="py"?`<pre>${esc(lab.L.tests.map(t=>t.expr?`assert ${t.expr} == ${t.want}`:`# input: ${t.stdin.join(", ")}  ->  prints:\n# ${t.out.replace(/\n/g,"\n# ")}`).join("\n"))}</pre>`:"";
    return `<div class="fb bad"><b class="t">The code runner couldn't start here</b><p>${esc(r.msg)}${CSPV.length?" (blocked: "+esc(CSPV.slice(0,3).join("; "))+")":""}. Your code is saved. Try again, or open <code>index.html</code> from your Coding Handson folder in Chrome. You can also run it in VS Code${lab.L.kind==="py"?" with these checks at the bottom of your file":""}:</p>${tests}
      <div class="row"><button class="btn small" data-l="run">Try again</button><button class="btn small" data-l="self">I ran it myself and every check passes</button></div></div>`;}
  if(r.kind==="sql"){
    if(r.error)return `<div class="fb bad"><b class="t">SQL error</b><pre>${esc(r.error)}</pre><p class="hint">SQLite names the problem directly. Compare spellings with the tables above.</p></div>`;
    if(r.ok)return passHTML();
    if(r.hidden)return `<div class="fb bad"><b class="t">Right on these tables, wrong on a second set</b><p>Your result matches here, but the query is also run on a hidden set of rows with the same columns, and there it gives a different answer from the correct query. That usually means one of three things: <b>ties</b> (two rows share the top value), <b>NULLs</b>, or a value <b>exactly on the boundary</b> (<code>&gt;</code> vs <code>&gt;=</code>). Re-read the task word by word and check each condition.</p></div>`;
    return `<div class="fb bad"><b class="t">Not quite</b><p>${!r.got.values.length?`Your query returned no rows; the answer has ${r.want.values.length}.`:`${!r.colsOK?`Your query returns ${r.got.columns.length} column${r.got.columns.length===1?"":"s"}; the answer has ${r.want.columns.length}. `:""}${r.got.values.length!==r.want.values.length?`You got ${r.got.values.length} row${r.got.values.length===1?"":"s"}; the answer has ${r.want.values.length}.`:lab.L.ordered?"Check the values and the order.":"Same number of rows, but some values differ."}`}</p>${/(=|<>|!=)\s*NULL\b/i.test(r.code||"")?`<p class="hint"><b>Tip:</b> comparing with <code>= NULL</code> never matches anything in SQL, because NULL means "unknown". Use <code>IS NULL</code> or <code>IS NOT NULL</code>.</p>`:""}
      <p class="eyebrow">Your result</p>${tableHTML(r.got)}<p class="eyebrow">Expected</p>${tableHTML(r.want)}</div>`;}
  const tests=r.tests,passN=tests.filter(t=>t.ok).length,errs=tests.map(t=>t.error).filter(Boolean);
  if(passN===tests.length)return passHTML();
  const same=errs.length===tests.length&&errs.every(e=>e===errs[0]);
  return `<div class="fb bad"><b class="t">${passN} of ${tests.length} tests passed</b>
    ${same?`<pre class="tb">${esc(errs[0])}</pre>${errTip(errs[0])}`:""}
    <ul class="tests">${tests.map(t=>`<li class="${t.ok?"pass":"fail"}"><span class="mark">${t.ok?"✓":"✗"}</span><div><b>${esc(t.label)}</b>
      ${!t.ok&&!t.error?`<div class="cmp"><span class="muted">Expected</span><pre>${esc(t.want)}</pre><span class="muted">Got</span><pre>${esc(t.got)}</pre></div>`:""}
      ${t.error&&!same?`<pre class="tb">${esc(t.error)}</pre>${errTip(t.error)}`:""}
      ${t.printed&&!t.ok?`<span class="muted">Your print() output</span><pre>${esc(t.printed)}</pre>`:""}</div></li>`).join("")}</ul>
    <button class="btn small" data-l="trace">▶ Watch it run on the failing test</button></div>`;}

function replyHTML(L){if(lab.replyShown)return `<div class="replybox"><span class="eyebrow">Your reply</span><p>${esc(lab.replyTxt)}</p><span class="eyebrow">A model reply</span><p>${esc(L.reply)}</p><p class="hint">A good reply says what was wrong in plain words, what you changed, and asks one question back. That's most of the job.</p></div>`;

    ${lab.mixed?`<p><b>${s<=lab.target*60?"Inside the target time.":"Over the target time, and that's fine: speed comes with reps."}</b> This was <b>${esc(L.title)}</b> (Day ${L.day}).</p>${lab.appr?`<p class="muted">Your approach: “${esc(lab.appr)}”</p>`:""}`:""}

    <p class="muted">${lab.helped?"You used help, so this lab comes back sooner for a redo from scratch.":lab.redo?"Recall strengthened. The next redo of this lab is scheduled further out.":"This lab comes back as a redo from scratch in 2 days, then 5, 12 and 30."}</p>

async function runLab(){
  if(lab.running)return;const L=lab.L,ed=document.getElementById("code");const code=(ed?ed.value:"").replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'");flushDraft();
  if(needsSteps()&&countSteps(code,L)<3){lab.result=null;document.getElementById("res").innerHTML=`<div class="fb bad"><b class="t">Steps first</b><p>Write at least 3 steps as comments (each a few words, like <code># loop over the prices</code>) before running. This is the habit that gets you unstuck in interviews.</p></div>`;return;}
  lab.running=true;lab.loadingMsg=(L.kind==="py"?pyReady:sqlReady)?"Running…":L.kind==="py"?"Starting Python in your browser. The first time downloads about 10 MB, so give it a moment…":"Starting SQLite…";renderLab();
  await new Promise(r=>setTimeout(r,30));
  let ok=false;
  try{
    if(L.kind==="py"){const P=await getPy();let out;if(L.pkgs)await P.need();
      try{out=JSON.parse(await P.call("_run",JSON.stringify({code,prelude:L.prelude||"",tests:L.tests,files:L.files||{},limit:L.limit||3000000,fuzz:L.fuzz||null,ref:L.fuzz?L.solution:""})));}
      catch(e){if(String(e&&e.message)!=="PYKILL")throw e;out=[{label:"your code",ok:false,error:KILLMSG}];}
      lab.result={kind:"py",tests:out};ok=out.every(t=>t.ok);}
    else{const SQL=await getSql();lab.result=runSqlLab(SQL,code,L);lab.result.code=code;ok=lab.result.ok;}
  }catch(e){lab.result={loadFail:true,msg:String(e&&e.message||e)};}
  lab.running=false;
  if(!lab.result.loadFail){lab.runs++;if(ok)onPass();else{lab.fails++;logErrors(lab.result);save();}}
  renderLab();
  const res=document.getElementById("res");if(res&&res.scrollIntoView)res.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function onPass(){if(lab.passed)return;lab.passed=true;const L=lab.L;if(lab.redo&&!lab.mixed&&!warmIds().length&&!dueLabs().filter(x=>x.id!==L.id).slice(0,2).length){S.warmDay=todayISO();}lab.before=areaStatus(areaOf(L)).score;
  if(!S.labs[L.id])S.lstat={...S.lstat,[L.id]:{fails:lab.fails,helped:!!lab.helped}};
  labPassed(L,lab.redo&&!lab.helped);
  if(lab.mixed)S.mocks=[...S.mocks,{id:L.id,secs:Math.round((Date.now()-lab.t0)/1000),target:lab.target*60,helped:!!lab.helped,d:todayISO()}].slice(-200);
  markPractice();save();topStats();}

const cells=(vals,o={})=>`<div class="vz-arr">${vals.map((v,i)=>`<div class="vz-cell ${(o.cls&&o.cls[i])||""}"><span class="vz-v">${esc(v)}</span><span class="vz-i">${o.idx===false?"":i}</span>${o.ptr&&o.ptr[i]?`<span class="vz-p">${o.ptr[i]}</span>`:""}</div>`).join("")}</div>`;
const kv=(title,obj)=>`<div class="vz-box"><span class="eyebrow">${title}</span><div class="vz-kv">${Object.keys(obj).length?Object.entries(obj).map(([k,v])=>`<span class="vz-pair"><b>${esc(k)}</b> → ${esc(v)}</span>`).join(""):'<span class="muted">empty</span>'}</div></div>`;
const VIZ={
 hashmap:{title:"Hash map: have I seen it?",day:4,blurb:"Two Sum in one pass. For each number, ask the dict whether its partner was already seen. Each lookup is instant, so it's O(n).",
  build(){const nums=[2,7,11,15],t=9,seen={},F=[];F.push({nums,i:-1,seen:{},say:`Find two numbers that add up to <b>${t}</b>. Start with an empty dict.`});
   for(let i=0;i<nums.length;i++){const x=nums[i],need=t-x;
     if(need in seen){F.push({nums,i,seen:{...seen},hit:seen[need],say:`x = <b>${x}</b>. Need ${t} − ${x} = <b>${need}</b>. Is ${need} in the dict? <b>Yes</b>, at index ${seen[need]}. Return <b>[${seen[need]}, ${i}]</b>.`});break;}
     F.push({nums,i,seen:{...seen},say:`x = <b>${x}</b>. Need ${t} − ${x} = <b>${need}</b>. Is ${need} in the dict? No.`});
     seen[x]=i;F.push({nums,i,seen:{...seen},say:`Remember it: store <b>${x} → ${i}</b> and move on.`});}
   return F;},
  render(f){return cells(f.nums,{cls:f.nums.map((_,k)=>k===f.i?"cur":k===f.hit?"hit":k<f.i?"done":""),ptr:{[f.i]:"x"}})+kv("seen (value → index)",f.seen);}},
 twoptr:{title:"Two pointers",day:16,blurb:"In a sorted array, put one pointer at each end. Sum too small: move left up. Too big: move right down.",
  build(){const a=[1,3,4,6,8,11],t=10,F=[];let l=0,r=a.length-1;
   while(l<r){const s=a[l]+a[r];
     if(s===t){F.push({a,l,r,done:true,say:`${a[l]} + ${a[r]} = <b>${s}</b>. That's the target. Done in one pass.`});break;}
     F.push({a,l,r,say:`${a[l]} + ${a[r]} = <b>${s}</b>. ${s<t?`Too small, so move <b>left</b> up.`:`Too big, so move <b>right</b> down.`}`});
     if(s<t)l++;else r--;}
   F.unshift({a,l:0,r:a.length-1,say:`Target <b>${t}</b>. The array is sorted, so start at both ends.`});return F;},
  render(f){return cells(f.a,{cls:f.a.map((_,k)=>(k===f.l||k===f.r)?(f.done?"hit":"cur"):(k<f.l||k>f.r)?"out":""),ptr:{[f.l]:"left",[f.r]:f.l===f.r?"left/right":"right"}});}},
 window:{title:"Sliding window",day:16,blurb:"Longest substring without repeats. The window grows on the right; on a repeat, the left edge jumps past the earlier copy.",
  build(){const s="abcabcbb".split(""),F=[];const seen={};let left=0,best=0;
   F.push({s,left:0,right:-1,best:0,say:`Find the longest run of letters with no repeats in "<b>abcabcbb</b>".`});
   for(let right=0;right<s.length;right++){const ch=s[right];let say;
     if(ch in seen&&seen[ch]>=left){say=`"${ch}" is already in the window (index ${seen[ch]}). Move left to <b>${seen[ch]+1}</b>.`;left=seen[ch]+1;}
     else say=`"${ch}" is new. Grow the window.`;
     seen[ch]=right;best=Math.max(best,right-left+1);F.push({s,left,right,best,say:`${say} Window length ${right-left+1}, best <b>${best}</b>.`});}
   return F;},
  render(f){return cells(f.s,{cls:f.s.map((_,k)=>k>=f.left&&k<=f.right?(k===f.right?"cur":"win"):k<f.left?"out":""),ptr:{[f.left]:f.right>=0?"left":"",[Math.max(f.right,0)]:f.right>=0?(f.left===f.right?"left/right":"right"):""}})+`<p class="vz-stat">best so far: <b>${f.best}</b></p>`;}},
 bsearch:{title:"Binary search",day:17,blurb:"Halve the range every step. 8 items take at most 4 looks; a million take about 20.",
  build(){const a=[1,3,5,7,9,11,13,15],t=11,F=[];let lo=0,hi=a.length-1;F.push({a,lo,hi,mid:-1,say:`Find <b>${t}</b> in a sorted list.`});
   while(lo<=hi){const mid=Math.floor((lo+hi)/2);
     if(a[mid]===t){F.push({a,lo,hi,mid,found:true,say:`mid = (${lo} + ${hi}) // 2 = ${mid}. a[${mid}] = ${a[mid]}. <b>Found it.</b>`});break;}
     F.push({a,lo,hi,mid,say:`mid = (${lo} + ${hi}) // 2 = ${mid}. a[${mid}] = ${a[mid]} is ${a[mid]<t?"too small, so drop the left half":"too big, so drop the right half"}.`});
     if(a[mid]<t)lo=mid+1;else hi=mid-1;}
   return F;},
  render(f){const p={};p[f.lo]="lo";p[f.hi]=(p[f.hi]?p[f.hi]+"/":"")+"hi";if(f.mid>=0)p[f.mid]=(p[f.mid]?p[f.mid]+"/":"")+"mid";
   return cells(f.a,{cls:f.a.map((_,k)=>k===f.mid?(f.found?"hit":"cur"):(k<f.lo||k>f.hi)?"out":"win"),ptr:p});}},
 stack:{title:"Stack: matching brackets",day:17,blurb:"Openers go on the stack. A closer must match the top. The stack must be empty at the end.",
  build(){const s="([]{})".split(""),F=[],st=[],pair={")":"(","]":"[","}":"{"};F.push({s,i:-1,st:[],say:"Check whether <b>([]{})</b> is valid."});
   s.forEach((ch,i)=>{if(pair[ch]){const top=st.pop();F.push({s,i,st:[...st],say:`"${ch}" is a closer. Pop the top: "${top}". ${top===pair[ch]?"They match.":"They don't match: invalid."}`});}
     else{st.push(ch);F.push({s,i,st:[...st],say:`"${ch}" is an opener. Push it.`});}});
   F.push({s,i:s.length,st:[],say:"The stack is empty at the end, so the string is <b>valid</b>."});return F;},
  render(f){return `<div class="vz-row">${cells(f.s,{cls:f.s.map((_,k)=>k===f.i?"cur":k<f.i?"done":""),idx:false})}<div class="vz-stack"><span class="eyebrow">stack</span>${f.st.length?f.st.slice().reverse().map((c,k)=>`<div class="vz-sc ${k===0?"top":""}">${esc(c)}</div>`).join(""):'<div class="muted">empty</div>'}</div></div>`;}},
 recursion:{title:"Recursion tree",day:20,blurb:"climb(4) calls climb(3) and climb(2), and so on down to the base cases. Notice climb(2) is worked out twice: that waste is why dynamic programming remembers answers.",
  build(){const nodes=[],F=[];let leaf=0;
   const mk=(n,depth)=>{const node={n,depth,kids:[],id:nodes.length};nodes.push(node);if(n>1){node.kids=[mk(n-1,depth+1),mk(n-2,depth+1)];node.x=(node.kids[0].x+node.kids[1].x)/2;}else node.x=leaf++;return node;};
   const root=mk(4,0);const state={};
   const walk=node=>{state[node.id]="call";F.push({state:{...state},say:`Call <b>climb(${node.n})</b>${node.n<=1?". Base case: return 1.":`. It needs climb(${node.n-1}) + climb(${node.n-2}).`}`});
     let v=1;if(node.kids.length){v=walk(node.kids[0])+walk(node.kids[1]);}
     state[node.id]="done:"+v;const dup=node.n===2&&nodes.filter(m=>m.n===2&&String(state[m.id]||"").startsWith("done")).length>1;
     F.push({state:{...state},say:`climb(${node.n}) returns <b>${v}</b>.${dup?" That's the <b>second</b> time climb(2) was worked out.":""}`});return v;};
   walk(root);F.push({state:{...state},say:"climb(4) = <b>5</b> ways. Remembering each answer (memoization) makes every call happen once: that's dynamic programming."});
   this.nodes=nodes;this.leaves=leaf;return F;},
  render(f){const N=this.nodes,W=Math.max(this.leaves-1,1),dx=280/W,X=n=>20+n.x*dx,Y=n=>24+n.depth*58;
   const lines=N.flatMap(n=>n.kids.map(k=>`<line x1="${X(n)}" y1="${Y(n)}" x2="${X(k)}" y2="${Y(k)}"/>`)).join("");
   const dots=N.map(n=>{const s=f.state[n.id]||"",done=s.startsWith("done");return `<g class="vz-node ${done?"done":s?"call":""}"><circle cx="${X(n)}" cy="${Y(n)}" r="17"/><text x="${X(n)}" y="${Y(n)+4}">c(${n.n})</text>${done?`<text class="vz-ret" x="${X(n)}" y="${Y(n)+32}">=${s.split(":")[1]}</text>`:""}</g>`;}).join("");
   return `<svg class="vz-tree" viewBox="0 0 320 ${Y({depth:4})+40}" role="img" aria-label="Recursion tree for climb(4)">${lines}${dots}</svg>`;}},
 bfs:{title:"BFS on a grid",day:19,blurb:"Number of Islands. Scan every cell. On land, count an island and flood its connected land with a queue so it isn't counted again.",
  build(){const g=["11000","11000","00100","00011"].map(r=>r.split("")),R=g.length,C=g[0].length,F=[],mark=g.map(r=>r.map(()=>0));let count=0;
   const snap=(q,cur,say)=>F.push({g:g.map(r=>r.slice()),mark:mark.map(r=>r.slice()),q:q.map(p=>`(${p})`),cur,count,say});
   snap([],null,"1 is land, 0 is water. Scan the grid row by row.");
   for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(g[r][c]==="1"&&!mark[r][c]){count++;mark[r][c]=count;const q=[[r,c]];snap(q,[r,c],`New land at (${r},${c}): island <b>#${count}</b>. Put it in the queue.`);
     while(q.length){const [i,j]=q.shift();const add=[];for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=i+di,b=j+dj;if(a>=0&&a<R&&b>=0&&b<C&&g[a][b]==="1"&&!mark[a][b]){mark[a][b]=count;q.push([a,b]);add.push(`(${a},${b})`);}}
       snap(q,[i,j],`Visit (${i},${j}). ${add.length?`Neighbouring land ${add.join(" ")} joins the queue.`:"No new land next to it."}`);}}
   snap([],null,`Scan finished: <b>${count} islands</b>. Each land cell was visited once.`);return F;},
  render(f){return `<div class="vz-row"><div class="vz-grid" style="grid-template-columns:repeat(${f.g[0].length},34px)">${f.g.flatMap((row,r)=>row.map((v,c)=>`<div class="vz-g ${v==="1"?"land":"water"} ${f.mark[r][c]?"isl"+((f.mark[r][c]-1)%3):""} ${f.cur&&f.cur[0]===r&&f.cur[1]===c?"cur":""}">${v}</div>`)).join("")}</div>
   <div class="vz-box"><span class="eyebrow">queue</span><div class="vz-kv">${f.q.length?f.q.map(x=>`<span class="vz-pair">${x}</span>`).join(""):'<span class="muted">empty</span>'}</div><p class="vz-stat">islands: <b>${f.count}</b></p></div></div>`;}},
 join:{title:"SQL LEFT JOIN, then IS NULL",day:10,blurb:"LEFT JOIN keeps every customer. Customers with no orders get NULLs, and WHERE o.id IS NULL keeps exactly those.",
  build(){const C=[[1,"Acme"],[2,"Bolt"],[3,"Cora"],[4,"Dune"],[5,"Echo"]],O=[[1,1,120],[2,1,80],[3,2,40],[4,3,300],[5,1,55.5],[6,3,20],[7,5,75]],F=[],res=[];
   F.push({C,O,ci:-1,om:[],res:[],say:"customers LEFT JOIN orders ON o.customer_id = c.id. Go through customers one at a time."});
   C.forEach(([id,name],ci)=>{const m=O.filter(o=>o[1]===id),before=res.length;
     if(m.length)m.forEach(o=>res.push([name,o[0]]));else res.push([name,null]);
     F.push({C,O,ci,om:m.map(o=>o[0]),res:res.slice(),added:res.length-before,say:m.length?`<b>${name}</b> matches ${m.length} order${m.length>1?"s":""}: one result row each.`:`<b>${name}</b> matches no orders. LEFT JOIN still keeps it, with <b>NULL</b> for the order.`});});
   F.push({C,O,ci:-1,om:[],res:res.slice(),filter:true,say:"Now WHERE o.id IS NULL keeps only the rows with no order: <b>Dune</b>, the customer who never ordered."});return F;},

/* ---------- "Watch it run": step through your own code ---------- */
let pyTrace=null;
async function startTrace(testIdx){
  const L=lab.L,ed=document.getElementById("code");const code=(ed?ed.value:"").replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'");flushDraft();
  if(testIdx==null){const r=lab.result;const f=r&&r.tests?r.tests.findIndex(t=>!t.ok):-1;testIdx=f>=0?f:0;}
  lab.trace={loading:true,testIdx,code,i:0,quiz:lab.trace?lab.trace.quiz:false,answered:{},ask:null,fb:""};renderStepper();
  try{const P=await getPy();if(L.pkgs)await P.need();
    const res=JSON.parse(await P.call("_trace",JSON.stringify({code,prelude:L.prelude||"",test:L.tests[testIdx],files:L.files||{},max:300}),15000));
    Object.assign(lab.trace,{loading:false,res,cps:checkpoints(res.steps)});
  }catch(e){Object.assign(lab.trace,{loading:false,res:{steps:[],error:String(e&&e.message)==="PYKILL"?KILLMSG:"The runner couldn't start: "+(e&&e.message||e)}});}
  renderStepper();const el=document.getElementById("spBox");if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest",behavior:"smooth"});
}
/* Steps where a short variable changes: good moments to ask "what is it now?" */
function checkpoints(steps){const c=[];
  for(let k=1;k<steps.length;k++){const a=steps[k-1],b=steps[k];if(a.fn!==b.fn||b.ev!=="line")continue;
    const ch=Object.keys(b.vars).filter(n=>a.vars[n]!==b.vars[n]&&String(b.vars[n]).length<=24);if(ch.length)c.push({k,name:ch[ch.length-1]});}
  if(c.length<=5)return c;const out=[];for(let j=0;j<5;j++)out.push(c[Math.round(j*(c.length-1)/4)]);return out;}
const unq=s=>pnorm(s).replace(/^'(.*)'$/,"$1");
function spGo(i){const T=lab.trace;if(!T||!T.res)return;const n=T.res.steps.length;i=Math.max(0,Math.min(n-1,i));
  if(T.quiz&&i===T.i+1){const cp=T.cps.find(c=>c.k===i);if(cp&&!(i in T.answered)){T.ask=cp;T.fb="";renderStepper();setTimeout(()=>{const a=document.getElementById("spAns");if(a)a.focus();},30);return;}}
  T.i=i;T.ask=null;renderStepper();}
function spCheck(skip){const T=lab.trace,cp=T.ask;if(!cp)return;const want=T.res.steps[cp.k].vars[cp.name];
  const el=document.getElementById("spAns"),ok=!skip&&el&&el.value.trim()&&unq(el.value)===unq(want);
  T.answered[cp.k]=ok;T.fb=skip?`It's <code>${esc(want)}</code>.`:ok?`<b>Right.</b> <code>${esc(cp.name)}</code> is <code>${esc(want)}</code>.`:`<b>Not quite.</b> It's <code>${esc(want)}</code>. Look at line ${T.res.steps[cp.k-1].line} again: what did it change?`;
  T.i=cp.k;T.ask=null;renderStepper();}
function renderStepper(){const el=document.getElementById("spBox");if(el)el.innerHTML=stepperHTML();}
function stepperHTML(){
  const T=lab&&lab.trace;if(!T)return "";
  const head=`<div class="sp-head"><span class="eyebrow">Watch it run</span>
    <select id="spTest" aria-label="Which test to watch">${lab.L.tests.map((t,k)=>`<option value="${k}" ${k===T.testIdx?"selected":""}>Test: ${esc(t.label)}</option>`).join("")}</select>
    <button class="btn small" data-l="sp-rerun" title="Record again with the code that's in the editor now">Re-record</button><button class="btn small" data-l="sp-close">Close</button></div>`;
  if(T.loading)return `<div class="stepper">${head}<p class="muted">${pyReady?"Recording your code…":"Starting Python in your browser. The first time downloads about 10 MB…"}</p></div>`;
  const r=T.res,steps=r.steps||[];
  if(!steps.length)return `<div class="stepper">${head}${r.error?`<pre class="tb">${esc(r.error)}</pre>${errTip(r.error)}`:""}<p class="muted">${r.error?"Your code stopped before running a single line of it. Fix the error above first.":"Nothing to show: no lines of your code ran for this test. Is the function name right?"}</p></div>`;
  const s=steps[T.i],prev=T.i?steps[T.i-1]:null,last=T.i===steps.length-1,lines=T.code.split("\n");
  const hide=T.ask!==null;

  const note=s.ev==="return"?`<b>${esc(s.fn)}()</b> finishes and returns <code>${esc(s.ret)}</code>`:`About to run <b>line ${s.line}</b>${s.fn!=="<module>"?` inside <b>${esc(s.fn)}()</b>`:""}`;
  const score=Object.values(T.answered);
  return `<div class="stepper">${head}
    <pre class="sp-code" aria-label="Your code with the current line highlighted">${lines.map((l,k)=>`<span class="${k+1===s.line?(s.ev==="return"?"ret":"cur"):""}${prev&&k+1===prev.line&&k+1!==s.line?" was":""}"><i>${k+1}</i>${esc(l)||" "}</span>`).join("")}</pre>
    <p class="sp-note" aria-live="polite">Step ${T.i+1} of ${steps.length} · ${note}</p>
    ${hide?`<div class="sp-ask"><p><b>Predict it.</b> Line ${steps[T.ask.k-1].line} just ran. What is <code>${esc(T.ask.name)}</code> now?</p>
        <div class="row"><input class="code" id="spAns" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="Type the value" style="flex:1 1 160px"><button class="btn primary small" data-l="sp-check">Check</button><button class="btn small" data-l="sp-skip">Show me</button></div></div>`
      :`${T.fb?`<p class="sp-fb">${T.fb}</p>`:""}
    <div class="sp-vars">${vars.length?`<table class="mini"><thead><tr><th>Variable</th><th>Value now</th></tr></thead><tbody>${vars.map(([k,v])=>`<tr class="${prev&&prev.fn===s.fn&&prev.vars[k]!==v?"chg":""}"><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">No variables yet.</p>`}</div>`}
    ${s.out?`<div><span class="eyebrow">Printed so far</span><pre class="sp-out">${esc(s.out)}</pre></div>`:""}

      <input type="range" id="spRange" min="0" max="${steps.length-1}" value="${T.i}" aria-label="Step" ${hide?"disabled":""}>
      <button class="btn primary small" data-l="sp-next" aria-label="Next step" ${last||hide?"disabled":""}>Next ▶</button><button class="btn small" data-l="sp-last" aria-label="Last step" ${hide?"disabled":""}>⏭</button></div>
    <label class="selfcheck"><input type="checkbox" id="spQuiz" ${T.quiz?"checked":""}> Quiz me: predict values before they appear${T.quiz&&score.length?` <span class="muted">(${score.filter(Boolean).length}/${score.length} right)</span>`:""}</label>
    ${last?`<div class="sp-end">${r.error?`<pre class="tb">${esc(r.error)}</pre>${errTip(r.error)}`:r.truncated?`<p><b>Stopped after ${steps.length} steps.</b> Scroll back: if the same lines repeat with the same values, that's a loop whose condition never changes.</p>`:"result" in r?`<p>Final result: <code>${esc(r.result)}</code>${lab.L.tests[T.testIdx].want?` · expected <code>${esc(lab.L.tests[T.testIdx].want)}</code>`:""}</p>`:"<p>The program finished.</p>"}</div>`:""}
    <p class="hint">Arrow keys step too. Changed values are highlighted.</p></div>`;
}
function spAct(a,btn){const T=lab.trace;
  if(a==="trace"){startTrace(null);return true;}
  if(!T)return false;
  if(a==="sp-close"){lab.trace=null;renderStepper();return true;}
  if(a==="sp-rerun"){startTrace(T.testIdx);return true;}
  if(T.loading||!T.res)return true;
  if(a==="sp-next"){spGo(T.i+1);return true;}
  if(a==="sp-prev"){T.fb="";spGo(T.i-1);return true;}
  if(a==="sp-first"){T.fb="";T.ask=null;T.i=0;renderStepper();return true;}
  if(a==="sp-last"){T.fb="";T.ask=null;T.i=T.res.steps.length-1;renderStepper();return true;}
  if(a==="sp-check"){spCheck(false);return true;}
  if(a==="sp-skip"){spCheck(true);return true;}
  return false;}
sheetIn.addEventListener("input",ev=>{if(!lab||!lab.trace)return;

/* ---------- Interview readiness: evidence per skill area ---------- */
const AREAS=[

 {id:"hash",name:"Arrays, hashing and prefix sums",days:[15],extra:["L21-1"]},
 {id:"ptr",name:"Two pointers and sliding window",days:[16]},
 {id:"stack",name:"Stacks and binary search",days:[17],extra:["L21-0"]},
 {id:"list",name:"Linked lists and recursion",days:[18]},
 {id:"graph",name:"Trees and graphs",days:[19]},

function areaOf(L){return AREAS.find(a=>(a.extra||[]).includes(L.id))||AREAS.find(a=>a.days.includes(L.day));}
const areaLabs=a=>ALL_LABS.filter(L=>areaOf(L)===a);
/* 40 for passing, +20 without help, +10 if it took 2 or fewer failed runs, +15 per redo from scratch (up to 2). */
function labScore(L){if(!S.labs[L.id])return 0;const st=S.lstat[L.id]||{legacy:1},b=(S.lsrs[L.id]||{b:0}).b||0;
  let s=40;if(!st.helped){s+=20;if(st.legacy||st.fails<=2)s+=10;}s=Math.min(100,s+Math.min(b,2)*15);
  const due=(S.lsrs[L.id]||{}).d;if(due&&due<shift(todayISO(),-6))s-=15;return Math.max(0,s);}
const avg=xs=>xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):0;
function areaStatus(a){const labs=areaLabs(a),cur=reachedDay(),unl=labs.filter(L=>L.day<=cur);
  if(!unl.length)return {state:"upcoming",from:Math.min(...labs.map(L=>L.day)),score:0};
  const score=avg(unl.map(labScore)),passed=unl.filter(L=>S.labs[L.id]).length,redone=unl.filter(L=>((S.lsrs[L.id]||{}).b||0)>=1).length;
  return {state:score>=80?"ready":score>=55?"solid":passed?"building":"new",score,passed,total:unl.length,redone};}
const STATE_LABEL={ready:"interview-ready",solid:"solid",building:"building",new:"not started"};
const readinessOverall=()=>avg(ALL_LABS.map(labScore));
function weakestArea(){const xs=AREAS.map(a=>[a,areaStatus(a)]).filter(([,s])=>s.state!=="upcoming"&&s.passed);xs.sort((x,y)=>x[1].score-y[1].score);return xs.length?xs[0][0]:null;}
const mixedUnlocked=()=>reachedDay()>3;
function readinessCard(){
  const o=readinessOverall(),weak=weakestArea();
  return `<section class="card ready"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><span class="eyebrow">Interview readiness</span><h2>${o}%</h2></div>
      ${weak&&mixedUnlocked()?`<button class="btn small primary" data-act="mixed" data-area="${weak.id}">Practise weakest: ${esc(weak.name)}</button>`:""}</div>
    <p class="hint">An estimate from your evidence, not a guarantee: labs passed, how much help you needed, and redos from scratch, which count most because they prove you can recall it.</p>
    <ul class="areas">${AREAS.map(a=>{const s=areaStatus(a);return `<li class="${s.state}"><div class="an"><span>${esc(a.name)}</span><span class="pmeta">${s.state==="upcoming"?`from Day ${s.from}`:`${s.score}% · ${STATE_LABEL[s.state]}`}</span></div><div class="sbar sm" aria-hidden="true"><span style="width:${s.score}%"></span></div>${s.state!=="upcoming"&&s.passed?`<span class="hint">${s.passed}/${s.total} labs passed · ${s.redone} redone from scratch</span>`:""}</li>`;}).join("")}</ul>
    ${mixedUnlocked()?`<button class="btn block" data-act="mixed">Interview rep: one unlabelled problem</button>`:`<p class="hint">Interview reps (unlabelled problems against the clock) unlock after Day 3.</p>`}</section>`;

/* ---------- Interview reps: an unlabelled problem, weighted toward weak areas ---------- */
let lastMixed=null;
function pickMixed(areaId){const cur=reachedDay();
  const ok=L=>!L.bug&&L.kind!=="design"&&(!areaId||areaOf(L).id===areaId);
  let pool=ALL_LABS.filter(L=>ok(L)&&L.day<cur);if(!pool.length)pool=ALL_LABS.filter(L=>ok(L)&&L.day<=cur);if(!pool.length)return null;
  const w=pool.map(L=>(105-labScore(L))*(L.id===lastMixed?0.1:1)),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}return pool[pool.length-1];}
function openMixed(areaId){const L=pickMixed(areaId)||pickMixed();if(!L)return;lastMixed=L.id;openLab(L.id,"mixed");}
/* Drop the sentences that name the technique, so recognising it is your job. */
function mixTask(L){return L.task.replace(/<b>Timed:[^<]*<\/b>\s*/,"").replace(/, so a sliding window won't work/,"").replace(/using two pointers and /,"using ").split(/(?<=[.?])\s+(?=[A-Z<])/).filter(s=>!/^(Use a |Aim for |A new pattern|BFS or DFS)/.test(s.replace(/<[^>]+>/g,""))).join(" ");}

/* ---------- Error journal ---------- */
const PRACTICE={"TypeError":"L1-1","TimeoutError":"L2-2","KeyError":"L5-1","AttributeError":"L18-2","Wrong result":"L3-2","SQL error":"L8-1"};
const ERR_EXTRA={"Wrong result":["No crash, but the answer didn't match","Watch it run and find the first value that's off"],"SQL error":["SQLite couldn't run the query","Check names against the tables; read the message word by word"]};
function logErrors(r){if(!r||r.loadFail)return;const add=k=>{S.errs={...S.errs,[k]:(S.errs[k]||0)+1};};
  if(r.kind==="sql"){if(r.error)add("SQL error");else if(!r.ok)add("Wrong result");return;}
  const types=new Set();(r.tests||[]).forEach(t=>{if(t.error){const m=(t.error.trim().split("\n").pop()||"").match(/^(\w+(?:Error|Exception))/);if(m)types.add(m[1]);}else if(!t.ok)types.add("Wrong result");});
  types.forEach(add);}
function journalCard(){const top=Object.entries(S.errs||{}).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<section class="card journal"><span class="eyebrow">Your error journal</span>
    ${top.length?`<p class="muted">Logged automatically from your labs. Your most frequent error is where practice pays off fastest.</p><ul class="jl">${top.map(([k,n])=>{const row=ERR_ROWS.find(r=>r[0]===k)||(ERR_EXTRA[k]?[k,...ERR_EXTRA[k]]:null);const pid=PRACTICE[k];
      return `<li><div><b>${esc(k)}</b> <span class="chip">${n}×</span>${row?`<p class="hint">${esc(row[1])}. Check first: ${esc(row[2].charAt(0).toLowerCase()+row[2].slice(1))}.</p>`:""}</div>${pid?`<button class="btn small" data-act="practice" data-lab="${pid}">Practise</button>`:""}</li>`;}).join("")}</ul>`
      :`<p class="muted">Every error you hit in a lab is logged here automatically, with a practice lab for the common ones. Nothing yet.</p>`}</section>`;}

/* ---------- Stuck ladder: rebuild the solution from scrambled lines ---------- */
function pzStart(){const lines=lab.L.solution.split("\n").filter(l=>l.trim());
  let pool=shuffled(lines.map((_,i)=>i),lab.L.id+"z"+Date.now());if(pool.every((x,i)=>x===i))pool.reverse();
  lab.pz={lines,pool,order:[],tries:0,marks:null,done:false};markHelped();}
function pzHTML(){const P=lab.pz;if(!P)return "";const left=P.pool.filter(i=>!P.order.includes(i));
  return `<div class="pz"><span class="eyebrow">Rebuild from scrambled lines</span><p class="hint">These are the solution's lines, shuffled. Tap them in order; indentation shows which block each line belongs to. This counts as help, so the lab comes back sooner as a redo.</p>
    <ol class="pz-chosen">${P.order.map((i,pos)=>`<li><button class="pzl ${P.marks?(P.marks[pos]?"right":"wrong"):""}" data-l="pz-unpick" data-i="${i}" ${P.done?"disabled":""}>${esc(P.lines[i])}</button></li>`).join("")||'<li class="muted">Your code appears here</li>'}</ol>
    ${left.length?`<div class="pz-pool">${left.map(i=>`<button class="pzl" data-l="pz-pick" data-i="${i}">${esc(P.lines[i])}</button>`).join("")}</div>`:""}
    ${P.msg||""}
    <div class="row">${P.done?"":`<button class="btn small primary" data-l="pz-check" ${left.length?"disabled":""}>Check order</button>`}<button class="btn small" data-l="pz-close">Close</button></div></div>`;}
function renderPz(){const el=document.getElementById("pzBox");if(el)el.innerHTML=pzHTML();}
function pzAct(a,btn){const P=lab.pz;
  if(a==="parsons"){if(!P)pzStart();renderPz();const el=document.getElementById("pzBox");if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest",behavior:"smooth"});return true;}
  if(!P)return false;
  if(a==="pz-close"){lab.pz=null;renderPz();return true;}
  if(a==="pz-pick"){P.order=[...P.order,+btn.dataset.i];P.marks=null;P.msg="";renderPz();return true;}
  if(a==="pz-unpick"){P.order=P.order.filter(i=>i!==+btn.dataset.i);P.marks=null;P.msg="";renderPz();return true;}
  if(a==="pz-check"){P.tries++;P.marks=P.order.map((i,pos)=>P.lines[i]===P.lines[pos]);
    const self=P.marks.every(Boolean);
    if(self||P.tries>=3){if(!self){P.order=P.lines.map((_,i)=>i);P.marks=P.order.map(()=>true);}
      P.done=true;const ed=document.getElementById("code");if(ed){ed.value=P.lines.join("\n")+"\n";ed.dispatchEvent(new Event("input"));}flushDraft();
      P.msg=`<div class="fb ${self?"ok":"bad"}"><p><b>${self?"That's the working order.":"Here's the right order."}</b> It's now in your editor. Read it line by line, tap Watch it run to see it work, then run the tests.</p></div>`;}
    else P.msg=`<div class="fb bad"><p>The red lines are in the wrong place. Tap them to take them back.</p></div>`;
    renderPz();return true;}
  return false;}

function labAct(a,btn){if(!lab)return;const L=lab.L;
  if((a==="trace"||a.startsWith("sp-"))&&spAct(a,btn))return;
  if((a==="parsons"||a.startsWith("pz-"))&&pzAct(a,btn))return;
  if(a==="appr"){const el=document.getElementById("appr"),v=el?el.value.trim():"";if(v.split(/\s+/).filter(Boolean).length<12){const h=document.getElementById("apprHint");if(h){h.textContent="A bit more: at least 12 words. Name the data structure and why it fits.";h.classList.add("warn");}return;}lab.appr=v;nextPhase();return;}
  if(a==="close"){closeSheet();return;}
  if(a==="sym"){const ed=document.getElementById("code");if(!ed)return;const c=btn.dataset.c,i=ed.selectionStart,j=ed.selectionEnd;ed.value=ed.value.slice(0,i)+c+ed.value.slice(j);ed.selectionStart=ed.selectionEnd=i+c.length;ed.focus();ed.dispatchEvent(new Event("input"));return;}
  if(a==="next"){nextPhase();return;}
  if(a==="cpick"){lab.cpick=+btn.dataset.i;renderLab();return;}
  if(a==="qtog"){const i=+btn.dataset.i;lab.qsel=lab.qsel.includes(i)?lab.qsel.filter(x=>x!==i):[...lab.qsel,i];renderLab();return;}
  if(a==="qcheck"){lab.qdone=true;lab.qscore=L.questions.filter(([,g],i)=>g===lab.qsel.includes(i)).length;renderLab();return;}
  if(a==="tpick"){lab.tpick=+btn.dataset.i;if(lab.tpick===L.trade[lab.ti||0].a)lab.tright=(lab.tright||0)+1;renderLab();return;}
  if(a==="tnext"){lab.tpick=null;lab.ti=(lab.ti||0)+1;if(lab.ti>=L.trade.length){if((lab.tright||0)<L.trade.length-1)markHelped();nextPhase();}else renderLab();return;}
  if(a==="dsum"){const el=document.getElementById("dsum"),v=el?el.value.trim():"";lab.dsum=v;if(new Set(v.toLowerCase().split(/\s+/).filter(Boolean)).size<22){const h=document.getElementById("dsumHint");if(h){h.textContent="A bit more: at least 30 words, mostly different ones. Cover the clarifying questions, the boxes, one trade-off and how you'd measure it.";h.classList.add("warn");}return;}
    const miss=(L.keys||[]).filter(([,re])=>!new RegExp(re,"i").test(v)).map(x=>x[0]),need=Math.ceil((L.keys||[]).length*0.6);
    lab.dtries=(lab.dtries||0)+1;
    if(L.keys&&L.keys.length-miss.length<need){if(lab.dtries<3){const h=document.getElementById("dsumHint");if(h){h.textContent="Not there yet. Your summary doesn't cover: "+miss.slice(0,3).join("; ")+". Add them in your own words.";h.classList.add("warn");}return;}markHelped();}
    lab.dmiss=miss;onPass();renderLab();return;}
  if(a==="reply"){const el=document.getElementById("replyTxt"),v=el?el.value.trim():"";if(v.split(/\s+/).filter(Boolean).length<12){const h=document.getElementById("replyHint");if(h){h.textContent="At least 12 words. Write it as if you're sending it.";h.classList.add("warn");}return;}
    lab.replyTxt=v;lab.replyShown=true;const r=document.getElementById("res");if(r)r.innerHTML=resultsHTML();return;}
  if(a==="pcheck"){const P=predictQ(L),el=document.getElementById("pred");if(!el||!el.value.trim())return;
    lab.pval=el.value;const ok=P.num?parseInt(el.value,10)===+P.a:pnorm(el.value)===pnorm(P.a);lab.ptries++;
    const fb=document.getElementById("pfb");
    if(ok||lab.ptries>=2){lab.pdone=true;renderLab();document.getElementById("pfb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b class="t">${ok?"Right. You just solved it by hand.":"Here's the answer"}</b><pre>${esc(P.a)}</pre><p>${ok?"Now notice what you did to get there: those are your steps.":"Trace it once more by hand until you see why. That's the reasoning your code has to repeat."}</p></div>`;}
    else fb.innerHTML=`<div class="fb bad"><b class="t">Not quite</b><p>Go slower: write out each step on paper. One more try.</p></div>`;
    return;}
  if(a==="pick"){lab.order=[...lab.order,+btn.dataset.i];lab.marks=null;lab.pmsg="";renderLab();return;}
  if(a==="unpick"){lab.order=lab.order.filter(i=>i!==+btn.dataset.i);lab.marks=null;lab.pmsg="";renderLab();return;}
  if(a==="ocheck"){lab.ptries++;lab.marks=lab.order.map((i,pos)=>i===pos);const ok=lab.marks.every(Boolean);
    if(ok){lab.pdone=true;lab.pmsg=`<div class="fb ok"><b class="t">${lab.stage==="design"?"That's the request path":"That's a working plan"}</b><p>${lab.stage==="design"?"This is the diagram you'd draw on the whiteboard, box by box.":"It becomes the comments in your editor."}</p></div>`;}
    else if(lab.ptries>=2){lab.pdone=true;if(lab.stage==="design")markHelped();lab.order=L.steps.map((_,i)=>i);lab.marks=lab.order.map(()=>true);lab.pmsg=`<div class="fb bad"><b class="t">Here's a working order</b><p>Read it top to bottom and ask why each step must come before the next one.</p></div>`;}
    else lab.pmsg=`<div class="fb bad"><b class="t">Some steps are out of order</b><p>The red ones are in the wrong place. Tap them to take them back, then try again.</p></div>`;
    renderLab();return;}
  if(a==="pat"){const i=+btn.dataset.i;lab.ppick=i;lab.pdone=true;const ok=lab.popts[i]===L.pat;
    lab.pmsg=`<div class="fb ${ok?"ok":"bad"}"><b class="t">${ok?"Right":"It's "+esc(L.pat)}</b><p>Use this when ${esc(PATWHY[L.pat]||"it fits the problem")}.</p></div>`;renderLab();return;}
  if(a==="run"){runLab();return;}
  if(a==="hint"){flushDraft();lab.showHint=!lab.showHint;if(lab.showHint)markHelped();renderLab();return;}
  if(a==="sol"){flushDraft();lab.showSol=!lab.showSol;if(lab.showSol)markHelped();renderLab();return;}
  if(a==="reset"){if(!lab.resetArm){flushDraft();lab.resetArm=true;renderLab();return;}lab.resetArm=false;delete drafts[draftKey()];saveDraft(draftKey(),initialCode(L,lab.stage));lab.result=null;renderLab();return;}
  if(a==="self"){markHelped();onPass();lab.result=null;renderLab();document.getElementById("res").innerHTML=passHTML();return;}
}
const PATWHY={"read input & print": "you read the lines you're given, convert them, and print results", "loop & build a list": "you go through items one by one and collect results", "while loop": "you repeat until a condition changes and don't know the count in advance", "string methods": "split, join, strip, lower and slicing can do the heavy lifting", "hash map / set": "you need to count things or ask \"have I seen this?\" instantly", "try/except": "some inputs will fail and you must handle them instead of crashing", "running total": "each answer builds on the one before it", "track best so far": "one pass is enough if you remember the best (or lowest) value seen so far", "class with methods": "some data and the actions on it belong together", "file reading": "you open a file with with, read it, and it closes automatically", "two pointers": "the data is sorted and you move one end or the other", "sliding window": "you need a contiguous stretch that grows on the right and shrinks on the left", "stack": "the most recent item must be handled first, as with brackets or the next warmer day", "binary search": "the data is sorted and you need O(log n): halve the range each step", "linked list pointers": "you rewire next pointers carefully, often with a dummy head", "recursion": "the answer for a node comes from the answers for its children", "BFS/DFS": "you explore connected cells or nodes, marking what you've visited", "dynamic programming": "the answer for n is built from answers for smaller n", "sort then scan": "after sorting, the items that interact sit next to each other", "heap": "you repeatedly need the smallest item, or the k largest", "prefix sums": "sums or products of stretches come from running totals", "validation rules": "you check each rule in turn and collect what's wrong", "loop with retries": "you try, catch the failure, and try again up to a limit", "string search & parse": "you find positions in text, cut out the part you need, and parse it", "slicing": "you take a piece of a list or string by position", "math formula": "you apply a known formula carefully, piece by piece", "agent loop": "you ask the model, run what it asks for, feed the result back, and repeat", "guard clauses": "you reject anything unsafe early and allow only what's left", "dedupe & clean": "real exports repeat rows and mix formats, so decide what makes a record unique before you add anything up", "flatten nested data": "the data is nested JSON and you need flat rows, so walk down safely with .get", "regex redaction": "you need to find text by its shape (an email, a phone number) and replace it", "evaluation metrics": "someone asks \"is it good?\" and you answer with a number you compute per case and average", "token bucket": "you allow bursts up to a limit but refill slowly over time", "filter, select, sort": "the question is \"which rows, which columns, in what order\": the same three moves in SQL, pandas and PySpark", "group & aggregate": "the question says per category, per customer or for each: group, then sum, count or average", "clean, join, aggregate": "the data is messy and split across two tables: clean first, join second, add up last"};

sheetIn.addEventListener("click",ev=>{
  const v=ev.target.closest("[data-v]");if(v&&vz){vizAct(v.dataset.v);return;}
  const c=ev.target.closest("[data-c]");if(c&&celebrateDay!==null){celebrateAct(c.dataset.c);return;}
  const l=ev.target.closest("[data-l]");if(l&&lab){labAct(l.dataset.l,l);return;}
  if(!sess)return;
  const o=ev.target.closest(".opt");
  if(o&&!sess.answered){sess.picked=+o.dataset.o;sheetIn.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",b===o));const c=sheetIn.querySelector('[data-s="check"]');c.disabled=false;c.focus();return;}
  const b=ev.target.closest("[data-s]");if(!b)return;
  if(b.dataset.s==="close")closeSheet();
  else if(b.dataset.s==="check")check();
  else if(b.dataset.s==="next"){sess.i++;renderDrill();}
});
document.addEventListener("keydown",ev=>{
  if(sheet.hidden)return;
  if(ev.key==="Escape"){closeSheet();return;}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName||"")&&document.activeElement.id!=="spRange";
  if(vz&&!typing&&(ev.key==="ArrowRight"||ev.key==="ArrowLeft")){vizAct(ev.key==="ArrowRight"?"next":"prev");return;}
  if(lab&&lab.trace&&lab.trace.res&&!lab.trace.ask&&!typing&&(ev.key==="ArrowRight"||ev.key==="ArrowLeft")){ev.preventDefault();spAct(ev.key==="ArrowRight"?"sp-next":"sp-prev");return;}
  if(lab&&lab.phase==="pattern"&&!lab.pdone&&/^[1-4]$/.test(ev.key)&&document.activeElement.tagName!=="TEXTAREA"){const btn=sheetIn.querySelector(`[data-l="pat"][data-i="${+ev.key-1}"]`);if(btn)btn.click();return;}
  if(!sess)return;
  const it=sess.queue[sess.i];
  if(it&&it.d.k==="mcq"&&!sess.answered&&/^[1-4]$/.test(ev.key)){const btn=sheetIn.querySelectorAll(".opt")[+ev.key-1];if(btn)btn.click();}
});
