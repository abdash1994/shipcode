n text\n", "hint": "Use re.sub(pattern, replacement, text) once per kind. \\d is a digit, [6-9] one digit from 6 to 9, {9} means exactly nine times, and \\b marks a word boundary so you don't match inside longer numbers.", "tests": [{"label": "email", "expr": "redact('Mail asha.k@example.co.in today')", "want": "'Mail [EMAIL] today'"}, {"label": "phone with +91", "expr": "redact('Call +91 9876543210 now')", "want": "'Call [PHONE] now'"}, {"label": "phone without prefix", "expr": "redact('Alt: 8123456789.')", "want": "'Alt: [PHONE].'"}, {"label": "PAN", "expr": "redact('PAN ABCDE1234F on file')", "want": "'PAN [PAN] on file'"}, {"label": "leaves other numbers", "expr": "redact('Order 123456 for 2 items')", "want": "'Order 123456 for 2 items'"}, {"label": "all together", "expr": "redact('x@y.com, 9000000001, FGHIJ5678K')", "want": "'[EMAIL], [PHONE], [PAN]'"}], "new": [["re.sub(pat, repl, s)", "replace pattern matches"]], "pat": "regex redaction", "steps": ["Replace email addresses with [EMAIL]", "Replace Indian mobile numbers, with optional +91, with [PHONE]", "Replace PAN numbers with [PAN]", "Return the redacted text"]}, {"kind": "design", "scope": true, "title": "Scope it: \"summarise our support calls with AI\"", "task": "<b>From the VP of Support:<\/b> \"We record 2,000 calls a day. Can AI summarise them so managers know what's going on?\" Plan it before anyone picks a model.", "questions": [["What decision will the summaries help managers make?", true], ["Are recordings already transcribed, and in which languages?", true], ["Can customer data go to an outside AI provider?", true], ["Which model is top of the leaderboard this week?", false], ["Should summaries be in rhyming verse?", false], ["Can we build our own LLM?", false]], "steps": ["Agree the output: the fields each summary must have", "Get 20 real transcripts and write good summaries for them by hand", "Redact personal data before anything goes to the model", "Prompt the model for structured JSON with those fields", "Score it against the 20 hand-written examples", "Roll out to one team, collect feedback, then scale"], "trade": [{"q": "Calls contain phone numbers and card details. What do you do?", "o": ["Redact them in code before calling the model", "Ask the model not to repeat them", "Only use calls without personal data", "Ignore it, the provider is secure"], "a": 0, "why": "Personal data handling is a hard requirement, done in code before the call (your Day 24 redaction lab)."}, {"q": "How do you know the summaries are good?", "o": ["Compare with hand-written summaries on a fixed set and track a score", "Read three and decide", "Use the longest summaries", "Ask the model if it did well"], "a": 0, "why": "A small eval set turns \"good\" into a number you can improve and report."}], "model": ["Clarify: the decision the summaries serve, transcription and languages, and data rules.", "Define the output fields; write 20 good examples by hand as the eval set.", "Pipeline: transcript → redact personal data → model returns JSON → validate → store.", "Measure against the examples before rollout; start with one team.", "Track cost per call and manager feedback as it scales."], "keys": [["the decision the summaries serve", "decision|manager|purpose|what .* for|use|who (reads|uses)|goal|why|audience|action|reader"], ["personal data rules and redaction", "redact|personal|pii|privacy|data rule|mask|anonymi|sensitive|names?|phone numbers?|gdpr|consent|confidential|remove (the )?(names|details)"], ["an eval set of hand-written examples", "eval|example|hand.?written|score|compar|test set|sample|gold|human.?(written|labell?ed)|check (quality|against)|rate|grade"], ["structured output fields", "json|field|structur|format|template|schema|fixed (layout|fields|sections)|bullet|same shape"], ["starting with one team", "one team|pilot|roll.?out|small|trial|start with|single team|few calls|limited|phase"], ["cost", "cost|price|budget|token|spend|expens|cheap|per call|bill"]]}], "25": [{"kind": "py", "title": "Chunk text with overlap", "task": "Write <code>chunk(text, size, overlap)<\/code>: split text into pieces of up to <code>size<\/code> characters, each starting <code>size - overlap<\/code> characters after the previous one. Stop once a chunk reaches the end of the text.", "starter": "def chunk(text, size, overlap):\n    pass\n", "solution": "def chunk(text, size, overlap):\n    step = size - overlap\n    out = []\n    for start in range(0, len(text), step):\n        out.append(text[start:start + size])\n        if start + size >= len(text):\n            break\n    return out\n", "hint": "range(0, len(text), size - overlap) gives the start positions. Break after the chunk that reaches the end.", "tests": [{"label": "abcdefghij, 4, 1", "expr": "chunk('abcdefghij', 4, 1)", "want": "['abcd', 'defg', 'ghij']"}, {"label": "no overlap", "expr": "chunk('abcdefg', 3, 0)", "want": "['abc', 'def', 'g']"}, {"label": "shorter than size", "expr": "chunk('hi', 10, 2)", "want": "['hi']"}, {"label": "empty", "expr": "chunk('', 5, 1)", "want": "[]"}], "pat": "slicing", "steps": ["Work out the step: size minus overlap", "Loop over start positions from 0, moving by step", "Take text[start:start + size]", "Stop after the chunk that reaches the end", "Return the chunks"]}, {"kind": "py", "title": "Retrieve the closest chunks", "task": "Write <code>cosine(a, b)<\/code> for two vectors (lists of numbers), and <code>top_k(query, docs, k)<\/code>: docs is a dict of id to vector; return the k ids most similar to query, most similar first. This is what a vector database does.", "starter": "import math\n\ndef cosine(a, b):\n    pass\n\ndef top_k(query, docs, k):\n    pass\n", "solution": "import math\n\ndef cosine(a, b):\n    dot = sum(x * y for x, y in zip(a, b))\n    na = math.sqrt(sum(x * x for x in a))\n    nb = math.sqrt(sum(y * y for y in b))\n    return dot / (na * nb)\n\ndef top_k(query, docs, k):\n    return sorted(docs, key=lambda d: cosine(query, docs[d]), reverse=True)[:k]\n", "hint": "cosine = dot(a, b) / (|a| * |b|). sorted(docs, key=..., reverse=True)[:k] ranks the ids.", "tests": [{"label": "same direction", "expr": "round(cosine([1, 2], [2, 4]), 6)", "want": "1.0"}, {"label": "perpendicular", "expr": "round(cosine([1, 0], [0, 5]), 6)", "want": "0.0"}, {"label": "top 2", "expr": "top_k([1, 0], {'refunds': [0.9, 0.1], 'shipping': [0, 1], 'returns': [0.7, 0.3]}, 2)", "want": "['refunds', 'returns']"}], "new": [["math.sqrt(x)", "square root"], ["zip(a, b)", "pair up items of two lists"]], "pat": "math formula", "steps": ["cosine: multiply matching numbers and add them up (the dot product)", "cosine: divide by the two vector lengths multiplied together", "top_k: sort the ids by cosine with the query, highest first", "top_k: return the first k"]}, {"kind": "py", "title": "Score a RAG system", "task": "<b>Customer question:<\/b> \"The bot gives wrong answers. Is it the search or the model?\" Measure both. <code>ROWS<\/code> is provided. Write <code>evaluate(rows, k)<\/code> returning <code>{\"recall_at_k\": ..., \"exact_match\": ...}<\/code>, each averaged over rows and rounded to 2 decimals. Recall@k for a row: how many of its relevant ids appear in the first k retrieved, divided by the number of relevant ids. Exact match: 1 if answer and expected are equal after lowercasing, trimming spaces and removing a trailing full stop.", "starter": "def evaluate(rows, k):\n    pass\n", "solution": "def norm(s):\n    s = s.strip().lower()\n    return s[:-1] if s.endswith(\".\") else s\n\ndef evaluate(rows, k):\n    recalls, matches = [], []\n    for r in rows:\n        top = set(r[\"retrieved\"][:k])\n        hits = len(top & set(r[\"relevant\"]))\n        recalls.append(hits / len(r[\"relevant\"]))\n        matches.append(1 if norm(r[\"answer\"]) == norm(r[\"expected\"]) else 0)\n    return {\"recall_at_k\": round(sum(recalls) / len(rows), 2), \"exact_match\": round(sum(matches) / len(rows), 2)}\n", "hint": "Compute two numbers per row, collect them in lists, then average. A set intersection counts the hits. A small helper function for normalising answers keeps it readable.", "tests": [{"label": "k = 3", "expr": "evaluate(ROWS, 3)", "want": "{'recall_at_k': 0.58, 'exact_match': 0.75}"}, {"label": "k = 1", "expr": "evaluate(ROWS, 1)", "want": "{'recall_at_k': 0.25, 'exact_match': 0.75}"}, {"label": "perfect single row", "expr": "evaluate([{'retrieved': ['a'], 'relevant': ['a'], 'answer': 'Yes.', 'expected': 'yes'}], 1)", "want": "{'recall_at_k': 1.0, 'exact_match': 1.0}"}], "prelude": "ROWS = [\n    {\"retrieved\": [\"d1\", \"d7\", \"d3\"], \"relevant\": [\"d1\", \"d3\"], \"answer\": \"Paris\", \"expected\": \"paris\"},\n    {\"retrieved\": [\"d2\", \"d9\", \"d4\"], \"relevant\": [\"d5\"], \"answer\": \"42 \", \"expected\": \"42\"},\n    {\"retrieved\": [\"d8\", \"d6\", \"d5\"], \"relevant\": [\"d6\", \"d8\"], \"answer\": \"Blue.\", \"expected\": \"blue\"},\n    {\"retrieved\": [\"d1\", \"d2\", \"d3\"], \"relevant\": [\"d3\", \"d4\", \"d9\"], \"answer\": \"no idea\", \"expected\": \"Tokyo\"},\n]\n", "new": [["s.endswith('ab')", "True if s ends with ab"]], "pat": "evaluation metrics", "steps": ["Write a small helper that normalises an answer", "For each row, count how many relevant ids are in the first k retrieved", "Divide by the number of relevant ids to get that row's recall", "Score exact match as 1 or 0 using the helper", "Average both lists and round to 2 decimals"]}], "26": [{"kind": "py", "title": "The agent loop", "task": "Write <code>run_agent(model, tools, question, max_steps=5)<\/code>. Start <code>messages<\/code> as <code>[{\"role\": \"user\", \"content\": question}]<\/code>. Each step, call <code>model(messages)<\/code>. It returns either <code>{\"answer\": ...}<\/code> (return the answer) or <code>{\"tool\": name, \"args\": {...}}<\/code>: run <code>tools[name](**args)<\/code> and append <code>{\"role\": \"tool\", \"content\": str(result)}<\/code>. If the tool name is unknown, append the content <code>\"Error: unknown tool NAME\"<\/code> instead. After max_steps without an answer, return <code>\"Stopped: step limit reached\"<\/code>. <code>scripted(...)<\/code> fake models are provided.", "starter": "def run_agent(model, tools, question, max_steps=5):\n    messages = [{\"role\": \"user\", \"content\": question}]\n    \n", "solution": "def run_agent(model, tools, question, max_steps=5):\n    messages = [{\"role\": \"user\", \"content\": question}]\n    for _ in range(max_steps):\n        reply = model(messages)\n        if \"answer\" in reply:\n            return reply[\"answer\"]\n        name = reply[\"tool\"]\n        if name not in tools:\n            content = f\"Error: unknown tool {name}\"\n        else:\n            content = str(tools[name](**reply[\"args\"]))\n        messages.append({\"role\": \"tool\", \"content\": content})\n    return \"Stopped: step limit reached\"\n", "hint": "A for loop over range(max_steps). Check \"answer\" in reply first. tools[name](**reply[\"args\"]) unpacks the args dict.", "tests": [{"label": "uses a tool, then answers", "expr": "run_agent(scripted({'tool': 'add', 'args': {'a': 2, 'b': 3}}, lambda m: {'answer': 'The sum is ' + m[-1]['content']}), TOOLS, 'What is 2 + 3?')", "want": "'The sum is 5'"}, {"label": "unknown tool is reported back", "expr": "run_agent(scripted({'tool': 'delete_db', 'args': {}}, lambda m: {'answer': m[-1]['content']}), TOOLS, 'go')", "want": "'Error: unknown tool delete_db'"}, {"label": "step limit", "expr": "run_agent(lambda m: {'tool': 'add', 'args': {'a': 1, 'b': 1}}, TOOLS, 'loop', max_steps=3)", "want": "'Stopped: step limit reached'"}], "prelude": "TOOLS = {\"add\": lambda a, b: a + b}\n\ndef scripted(*steps):\n    \"\"\"A fake model: returns each step in order. A step can be a dict or a function of messages.\"\"\"\n    state = {\"i\": 0}\n    def model(messages):\n        step = steps[min(state[\"i\"], len(steps) - 1)]\n        state[\"i\"] += 1\n        return step(messages) if callable(step) else step\n    return model\n", "new": [["f(**d)", "pass the dict d as keyword arguments"]], "pat": "agent loop", "steps": ["Start the messages list with the user's question", "Loop at most max_steps times and ask the model", "If it gave an answer, return it", "If it asked for a tool, run it (or build an error if it's unknown) and append the result as a tool message", "After the loop, return the step-limit message"]}, {"kind": "py", "title": "Guard the SQL tool", "task": "Before running SQL a model wrote, check it in code. Write <code>is_safe_sql(q)<\/code>: True only if, ignoring case and surrounding spaces, the query starts with <code>SELECT<\/code> or <code>WITH<\/code>, contains no <code>;<\/code> except optionally one at the very end, and contains none of the words INSERT, UPDATE, DELETE, DROP, ALTER, CREATE, ATTACH, PRAGMA.", "starter": "import re\n\ndef is_safe_sql(q):\n    pass\n", "solution": "import re\n\nBLOCKED = {\"INSERT\", \"UPDATE\", \"DELETE\", \"DROP\", \"ALTER\", \"CREATE\", \"ATTACH\", \"PRAGMA\"}\n\ndef is_safe_sql(q):\n    s = q.strip()\n    if s.endswith(\";\"):\n        s = s[:-1]\n    if \";\" in s:\n        return False\n    words = set(re.findall(r\"[A-Za-z_]+\", s.upper()))\n    if words & BLOCKED:\n        return False\n    return s.upper().startswith((\"SELECT\", \"WITH\"))\n", "hint": "Strip one trailing ;, reject any other ;. re.findall(r\"[A-Za-z_]+\", s.upper()) gives the words to check against a blocked set.", "tests": [{"label": "plain select", "expr": "is_safe_sql('select name from customers;')", "want": "True"}, {"label": "CTE", "expr": "is_safe_sql('WITH t AS (SELECT 1) SELECT * FROM t')", "want": "True"}, {"label": "two statements", "expr": "is_safe_sql('SELECT 1; DROP TABLE orders')", "want": "False"}, {"label": "delete", "expr": "is_safe_sql('DELETE FROM orders')", "want": "False"}, {"label": "hidden write in a CTE", "expr": "is_safe_sql('WITH x AS (DELETE FROM orders RETURNING *) SELECT * FROM x')", "want": "False"}, {"label": "column named updated_at is fine", "expr": "is_safe_sql('SELECT updated_at FROM t')", "want": "True"}], "new": [["re.findall(pat, s)", "list of all matches"], ["s.upper()", "UPPERCASE copy"]], "pat": "guard clauses", "steps": ["Strip spaces and one trailing ;", "If any ; is left, return False", "Pull out the words and reject any blocked word", "Return whether it starts with SELECT or WITH"]}, {"kind": "py", "scenario": true, "title": "Route support tickets with an LLM, safely", "brief": "We want an LLM to sort incoming support tickets into billing, bug or account. But we can't afford tickets going to the wrong team. (Sara, Support Lead)", "clarify": {"q": "The model is unsure, or answers with a category that doesn't exist. What should the system do?", "o": ["Send the ticket to a human queue", "Pick the closest category", "Ask the model again until it agrees", "Drop the ticket"], "a": 0, "why": "When the model's answer can't be trusted, a safe fallback (a human) beats a confident wrong answer. That's a guardrail written in code."}, "task": "Write <code>route_ticket(text, llm)<\/code>. Call <code>llm(prompt)<\/code> once with a prompt that includes the ticket text. The reply should contain JSON like <code>{\"category\": \"bug\", \"confidence\": 0.9}<\/code>, possibly wrapped in other text. Return the category only if it's in <code>CATEGORIES<\/code> (provided) and confidence is at least 0.7. In every other case, including unparseable replies, return <code>\"needs_human\"<\/code>. Never crash.", "starter": "import json\n\ndef route_ticket(text, llm):\n    pass\n", "solution": "import json\n\ndef route_ticket(text, llm):\n    reply = llm(f\"Classify this support ticket as billing, bug or account. Reply as JSON with category and confidence.\\n\\nTicket: {text}\")\n    start, end = reply.find(\"{\"), reply.rfind(\"}\")\n    if start == -1 or end < start:\n        return \"needs_human\"\n    try:\n        data = json.loads(reply[start:end + 1])\n    except json.JSONDecodeError:\n        return \"needs_human\"\n    cat, conf = data.get(\"category\"), data.get(\"confidence\", 0)\n    if cat in CATEGORIES and isinstance(conf, (int, float)) and conf >= 0.7:\n        return cat\n    return \"needs_human\"\n", "hint": "Reuse your extract_json idea from Day 24, then check two things: is the category allowed, and is confidence a number of at least 0.7?", "tests": [{"label": "clean answer", "expr": "route_ticket('I was charged twice', reply_with('{\"category\": \"billing\", \"confidence\": 0.92}'))", "want": "'billing'"}, {"label": "JSON inside chatty text", "expr": "route_ticket('App crashes on save', reply_with('Sure! {\"category\": \"bug\", \"confidence\": 0.8} Hope that helps'))", "want": "'bug'"}, {"label": "low confidence goes to a human", "expr": "route_ticket('Something is off', reply_with('{\"category\": \"bug\", \"confidence\": 0.4}'))", "want": "'needs_human'"}, {"label": "invented category goes to a human", "expr": "route_ticket('Want my money back', reply_with('{\"category\": \"refund\", \"confidence\": 0.99}'))", "want": "'needs_human'"}, {"label": "not JSON goes to a human", "expr": "route_ticket('Hmm', reply_with('I think it is billing'))", "want": "'needs_human'"}, {"label": "the prompt includes the ticket", "expr": "route_ticket(\"I'm locked out of my account\", lambda p: '{\"category\": \"account\", \"confidence\": 0.9}' if 'locked out' in p else '{}')", "want": "'account'"}], "reply": "Tickets are now routed automatically only when the model returns a valid category with confidence of at least 0.7. Everything else goes to the human queue, so nothing is mis-routed silently. Before raising automation further, I'd measure accuracy on 100 past tickets.", "prelude": "CATEGORIES = {\"billing\", \"bug\", \"account\"}\n\ndef reply_with(text):\n    \"\"\"A fake LLM that always answers with this text.\"\"\"\n    return lambda prompt: text\n", "pat": "guard clauses", "steps": ["Ask the model once, with the ticket text inside the prompt", "Find the first { and last }; if missing, return needs_human", "Try json.loads; if it fails, return needs_human", "Read category and confidence from the result", "Return the category only if it is allowed and confidence is at least 0.7, else needs_human"]}], "28": [{"kind": "py", "title": "LRU cache", "task": "A classic interview question and the idea behind caching LLM answers. Write <code>LRUCache(capacity)<\/code> with <code>get(key)<\/code> (value, or -1 if missing) and <code>put(key, value)<\/code>. When full, evict the least recently used key. Both O(1). (LeetCode 146.)", "starter": "from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        pass\n", "solution": "from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.data = OrderedDict()\n\n    def get(self, key):\n        if key not in self.data:\n            return -1\n        self.data.move_to_end(key)\n        return self.data[key]\n\n    def put(self, key, value):\n        self.data[key] = value\n        self.data.move_to_end(key)\n        if len(self.data) > self.cap:\n            self.data.popitem(last=False)\n", "hint": "OrderedDict keeps insertion order. move_to_end(key) marks it as recently used; popitem(last=False) removes the oldest.", "tests": [{"label": "LeetCode example", "expr": "(lambda c: [c.put(1, 1), c.put(2, 2), c.get(1), c.put(3, 3), c.get(2), c.put(4, 4), c.get(1), c.get(3), c.get(4)])(LRUCache(2))", "want": "[None, None, 1, None, -1, None, -1, 3, 4]"}, {"label": "update keeps it fresh", "expr": "(lambda c: [c.put(1, 1), c.put(2, 2), c.put(1, 10), c.put(3, 3), c.get(1), c.get(2)])(LRUCache(2))[4:]", "want": "[10, -1]"}], "new": [["OrderedDict()", "a dict that remembers order and can move keys"], ["od.move_to_end(k)", "move key k to the end"], ["od.popitem(last=False)", "remove the oldest item"]], "pat": "hash map / set", "steps": ["Store the capacity and an OrderedDict", "get: return -1 if missing, otherwise mark it recently used and return it", "put: store the value and mark it recently used", "put: if over capacity, remove the oldest key"], "free": true}, {"kind": "design", "title": "Design: support bot over company docs", "task": "A SaaS company wants a support chatbot that answers its 10,000 customers from the help-centre docs. Docs change every day. Walk through the design like an interview: clarify, lay out the request path, make the trade-off calls.", "questions": [["How many questions per minute at peak, and how fast must answers be?", true], ["How fresh must answers be after a doc changes?", true], ["What should happen when the bot doesn't know the answer?", true], ["Which programming language should we use?", false], ["Can we use the newest, biggest model?", false], ["What colour should the chat widget be?", false]], "steps": ["Chat UI sends the question to the API", "API checks who the user is and applies rate limits", "Check the cache for a recent identical question", "Retrieve the closest chunks from the vector database", "Build the prompt from the rules, chunks and question", "Call the LLM and stream the answer back", "Check the answer cites a source, otherwise hand off to a human", "Log the question, answer and feedback for evals"], "trade": [{"q": "Docs change daily. How do you keep answers fresh?", "o": ["Re-embed changed docs through a queue when they're updated", "Retrain the LLM every night", "Ask users to refresh the page", "Cache answers for longer"], "a": 0, "why": "Only the changed documents need new embeddings, and a queue keeps that work out of the user's request."}, {"q": "Answers take 8 seconds and users say it feels slow. Quickest win?", "o": ["Stream tokens as they're generated, and cache common answers", "Switch to a bigger model", "Add more documents", "Remove the vector database"], "a": 0, "why": "Streaming makes the first words appear in under a second; caching skips the LLM for repeated questions."}, {"q": "How do you know it's good enough to launch?", "o": ["An eval set of real questions with expected answers and a target score", "The team tries it and agrees", "Count how many questions it answers", "Ask the LLM to grade itself only"], "a": 0, "why": "An eval set gives a number you can track across every change (your Day 29 scenario)."}], "model": ["Clarify scale (peak questions per minute, latency target), freshness, and the fallback when unsure.", "Request path: API (auth, rate limits) → cache → retriever + vector DB → prompt builder → LLM (streaming) → citation check → response.", "Ingestion path, separate from requests: doc change → queue → worker chunks and embeds → vector DB.", "Safety: answer only from retrieved sources; no source means a human handoff.", "Measure: log everything; run an eval set before launch and after every change; watch p95 latency, cost per answer and thumbs-down rate."], "keys": [["scale and speed", "scale|peak|latency|per minute|per second|load|fast|how many|traffic|users at once|concurrent|volume|response time|seconds"], ["freshness and the ingestion path", "fresh|ingest|re.?embed|queue|updat|doc chang|chang(e|ed|es) (docs|documents)|new (docs|documents)|stale|sync|re.?index|pipeline"], ["retrieval over a vector database", "retriev|vector|embed|chunk|rag|search|lookup|find (the )?(relevant|right)|similar|knowledge base|semantic"], ["a cache or rate limit", "cache|rate.?limit|throttl|remember (answers|common)|reuse|limit (requests|per user)|quota"], ["citations and a fallback when unsure", "cit|source|fallback|human|hand.?off|know|unsure|escalat|take over|admit|refuse|ground|reference the doc"], ["evals and metrics", "eval|measur|metric|p95|thumbs|log|monitor|track|test set|feedback|quality|score|dashboard|review"]]}, {"kind": "design", "title": "Design: an agent that updates the CRM", "task": "Sales reps upload call notes. The customer wants an AI agent that reads each note and updates the CRM: deal stage, next step, deal size. Wrong updates are costly. Design it.", "questions": [["Which fields may the agent change on its own, and which need approval?", true], ["What does a wrong update cost the business?", true], ["How many notes a day, and how quickly must the CRM update?", true], ["Which vector database is the most popular right now?", false], ["Could the agent also email customers directly?", false], ["Should we rewrite the CRM in Rust?", false]], "steps": ["Call notes arrive on a queue", "A worker sends the note and the allowed tools to the model", "The model proposes field updates as structured JSON", "Code validates fields, types and allowed values", "Low-risk updates apply; high-risk ones wait for human approval", "Write to the CRM through its API, retrying on errors", "Log every change with before and after values for audit"], "trade": [{"q": "The model sometimes invents a deal size that isn't in the notes. Best protection?", "o": ["Validate in code: only accept values found in the note, otherwise flag for review", "Tell the model in the prompt not to invent things", "Raise the temperature", "Let sales fix it later"], "a": 0, "why": "Prompts reduce mistakes; code-level checks prevent them. Guardrails belong in code (Day 26)."}, {"q": "The CRM API rate-limits you at peak. What do you do?", "o": ["Process the queue at a controlled rate and retry with backoff", "Drop the extra notes", "Call the API faster", "Switch to a different CRM"], "a": 0, "why": "A queue absorbs bursts; retries with backoff respect the limit without losing work (your Day 23 scenario)."}, {"q": "How do you stop the agent looping forever on a confusing note?", "o": ["Cap the steps and send the note to a human when the cap is hit", "Let it run until it finishes", "Use a smaller model", "Delete confusing notes"], "a": 0, "why": "MAX_STEPS plus a human fallback keeps cost and behaviour bounded (Day 26)."}], "model": ["Clarify write permissions per field, the cost of mistakes, volume and latency.", "Pipeline: notes queue → agent worker → model proposes JSON → validation in code → auto-apply low risk / approval for high risk → CRM API with retries → audit log.", "Guardrails in code: allowed fields only, values must appear in the note, step cap, human fallback.", "Reliability: the queue absorbs bursts; rate-limited calls retry with backoff; every write is idempotent and logged.", "Measure: approval rate, rejection reasons and error rate per field, to decide what can safely be automated next."], "keys": [["permissions and the cost of mistakes", "permission|allowed|risk|mistake|field|access|scope|limit what|which (fields|records)|least privilege|damage|undo|wrong update"], ["validation in code", "validat|check|schema|json|verify|format|sanity|rules|allowed values|reject|type"], ["human approval for risky changes", "approv|human|review|confirm|sign.?off|person (checks|approves)|manager|in the loop|ask (first|before)|manual"], ["a queue and retries", "queue|retry|retries|backoff|idempot|again|resend|dead.?letter|background job|timeout"], ["an audit log", "audit|log|record|history|trail|who changed|trace|journal"], ["what you'd measure", "measur|rate|metric|error|accuracy|success|monitor|count|how often|dashboard|failures?"]]}], "30": [{"kind": "py", "title": "Final round: meeting rooms", "task": "<b>Timed: 35 minutes, talk aloud.<\/b> Write <code>min_rooms(intervals)<\/code>: given meetings as <code>[start, end]<\/code>, the fewest rooms needed so no two meetings in one room overlap. A meeting ending at 10 frees the room for one starting at 10. Use a heap.", "starter": "import heapq\n\ndef min_rooms(intervals):\n    pass\n", "solution": "import heapq\n\ndef min_rooms(intervals):\n    ends = []\n    for s, e in sorted(intervals):\n        if ends and ends[0] <= s:\n            heapq.heapreplace(ends, e)\n        else:\n            heapq.heappush(ends, e)\n    return len(ends)\n", "hint": "Sort by start. Keep a min-heap of end times. If the earliest end is <= this start, reuse that room.", "tests": [{"label": "[[0,30],[5,10],[15,20]]", "expr": "min_rooms([[0, 30], [5, 10], [15, 20]])", "want": "2"}, {"label": "back to back", "expr": "min_rooms([[7, 10], [10, 12]])", "want": "1"}, {"label": "none", "expr": "min_rooms([])", "want": "0"}, {"label": "three overlap", "expr": "min_rooms([[1, 5], [2, 6], [3, 7], [6, 8]])", "want": "3"}], "mock": true, "new": [["heapq.heapreplace(h, x)", "pop the smallest, then push x"]], "pat": "heap", "steps": ["Sort meetings by start", "Keep a min-heap of end times for rooms in use", "If the earliest-ending room is free by this start, reuse it (replace its end time)", "Otherwise open a new room (push its end time)", "Return the number of rooms"]}, {"kind": "sql", "title": "Final round: above the department average", "task": "Return <code>name<\/code> and <code>dept<\/code> of employees who earn more than the average salary of their own department.", "starter": "SELECT \n", "solution": "SELECT name, dept FROM employees e WHERE salary > (SELECT AVG(salary) FROM employees WHERE dept = e.dept);", "hint": "A correlated subquery: compare salary with (SELECT AVG(salary) FROM employees WHERE dept = e.dept). A window AVG() OVER (PARTITION BY dept) in a CTE also works.", "ordered": false, "mock": true, "rows": 2}, {"kind": "py", "title": "Staged build: a key-value store, level by level", "task": "<b>Interview format:<\/b> many company coding rounds give you one problem in levels, each adding a requirement to the code you already wrote. Build <code>KVStore<\/code>. <b>Level 1:<\/b> <code>set(key, value)<\/code> and <code>get(key)<\/code>, which returns <code>None<\/code> if missing. <b>Level 2:<\/b> <code>delete(key)<\/code> returns whether the key existed; <code>count(value)<\/code> returns how many keys hold that value. <b>Level 3:<\/b> <code>set(key, value, now=0, ttl=None)<\/code>: with a ttl the key expires at <code>now + ttl<\/code>; <code>get<\/code>, <code>delete<\/code> and <code>count<\/code> take <code>now=0<\/code> too and treat expired keys as missing. <b>Level 4:<\/b> <code>undo()<\/code> reverts the last successful set or delete and returns True, or False if there's nothing to undo. Do the levels in order and run the tests after each one: the test names say which level they check.", "starter": "class KVStore:\n    def __init__(self):\n        pass\n", "solution": "class KVStore:\n    def __init__(self):\n        self.data = {}\n        self.history = []\n\n    def _alive(self, key, now):\n        if key not in self.data:\n            return False\n        expires = self.data[key][1]\n        return expires is None or now < expires\n\n    def set(self, key, value, now=0, ttl=None):\n        self.history.append((key, self.data.get(key)))\n        self.data[key] = (value, None if ttl is None else now + ttl)\n\n    def get(self, key, now=0):\n        return self.data[key][0] if self._alive(key, now) else None\n\n    def delete(self, key, now=0):\n        if not self._alive(key, now):\n            return False\n        self.history.append((key, self.data[key]))\n        del self.data[key]\n        return True\n\n    def count(self, value, now=0):\n        return sum(1 for k, (v, _) in self.data.items() if v == value and self._alive(k, now))\n\n    def undo(self):\n        if not self.history:\n            return False\n        key, prev = self.history.pop()\n        if prev is None:\n            self.data.pop(key, None)\n        else:\n            self.data[key] = prev\n        return True\n", "hint": "Store each value as (value, expires_at) so Level 3 doesn't force a rewrite. A small _alive(key, now) helper used by every method keeps expiry in one place. For undo, push (key, previous entry) before every change.", "tests": [{"label": "Level 1: set then get", "expr": "(lambda s: (s.set('a', 1), s.get('a'))[1])(KVStore())", "want": "1"}, {"label": "Level 1: missing key", "expr": "KVStore().get('x')", "want": "None"}, {"label": "Level 1: overwrite", "expr": "(lambda s: (s.set('a', 1), s.set('a', 2), s.get('a'))[2])(KVStore())", "want": "2"}, {"label": "Level 2: delete", "expr": "(lambda s: (s.set('a', 1), s.delete('a'), s.delete('a'), s.get('a'))[1:])(KVStore())", "want": "(True, False, None)"}, {"label": "Level 2: count", "expr": "(lambda s: (s.set('a', 1), s.set('b', 1), s.set('c', 2), s.count(1))[3])(KVStore())", "want": "2"}, {"label": "Level 3: expiry", "expr": "(lambda s: (s.set('a', 1, now=0, ttl=10), s.get('a', now=5), s.get('a', now=10))[1:])(KVStore())", "want": "(1, None)"}, {"label": "Level 3: count skips expired", "expr": "(lambda s: (s.set('a', 1, now=0, ttl=5), s.set('b', 1), s.count(1, now=6))[2])(KVStore())", "want": "1"}, {"label": "Level 4: undo a set", "expr": "(lambda s: (s.set('a', 1), s.set('a', 2), s.undo(), s.get('a'))[3])(KVStore())", "want": "1"}, {"label": "Level 4: undo a delete", "expr": "(lambda s: (s.set('a', 1), s.delete('a'), s.undo(), s.get('a'))[3])(KVStore())", "want": "1"}, {"label": "Level 4: nothing to undo", "expr": "KVStore().undo()", "want": "False"}], "pat": "class with methods", "steps": ["Level 1: keep a dict; get returns None when the key is missing", "Level 2: delete reports whether the key existed; count loops over the values", "Level 3: store (value, expires_at) and treat expired keys as missing in every method", "Level 4: before every change, save (key, previous entry) on a history list; undo pops and restores it"]}], "27": [{"kind": "py", "scenario": true, "title": "Works on my laptop, not in the container", "brief": "Your service deployed fine but nobody can reach it, and when it does start it sometimes runs in debug mode in production. Can you fix the config loading? (Ops on-call)", "clarify": {"q": "The app works on your laptop, but nothing can reach it inside the Docker container. Most likely cause?", "o": ["It listens on 127.0.0.1 instead of 0.0.0.0", "Python is too old in the container", "The laptop is faster", "Docker doesn't support Python web apps"], "a": 0, "why": "Inside a container, 127.0.0.1 only accepts connections from the container itself. Listening on 0.0.0.0 accepts them from outside."}, "task": "Fix <code>load_config(env)<\/code>. <code>env<\/code> is a dict of strings, like environment variables. Return <code>port<\/code> as an int (default 8000), <code>host<\/code> (default <code>\"0.0.0.0\"<\/code>), <code>debug<\/code> True only for <code>\"1\"<\/code>, <code>\"true\"<\/code> or <code>\"yes\"<\/code> in any case (default False), and <code>api_key<\/code>. If <code>API_KEY<\/code> is missing or blank, raise <code>ValueError<\/code> so a bad deploy fails at startup.", "starter": "def load_config(env):\n    port = env.get(\"PORT\", 8000)\n    host = env.get(\"HOST\", \"127.0.0.1\")\n    debug = bool(env.get(\"DEBUG\", False))\n    api_key = env.get(\"API_KEY\")\n    return {\"port\": port, \"host\": host, \"debug\": debug, \"api_key\": api_key}\n", "solution": "def load_config(env):\n    api_key = env.get(\"API_KEY\", \"\").strip()\n    if not api_key:\n        raise ValueError(\"API_KEY is missing\")\n    return {\n        \"port\": int(env.get(\"PORT\", 8000)),\n        \"host\": env.get(\"HOST\", \"0.0.0.0\"),\n        \"debug\": env.get(\"DEBUG\", \"\").strip().lower() in (\"1\", \"true\", \"yes\"),\n        \"api_key\": api_key,\n    }\n", "hint": "Three bugs: environment values are always strings, so convert PORT with int(); bool(\"false\") is True, so compare the text instead; and 127.0.0.1 is unreachable from outside a container.", "tests": [{"label": "defaults", "expr": "load_config({'API_KEY': 'k'})", "want": "{'port': 8000, 'host': '0.0.0.0', 'debug': False, 'api_key': 'k'}"}, {"label": "PORT is text, DEBUG is 'false'", "expr": "(lambda c: (c['port'], c['debug']))(load_config({'API_KEY': 'k', 'PORT': '9000', 'DEBUG': 'false'}))", "want": "(9000, False)"}, {"label": "DEBUG 'TRUE'", "expr": "load_config({'API_KEY': 'k', 'DEBUG': 'TRUE'})['debug']", "want": "True"}, {"label": "missing key fails fast", "expr": "_raises(lambda: load_config({}), ValueError)", "want": "True"}, {"label": "blank key fails fast", "expr": "_raises(lambda: load_config({'API_KEY': '  '}), ValueError)", "want": "True"}], "reply": "The service only listened on 127.0.0.1, which is unreachable from outside a container, and PORT and DEBUG were read as text (so DEBUG=false switched debug on). Config now defaults to 0.0.0.0:8000, converts PORT, parses DEBUG strictly, and refuses to start without an API key, so a bad deploy fails immediately instead of on a customer request.", "bug": true}, {"kind": "py", "title": "Rate limiter (token bucket)", "task": "<b>Production incident:<\/b> a customer's script is hammering your API. Write a class <code>RateLimiter(rate, capacity)<\/code>: it starts full with <code>capacity<\/code> tokens and refills at <code>rate<\/code> tokens per second, never above capacity. <code>allow(now)<\/code> takes the current time in seconds: if at least one token is available, spend it and return True, otherwise return False. (Passing the time in makes it testable.)", "starter": "class RateLimiter:\n    def __init__(self, rate, capacity):\n        pass\n", "solution": "class RateLimiter:\n    def __init__(self, rate, capacity):\n        self.rate = rate\n        self.capacity = capacity\n        self.tokens = capacity\n        self.last = None\n\n    def allow(self, now):\n        if self.last is not None:\n            self.tokens = min(self.capacity, self.tokens + (now - self.last) * self.rate)\n        self.last = now\n        if self.tokens >= 1:\n            self.tokens -= 1\n            return True\n        return False\n", "hint": "Store tokens and the last time you looked. On each call, first add (now - last) * rate tokens, capped at capacity, then try to spend one.", "tests": [{"label": "burst up to capacity", "expr": "(lambda r: [r.allow(0) for _ in range(4)])(RateLimiter(1, 3))", "want": "[True, True, True, False]"}, {"label": "refills over time", "expr": "(lambda r: [r.allow(0), r.allow(0), r.allow(0.5), r.allow(1.0)])(RateLimiter(1, 2))", "want": "[True, True, False, True]"}, {"label": "never above capacity", "expr": "(lambda r: [r.allow(0), r.allow(100), r.allow(100), r.allow(100)])(RateLimiter(1, 2))", "want": "[True, True, True, False]"}], "pat": "token bucket", "steps": ["Store rate, capacity, a full bucket of tokens and the last time seen", "On each call, add tokens for the time passed since last, capped at capacity", "Remember now as the last time", "If at least one token is left, spend it and return True", "Otherwise return False"]}], "29": [{"kind": "py", "scenario": true, "title": "Is the bot good enough? Build the eval", "brief": "Leadership asks: is our support bot good enough to launch? I need a number, not a vibe. (Maya, VP Customer Experience)", "clarify": {"q": "Someone asks whether an AI bot is good enough to launch. What's your first move?", "o": ["Agree on real questions with expected answers, and a target score", "Try a few questions yourself and decide", "Switch to a bigger model", "Launch and watch for complaints"], "a": 0, "why": "An evaluation set turns \"is it good?\" into a number you can track and improve. FDEs are judged on outcomes, so measure them."}, "task": "<code>CASES<\/code> and two fake bots are provided. A bot takes a question and returns <code>(answer_text, cited_doc_ids)<\/code>. Write <code>evaluate(cases, bot)<\/code> returning <code>{\"score\": ..., \"failures\": [...]}<\/code>. A case passes only if its <code>expect<\/code> text appears in the answer (ignoring case) <b>and<\/b> its <code>doc<\/code> is among the cited ids. Score is the share of passing cases, rounded to 2 decimals (0.0 when there are no cases). Failures lists the failing questions in order.", "starter": "def evaluate(cases, bot):\n    pass\n", "solution": "def evaluate(cases, bot):\n    failures = []\n    for c in cases:\n        answer, docs = bot(c[\"q\"])\n        if c[\"expect\"].lower() not in answer.lower() or c[\"doc\"] not in docs:\n            failures.append(c[\"q\"])\n    if not cases:\n        return {\"score\": 0.0, \"failures\": []}\n    return {\"score\": round((len(cases) - len(failures)) / len(cases), 2), \"failures\": failures}\n", "hint": "Loop over the cases, call the bot, check both conditions, and collect the failing questions. Guard the division for an empty list.", "tests": [{"label": "the current bot", "expr": "evaluate(CASES, bot_v1)", "want": "{'score': 0.5, 'failures': [\"What's the refund window?\", 'Where is my invoice?']}"}, {"label": "a perfect bot", "expr": "evaluate(CASES, bot_perfect)", "want": "{'score': 1.0, 'failures': []}"}, {"label": "no cases", "expr": "evaluate([], bot_v1)", "want": "{'score': 0.0, 'failures': []}"}], "reply": "I built an evaluation on 4 real questions; we should grow it to 50 or more. Today the bot scores 50%: it states the refund window correctly but cites the wrong document, and it can't find invoices. Fixing retrieval for those two documents is the next step. I suggest we agree a launch target, say 90%, and rerun this after every change.", "prelude": "CASES = [\n    {\"q\": \"How do I reset my password?\", \"expect\": \"settings > security\", \"doc\": \"kb-12\"},\n    {\"q\": \"What's the refund window?\", \"expect\": \"30 days\", \"doc\": \"kb-7\"},\n    {\"q\": \"Do you support SSO?\", \"expect\": \"yes\", \"doc\": \"kb-3\"},\n    {\"q\": \"Where is my invoice?\", \"expect\": \"billing page\", \"doc\": \"kb-9\"},\n]\n\ndef bot_v1(q):\n    answers = {\n        \"How do I reset my password?\": (\"Go to Settings > Security and click reset.\", [\"kb-12\"]),\n        \"What's the refund window?\": (\"Refunds are available within 30 days.\", [\"kb-2\"]),\n        \"Do you support SSO?\": (\"Yes, on the Business plan.\", [\"kb-3\"]),\n        \"Where is my invoice?\": (\"I'm not sure.\", []),\n    }\n    return answers[q]\n\ndef bot_perfect(q):\n    c = next(c for c in CASES if c[\"q\"] == q)\n    return (\"Answer: \" + c[\"expect\"], [c[\"doc\"]])\n", "pat": "evaluation metrics", "steps": ["Start an empty failures list", "For each case, ask the bot and get the answer and cited docs", "The case fails if the expected text isn't in the answer (ignoring case) or its doc isn't cited", "If there are no cases, return score 0.0", "Return the share that passed, rounded, with the failures"]}, {"kind": "sql", "title": "Customers at risk of churning", "task": "As of <b>2026-03-05<\/b>, return the <code>name<\/code> of every customer who has ordered before but placed <b>no order in the last 30 days<\/b> (on or after 2026-02-03). Customers who never ordered are a different problem: leave them out.", "starter": "SELECT \n", "solution": "SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id GROUP BY c.id, c.name HAVING MAX(o.order_date) < date('2026-03-05', '-30 days');", "hint": "Group orders per customer and look at MAX(order_date). In SQLite, date('2026-03-05', '-30 days') gives the cutoff. An inner JOIN already leaves out customers with no orders.", "ordered": false, "rows": 1}, {"kind": "design", "scope": true, "title": "Scope it: an AI assistant for field engineers", "task": "<b>From a manufacturing customer:<\/b> \"Our field engineers waste hours searching 3,000 PDF manuals. We want an AI assistant on their phones.\" This is a first meeting. Scope it into a pilot.", "questions": [["Which questions do engineers ask most, and how do they search today?", true], ["Do they have signal on site, and can they type with gloves on?", true], ["What happens if the assistant gives a wrong instruction?", true], ["Should we use Kubernetes?", false], ["Which vector database has the most GitHub stars?", false], ["Could it also order lunch?", false]], "steps": ["Collect 30 real questions with the right answers from senior engineers", "Pick one product line's manuals for the pilot", "Build RAG over those manuals with page citations", "Score it on the 30 questions and fix the failures", "Pilot with 5 engineers and log every question", "Report results against the agreed target, then plan the rollout"], "trade": [{"q": "A wrong answer could damage equipment. Main safeguard?", "o": ["Always cite the manual page, and say \"I don't know\" when nothing matches", "Use a bigger model", "Add a disclaimer at the bottom", "Hide the sources to keep it simple"], "a": 0, "why": "Citations let engineers check, and refusing when unsure is safer than guessing."}, {"q": "What should the pilot prove?", "o": ["A measured score on real questions and time saved, against a target agreed upfront", "That the demo looks good", "That the code has no bugs", "That every manual is loaded"], "a": 0, "why": "FDEs are judged on outcomes. Agree the target first, then report against it."}], "model": ["Clarify: real questions, field conditions, and the cost of a wrong answer.", "Narrow to a pilot: one product line, 30 questions with known answers as the eval set.", "Build: RAG over the manuals with page citations and a refusal when unsure.", "Measure: eval score, time saved per lookup, engineer feedback; agreed target first.", "Then plan the rollout: more manuals, offline needs, monitoring."], "keys": [["the real questions and field conditions", "question|signal|offline|field|glove|phone|what (do )?(engineers|they) ask|real (use|cases)|conditions|site|connectivity|talk to|interview|shadow|day.to.day"], ["the cost of a wrong answer", "wrong|risk|safe|damage|danger|safety|mistake|harm|consequence|injur|liab|costly"], ["narrowing to a pilot", "pilot|one product|narrow|small|start with|single|limit|trial|few (engineers|sites)|phase|subset|scope down"], ["an eval set with known answers", "eval|30 questions|thirty|known (right |correct )?answer|right answers|score|test set|question list|answer key|check (answers|against)|benchmark|examples|expected"], ["citations and refusing when unsure", "cit|page|source|refus|know|unsure|reference|manual section|say (so|it doesn.t know)|don.t guess|admit|escalate"], ["measuring against an agreed target", "measur|target|time saved|metric|goal|success|agree|baseline|kpi|track|compare|minutes"]]}], "22": [{"kind": "py", "title": "Fix the bug: the API client drops records", "task": "<b>Customer report:<\/b> \"Your sync is missing records.\" <code>fetch_all()<\/code> should return <b>every<\/b> item from the customer's paginated API (<code>fetch_page<\/code> is provided). It returns too few. Find out why with Watch it run, then fix it.", "starter": "def fetch_all():\n    items = []\n    data = fetch_page(1)\n    while data[\"next\"] is not None:\n        items += data[\"items\"]\n        data = fetch_page(data[\"next\"])\n    return items\n", "solution": "def fetch_all():\n    items = []\n    data = fetch_page(1)\n    while True:\n        items += data[\"items\"]\n        if data[\"next\"] is None:\n            break\n        data = fetch_page(data[\"next\"])\n    return items\n", "hint": "The loop stops as soon as it sees the last page, before adding that page's items. Add the items first, then decide whether to stop.", "tests": [{"label": "all 7 records", "expr": "len(fetch_all())", "want": "7"}, {"label": "ids in order", "expr": "[x['id'] for x in fetch_all()]", "want": "[1, 2, 3, 4, 5, 6, 7]"}, {"label": "each page fetched once", "expr": "(CALLS.clear(), fetch_all(), CALLS)[2]", "want": "[1, 2, 3]"}], "prelude": "PAGES = {\n    1: {\"items\": [{\"id\": 1}, {\"id\": 2}, {\"id\": 3}], \"next\": 2},\n    2: {\"items\": [{\"id\": 4}, {\"id\": 5}], \"next\": 3},\n    3: {\"items\": [{\"id\": 6}, {\"id\": 7}], \"next\": None},\n}\nCALLS = []\n\ndef fetch_page(page):\n    \"\"\"The customer's API: returns one page of items and the next page number (None on the last page).\"\"\"\n    CALLS.append(page)\n    return PAGES[page]\n", "bug": true}, {"kind": "py", "title": "Flatten webhook events", "task": "<b>Customer request:<\/b> \"Load our payment webhooks into a table.\" <code>EVENTS<\/code> is provided. Write <code>flatten(events)<\/code>: for each event of type <code>\"order.paid\"<\/code> only, return a dict with keys <code>event_id<\/code>, <code>order_id<\/code>, <code>amount<\/code>, <code>currency<\/code>, <code>email<\/code>. Any missing field becomes <code>None<\/code>. Never crash on a missing level.", "starter": "def flatten(events):\n    rows = []\n    \n    return rows\n", "solution": "def flatten(events):\n    rows = []\n    for e in events:\n        if e.get(\"type\") != \"order.paid\":\n            continue\n        data = e.get(\"data\", {})\n        order = data.get(\"order\", {})\n        amount = order.get(\"amount\", {})\n        customer = data.get(\"customer\", {})\n        rows.append({\n            \"event_id\": e.get(\"id\"),\n            \"order_id\": order.get(\"id\"),\n            \"amount\": amount.get(\"value\"),\n            \"currency\": amount.get(\"currency\"),\n            \"email\": customer.get(\"email\"),\n        })\n    return rows\n", "hint": "Walk down one level at a time with .get(key, {}) so a missing level gives an empty dict instead of a KeyError. Use .get(key) (default None) for the final values.", "tests": [{"label": "only paid events", "expr": "[r['event_id'] for r in flatten(EVENTS)]", "want": "['e1', 'e3', 'e4']"}, {"label": "full row", "expr": "flatten(EVENTS)[0]", "want": "{'event_id': 'e1', 'order_id': 'o1', 'amount': 1200, 'currency': 'INR', 'email': 'asha@example.com'}"}, {"label": "missing customer and amount", "expr": "flatten(EVENTS)[2]", "want": "{'event_id': 'e4', 'order_id': 'o4', 'amount': None, 'currency': None, 'email': None}"}, {"label": "empty input", "expr": "flatten([])", "want": "[]"}], "prelude": "EVENTS = [\n    {\"id\": \"e1\", \"type\": \"order.paid\", \"data\": {\"order\": {\"id\": \"o1\", \"amount\": {\"value\": 1200, \"currency\": \"INR\"}}, \"customer\": {\"email\": \"asha@example.com\"}}},\n    {\"id\": \"e2\", \"type\": \"order.refunded\", \"data\": {\"order\": {\"id\": \"o2\", \"amount\": {\"value\": 300, \"currency\": \"INR\"}}}},\n    {\"id\": \"e3\", \"type\": \"order.paid\", \"data\": {\"order\": {\"id\": \"o3\", \"amount\": {\"value\": 45, \"currency\": \"USD\"}}}},\n    {\"id\": \"e4\", \"type\": \"order.paid\", \"data\": {\"order\": {\"id\": \"o4\"}, \"customer\": {}}},\n]\n", "pat": "flatten nested data", "steps": ["Start an empty list of rows", "For each event, skip it unless its type is order.paid", "Walk down data, order, amount and customer with .get(key, {})", "Build the flat dict with .get for each final value", "Append it and return the rows"]}, {"kind": "py", "title": "Fix the bug: a teammate's pull request", "task": "<b>Code review:<\/b> a teammate's PR adds invoice totals. Customers say totals are too low, and one invoice crashes. Read the whole file first, then fix <b>both<\/b> bugs without rewriting it. This is what debugging unfamiliar code in interviews looks like: understand before you change.", "starter": "TAX_RATE = 0.18\n\n\ndef parse_line(line):\n    \"\"\"'SKU-1, 2, 499.00' -> ('SKU-1', 2, 499.0)\"\"\"\n    sku, qty, price = [p.strip() for p in line.split(\",\")]\n    return sku, int(qty), float(price)\n\n\ndef line_total(qty, price, discount_pct):\n    return qty * price * (1 - discount_pct / 100)\n\n\ndef invoice_total(lines, discount_pct=0):\n    \"\"\"Lines are 'sku, qty, price'. Blank lines and # comments are skipped. Tax is added at the end.\"\"\"\n    subtotal = 0\n    for line in lines:\n        if not line.strip() or line.startswith(\"#\"):\n            continue\n        sku, qty, price = parse_line(line)\n        subtotal = line_total(qty, price, discount_pct)\n    tax = subtotal * TAX_RATE\n    return round(subtotal + tax, 2)\n", "solution": "TAX_RATE = 0.18\n\n\ndef parse_line(line):\n    \"\"\"'SKU-1, 2, 499.00' -> ('SKU-1', 2, 499.0)\"\"\"\n    sku, qty, price = [p.strip() for p in line.split(\",\")]\n    return sku, int(qty), float(price)\n\n\ndef line_total(qty, price, discount_pct):\n    return qty * price * (1 - discount_pct / 100)\n\n\ndef invoice_total(lines, discount_pct=0):\n    \"\"\"Lines are 'sku, qty, price'. Blank lines and # comments are skipped. Tax is added at the end.\"\"\"\n    subtotal = 0\n    for line in lines:\n        if not line.strip() or line.strip().startswith(\"#\"):\n            continue\n        sku, qty, price = parse_line(line)\n        subtotal += line_total(qty, price, discount_pct)\n    tax = subtotal * TAX_RATE\n    return round(subtotal + tax, 2)\n", "hint": "Run the tests and read which ones fail. Totals too low on multi-line invoices: look at how subtotal is updated inside the loop. The crash: an indented comment line isn't skipped, so parse_line gets it.", "tests": [{"label": "one line", "expr": "invoice_total(['SKU-1, 2, 100'])", "want": "236.0"}, {"label": "several lines add up", "expr": "invoice_total(['A, 1, 100', 'B, 2, 50'])", "want": "236.0"}, {"label": "10% discount", "expr": "invoice_total(['A, 1, 100', 'B, 1, 100'], 10)", "want": "212.4"}, {"label": "blank lines and comments, even indented", "expr": "invoice_total(['# header', '', '   # indented note', 'A, 1, 100'])", "want": "118.0"}, {"label": "empty invoice", "expr": "invoice_total([])", "want": "0"}], "bug": true, "new": [["s.startswith('ab')", "True if s begins with ab"]]}], "13": [{"kind": "py", "title": "PySpark: filter, select, sort", "task": "Write <code>big_orders(df, minimum)<\/code>: return a DataFrame of the rows whose amount is at least <code>minimum<\/code>, with only the columns <code>id<\/code> and <code>amount<\/code>, sorted by amount from highest to lowest.<p class=\"hint\"><code>ORDERS<\/code> has columns id, category, amount (one is null) and customer_id. <code>CUSTOMERS<\/code> has customer_id and city. This runs on ShipCode's practice engine, which accepts real PySpark syntax for the operations in today's lesson. It is not a Spark cluster.<\/p>", "starter": "from pyspark.sql import functions as F\n\n\ndef big_orders(df, minimum):\n    pass\n", "solution": "from pyspark.sql import functions as F\n\n\ndef big_orders(df, minimum):\n    return df.filter(F.col(\"amount\") >= minimum).select(\"id\", \"amount\").orderBy(F.col(\"amount\").desc())\n", "hint": "Chain three methods: .filter(F.col('amount') >= minimum), .select('id', 'amount'), .orderBy(F.col('amount').desc()).", "tests": [{"label": "how many rows", "expr": "big_orders(ORDERS, 100).count()", "want": "3"}, {"label": "rows, highest first", "expr": "[tuple(r) for r in big_orders(ORDERS, 100).collect()]", "want": "[(4, 300.0), (1, 120.0), (3, 100.0)]"}, {"label": "only id and amount", "expr": "big_orders(ORDERS, 500).columns", "want": "['id', 'amount']"}], "prelude": "from pyspark.sql import SparkSession, functions as F\nspark = SparkSession.builder.appName(\"lab\").getOrCreate()\nORDERS = spark.createDataFrame([(1, \"toys\", 120.0, 1), (2, \"books\", 40.0, 2), (3, \"toys\", 100.0, 1), (4, \"games\", 300.0, 3), (5, \"books\", None, 2), (6, \"toys\", 99.5, 9)], [\"id\", \"category\", \"amount\", \"customer_id\"])\nCUSTOMERS = spark.createDataFrame([(1, \"Pune\"), (2, \"Delhi\"), (3, \"Pune\")], [\"customer_id\", \"city\"])\n", "pkgs": true, "new": [["df.select('a', 'b')", "pick columns"], ["df.orderBy('a')", "sort rows (like ORDER BY)"]], "pat": "filter, select, sort", "steps": ["Filter to rows where amount is at least minimum", "Select the id and amount columns", "Order by amount, highest first", "Return the DataFrame"]}, {"kind": "py", "title": "PySpark: groupBy and agg", "task": "Write <code>category_totals(df)<\/code>: return a DataFrame with one row per category and the columns <code>category<\/code>, <code>total<\/code> (sum of amount) and <code>orders<\/code> (number of rows), sorted by total from highest to lowest.<p class=\"hint\"><code>ORDERS<\/code> has columns id, category, amount (one is null) and customer_id. <code>CUSTOMERS<\/code> has customer_id and city. This runs on ShipCode's practice engine, which accepts real PySpark syntax for the operations in today's lesson. It is not a Spark cluster.<\/p>", "starter": "from pyspark.sql import functions as F\n\n\ndef category_totals(df):\n    pass\n", "solution": "from pyspark.sql import functions as F\n\n\ndef category_totals(df):\n    return (df.groupBy(\"category\")\n              .agg(F.sum(\"amount\").alias(\"total\"), F.count(\"*\").alias(\"orders\"))\n              .orderBy(F.col(\"total\").desc()))\n", "hint": "groupBy('category').agg(...) takes several aggregates. Name each with .alias(): F.sum('amount').alias('total') and F.count('*').alias('orders').", "tests": [{"label": "column names", "expr": "category_totals(ORDERS).columns", "want": "['category', 'total', 'orders']"}, {"label": "rows, highest total first", "expr": "[tuple(r) for r in category_totals(ORDERS).collect()]", "want": "[('toys', 319.5, 3), ('games', 300.0, 1), ('books', 40.0, 2)]"}], "prelude": "from pyspark.sql import SparkSession, functions as F\nspark = SparkSession.builder.appName(\"lab\").getOrCreate()\nORDERS = spark.createDataFrame([(1, \"toys\", 120.0, 1), (2, \"books\", 40.0, 2), (3, \"toys\", 100.0, 1), (4, \"games\", 300.0, 3), (5, \"books\", None, 2), (6, \"toys\", 99.5, 9)], [\"id\", \"category\", \"amount\", \"customer_id\"])\nCUSTOMERS = spark.createDataFrame([(1, \"Pune\"), (2, \"Delhi\"), (3, \"Pune\")], [\"customer_id\", \"city\"])\n", "pkgs": true, "new": [["df.orderBy('a')", "sort rows (like ORDER BY)"]], "pat": "group & aggregate", "steps": ["Group by category", "Aggregate: sum of amount named total", "Aggregate: count of rows named orders", "Order by total, highest first"]}, {"kind": "py", "title": "PySpark: clean, join, add a column", "task": "Write <code>city_report(orders, customers)<\/code>: drop orders with a null amount, left-join the customers on <code>customer_id<\/code>, fill a missing city with <code>'Unknown'<\/code>, add a column <code>size<\/code> that is <code>'big'<\/code> when amount is at least 100 and <code>'small'<\/code> otherwise, and return the columns d": "sql", "title": "Free and pro, side by side", "task": "Return each <code>city<\/code> with two columns: <code>free_users<\/code> and <code>pro_users<\/code>, the number of users on each plan in that city.", "starter": "SELECT \n", "solution": "SELECT city, SUM(CASE WHEN plan = 'free' THEN 1 ELSE 0 END) AS free_users, SUM(CASE WHEN plan = 'pro' THEN 1 ELSE 0 END) AS pro_users FROM users GROUP BY city;", "hint": "SUM(CASE WHEN plan = 'free' THEN 1 ELSE 0 END) counts only the free rows in each group.", "ordered": false, "gym": 2, "area": "sql2", "new": ["SUM(CASE WHEN cond THEN 1 ELSE 0 END): count only the rows that match cond, per group"], "tables": ["users"], "rows": 3}, {"kind": "sql", "title": "Ordered in January and February", "task": "Return the <code>customer_id<\/code> of customers who ordered in <b>both<\/b> January 2026 and February 2026. Ignore every other month.", "starter": "SELECT \n", "solution": "SELECT customer_id FROM orders WHERE order_date >= '2026-01-01' AND order_date < '2026-03-01' GROUP BY customer_id HAVING COUNT(DISTINCT strftime('%m', order_date)) = 2;", "hint": "Keep Jan and Feb rows only, GROUP BY customer, then HAVING COUNT(DISTINCT strftime('%m', order_date)) = 2.", "ordered": false, "gym": 2, "area": "sql2", "new": ["COUNT(DISTINCT x): how many different values of x"], "tables": ["orders"], "trap": "Orders from other months or other years must not count towards the two months.", "rows": 1}], "43": [{"kind": "sql", "title": "The NOT IN trap", "task": "Return the <code>name<\/code> of employees who are <b>nobody's manager<\/b>. This query returns zero rows even though such people exist. Fix it.", "starter": "SELECT name FROM employees\nWHERE id NOT IN (SELECT manager_id FROM employees);\n", "solution": "SELECT name FROM employees WHERE id NOT IN (SELECT manager_id FROM employees WHERE manager_id IS NOT NULL);", "hint": "manager_id contains NULL, and x NOT IN (..., NULL) is never true. Exclude the NULLs in the subquery, or use NOT EXIS city<\/code>? Stack both cities lists first <b>without removing repeats<\/b>, then count. Return <code>city<\/code> and <code>people<\/code>.", "starter": "SELECT \n", "solution": "SELECT city, COUNT(*) AS people FROM (SELECT city FROM customers UNION ALL SELECT city FROM users) GROUP BY city;", "hint": "UNION ALL keeps every row. UNION would remove repeats and the counts would be too small.", "ordered": false, "gym": 3, "area": "sql3", "new": ["FROM (SELECT ...): use a query as the table"], "tables": ["customers", "users"], "rows": 3}, {"kind": "sql", "title": "Filter on a window result", "task": "Return each customer's <b>most recent order<\/b>: <code>customer_id<\/code>, <code>order_date<\/code>, <code>amount<\/code> (if two orders share the date, the higher <code>id<\/code> is the latest). This fails with a window-function error. Fix it.", "starter": "SELECT customer_id, order_date, amount FROM orders\nWHERE ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC) = 1;\n", "solution": "WITH r AS (SELECT customer_id, order_date, amount, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC, id DESC) AS rn FROM orders) SELECT customer_id, order_date, amount FROM r WHERE rn = 1;", "hint": "Window functions run after WHERE, so you cannot filter on them there. Compute rn in a CTE, then WHERE rn = 1 outside.", "ordered": false, "gym": 3, "area": "sql3", "new": ["Order SQL runs in: FROM, WHERE, GROUP BY, HAVING, SELECT (windows), ORDER BY, LIMIT"], "tables": ["orders"], "rows": 4}, {"kind": "sql", "title": "WHERE or HAVING?", "task": "Take only people earning <b>more than 45000<\/b>. Then return each <code>dept<\/code> and that average salary, keeping only departments where the average is <b>above 65000<\/b>.", "starter": "SELECT \n", "solution": "SELECT dept, AVG(salary) AS avg_salary FROM employees WHERE salary > 45000 GROUP BY dept HAVING AVG(salary) > 65000;", "hint": "WHERE removes people before grouping; HAVING removes groups after grouping.", "ordered": false, "gym": 3, "area": "sql3", "new": [], "tables": ["employees"], "trap": "WHERE filters rows before the groups are made, HAVING filters the groups. Check which filter belongs to which stage.", "rows": 2}, {"kind": "sql", "title": "Count people, not rows", "task": "How many <b>different users<\/b> made a purchase? Return one number. (Some users have two purchase rows.)", "starter": "SELECT \n", "solution": "SELECT COUNT(DISTINCT user_id) FROM events WHERE event = 'purchase';", "hint": "COUNT(*) counts rows; COUNT(DISTINCT user_id) counts people.", "ordered": false, "gym": 3, "area": "sql3", "new": [], "tables": ["events"], "trap": "A user with two purchase rows must be counted once.", "rows": 1}], "44": [{"kind": "sql", "title": "Read a query plan", "task": "The <code>events<\/code> table has an index on <code>user_id<\/code>. Ask SQLite how it would run <code>SELECT * FROM events WHERE user_id = 3<\/code> by putting <code>EXPLAIN QUERY PLAN<\/code> in front. Run it and read the <b>detail<\/b> column: <code>SEARCH … USING INDEX<\/code> means SQLite jumped straight to the rows; <code>SCAN<\/code> means it read every row.", "starter": "SELECT \n", "solution": "EXPLAIN QUERY PLAN SELECT * FROM events WHERE user_id = 3;", "hint": "Write EXPLAIN QUERY PLAN, then the query on the next words.", "ordered": false, "gym": 4, "area": "sql4", "new": ["EXPLAIN QUERY PLAN <query>: shows how the database will run the query, without running it", "Index: a sorted lookup structure, like a book's index"], "tables": ["events"], "explain": true, "rows": 1}, {"kind": "sql", "title": "Don't wrap the column", "task": "Events in February 2026 are found with <code>strftime('%Y-%m', ts) = '2026-02'<\/code>, which forces a full SCAN even though <code>ts<\/code> has an index. Rewrite the filter as a <b>range on ts<\/b> so the plan says SEARCH. Keep EXPLAIN QUERY PLAN in front.", "starter": "EXPLAIN QUERY PLAN\nSELECT * FROM events\nWHERE strftime('%Y-%m', ts) = '2026-02';\n", "solution": "EXPLAIN QUERY PLAN SELECT * FROM events WHERE ts >= '2026-02-01' AND ts < '2026-03-01';", "hint": "Compare ts itself with a start and end date. A function around the column hides it from the index.", "ordered": false, "gym": 4, "area": "sql4", "new": ["WHERE col >= a AND col < b: a range the index can use", "WHERE f(col) = x: a function on the column usually means a full scan"], "tables": ["events"], "explain": "loose", "rows": 1}, {"kind": "sql", "title": "Read less: a covering index", "task": "How many events does user 3 have? Write the query (<code>COUNT(*)<\/code>) with <code>EXPLAIN QUERY PLAN<\/code> in front. It can be answered from the index alone, so the plan says <b>COVERING INDEX<\/b>: no table rows are read.", "starter": "SELECT \n", "solution": "EXPLAIN QUERY PLAN SELECT COUNT(*) FROM events WHERE user_id = 3;", "hint": "SELECT * must read whole rows. COUNT(*) with a user_id filter only needs the index.", "ordered": false, "gym": 4, "area": "sql4", "new": ["COVERING INDEX: the index alone has every column the query needs, so no table reads", "SELECT only the columns you need: fewer bytes read"], "tables": ["events"], "explain": true, "rows": 1}, {"kind": "sql", "title": "Join using the index", "task": "List each Pune user's <code>name<\/code> and their event names. Write it as <code>FROM users u JOIN events e …<\/code> with <code>EXPLAIN QUERY PLAN<\/code> in front. The plan should SCAN users once and SEARCH events using its index.", "starter": "SELECT \n", "solution": "EXPLAIN QUERY PLAN SELECT u.name, e.event FROM users u JOIN events e ON e.user_id = u.id WHERE u.city = 'Pune';", "hint": "Join on e.user_id = u.id. The index on events.user_id lets SQLite look up each user's events directly.", "ordered": false, "gym": 4, "area": "sql4", "new": ["Index on the join column: turns one scan per row into one lookup per row"], "tables": ["users", "events"], "explain": true, "rows": 2}, {"kind": "design", "title": "Cut the warehouse bill", "gym": 4, "area": "sql4", "new": [], "tables": ["events"], "task": "A dashboard runs this on a 2 TB <code>events<\/code> table in a column-store warehouse every 5 minutes, and the monthly bill has tripled: <code>SELECT * FROM events WHERE DATE(created_at) = CURRENT_DATE - 1 ORDER BY created_at LIMIT 100<\/code>. Walk through how you'd find and fix the cost.", "questions": [["How much data does the query scan today, and what does the bill count?", true], ["Is the table partitioned or clustered, and on which column?", true], ["Who reads this dashboard and how fresh must it be?", true], ["Which BI tool draws the chart?", false], ["Should we rewrite the dashboard in another language?", false], ["What colour is the chart?", false]], "steps": ["Measure first: run a dry run or EXPLAIN and note bytes scanned", "Select only the columns the dashboard shows instead of SELECT *", "Filter on the raw partition column (created_at range) so old partitions are skipped", "Pre-aggregate into a small summary table refreshed on a schedule", "Point the dashboard at the summary table", "Check the new bytes scanned and the cost; set a budget alert"], "trade": [{"q": "Why doesn't LIMIT 100 make the query cheap?", "o": ["The engine may still read all the rows needed to sort them first", "LIMIT only works in SQLite", "LIMIT adds a second scan", "It does, the bill is caused by something else"], "a": 0, "why": "With ORDER BY, the engine usually has to read everything that matches before it can return the first 100. Cutting scanned data means fewer columns and fewer partitions."}, {"q": "The dashboard needs yesterday's totals by hour. Best change?", "o": ["Pre-aggregate hourly totals once and read the small table", "Query the raw table more often", "Add more columns to SELECT", "Remove the date filter"], "a": 0, "why": "Computing once and reading many times turns a 2 TB scan into a tiny read."}, {"q": "How do you know the fix worked?", "o": ["Bytes scanned and cost per run drop, and the numbers still match the old dashboard", "The query looks shorter", "The chart loads once", "Nobody complained"], "a": 0, "why": "Prove it with the same two numbers that showed the problem, plus a correctness check against the old result."}], "model": ["Clarify: what is scanned and billed, how the table is partitioned or clustered, how fresh the dashboard must be.", "Measure first with a dry run or query plan: bytes scanned per run and runs per day.", "Cheap fixes: name only the needed columns, filter on the raw partition column, and drop the pointless sort.", "Structural fix: a scheduled summary table (or materialised view) the dashboard reads, so the big table is scanned once per refresh.", "Verify bytes and cost dropped and totals still match; add a budget alert so a regression is caught early."], "keys": [["partitioned or date filter on the partition column", "partition|date (range|filter)|created_at|filter (on|by) (the )?date|only (yesterday|one day)|prune|skip (old|other)"], ["select only the needed columns, not SELECT *", "select \\*|only the (needed |required )?columns|fewer columns|column|just (the )?(fields|columns)|not everything|stop reading everything"], ["pre-aggregate into a summary table", "pre-?aggregat|summary|rollup|materiali[sz]ed|aggregate table|compute (it )?once|precompute|cache the result|small table"], ["measure bytes scanned first", "bytes|dry.?run|explain|measure|scanned|how much (data|is read)|look at the plan|check (the )?(size|plan)"], ["check cost and correctness afterwards", "cost|bill|budget|verify|match|compare|same (numbers|totals)|still (correct|right)|confirm|alert"]]}], "45": [{"kind": "sql", "title": "Funnel step counts", "task": "From <code>events<\/code>, how many <b>different users<\/b> reached each step? Return <code>event<\/code> and <code>users<\/code> in funnel order: visit, signup, add_to_cart, purchase.", "starter": "SELECT \n", "solution": "SELECT event, COUNT(DISTINCT user_id) AS users FROM events GROUP BY event ORDER BY CASE event WHEN 'visit' THEN 1 WHEN 'signup' THEN 2 WHEN 'add_to_cart' THEN 3 ELSE 4 END;", "hint": "GROUP BY event with COUNT(DISTINCT user_id), then ORDER BY a CASE that gives each step a number.", "ordered": true, "gym": 5, "area": "sql5", "new": ["ORDER BY CASE col WHEN 'a' THEN 1 ... END: sort in your own order"], "tables": ["events"], "trap": "Users who did a step twice (two visits, two purchases) must count once per step.", "rows": 4}, {"kind": "sql", "title": "Percent of the previous step", "task": "Same funnel, with a third column <code>pct_of_previous<\/code>: users at this step as a percentage of users at the step before, rounded to 1 decimal (NULL for the first step).", "starter": "SELECT \n", "solution": "WITH s AS (SELECT CASE event WHEN 'visit' THEN 1 WHEN 'signup' THEN 2 WHEN 'add_to_cart' THEN 3 ELSE 4 END AS step, event, COUNT(DISTINCT user_id) AS users FROM events GROUP BY event) SELECT event, users, ROUND(100.0 * users / LAG(users) OVER (ORDER BY step), 1) AS pct_of_previous FROM s ORDER BY step;", "hint": "Count per step in a CTE, then users divided by LAG(users) OVER (ORDER BY step). Multiply by 100.0 so the division keeps decimals.", "ordered": true, "gym": 5, "area": "sql5", "new": ["100.0 * a / b: the .0 stops SQLite from rounding the division down to a whole number"], "tables": ["events"], "rows": 4}, {"kind": "sql", "title": "Who dropped off", "task": "Return the <code>name<\/code> of users who <b>signed up but never added to cart<\/b>.", "starter": "SELECT \n", "solution": "SELECT u.name FROM users u WHERE EXISTS (SELECT 1 FROM events e WHERE e.user_id = u.id AND e.event = 'signup') AND NOT EXISTS (SELECT 1 FROM events e WHERE e.user_id = u.id AND e.event = 'add_to_cart');", "hint": "EXISTS for a signup event AND NOT EXISTS for an add_to_cart event, both tied to the same user with e.user_id = u.id.", "ordered": false, "gym": 5, "area": "sql5", "new": ["EXISTS (SELECT 1 FROM t WHERE t.x = outer.x): is there at least one matching row?"], "tables": ["users", "events"], "rows": 2}, {"kind": "sql", "title": "Day-7 retention", "task": "What percent of <b>all users<\/b> logged in exactly 7 days after they signed up? Return one number rounded to 1 decimal. Users who never log in still count in the total.", "starter": "SELECT \n", "solution": "SELECT ROUND(100.0 * COUNT(DISTINCT l.user_id) / (SELECT COUNT(*) FROM users), 1) AS d7_retention FROM logins l JOIN users u ON u.id = l.user_id WHERE julianday(l.login_date) - julianday(u.signup_date) = 7;", "hint": "Join logins to users, keep rows where the login is 7 days after signup, count distinct users, divide by ALL users.", "ordered": false, "gym": 5, "area": "sql5", "new": ["retention = people who came back / people who could have come back"], "tables": ["users", "logins"], "trap": "The denominator is every user, not only those who logged in. Also check you count each user once and use exactly 7 days.", "rows": 1}, {"kind": "sql", "title": "Cohort table", "task": "Group users by <b>signup month<\/b> (<code>cohort<\/code>, like 2026-01). For each cohort and <code>month_number<\/code> (0 = the signup month, 1 = the next month, and so on) return <code>active_users<\/code>: how many different users logged in that month. Order by cohort, then month_number.", "starter": "SELECT \n", "solution": "SELECT strftime('%Y-%m', u.signup_date) AS cohort, (CAST(strftime('%Y', l.login_date) AS INTEGER) - CAST(strftime('%Y', u.signup_date) AS INTEGER)) * 12 + CAST(strftime('%m', l.login_date) AS INTEGER) - CAST(strftime('%m', u.signup_date) AS INTEGER) AS month_number, COUNT(DISTINCT l.user_id) AS active_users FROM users u JOIN logins l ON l.user_id = u.id GROUP BY cohort, month_number ORDER BY cohort, month_number;", "hint": "month_number = (login year - signup year) * 12 + (login month - signup month). Join users to logins, GROUP BY cohort and month_number.", "ordered": true, "gym": 5, "area": "sql5", "new": ["CAST(x AS INTEGER): turn the text '03' into the number 3", "GROUP BY an alias (cohort, month_number): allowed in SQLite"], "tables": ["users", "logins"], "trap": "Months must be counted across year boundaries: December to January is month 1, not -11. Use the year in your month arithmetic.", "rows": 6}, {"kind": "sql", "title": "Retention curve", "task": "Turn the cohort table into percentages: for each <code>cohort<\/code> and <code>month_number<\/code>, <code>retention_pct<\/code> = active users in that month as a percent of <b>all users in the cohort<\/b>, rounded to 1 decimal. Order by cohort, month_number.", "starter": "SELECT \n", "solution": "WITH a AS (SELECT strftime('%Y-%m', u.signup_date) AS cohort, (CAST(strftime('%Y', l.login_date) AS INTEGER) - CAST(strftime('%Y', u.signup_date) AS INTEGER)) * 12 + CAST(strftime('%m', l.login_date) AS INTEGER) - CAST(strftime('%m', u.signup_date) AS INTEGER) AS month_number, COUNT(DISTINCT l.user_id) AS active_users FROM users u JOIN logins l ON l.user_id = u.id GROUP BY cohort, month_number), n AS (SELECT strftime('%Y-%m', signup_date) AS cohort, COUNT(*) AS size FROM users GROUP BY cohort) SELECT a.cohort, a.month_number, ROUND(100.0 * a.active_users / n.size, 1) AS retention_pct FROM a JOIN n ON n.cohort = a.cohort ORDER BY a.cohort, a.month_number;", "hint": "Reuse your cohort query as a CTE, add a second CTE with the cohort sizes, join them, and divide.", "ordered": true, "gym": 5, "area": "sql5", "new": [], "tables": ["users", "logins"], "rows": 6}, {"kind": "sql", "title": "A/B test result", "task": "From <code>experiment<\/code>, return for each <code>variant<\/code>: <code>users<\/code>, <code>conversions<\/code> (sum of converted) and <code>rate_pct<\/code> (conversions as a percent of users, 1 decimal). Order by variant.", "starter": "SELECT \n", "solution": "SELECT variant, COUNT(*) AS users, SUM(converted) AS conversions, ROUND(100.0 * SUM(converted) / COUNT(*), 1) AS rate_pct FROM experiment GROUP BY variant ORDER BY variant;", "hint": "GROUP BY variant. converted is 0 or 1, so SUM(converted) counts the conversions.", "ordered": true, "gym": 5, "area": "sql5", "new": [], "tables": ["experiment"], "rows": 2}, {"kind": "sql", "title": "Lift of B over A", "task": "Return one number: the <b>relative lift<\/b> of variant B's conversion rate over A's, as a percent rounded to 1 decimal: (rate B - rate A) / rate A * 100.", "starter": "SELECT \n", "solution": "WITH r AS (SELECT variant, 1.0 * SUM(converted) / COUNT(*) AS rate FROM experiment GROUP BY variant) SELECT ROUND(100.0 * (b.rate - a.rate) / a.rate, 1) AS lift_pct FROM r a JOIN r b ON a.variant = 'A' AND b.variant = 'B';", "hint": "Compute each variant's rate in a CTE, then join the CTE to itself: one copy as A, one as B.", "ordered": false, "gym": 5, "area": "sql5", "new": ["Join a CTE to itself to put two rows side by side"], "tables": ["experiment"], "rows": 1}], "51": [{"kind": "py", "title": "FizzBuzz list", "task": "Write <code>fizzbuzz(n)<\/code>: return a list for the numbers 1 to n. Use <code>'FizzBuzz'<\/code> for multiples of 15, <code>'Fizz'<\/code> for multiples of 3, <code>'Buzz'<\/code> for multiples of 5, otherwise the number itself as text.", "starter": "def fizzbuzz(n):\n    pass\n", "solution": "def fizzbuzz(n):\n    out = []\n    for i in range(1, n + 1):\n        if i % 15 == 0:\n            out.append('FizzBuzz')\n        elif i % 3 == 0:\n            out.append('Fizz')\n        elif i % 5 == 0:\n            out.append('Buzz')\n        else:\n            out.append(str(i))\n    return out\n", "hint": "Check the multiples of 15 first, or 15 would be called just 'Fizz'.", "tests": [{"label": "n = 5", "expr": "fizzbuzz(5)", "want": "['1', '2', 'Fizz', '4', 'Buzz']"}, {"label": "hits 15", "expr": "fizzbuzz(15)[-3:]", "want": "['13', '14', 'FizzBuzz']"}, {"label": "n = 0", "expr": "fizzbuzz(0)", "want": "[]"}, {"label": "n = 1", "expr": "fizzbuzz(1)", "want": "['1']"}], "steps": ["Make an empty list", "Loop i from 1 to n", "Check 15 first, then 3, then 5", "Otherwise append the number as text, then return the list"], "fuzz": ["fizzbuzz", "(R.randint(0, 40),)"], "gym": 1, "gk": "py", "gname": "Python Gym", "area": "py1"}, {"kind": "py", "title": "Count the words", "task": "Write <code>word_count(text)<\/code>: return how many words are in <code>text<\/code>. Words are separated by spaces; extra spaces and an empty text must work.", "starter": "def word_count(text):\n    pass\n", "solution": "def word_count(text):\n    return len(text.split())\n", "hint": "str.split() with no argument ignores repeated spaces.", "tests": [{"label": "basic", "expr": "word_count('the quick brown fox')", "want": "4"}, {"label": "extra spaces", "expr": "word_count('  a   b  ')", "want": "2"}, {"label": "empty", "expr": "word_count('')", "want": "0"}, {"label": "one word", "expr": "word_count('hello')", "want": "1"}], "steps": ["Split the text on whitespace", "Count the pieces"], "fuzz": ["word_count", "(' '.join('w' * R.randint(1, 3) for _ in range(R.randint(0, 5))),)"], "gym": 1, "gk": "py", "gname": "Python Gym", "area": "py1"}, {"kind": "py", "title": "Tidy the names", "task": "Write <code>clean_names(names)<\/code>: for each name, trim spaces and capitalise each word (<code>'  asha RAO '<\/code> becomes <code>'Asha Rao'<\/code>). Drop names that are empty after trimming. Keep the order.", "starter": "def clean_names(names):\n    pass\n", "solution": "def clean_names(names):\n    out = []\n    for n in names:\n        n = n.strip()\n        if n:\n            out.append(n.title())\n    return out\n", "hint": "strip() trims, title() capitalises each word. An empty string is falsy.", "tests": [{"label": "basic", "expr": "clean_names(['  asha RAO ', 'dev'])", "want": "['Asha Rao', 'Dev']"}, {"label": "drops blanks", "expr": "clean_names(['a', '   ', '', 'b'])", "want": "['A', 'B']"}, {"label": "empty list", "expr": "clean_names([])", "want": "[]"}, {"label": "keeps order", "expr": "clean_names(['zed', 'amy'])", "want": "['Zed', 'Amy']"}], "steps": ["Make a
