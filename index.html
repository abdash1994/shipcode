const LABS={"1": [{"kind": "py", "title": "Sum, difference, average", "task": "Write a <b>whole program<\/b> (not a function). Read two whole numbers with <code>input()<\/code>, one per line. Print their sum, then their difference (first minus second), then their average, each on its own line.", "starter": "# read two numbers, then print three lines\n", "solution": "a = int(input(\"First: \"))\nb = int(input(\"Second: \"))\nprint(a + b)\nprint(a - b)\nprint((a + b) / 2)\n", "hint": "input() gives text. Wrap it in int(). The average uses / so it prints as 4.0.", "tests": [{"label": "inputs 3 and 5", "stdin": ["3", "5"], "out": "8\n-2\n4.0"}, {"label": "inputs 10 and 4", "stdin": ["10", "4"], "out": "14\n6\n7.0"}, {"label": "inputs -2 and 2", "stdin": ["-2", "2"], "out": "0\n-4\n0.0"}], "pat": "read input & print", "steps": ["Read the first line and turn it into an int", "Read the second line and turn it into an int", "Print the sum", "Print the difference", "Print the average"]}, {"kind": "py", "title": "Fix the bug: birthday message", "task": "This program crashes. Run it first and read the error, then fix it. For the input <code>Asha<\/code> and <code>30<\/code> it must print <code>Hi Asha, next year you'll be 31<\/code>.", "starter": "name = input(\"Name: \")\nage = input(\"Age: \")\nprint(\"Hi \" + name + \", next year you'll be \" + age + 1)\n", "solution": "name = input(\"Name: \")\nage = int(input(\"Age: \"))\nprint(f\"Hi {name}, next year you'll be {age + 1}\")\n", "hint": "age is a string. Convert it with int() before adding 1, and turn the number back into text with str() or an f-string.", "tests": [{"label": "Asha, 30", "stdin": ["Asha", "30"], "out": "Hi Asha, next year you'll be 31"}, {"label": "Ravi, 9", "stdin": ["Ravi", "9"], "out": "Hi Ravi, next year you'll be 10"}], "bug": true}], "2": [{"kind": "py", "title": "FizzBuzz as a function", "task": "Write <code>fizzbuzz(n)<\/code> that <b>returns a list of strings<\/b> for the numbers 1 to n: <code>\"Fizz\"<\/code> for multiples of 3, <code>\"Buzz\"<\/code> for multiples of 5, <code>\"FizzBuzz\"<\/code> for both, otherwise the number as a string.", "starter": "def fizzbuzz(n):\n    result = []\n    # your loop here\n    return result\n", "solution": "def fizzbuzz(n):\n    result = []\n    for i in range(1, n + 1):\n        if i % 15 == 0:\n            result.append(\"FizzBuzz\")\n        elif i % 3 == 0:\n            result.append(\"Fizz\")\n        elif i % 5 == 0:\n            result.append(\"Buzz\")\n        else:\n            result.append(str(i))\n    return result\n", "hint": "range(1, n + 1) includes n. Check 15 first. Use str(i) for plain numbers.", "tests": [{"label": "fizzbuzz(5)", "expr": "fizzbuzz(5)", "want": "['1', '2', 'Fizz', '4', 'Buzz']"}, {"label": "fizzbuzz(15)[-1]", "expr": "fizzbuzz(15)[-1]", "want": "'FizzBuzz'"}, {"label": "fizzbuzz(0)", "expr": "fizzbuzz(0)", "want": "[]"}], "fuzz": ["fizzbuzz", "(R.randint(1, 40),)"], "pat": "loop & build a list", "steps": ["Make an empty result list", "Loop i from 1 to n, including n", "If i divides by 15 add FizzBuzz, else by 3 add Fizz, else by 5 add Buzz", "Otherwise add str(i)", "Return the list"]}, {"kind": "py", "title": "Digit sum with a while loop", "task": "Write <code>digit_sum(n)<\/code> that returns the sum of the digits of a non-negative integer, using a <code>while<\/code> loop with <code>% 10<\/code> and <code>// 10<\/code> (no converting to a string).", "starter": "def digit_sum(n):\n    total = 0\n    \n    return total\n", "solution": "def digit_sum(n):\n    total = 0\n    while n > 0:\n        total += n % 10\n        n //= 10\n    return total\n", "hint": "n % 10 is the last digit. n // 10 removes it. Stop when n reaches 0.", "tests": [{"label": "digit_sum(1234)", "expr": "digit_sum(1234)", "want": "10"}, {"label": "digit_sum(9)", "expr": "digit_sum(9)", "want": "9"}, {"label": "digit_sum(0)", "expr": "digit_sum(0)", "want": "0"}, {"label": "digit_sum(1000001)", "expr": "digit_sum(1000001)", "want": "2"}], "fuzz": ["digit_sum", "(R.randint(0, 10**6),)"], "pat": "while loop", "steps": ["Start total at 0", "Repeat while n is above 0", "Add the last digit (n % 10) to total", "Remove the last digit (n // 10)", "Return total"]}, {"kind": "py", "title": "Fix the bug: the loop that never ends", "task": "Run this. It never finishes, so the runner stops it. Find out why and fix it so <code>countdown(3)<\/code> returns <code>[3, 2, 1]<\/code>.", "starter": "def countdown(n):\n    out = []\n    while n > 0:\n        out.append(n)\n    return out\n", "solution": "def countdown(n):\n    out = []\n    while n > 0:\n        out.append(n)\n        n -= 1\n    return out\n", "hint": "The condition n > 0 never becomes False because n never changes inside the loop.", "tests": [{"label": "countdown(3)", "expr": "countdown(3)", "want": "[3, 2, 1]"}, {"label": "countdown(0)", "expr": "countdown(0)", "want": "[]"}], "bug": true}], "3": [{"kind": "py", "title": "Reverse the words", "task": "Write <code>reverse_words(s)<\/code>: return the words of <code>s<\/code> in reverse order, separated by single spaces, with no spaces at the ends. (LeetCode 151.)", "starter": "def reverse_words(s):\n    pass\n", "solution": "def reverse_words(s):\n    return \" \".join(s.split()[::-1])\n", "hint": "split() with no argument handles any amount of whitespace. Then reverse the list and join it.", "tests": [{"label": "'the sky is blue'", "expr": "reverse_words('the sky is blue')", "want": "'blue is sky the'"}, {"label": "extra spaces", "expr": "reverse_words('  hello   world  ')", "want": "'world hello'"}, {"label": "one word", "expr": "reverse_words('a')", "want": "'a'"}], "fuzz": ["reverse_words", "(''.join(R.choice(['a', 'bb', 'sky', 'blue', ' ', '  ']) for _ in range(R.randint(0, 7))),)"], "pat": "string methods", "steps": ["Split the string into words (this handles extra spaces)", "Reverse the list of words", "Join them with single spaces and return the result"]}, {"kind": "py", "title": "Valid palindrome", "task": "Write <code>is_palindrome(s)<\/code>: ignoring case and anything that isn't a letter or digit, does <code>s<\/code> read the same backwards? (LeetCode 125.)", "starter": "def is_palindrome(s):\n    pass\n", "solution": "def is_palindrome(s):\n    clean = [c.lower() for c in s if c.isalnum()]\n    return clean == clean[::-1]\n", "hint": "Build a cleaned list or string with c.isalnum() and c.lower(), then compare it with its reverse.", "tests": [{"label": "Panama", "expr": "is_palindrome('A man, a plan, a canal: Panama')", "want": "True"}, {"label": "race a car", "expr": "is_palindrome('race a car')", "want": "False"}, {"label": "just a space", "expr": "is_palindrome(' ')", "want": "True"}, {"label": "0P", "expr": "is_palindrome('0P')", "want": "False"}], "fuzz": ["is_palindrome", "(''.join(R.choice('aAb ,1') for _ in range(R.randint(0, 6))),)"], "pat": "string methods", "steps": ["Keep only letters and digits, lowercased", "Make a reversed copy", "Return whether the two are equal"]}, {"kind": "py", "title": "Fix the bug: duplicates survive", "task": "This should remove duplicates while keeping the first-seen order, but it returns the list unchanged. It doesn't crash: the logic is wrong. Fix it.", "starter": "def dedupe(xs):\n    seen = []\n    result = []\n    for x in xs:\n        if x not in seen:\n            result.append(x)\n    return result\n", "solution": "def dedupe(xs):\n    seen = set()\n    result = []\n    for x in xs:\n        if x not in seen:\n            seen.add(x)\n            result.append(x)\n    return result\n", "hint": "Nothing is ever added to seen. A set also makes the membership check O(1).", "tests": [{"label": "dedupe([1, 2, 1, 3, 2])", "expr": "dedupe([1, 2, 1, 3, 2])", "want": "[1, 2, 3]"}, {"label": "strings", "expr": "dedupe(['b', 'a', 'b'])", "want": "['b', 'a']"}, {"label": "empty", "expr": "dedupe([])", "want": "[]"}], "bug": true}], "4": [{"kind": "py", "title": "Two Sum in one pass", "task": "Write <code>two_sum(nums, target)<\/code>: return the indexes <code>[i, j]<\/code> (i &lt; j) of the two numbers that add up to target. Exactly one answer exists. Aim for O(n) with a dict. (LeetCode 1.)", "starter": "def two_sum(nums, target):\n    seen = {}   # value -> index\n    \n", "solution": "def two_sum(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target - x in seen:\n            return [seen[target - x], i]\n        seen[x] = i\n", "hint": "For each x, check whether target - x is already in the dict before you store x.", "tests": [{"label": "[2,7,11,15], 9", "expr": "two_sum([2, 7, 11, 15], 9)", "want": "[0, 1]"}, {"label": "[3,2,4], 6", "expr": "two_sum([3, 2, 4], 6)", "want": "[1, 2]"}, {"label": "[3,3], 6", "expr": "two_sum([3, 3], 6)", "want": "[0, 1]"}, {"label": "negatives", "expr": "two_sum([-3, 4, 3, 90], 0)", "want": "[0, 2]"}, {"label": "large input (must be fast)", "expr": "two_sum(list(range(3000)), 5997)", "want": "[2998, 2999]"}], "pat": "hash map / set", "steps": ["Make an empty dict of value to index", "Loop over nums with their indexes", "If target minus x is already in the dict, return [its index, i]", "Otherwise store x with its index i"]}, {"kind": "py", "title": "Word count", "task": "Write <code>word_count(text)<\/code>: return a dict mapping each lowercase word to how many times it appears. Words are separated by whitespace.", "starter": "def word_count(text):\n    counts = {}\n    \n    return counts\n", "solution": "def word_count(text):\n    counts = {}\n    for w in text.lower().split():\n        counts[w] = counts.get(w, 0) + 1\n    return counts\n", "hint": "Lowercase first, split, then counts[w] = counts.get(w, 0) + 1.", "tests": [{"label": "'The cat the'", "expr": "word_count('The cat the')", "want": "{'the': 2, 'cat': 1}"}, {"label": "empty", "expr": "word_count('')", "want": "{}"}, {"label": "spacing", "expr": "word_count('a  b\\na')", "want": "{'a': 2, 'b': 1}"}], "fuzz": ["word_count", "(' '.join(R.choice(['The', 'the', 'cat', 'Cat', 'a']) for _ in range(R.randint(0, 6))),)"], "pat": "hash map / set", "steps": ["Make an empty dict", "Lowercase the text and split it into words", "For each word, add 1 to its count (starting from 0)", "Return the dict"]}, {"kind": "py", "title": "Valid anagram", "task": "Write <code>is_anagram(s, t)<\/code>: True if t uses exactly the same letters as s, the same number of times. (LeetCode 242.)", "starter": "def is_anagram(s, t):\n    pass\n", "solution": "from collections import Counter\n\ndef is_anagram(s, t):\n    return Counter(s) == Counter(t)\n", "hint": "Compare letter counts: Counter(s) == Counter(t), or sorted(s) == sorted(t).", "tests": [{"label": "anagram/nagaram", "expr": "is_anagram('anagram', 'nagaram')", "want": "True"}, {"label": "rat/car", "expr": "is_anagram('rat', 'car')", "want": "False"}, {"label": "different lengths", "expr": "is_anagram('aa', 'a')", "want": "False"}], "fuzz": ["is_anagram", "(''.join(R.choice('abc') for _ in range(R.randint(0, 4))), ''.join(R.choice('abc') for _ in range(R.randint(0, 4))))"], "pat": "hash map / set", "steps": ["Count the letters in s", "Count the letters in t", "Return whether the two counts match"]}], "5": [{"kind": "py", "title": "Safe divide", "task": "Write <code>safe_divide(a, b)<\/code>: return <code>a / b<\/code>, or <code>None<\/code> if b is zero. Use <code>try/except<\/code> with the specific error type, not a bare <code>except<\/code>.", "starter": "def safe_divide(a, b):\n    pass\n", "solution": "def safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n", "hint": "Dividing by zero raises ZeroDivisionError.", "tests": [{"label": "10 / 4", "expr": "safe_divide(10, 4)", "want": "2.5"}, {"label": "divide by zero", "expr": "safe_divide(1, 0)", "want": "None"}, {"label": "negative", "expr": "safe_divide(-9, 3)", "want": "-3.0"}], "pat": "try/except", "steps": ["Try to return a divided by b", "If ZeroDivisionError happens, return None"]}, {"kind": "py", "title": "Fix the bug: KeyError", "task": "Run it and read the traceback. Fix <code>total_by_category<\/code> so it returns the total amount for each category.", "starter": "def total_by_category(rows):\n    totals = {}\n    for r in rows:\n        totals[r[\"category\"]] += r[\"amount\"]\n    return totals\n", "solution": "def total_by_category(rows):\n    totals = {}\n    for r in rows:\n        totals[r[\"category\"]] = totals.get(r[\"category\"], 0) + r[\"amount\"]\n    return totals\n", "hint": "The first time a category appears it isn't in the dict yet, so += fails. Use .get(key, 0).", "tests": [{"label": "food and rent", "expr": "total_by_category([{'category': 'food', 'amount': 10}, {'category': 'rent', 'amount': 100}, {'category': 'food', 'amount': 5}])", "want": "{'food': 15, 'rent': 100}"}, {"label": "no rows", "expr": "total_by_category([])", "want": "{}"}], "bug": true}, {"kind": "py", "title": "Running sum", "task": "Write <code>running_sum(nums)<\/code>: element i of the result is the sum of nums[0] through nums[i]. (LeetCode 1480.)", "starter": "def running_sum(nums):\n    pass\n", "solution": "def running_sum(nums):\n    out, total = [], 0\n    for x in nums:\n        total += x\n        out.append(total)\n    return out\n", "hint": "Keep a running total and append it each step.", "tests": [{"label": "[1,2,3,4]", "expr": "running_sum([1, 2, 3, 4])", "want": "[1, 3, 6, 10]"}, {"label": "[3,1,2,10,1]", "expr": "running_sum([3, 1, 2, 10, 1])", "want": "[3, 4, 6, 16, 17]"}, {"label": "empty", "expr": "running_sum([])", "want": "[]"}], "fuzz": ["running_sum", "([R.randint(-5, 9) for _ in range(R.randint(0, 7))],)"], "pat": "running total", "steps": ["Start an empty result list and a total of 0", "For each number, add it to total", "Append the total to the result", "Return the result"]}], "6": [{"kind": "py", "title": "Totals from a CSV file", "task": "A file <code>expenses.csv<\/code> exists with columns <code>date,category,amount<\/code>. Write <code>category_totals(path)<\/code> that reads it with <code>csv.DictReader<\/code> and returns a dict of category to total amount (as a float). <b>Skip rows whose amount is blank.<\/b>", "starter": "import csv\n\ndef category_totals(path):\n    totals = {}\n    \n    return totals\n", "solution": "import csv\n\ndef category_totals(path):\n    totals = {}\n    with open(path) as f:\n        for row in csv.DictReader(f):\n            if not row[\"amount\"].strip():\n                continue\n            amt = float(row[\"amount\"])\n            totals[row[\"category\"]] = totals.get(row[\"category\"], 0) + amt\n    return totals\n", "hint": "Every value from DictReader is a string. Check for a blank amount before float(), or you get ValueError.", "tests": [{"label": "expenses.csv", "expr": "category_totals('expenses.csv')", "want": "{'food': 22.5, 'travel': 40.0}"}, {"label": "returns floats", "expr": "type(category_totals('expenses.csv')['travel']).__name__", "want": "'float'"}], "files": {"expenses.csv": "date,category,amount\n2026-01-01,food,12.50\n2026-01-02,travel,40\n2026-01-03,food,\n2026-01-04,food,10\n"}, "pat": "file reading", "steps": ["Open the file with with open()", "Read the rows with csv.DictReader", "Skip a row if its amount is blank", "Convert the amount to float and add it to that category's total", "Return the totals"]}, {"kind": "py", "title": "Save and load JSON", "task": "Write <code>save(data, path)<\/code> that writes a dict to a JSON file, and <code>load(path)<\/code> that reads it back and returns the dict. Use <code>with open()<\/code> and the <code>json<\/code> module.", "starter": "import json\n\ndef save(data, path):\n    pass\n\ndef load(path):\n    pass\n", "solution": "import json\n\ndef save(data, path):\n    with open(path, \"w\") as f:\n        json.dump(data, f)\n\ndef load(path):\n    with open(path) as f:\n        return json.load(f)\n", "hint": "Open with \"w\" to write. json.dump(data, f) writes; json.load(f) reads. (dumps/loads are for strings.)", "tests": [{"label": "round trip", "expr": "(save({'total': 3.5, 'items': [1, 2]}, 'out.json'), load('out.json'))[1]", "want": "{'total': 3.5, 'items': [1, 2]}"}, {"label": "overwrites", "expr": "(save({'a': 1}, 'o.json'), save({'b': 2}, 'o.json'), load('o.json'))[2]", "want": "{'b': 2}"}], "pat": "file reading", "steps": ["save: open the path for writing", "save: json.dump the data into the file", "load: open the path for reading", "load: return json.load of the file"], "free": true}, {"kind": "design", "scope": true, "title": "Scope it: the weekly report nobody trusts", "task": "<b>From Ops:<\/b> \"Every Monday someone spends 3 hours merging CSVs from the shared drive into a report, and it's often wrong. Can you automate it?\" Turn this into a plan before you write a line of code.", "questions": [["What exact numbers does the report show, and who reads it?", true], ["Where do the CSVs come from, and do their columns ever change?", true], ["What does \"wrong\" mean: missing files, duplicates, or bad totals?", true], ["Should we use Excel or Google Sheets for the code?", false], ["Can we rewrite it in Java?", false], ["What font should the report use?", false]], "steps": ["Get last month's report and the raw CSVs as a known-good example", "List the files and check every one has the expected columns", "Read and clean each file: skip blanks, fix number formats", "Combine and calculate the totals", "Compare with last month's manual report and explain any difference", "Write the report file and schedule it weekly"], "trade": [{"q": "One CSV sometimes arrives with a renamed column. What should the script do?", "o": ["Stop with a clear error naming the file and the column", "Skip that file quietly", "Guess which column it is", "Fill the totals with zeros"], "a": 0, "why": "A report that's silently wrong is worse than one that's late. Fail loudly and say exactly what to fix."}, {"q": "How do you prove the automated report is right?", "o": ["Run it on last month's data and match the manual numbers", "Trust it because the code runs", "Ask Ops if it looks fine", "Count the rows"], "a": 0, "why": "A known-good example is your test. It's the same idea as the tests in every lab."}], "model": ["Clarify: the numbers, the readers, the sources, and what \"wrong\" has meant so far.", "Start from a known-good example: last month's report plus its raw files.", "Pipeline: check files and columns → clean → combine → totals → compare → write.", "Fail loudly on missing files or changed columns; never produce a silently wrong report.", "Done when it matches last month to the cent and runs every Monday without anyone touching it."], "keys": [["what you'd clarify first (the numbers, the readers, the sources)", "clarif|ask|who reads|which numbers|source|what .*wrong"], ["a known-good example to compare against", "last month|known.good|example|manual report|compar"], ["checking the files and columns", "column|file|schema|missing"], ["failing loudly, not a silently wrong report", "fail|error|stop|alert|loud|flag"], ["how you'd know it's done", "match|schedul|monday|weekly|automat"]]}], "7": [{"kind": "py", "title": "Bank account class", "task": "Write a class <code>BankAccount<\/code>: <code>BankAccount(100)<\/code> starts with <code>balance<\/code> 100. <code>deposit(x)<\/code> adds x. <code>withdraw(x)<\/code> subtracts x, but raises <code>ValueError<\/code> if x is more than the balance (and leaves the balance unchanged).", "starter": "class BankAccount:\n    def __init__(self, balance):\n        pass\n", "solution": "class BankAccount:\n    def __init__(self, balance):\n        self.balance = balance\n\n    def deposit(self, x):\n        self.balance += x\n\n    def withdraw(self, x):\n        if x > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= x\n", "hint": "Store the balance on self. raise ValueError(\"...\") stops the method before the subtraction.", "tests": [{"label": "starts at 100", "expr": "BankAccount(100).balance", "want": "100"}, {"label": "deposit 50, withdraw 20", "expr": "(lambda a: (a.deposit(50), a.withdraw(20), a.balance)[-1])(BankAccount(100))", "want": "130"}, {"label": "overdraw raises ValueError", "expr": "_raises(lambda: BankAccount(10).withdraw(50), ValueError)", "want": "True"}, {"label": "balance unchanged after failed withdraw", "expr": "(lambda a: (_raises(lambda: a.withdraw(50), ValueError), a.balance)[-1])(BankAccount(10))", "want": "10"}], "pat": "class with methods", "steps": ["__init__: store the starting balance on self", "deposit: add x to self.balance", "withdraw: if x is more than the balance, raise ValueError", "withdraw: otherwise subtract x"], "free": true}, {"kind": "py", "title": "Stack class", "task": "Write a class <code>Stack<\/code> with <code>push(x)<\/code>, <code>pop()<\/code> (returns the top item), <code>peek()<\/code> (returns the top without removing it), <code>is_empty()<\/code> and <code>__len__<\/code>.", "starter": "class Stack:\n    def __init__(self):\n        self.items = []\n", "solution": "class Stack:\n    def __init__(self):\n        self.items = []\n\n    def push(self, x):\n        self.items.append(x)\n\n    def pop(self):\n        return self.items.pop()\n\n    def peek(self):\n        return self.items[-1]\n\n    def is_empty(self):\n        return len(self.items) == 0\n\n    def __len__(self):\n        return len(self.items)\n", "hint": "A Python list already behaves like a stack: append adds to the end, pop() removes from the end, [-1] reads the end.", "tests": [{"label": "push 1, 2 then pop", "expr": "(lambda s: (s.push(1), s.push(2), s.pop())[-1])(Stack())", "want": "2"}, {"label": "peek doesn't remove", "expr": "(lambda s: (s.push(7), s.peek(), len(s))[1:])(Stack())", "want": "(7, 1)"}, {"label": "new stack is empty", "expr": "Stack().is_empty()", "want": "True"}], "pat": "class with methods", "steps": ["__init__: start with an empty list", "push: append to the list", "pop: remove and return the last item", "peek: return the last item without removing it", "is_empty and __len__: use len(self.items)"], "free": true}], "8": [{"kind": "sql", "title": "Filter and sort", "task": "From <code>employees<\/code>, return <code>name<\/code> and <code>salary<\/code> of people in the Sales department earning more than 50000. Highest salary first; break ties by name A to Z.", "starter": "SELECT \n", "solution": "SELECT name, salary FROM employees WHERE dept = 'Sales' AND salary > 50000 ORDER BY salary DESC, name;", "hint": "WHERE dept = 'Sales' AND salary > 50000, then ORDER BY salary DESC, name.", "ordered": true, "rows": 3}, {"kind": "sql", "title": "Find the NULLs", "task": "Return the <code>name<\/code> of every employee who has no manager.", "starter": "SELECT \n", "solution": "SELECT name FROM employees WHERE manager_id IS NULL;", "hint": "= NULL never matches. Use IS NULL.", "ordered": false, "rows": 3}, {"kind": "sql", "title": "IN and IS NOT NULL", "task": "Return <code>name<\/code> and <code>email<\/code> of customers in Hyderabad or Pune who have an email address.", "starter": "SELECT \n", "solution": "SELECT name, email FROM customers WHERE city IN ('Hyderabad', 'Pune') AND email IS NOT NULL;", "hint": "city IN ('Hyderabad', 'Pune') AND email IS NOT NULL.", "ordered": false, "rows": 3}], "9": [{"kind": "sql", "title": "GROUP BY with HAVING", "task": "For each department with <b>at least 3<\/b> employees, return <code>dept<\/code>, the number of employees, and the average salary.", "starter": "SELECT \n", "solution": "SELECT dept, COUNT(*), AVG(salary) FROM employees GROUP BY dept HAVING COUNT(*) >= 3;", "hint": "Group by dept, then filter groups with HAVING COUNT(*) >= 3.", "ordered": false, "rows": 2}, {"kind": "sql", "title": "Big spenders", "task": "From <code>orders<\/code>, return <code>customer_id<\/code> and the total <code>amount<\/code> for customers whose total is over 100.", "starter": "SELECT \n", "solution": "SELECT customer_id, SUM(amount) FROM orders GROUP BY customer_id HAVING SUM(amount) > 100;", "hint": "SUM(amount) per customer_id, filtered with HAVING.", "ordered": false, "rows": 2}, {"kind": "sql", "title": "CASE labels", "task": "Return each order's <code>id<\/code> and a label: <code>'big'<\/code> if amount is 100 or more, otherwise <code>'small'<\/code>.", "starter": "SELECT \n", "solution": "SELECT id, CASE WHEN amount >= 100 THEN 'big' ELSE 'small' END FROM orders;", "hint": "CASE WHEN amount >= 100 THEN 'big' ELSE 'small' END", "ordered": false, "rows": 7}], "10": [{"kind": "sql", "title": "Anti-join", "task": "Return the <code>name<\/code> of every customer who has never placed an order.", "starter": "SELECT \n", "solution": "SELECT c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL;", "hint": "LEFT JOIN orders, then keep rows where the order side IS NULL.", "ordered": false, "rows": 1}, {"kind": "sql", "title": "Self join", "task": "Return each employee's <code>name<\/code> and their manager's name. Employees without a manager should still appear, with NULL as the manager.", "starter": "SELECT \n", "solution": "SELECT e.name, m.name FROM employees e LEFT JOIN employees m ON e.manager_id = m.id;", "hint": "Alias the table twice: employees e LEFT JOIN employees m ON e.manager_id = m.id.", "ordered": false, "rows": 10}, {"kind": "sql", "title": "Count including zero", "task": "Return every customer's <code>name<\/code> and how many orders they have placed. Customers with no orders must show <b>0<\/b>.", "starter": "SELECT \n", "solution": "SELECT c.name, COUNT(o.id) FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id, c.name;", "hint": "COUNT(*) counts the NULL row as 1. COUNT(o.id) skips NULLs and gives 0.", "ordered": false, "rows": 5}], "11": [{"kind": "sql", "title": "Top 2 salaries per department", "task": "Return <code>name<\/code>, <code>dept<\/code> and <code>salary<\/code> for employees whose salary is among the top 2 <b>distinct<\/b> salaries in their department. Ignore employees with no salary.", "starter": "SELECT \n", "solution": "WITH r AS (SELECT name, dept, salary, DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk FROM employees WHERE salary IS NOT NULL) SELECT name, dept, salary FROM r WHERE rnk <= 2;", "hint": "DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) inside a CTE, then WHERE rnk <= 2 outside.", "ordered": false, "rows": 7}, {"kind": "sql", "title": "Running total", "task": "Return <code>order_date<\/code>, <code>amount<\/code> and a running total of amount, ordered by date.", "starter": "SELECT \n", "solution": "SELECT order_date, amount, SUM(amount) OVER (ORDER BY order_date) FROM orders ORDER BY order_date;", "hint": "SUM(amount) OVER (ORDER BY order_date)", "ordered": true, "rows": 7}, {"kind": "sql", "title": "Second highest salary", "task": "Return the second highest <b>distinct<\/b> salary in the company as a single value. (LeetCode 176.)", "starter": "SELECT \n", "solution": "SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees);", "hint": "The max of everything below the max. Or DISTINCT salary ORDER BY salary DESC LIMIT 1 OFFSET 1.", "ordered": false, "rows": 1}], "12": [{"kind": "py", "title": "What groupby does underneath", "task": "pandas <code>groupby(\"category\")[\"amount\"].sum()<\/code> is this loop. Write <code>group_sum(rows, key, value)<\/code>: rows is a list of dicts; return a dict of each key's value to the sum of its values. (Practise real pandas in Colab today too.)", "starter": "def group_sum(rows, key, value):\n    pass\n", "solution": "def group_sum(rows, key, value):\n    out = {}\n    for r in rows:\n        out[r[key]] = out.get(r[key], 0) + r[value]\n    return out\n", "hint": "Same pattern as word count, but the key and value column names are parameters: r[key], r[value].", "tests": [{"label": "by category", "expr": "group_sum([{'c': 'a', 'v': 1}, {'c': 'b', 'v': 2}, {'c': 'a', 'v': 3}], 'c', 'v')", "want": "{'a': 4, 'b': 2}"}, {"label": "empty", "expr": "group_sum([], 'c', 'v')", "want": "{}"}], "pat": "hash map / set", "steps": ["Make an empty dict", "For each row, read its key and its number", "Add the number to that key's total (starting from 0)", "Return the dict"]}, {"kind": "py", "title": "pandas: filter rows, pick columns, sort", "task": "Write <code>big_orders(df, minimum)<\/code>: return the rows whose amount is at least <code>minimum<\/code>, keeping only the columns <code>id<\/code> and <code>amount<\/code>, sorted by amount from highest to lowest.<p class=\"hint\"><code>ORDERS<\/code> has columns id, category, amount (one is missing) and customer_id. <code>CUSTOMERS<\/code> has customer_id and city. pandas is imported as <code>pd<\/code>.<\/p>", "starter": "def big_orders(df, minimum):\n    pass\n", "solution": "def big_orders(df, minimum):\n    big = df[df[\"amount\"] >= minimum]\n    return big[[\"id\", \"amount\"]].sort_values(\"amount\", ascending=False)\n", "hint": "Three moves: a mask in square brackets to filter, double brackets to pick columns, then sort_values with ascending=False.", "tests": [{"label": "how many rows", "expr": "len(big_orders(ORDERS, 100))", "want": "3"}, {"label": "rows, highest first", "expr": "big_orders(ORDERS, 100).to_dict('records')", "want": "[{'id': 4, 'amount': 300.0}, {'id': 1, 'amount': 120.0}, {'id': 3, 'amount': 100.0}]"}, {"label": "only id and amount", "expr": "list(big_orders(ORDERS, 500).columns)", "want": "['id', 'amount']"}], "prelude": "import pandas as pd\nORDERS = pd.DataFrame({\"id\": [1, 2, 3, 4, 5, 6], \"category\": [\"toys\", \"books\", \"toys\", \"games\", \"books\", \"toys\"], \"amount\": [120.0, 40.0, 100.0, 300.0, None, 99.5], \"customer_id\": [1, 2, 1, 3, 2, 9]})\nCUSTOMERS = pd.DataFrame({\"customer_id\": [1, 2, 3], \"city\": [\"Pune\", \"Delhi\", \"Pune\"]})\n", "pkgs": true, "pat": "filter, select, sort", "steps": ["Build a True/False mask: amount is at least minimum", "Keep the rows where the mask is True", "Keep only the id and amount columns", "Sort by amount, highest first, and return it"]}, {"kind": "py", "title": "pandas: group and total", "task": "Write <code>revenue_by_category(df)<\/code>: return a dict of category to total amount. A missing amount counts as nothing.<p class=\"hint\"><code>ORDERS<\/code> has columns id, category, amount (one is missing) and customer_id. <code>CUSTOMERS<\/code> has customer_id and city. pandas is imported as <code>pd<\/code>.<\/p>", "starter": "def revenue_by_category(df):\n    pass\n", "solution": "def revenue_by_category(df):\n    return df.groupby(\"category\")[\"amount\"].sum().to_dict()\n", "hint": "groupby the category, pick the amount column, sum it, then .to_dict(). sum() skips missing values for you.", "tests": [{"label": "one category", "expr": "revenue_by_category(ORDERS)['games']", "want": "300.0"}, {"label": "all categories", "expr": "revenue_by_category(ORDERS)", "want": "{'books': 40.0, 'games': 300.0, 'toys': 319.5}"}, {"label": "no rows", "expr": "revenue_by_category(ORDERS[ORDERS['amount'] > 1000])", "want": "{}"}], "prelude": "import pandas as pd\nORDERS = pd.DataFrame({\"id\": [1, 2, 3, 4, 5, 6], \"category\": [\"toys\", \"books\", \"toys\", \"games\", \"books\", \"toys\"], \"amount\": [120.0, 40.0, 100.0, 300.0, None, 99.5], \"customer_id\": [1, 2, 1, 3, 2, 9]})\nCUSTOMERS = pd.DataFrame({\"customer_id\": [1, 2, 3], \"city\": [\"Pune\", \"Delhi\", \"Pune\"]})\n", "pkgs": true, "pat": "group & aggregate", "steps": ["Group the rows by category", "Pick the amount column", "Sum it (missing values are skipped)", "Turn the result into a dict and return it"]}, {"kind": "py", "title": "pandas: clean, join, then aggregate", "task": "Write <code>city_revenue(orders, customers)<\/code>: drop orders with a missing amount, left-join the customers on <code>customer_id<\/code>, label orders whose customer isn't in the table as city <code>'Unknown'<\/code>, and return a list of <code>(city, total)<\/code> tuples with the highest total first.<p class=\"hint\"><code>ORDERS<\/code> has columns id, category, amount (one is missing) and customer_id. <code>CUSTOMERS<\/code> has customer_id and city. pandas is imported as <code>pd<\/code>.<\/p>", "starter": "def city_revenue(orders, customers):\n    pass\n", "solution": "def city_revenue(orders, customers):\n    clean = orders.dropna(subset=[\"amount\"])\n    joined = clean.merge(customers, on=\"customer_id\", how=\"left\")\n    joined[\"city\"] = joined[\"city\"].fillna(\"Unknown\")\n    totals = joined.groupby(\"city\")[\"amount\"].sum().sort_values(ascending=False)\n    return list(totals.items())\n", "hint": "Work in the order the task gives: dropna(subset=...), merge(..., how='left'), fillna on the city column, groupby and sum, sort_values, then list(totals.items()).", "tests": [{"label": "how many cities", "expr": "len(city_revenue(ORDERS, CUSTOMERS))", "want": "3"}, {"label": "totals, highest first", "expr": "city_revenue(ORDERS, CUSTOMERS)", "want": "[('Pune', 520.0), ('Unknown', 99.5), ('Delhi', 40.0)]"}, {"label": "inputs are left unchanged", "expr": "(city_revenue(ORDERS, CUSTOMERS), len(ORDERS), list(ORDERS.columns))[1:]", "want": "(6, ['id', 'category', 'amount', 'customer_id'])"}], "prelude": "import pandas as pd\nORDERS = pd.DataFrame({\"id\": [1, 2, 3, 4, 5, 6], \"category\": [\"toys\", \"books\", \"toys\", \"games\", \"books\", \"toys\"], \"amount\": [120.0, 40.0, 100.0, 300.0, None, 99.5], \"customer_id\": [1, 2, 1, 3, 2, 9]})\nCUSTOMERS = pd.DataFrame({\"customer_id\": [1, 2, 3], \"city\": [\"Pune\", \"Delhi\", \"Pune\"]})\n", "pkgs": true, "pat": "clean, join, aggregate", "steps": ["Drop the rows with a missing amount", "Left-join customers on customer_id", "Fill the missing cities with 'Unknown'", "Group by city and sum the amount", "Sort highest first and return (city, total) tuples"]}], "14": [{"kind": "py", "title": "Clean messy rows", "task": "Write <code>clean_rows(rows)<\/code>. Each row is a dict with string <code>id<\/code> and <code>amount<\/code>. Return a tuple <code>(good, bad)<\/code>: good is a list of <code>(int id, float amount)<\/code> tuples for rows that convert cleanly; bad is how many rows failed (wrong value or missing key). Never crash.", "starter": "def clean_rows(rows):\n    good, bad = [], 0\n    \n    return good, bad\n", "solution": "def clean_rows(rows):\n    good, bad = [], 0\n    for r in rows:\n        try:\n            good.append((int(r[\"id\"]), float(r[\"amount\"])))\n        except (ValueError, KeyError):\n            bad += 1\n    return good, bad\n", "hint": "Wrap the conversion in try/except (ValueError, KeyError) and count the failures.", "tests": [{"label": "one bad value, one missing key", "expr": "clean_rows([{'id': '1', 'amount': '9.5'}, {'id': '2', 'amount': 'abc'}, {'id': '3'}, {'id': '4', 'amount': '1'}])", "want": "([(1, 9.5), (4, 1.0)], 2)"}, {"label": "all good", "expr": "clean_rows([{'id': '7', 'amount': '0'}])", "want": "([(7, 0.0)], 0)"}], "pat": "try/except", "steps": ["Start an empty good list and bad = 0", "For each row, try converting id to int and amount to float", "If it works, append the (id, amount) tuple", "If ValueError or KeyError happens, add 1 to bad", "Return (good, bad)"]}, {"kind": "sql", "title": "Monthly totals", "task": "Return each month as <code>YYYY-MM<\/code> and the total order amount for that month, ordered by month.", "starter": "SELECT \n", "solution": "SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) FROM orders GROUP BY month ORDER BY month;", "hint": "In SQLite: strftime('%Y-%m', order_date) or substr(order_date, 1, 7).", "ordered": true, "rows": 3}, {"kind": "py", "scenario": true, "title": "Revenue that matches finance", "brief": "Hi, our monthly revenue from your dashboard is higher than what finance reports. I've attached the raw export. Can you find out why and give us numbers we can trust? (Priya, Head of Ops)", "clarify": {"q": "Your total is higher than finance's. What do you check first?", "o": ["Whether some orders appear more than once in the export", "Which Python version finance uses", "Whether to rewrite it in pandas", "Whether the column names are tidy"], "a": 0, "why": "Exports often repeat rows. Always ask what makes a record unique (here, order_id) before adding anything up."}, "task": "<code>ROWS<\/code> (provided) is the raw export: every value is a string. Write <code>monthly_revenue(rows)<\/code> returning a dict of <code>YYYY-MM<\/code> to total revenue, rounded to 2 decimals. Count each <code>order_id<\/code> once, skip customers whose name contains <code>TEST<\/code> (any case), skip blank amounts, strip <code>$<\/code>, commas and spaces, and let refunds (negative amounts) reduce revenue.", "starter": "def monthly_revenue(rows):\n    totals = {}\n    \n    return totals\n", "solution": "def monthly_revenue(rows):\n    totals, seen = {}, set()\n    for r in rows:\n        if r[\"order_id\"] in seen:\n            continue\n        seen.add(r[\"order_id\"])\n        if \"test\" in r[\"customer\"].lower():\n            continue\n        raw = r[\"amount\"].replace(\"$\", \"\").replace(\",\", \"\").strip()\n        if not raw:\n            continue\n        month = r[\"date\"][:7]\n        totals[month] = round(totals.get(month, 0) + float(raw), 2)\n    return totals\n", "hint": "Keep a set of order_ids you've already counted. Clean the amount string before float(). The month is date[:7].", "tests": [{"label": "the real export", "expr": "monthly_revenue(ROWS)", "want": "{'2026-01': 1500.5, '2026-02': 30.0}"}, {"label": "only duplicates", "expr": "monthly_revenue([{'order_id': '1', 'customer': 'A', 'date': '2026-03-01', 'amount': '10'}] * 3)", "want": "{'2026-03': 10.0}"}, {"label": "empty export", "expr": "monthly_revenue([])", "want": "{}"}], "reply": "Found it: the export lists some orders twice and includes a test account. Counting each order once, skipping test data and blank amounts, and subtracting refunds gives January $1,500.50 and February $30.00. One question back: should refunds reduce revenue? If finance excludes them, February becomes $80.00.", "prelude": "ROWS = [\n    {\"order_id\": \"1001\", \"customer\": \"Acme\", \"date\": \"2026-01-05\", \"amount\": \"$1,200.50\"},\n    {\"order_id\": \"1002\", \"customer\": \"Bolt\", \"date\": \"2026-01-19\", \"amount\": \"300\"},\n    {\"order_id\": \"1002\", \"customer\": \"Bolt\", \"date\": \"2026-01-19\", \"amount\": \"300\"},\n    {\"order_id\": \"1003\", \"customer\": \"TEST ACCOUNT\", \"date\": \"2026-01-20\", \"amount\": \"999\"},\n    {\"order_id\": \"1004\", \"customer\": \"Cora\", \"date\": \"2026-02-02\", \"amount\": \" 80 \"},\n    {\"order_id\": \"1005\", \"customer\": \"Acme\", \"date\": \"2026-02-14\", \"amount\": \"\"},\n    {\"order_id\": \"1006\", \"customer\": \"Dune\", \"date\": \"2026-02-20\", \"amount\": \"-50\"},\n]\n", "pat": "dedupe & clean", "steps": ["Start an empty totals dict and an empty set of seen order ids", "Skip a row whose order_id is already seen, otherwise remember it", "Skip test customers and blank amounts", "Clean the amount (remove $, commas, spaces) and turn it into a float", "Add it to its month's total (date[:7]) and return the totals"]}, {"kind": "design", "scope": true, "title": "Scope it: \"the dashboard numbers look off\"", "task": "<b>From the Head of Sales:<\/b> \"Our revenue dashboard says one thing and finance says another. Fix it.\" You have read access to the orders database and the dashboard's SQL.", "questions": [["Which number, for which period, differs, and by how much?", true], ["How does finance define revenue: refunds, tax, test accounts?", true], ["Which one does leadership treat as the truth today?", true], ["Can we switch to a different BI tool?", false], ["Should the dashboard be dark mode?", false], ["Which SQL dialect is the most popular?", false]], "steps": ["Pick one month and get both numbers side by side", "Get finance's exact definition of revenue", "Read the dashboard SQL line by line against that definition", "Find the rows that explain the gap: duplicates, refunds, test data, time zones", "Fix the query and show the numbers now match", "Write a short note with the cause and the new definition"], "trade": [{"q": "The gap is 4%. Where do you look first?", "o": ["Rows counted twice by a JOIN, or orders that shouldn't count", "Rounding in the chart", "The database server's speed", "The dashboard's colours"], "a": 0, "why": "Most metric gaps come from definitions and JOINs that duplicate rows (Day 10), not from rounding."}, {"q": "You found the cause. How do you report it?", "o": ["One paragraph: what differed, why, the fix, and one question about the definition", "A 10-page technical document", "Just fix it and say nothing", "Send the SQL diff only"], "a": 0, "why": "Customers need the cause in plain words and a decision to make. The SQL is for engineers."}], "model": ["Clarify: which number, which period, how big the gap is, and finance's definition.", "Reproduce it on one month with both numbers side by side.", "Trace the dashboard SQL against the definition; find the rows that explain the gap.", "Fix it, show the numbers match, and confirm the definition with finance.", "Report in plain words: cause, fix, one open question."], "keys": [["which number and period, and finance's definition", "defin|which number|period|finance"], ["reproducing the gap on one month", "reproduc|one month|side by side|compar"], ["tracing the SQL for duplicates, refunds or test data", "join|duplicat|refund|test (data|account)|sql|query"], ["showing the fixed number matches", "match|fix"], ["a plain-words report of the cause", "report|explain|plain|note|tell|cause"]]}], "15": [{"kind": "py", "title": "Group anagrams", "task": "Write <code>group_anagrams(words)<\/code>: return a list of groups, where each group is a list of words that are anagrams of each other. Any order is fine. (LeetCode 49.)", "starter": "from collections import defaultdict\n\ndef group_anagrams(words):\n    pass\n", "solution": "from collections import defaultdict\n\ndef group_anagrams(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[\"\".join(sorted(w))].append(w)\n    return list(groups.values())\n", "hint": "Use the sorted letters as the dict key.", "tests": [{"label": "eat, tea, tan, ate, nat, bat", "expr": "sorted(sorted(g) for g in group_anagrams(['eat', 'tea', 'tan', 'ate', 'nat', 'bat']))", "want": "[['ate', 'eat', 'tea'], ['bat'], ['nat', 'tan']]"}, {"label": "empty string", "expr": "group_anagrams([''])", "want": "[['']]"}], "pat": "hash map / set", "steps": ["Make a dict where every key maps to a list", "For each word, sort its letters to make the key", "Append the word to that key's list", "Return the dict's values as a list"]}, {"kind": "py", "title": "Top K frequent", "task": "Write <code>top_k_frequent(nums, k)<\/code>: return the k most frequent numbers, most frequent first. (LeetCode 347.)", "starter": "from collections import Counter\n\ndef top_k_frequent(nums, k):\n    pass\n", "solution": "from collections import Counter\n\ndef top_k_frequent(nums, k):\n    return [x for x, _ in Counter(nums).most_common(k)]\n", "hint": "Counter(nums).most_common(k) gives (number, count) pairs. Keep just the numbers.", "tests": [{"label": "[1,1,1,2,2,3], 2", "expr": "top_k_frequent([1, 1, 1, 2, 2, 3], 2)", "want": "[1, 2]"}, {"label": "[1], 1", "expr": "top_k_frequent([1], 1)", "want": "[1]"}, {"label": "[4,4,5,5,5,6], 1", "expr": "top_k_frequent([4, 4, 5, 5, 5, 6], 1)", "want": "[5]"}], "pat": "hash map / set", "steps": ["Count how often each number appears", "Take the k most common (number, count) pairs", "Return just the numbers"]}, {"kind": "py", "title": "Product except self", "task": "Write <code>product_except_self(nums)<\/code>: element i is the product of every number except nums[i]. <b>No division<\/b>, O(n). (LeetCode 238.)", "starter": "def product_except_self(nums):\n    pass\n", "solution": "def product_except_self(nums):\n    n = len(nums)\n    out = [1] * n\n    left = 1\n    for i in range(n):\n        out[i] = left\n        left *= nums[i]\n    right = 1\n    for i in range(n - 1, -1, -1):\n        out[i] *= right\n        right *= nums[i]\n    return out\n", "hint": "First pass: product of everything to the left of i. Second pass from the end: multiply in everything to the right.", "tests": [{"label": "[1,2,3,4]", "expr": "product_except_self([1, 2, 3, 4])", "want": "[24, 12, 8, 6]"}, {"label": "with a zero", "expr": "product_except_self([-1, 1, 0, -3, 3])", "want": "[0, 0, 9, 0, 0]"}, {"label": "large input (must be fast)", "expr": "product_except_self([1] * 3000) == [1] * 3000", "want": "True"}], "fuzz": ["product_except_self", "([R.randint(-3, 3) for _ in range(R.randint(2, 7))],)"], "pat": "prefix sums", "steps": ["Make an output list of 1s", "Left to right: put the product of everything before i into out[i]", "Right to left: multiply out[i] by the product of everything after i", "Return out"]}], "16": [{"kind": "py", "title": "Best time to buy and sell", "task": "Write <code>max_profit(prices)<\/code>: buy on one day and sell on a later day for the biggest profit. Return 0 if no profit is possible. (LeetCode 121.)", "starter": "def max_profit(prices):\n    pass\n", "solution": "def max_profit(prices):\n    lowest, best = float(\"inf\"), 0\n    for p in prices:\n        lowest = min(lowest, p)\n        best = max(best, p - lowest)\n    return best\n", "hint": "Track the lowest price so far. Today's profit is today's price minus that.", "tests": [{"label": "[7,1,5,3,6,4]", "expr": "max_profit([7, 1, 5, 3, 6, 4])", "want": "5"}, {"label": "falling prices", "expr": "max_profit([7, 6, 4, 3, 1])", "want": "0"}, {"label": "one day", "expr": "max_profit([5])", "want": "0"}, {"label": "large input (must be fast)", "expr": "max_profit(list(range(3000, 0, -1)) + [5000])", "want": "4999"}], "fuzz": ["max_profit", "([R.randint(1, 20) for _ in range(R.randint(1, 8))],)"], "pat": "track best so far", "steps": ["Start lowest at infinity and best at 0", "For each price, update the lowest price seen", "Update best with price minus lowest", "Return best"]}, {"kind": "py", "title": "Longest substring without repeats", "task": "Write <code>longest_unique(s)<\/code>: the length of the longest substring with no repeated characters. Use a sliding window. (LeetCode 3.)", "starter": "def longest_unique(s):\n    pass\n", "solution": "def longest_unique(s):\n    seen, left, best = {}, 0, 0\n    for right, ch in enumerate(s):\n        if ch in seen and seen[ch] >= left:\n            left = seen[ch] + 1\n        seen[ch] = right\n        best = max(best, right - left + 1)\n    return best\n", "hint": "Remember each character's last index. On a repeat inside the window, move left past it.", "tests": [{"label": "abcabcbb", "expr": "longest_unique('abcabcbb')", "want": "3"}, {"label": "bbbbb", "expr": "longest_unique('bbbbb')", "want": "1"}, {"label": "pwwkew", "expr": "longest_unique('pwwkew')", "want": "3"}, {"label": "abba", "expr": "longest_unique('abba')", "want": "2"}, {"label": "empty", "expr": "longest_unique('')", "want": "0"}], "fuzz": ["longest_unique", "(''.join(R.choice('abc') for _ in range(R.randint(0, 10))),)"], "pat": "sliding window", "steps": ["Keep a dict of each character's last index, a left edge, and the best length", "Move right across the string one character at a time", "If the character was seen inside the window, move left just past it", "Record its index and update the best length", "Return the best length"]}, {"kind": "py", "title": "Two Sum II (sorted)", "task": "Write <code>two_sum_sorted(numbers, target)<\/code>: numbers is sorted ascending. Return the <b>1-based<\/b> positions <code>[i, j]<\/code> of the pair that adds to target, using two pointers and O(1) extra memory. (LeetCode 167.)", "starter": "def two_sum_sorted(numbers, target):\n    left, right = 0, len(numbers) - 1\n    \n", "solution": "def two_sum_sorted(numbers, target):\n    left, right = 0, len(numbers) - 1\n    while left < right:\n        s = numbers[left] + numbers[right]\n        if s == target:\n            return [left + 1, right + 1]\n        if s < target:\n            left += 1\n        else:\n            right -= 1\n", "hint": "Sum too small: move left up. Too big: move right down. Add 1 to each index when you return.", "tests": [{"label": "[2,7,11,15], 9", "expr": "two_sum_sorted([2, 7, 11, 15], 9)", "want": "[1, 2]"}, {"label": "[2,3,4], 6", "expr": "two_sum_sorted([2, 3, 4], 6)", "want": "[1, 3]"}, {"label": "[-1,0], -1", "expr": "two_sum_sorted([-1, 0], -1)", "want": "[1, 2]"}, {"label": "large input (must be fast)", "expr": "two_sum_sorted(list(range(1, 3001)), 5999)", "want": "[2999, 3000]"}], "pat": "two pointers", "steps": ["Put one pointer at each end", "While left is before right, add the two numbers", "If the sum equals the target, return the 1-based positions", "If the sum is too small move left up, if too big move right down"]}], "17": [{"kind": "py", "title": "Valid parentheses", "task": "Write <code>is_valid(s)<\/code> for strings of <code>()[]{}<\/code>: every opener must be closed by the same type, in the right order. (LeetCode 20.)", "starter": "def is_valid(s):\n    stack = []\n    pairs = {')': '(', ']': '[', '}': '{'}\n    \n", "solution": "def is_valid(s):\n    stack = []\n    pairs = {')': '(', ']': '[', '}': '{'}\n    for ch in s:\n        if ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n        else:\n            stack.append(ch)\n    return not stack\n", "hint": "Push openers. On a closer, the stack must be non-empty and its top must be the matching opener. At the end the stack must be empty.", "tests": [{"label": "()[]{}", "expr": "is_valid('()[]{}')", "want": "True"}, {"label": "(]", "expr": "is_valid('(]')", "want": emperatures", "task": "Write <code>daily_temperatures(temps)<\/code>: for each day, how many days until a warmer temperature (0 if never). Use a stack of indexes for O(n). (LeetCode 739.)", "starter": "def daily_temperatures(temps):\n    pass\n", "solution": "def daily_temperatures(temps):\n    out = [0] * len(temps)\n    stack = []\n    for i, t in enumerate(temps):\n        while stack and temps[stack[-1]] < t:\n            j = stack.pop()\n            out[j] = i - j\n        stack.append(i)\n    return out\n", "hint": "Keep indexes of days still waiting. When today is warmer than the day on top, pop it and record i - j.", "tests": [{"label": "[73,74,75,71,69,72,76,73]", "expr": "daily_temperatures([73, 74, 75, 71, 69, 72, 76, 73])", "want": "[1, 1, 4, 2, 1, 1, 0, 0]"}, {"label": "[30,60,90]", "expr": "daily_temperatures([30, 60, 90])", "want": "[1, 1, 0]"}, {"label": "large input (must be fast)", "expr": "daily_temperatures(list(range(3000, 0, -1)))[:3]", "want": "[0, 0, 0]"}], "fuzz": ["daily_temperatures", "([R.randint(30, 40) for _ in range(R.randint(1, 8))],)"], "pat": "stack", "steps": ["Make an answer list of zeros and an empty stack of indexes", "Go through each day i with temperature t", "While the day on top of the stack is colder than t, pop it and record i minus that day", "Push i", "Return the answer"]}], "18": [{"kind": "py", "title": "Reverse a linked list", "task": "<code>ListNode<\/code>, <code>build(list)<\/code> and <code>to_list(head)<\/code> are provided. Write <code>reverse(head)<\/code> that reverses the list and returns the new head. (LeetCode 206.)", "starter": "def reverse(head):\n    prev = None\n    \n", "solution": "def reverse(head):\n    prev = None\n    while head:\n        nxt = head.next\n        head.next = prev\n        prev, head = head, nxt\n    return prev\n", "hint": "Save next, point current back at prev, then step both forward.", "tests": [{"label": "1..5", "expr": "to_list(reverse(build([1, 2, 3, 4, 5])))", "want": "[5, 4, 3, 2, 1]"}, {"label": "empty", "expr": "to_list(reverse(build([])))", "want": "[]"}, {"label": "one node", "expr": "to_list(reverse(build([7])))", "want": "[7]"}], "prelude": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef build(values):          # build([1, 2, 3]) -> head node\n    dummy = ListNode()\n    cur = dummy\n    for v in values:\n        cur.next = ListNode(v)\n        cur = cur.next\n    return dummy.next\n\ndef to_list(head):          # to_list(head) -> [1, 2, 3]\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n", "pat": "linked list pointers", "steps": ["Start prev as None", "While there is a current node", "Save the next node, then point the current node back at prev", "Move prev and current one step forward", "Return prev"]}, {"kind": "py", "title": "Merge two sorted lists", "task": "Write <code>merge(a, b)<\/code>: merge two sorted linked lists into one sorted list and return its head. Use a dummy node. (LeetCode 21.)", "starter": "def merge(a, b):\n    dummy = ListNode()\n    tail = dummy\n    \n", "solution": "def merge(a, b):\n    dummy = ListNode()\n    tail = dummy\n    while a and b:\n        if a.val <= b.val:\n            tail.next, a = a, a.next\n        else:\n            tail.next, b = b, b.next\n        tail = tail.next\n    tail.next = a or b\n    return dummy.next\n", "hint": "Attach the smaller head to tail and advance. When one list runs out, attach the rest of the other.", "tests": [{"label": "[1,2,4] + [1,3,4]", "expr": "to_list(merge(build([1, 2, 4]), build([1, 3, 4])))", "want": "[1, 1, 2, 3, 4, 4]"}, {"label": "both empty", "expr": "to_list(merge(build([]), build([])))", "want": "[]"}, {"label": "one empty", "expr": "to_list(merge(build([]), build([0])))", "want": "[0]"}], "prelude": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef build( urn dummy.next\n\ndef to_list(head):          # to_list(head) -> [1, 2, 3]\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n", "bug": true}], "19": [{"kind": "py", "title": "Max depth of a tree", "task": "<code>TreeNode<\/code>, <code>tree(list)<\/code> and <code>levels(root)<\/code> are provided. Write <code>max_depth(root)<\/code> recursively. (LeetCode 104.)", "starter": "def max_depth(root):\n    pass\n", "solution": "def max_depth(root):\n    if not root:\n        return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))\n", "hint": "Base case: None has depth 0. Otherwise 1 + the deeper child.", "tests": [{"label": "[3,9,20,null,null,15,7]", "expr": "max_depth(tree([3, 9, 20, None, None, 15, 7]))", "want": "3"}, {"label": "empty", "expr": "max_depth(None)", "want": "0"}, {"label": "[1,null,2]", "expr": "max_depth(tree([1, None, 2]))", "want": "2"}], "prelude": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef tree(values):           # tree([3, 9, 20, None, None, 15, 7]) -> root (LeetCode order)\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    q, i = deque([root]), 1\n    while q and i < len(values):\n        node = q.popleft()\n        if i < len(values) and values[i] is not None:\n            node.left = TreeNode(values[i]); q.append(node.left)\n        i += 1\n        if i < len(values) and values[i] is not None:\n            node.right = TreeNode(values[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef levels(root):           # levels(root) -> [3, 9, 20, 15, 7]\n    out, q = [], deque([root] if root else [])\n    while q:\n        n = q.popleft()\n        out.append(n.val)\n        if n.left: q.append(n.left)\n        if n.right: q.append(n.right)\n    return out\n", "pat": "recursion", "steps": ["If the node is None, return 0", "Get the depth of the left subtree", "Get the depth of the right subtree", "Return 1 plus the larger one"]}, {"kind": "py", "title": "Invert a tree", "task": "Write <code>invert(root)<\/code>: swap every node's left and right children and return the root. (LeetCode 226.)", "starter": "def invert(root):\n    pass\n", "solution": "def invert(root):\n    if root:\n        root.left, root.right = invert(root.right), invert(root.left)\n    return root\n", "hint": "Swap the children, recursing into each, and return root (even when it's None).", "tests": [{"label": "[4,2,7,1,3,6,9]", "expr": "levels(invert(tree([4, 2, 7, 1, 3, 6, 9])))", "want": "[4, 7, 2, 9, 6, 3, 1]"}, {"label": "empty", "expr": "invert(None)", "want": "None"}], "prelude": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef tree(values):           # tree([3, 9, 20, None, None, 15, 7]) -> root (LeetCode order)\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    q, i = deque([root]), 1\n    while q and i < len(values):\n        node = q.popleft()\n        if i < len(values) and values[i] is not None:\n            node.left = TreeNode(values[i]); q.append(node.left)\n        i += 1\n        if i < len(values) and values[i] is not None:\n            node.right = TreeNode(values[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef levels(root):           # levels(root) -> [3, 9, 20, 15, 7]\n    out, q = [], deque([root] if root else [])\n    while q:\n        n = q.popleft()\n        out.append(n.val)\n        if n.left: q.append(n.left)\n        if n.right: q.append(n.right)\n    return out\n", "pat": "recursion", "steps": ["If the node is None, return it", "Swap left and right, inverting each side", "Return the node"]}, {"kind": "py", "title": "Number of islands", "task": "Write <code>num_islands(grid)<\/code>: grid is a list of lists of <code>\"1\"<\/code> (land) and <code>\"0\"<\/code> (water). Count groups of land connected up, down, left or right. BFS or DFS. (LeetCode 200.)", "starter": "def num_islands(grid):\n    pass\n", "solution": "from collections import deque\n\ndef num_islands(grid):\n    if not grid:\n        return 0\n    rows, cols, count = len(grid), len(grid[0]), 0\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"1\":\n                count += 1\n                grid[r][c] = \"0\"\n                q = deque([(r, c)])\n                while q:\n                    i, j = q.popleft()\n                    for di, dj in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                        ni, nj = i + di, j + dj\n                        if 0 <= ni < rows and 0 <= nj < cols and grid[ni][nj] == \"1\":\n                            grid[ni][nj] = \"0\"\n                            q.append((ni, nj))\n    return count\n", "hint": "Loop over every cell. On land, count one island and flood it (mark it \"0\") so it isn't counted again.", "tests": [{"label": "one island", "expr": "num_islands([list('11110'), list('11010'), list('11000'), list('00000')])", "want": "1"}, {"label": "three islands", "expr": "num_islands([list('11000'), list('11000'), list('00100'), list('00011')])", "want": "3"}, {"label": "all water", "expr": "num_islands([list('000')])", "want": "0"}], "pat": "BFS/DFS", "steps": ["Set count to 0", "Go through every cell in the grid", "When a cell is land, add 1 and flood all the land connected to it, marking it as water", "Return count"]}], "20": [{"kind": "py", "title": "Climbing stairs", "task": "Write <code>climb(n)<\/code>: the number of ways to climb n steps taking 1 or 2 at a time. Must handle n = 40 fast. (LeetCode 70.)", "starter": "def climb(n):\n    pass\n", "solution": "def climb(n):\n    a, b = 1, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a\n", "hint": "f(n) = f(n-1) + f(n-2). Plain recursion is too slow for 40: keep just the last two values.", "tests": [{"label": "n = 2", "expr": "climb(2)", "want": "2"}, {"label": "n = 3", "expr": "climb(3)", "want": "3"}, {"label": "n = 40", "expr": "climb(40)", "want": "165580141"}, {"label": "large input (must be fast)", "expr": "climb(35)", "want": "14930352"}], "pat": "dynamic programming", "steps": ["The ways for 0 and 1 steps are both 1", "Each next step's ways = the previous two added together", "Loop n times keeping only the last two values", "Return the answer"]}, {"kind": "py", "title": "House robber", "task": "Write <code>rob(nums)<\/code>: the most money you can take without taking from two neighbouring houses. (LeetCode 198.)", "starter": "def rob(nums):\n    pass\n", "solution": "def rob(nums):\n    prev, cur = 0, 0\n    for x in nums:\n        prev, cur = cur, max(cur, prev + x)\n    return cur\n", "hint": "At each house: skip it (keep the best so far) or take it (best from two houses back + this one).", "tests": [{"label": "[1,2,3,1]", "expr": "rob([1, 2, 3, 1])", "want": "4"}, {"label": "[2,7,9,3,1]", "expr": "rob([2, 7, 9, 3, 1])", "want": "12"}, {"label": "empty", "expr": "rob([])", "want": "0"}, {"label": "[2,1,1,2]", "expr": "rob([2, 1, 1, 2])", "want": "4"}], "fuzz": ["rob", "([R.randint(0, 9) for _ in range(R.randint(1, 8))],)"], "pat": "dynamic programming", "steps": ["Track the best total up to the previous house and the one before it", "For each house, choose: skip it, or take it plus the best from two houses back", "Shift the two values forward", "Return the best"]}, {"kind": "py", "title": "Coin change", "task": "Write <code>coin_change(coins, amount)<\/code>: the fewest coins that make the amount, or -1 if it can't be made. (LeetCode 322.)", "starter": "def coin_change(coins, amount):\n    pass\n", "solution": "def coin_change(coins, amount):\n    dp = [0] + [float(\"inf\")] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a:\n                dp[a] = min(dp[a], dp[a - c] + 1)\n    return dp[amount] if dp[amount] != float(\"inf\") else -1\n", "hint": "dp[a] = fewest coins for amount a. dp[0] = 0. dp[a] = min(dp[a - c] + 1) over coins c.", "tests": [{"label": "[1,2,5], 11", "expr": "coin_change([1, 2, 5], 11)", "want": "3"}, {"label": "[2], 3", "expr": "coin_change([2], 3)", "want": "-1"}, {"label": "amount 0", "expr": "coin_change([1], 0)", "want": "0"}, {"label": "[186,419,83,408], 6249", "expr": "coin_change([186, 419, 83, 408], 6249)", "want": "20"}, {"label": "large input (must be fast)", "expr": "coin_change([1, 2, 5], 3000)", "want": "600"}], "fuzz": ["coin_change", "(R.sample([1, 2, 5, 7], R.randint(1, 3)), R.randint(0, 30))"], "pat": "dynamic programming", "steps": ["Make dp where dp[a] is the fewest coins for amount a: dp[0] = 0, the rest infinity", "For each amount a from 1 upward", "For each coin that fits, try dp[a - coin] + 1", "Return dp[amount], or -1 if it's still infinity"]}, {"kind": "py", "title": "Merge intervals", "task": "Write <code>merge_intervals(intervals)<\/code>: merge all overlapping <code>[start, end]<\/code> intervals and return them sorted by start. (LeetCode 56.)", "starter": "def merge_intervals(intervals):\n    pass\n", "solution": "def merge_intervals(intervals):\n    out = []\n    for s, e in sorted(intervals):\n        if out and s <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], e)\n        else:\n            out.append([s, e])\n    return out\n", "hint": "Sort by start. If the next start is within the last merged interval, extend its end; otherwise start a new one.", "tests": [{"label": "[[1,3],[2,6],[8,10],[15,18]]", "expr": "merge_intervals([[1, 3], [2, 6], [8, 10], [15, 18]])", "want": "[[1, 6], [8, 10], [15, 18]]"}, {"label": "touching", "expr": "merge_intervals([[1, 4], [4, 5]])", "want": "[[1, 5]]"}, {"label": "unsorted, nested", "expr": "merge_intervals([[5, 6], [1, 10]])", "want": "[[1, 10]]"}], "fuzz": ["merge_intervals", "([[a, a + R.randint(0, 4)] for a in [R.randint(0, 15) for _ in range(R.randint(1, 6))]],)"], "pat": "sort then scan", "steps": ["Sort the intervals by start", "For each interval, if it overlaps the last merged one, extend that one's end", "Otherwise add it as a new merged interval", "Return the merged list"]}], "21": [{"kind": "py", "title": "Mock 1: minimum in a rotated array", "task": "<b>Timed: 25 minutes, talk aloud.<\/b> A sorted array of unique numbers was rotated (e.g. <code>[3,4,5,1,2]<\/code>). Write <code>find_min(nums)<\/code> in O(log n). (LeetCode 153.)", "starter": "def find_min(nums):\n    pass\n", "solution": "def find_min(nums):\n    lo, hi = 0, len(nums) - 1\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if nums[mid] > nums[hi]:\n            lo = mid + 1\n        else:\n            hi = mid\n    return nums[lo]\n", "hint": "Compare nums[mid] with nums[hi]. If mid is bigger, the minimum is to the right of mid.", "tests": [{"label": "[3,4,5,1,2]", "expr": "find_min([3, 4, 5, 1, 2])", "want": "1"}, {"label": "[4,5,6,7,0,1,2]", "expr": "find_min([4, 5, 6, 7, 0, 1, 2])", "want": "0"}, {"label": "not rotated", "expr": "find_min([11, 13, 15, 17])", "want": "11"}, {"label": "one item", "expr": "find_min([5])", "want": "5"}, {"label": "big input", "expr": "find_min(list(range(500000, 1000000)) + list(range(500000)))", "want": "0"}, {"label": "100,000 items (must be O(log n))", "expr": "find_min(_Probe(list(range(50000, 100000)) + list(range(50000))))", "want": "0"}], "limit": 200000, "fuzz": ["find_min", "((lambda xs, k: xs[k:] + xs[:k])(sorted(R.sample(range(-30, 30), R.randint(1, 9))), R.randint(0, 8)),)"], "mock": true, "pat": "binary search", "steps": ["Set lo and hi at the two ends", "While lo < hi, find mid", "If nums[mid] > nums[hi], the minimum is to the right of mid", "Otherwise it is at mid or to its left", "Return nums[lo]"]}, {"kind": "py", "title": "Mock 2: subarray sum equals k", "task": "<b>Timed: 35 minutes.<\/b> A new pattern: prefix sums. Write <code>subarray_sum(nums, k)<\/code>: how many contiguous subarrays add up to k? Numbers can be negative, so a sliding window won't work. Aim for O(n). (LeetCode 560.)", "starter": "def subarray_sum(nums, k):\n    pass\n", "solution": "def subarray_sum(nums, k):\n    count, total = 0, 0\n    seen = {0: 1}\n    for x in nums:\n        total += x\n        count += seen.get(total - k, 0)\n        seen[total] = seen.get(total, 0) + 1\n    return count\n", "hint": "Keep a running total and a dict of how often each running total has appeared. If total - k appeared before, those subarrays end here.", "tests": [{"label": "[1,1,1], 2", "expr": "subarray_sum([1, 1, 1], 2)", "want": "2"}, {"label": "[1,2,3], 3", "expr": "subarray_sum([1, 2, 3], 3)", "want": "2"}, {"label": "negatives", "expr": "subarray_sum([1, -1, 0], 0)", "want": "3"}, {"label": "big input, O(n) needed", "expr": "subarray_sum([0] * 3000, 0)", "want": "4501500"}, {"label": "large input (must be fast)", "expr": "subarray_sum([1] * 2000, 2)", "want": "1999"}], "limit": 400000, "fuzz": ["subarray_sum", "([R.randint(-2, 3) for _ in range(R.randint(1, 8))], R.randint(-2, 5))"], "mock": true, "pat": "prefix sums", "steps": ["Keep a running total and a dict counting each total seen, starting with {0: 1}", "For each number, add it to the running total", "Add how many times (total - k) has been seen", "Record the current total in the dict", "Return the count"]}, {"kind": "design", "scope": true, "title": "Scope it: \"which leads should we call first?\"", "task": "<b>From a sales manager:<\/b> \"We get 500 leads a week and only have time to call 100. Can you tell us which ones to call?\" You have last year's leads with whether each one bought.", "questions": [["What counts as success: a meeting, a sale, or revenue?", true], ["What do we know about each lead when it arrives?", true], ["How will the team use the list: once a week or as leads arrive?", true], ["Should we use the newest deep learning model?", false], ["Can we buy a list of other companies' customers?", false], ["What colour should the score be?", false]], "steps": ["Agree what a good lead means, using last year's outcomes", "Look at which lead details went with buying (SQL GROUP BY)", "Start with a simple rule or score, not a model", "Check it on last year's data: how many buyers in the top 100?", "Ship it as a sorted list the team already uses", "Measure for a month and compare with how they picked before"], "trade": [{"q": "A simple scoring rule finds 60% of last year's buyers in the top 100. Next step?", "o": ["Ship it, measure real results, and improve from there", "Spend two months on a perfect model first", "Throw it away because it's not 100%", "Score every lead the same"], "a": 0, "why": "A simple version in use beats a perfect one on a laptop. Compare it with the baseline they have today."}, {"q": "How do you know it actually helped?", "o": ["Compare the conversion of called leads before and after", "Ask the reps if they like it", "Count how many leads were scored", "Check the code has no errors"], "a": 0, "why": "Outcomes are the measure: did more calls turn into sales than before?"}], "model": ["Clarify: what success means, what's known per lead, and how the list is used.", "Use history: last year's leads and outcomes show what predicts buying.", "Start simple: a rule or score you can explain, checked on past data.", "Ship it where the team already works; a baseline comparison proves value.", "Measure conversion before and after, then improve."], "keys": [["what success means", "success|sale|convert|conversion|meeting|revenue|buy|bought"], ["using last year's outcomes", "history|last year|past|outcome|historical"], ["starting with a simple rule or score", "simple|rule|score"], ["comparing with how they pick today", "baseline|compar|before|today"], ["measuring after it ships", "measur|track|conversion"]]}], "23": [{"kind": "py", "title": "Validate a request body", "task": "This is what Pydantic does for you. Write <code>validate_task(body)<\/code>: return a list of error strings (empty if valid). Rules: <code>title<\/code> is required (error <code>\"title is required\"<\/code>) and must be a non-empty string (<code>\"title must be a non-empty string\"<\/code>); <code>done<\/code> is optional but must be a bool if present (<code>\"done must be true or false\"<\/code>).", "starter": "def validate_task(body):\n    errors = []\n    \n    return errors\n", "solution": "def validate_task(body):\n    errors = []\n    if \"title\" not in body:\n        errors.append(\"title is required\")\n    elif not isinstance(body[\"title\"], str) or not body[\"title\"].strip():\n        errors.append(\"title must be a non-empty string\")\n    if \"done\" in body and not isinstance(body[\"done\"], bool):\n        errors.append(\"done must be true or false\")\n    return errors\n", "hint": "Check \"title\" in body first, then isinstance(body[\"title\"], str). Use isinstance(x, bool) for done.", "tests": [{"label": "valid", "expr": "validate_task({'title': 'Buy milk', 'done': False})", "want": "[]"}, {"label": "missing title", "expr": "validate_task({})", "want": "['title is required']"}, {"label": "blank title, bad done", "expr": "validate_task({'title': '  ', 'done': 'yes'})", "want": "['title must be a non-empty string', 'done must be true or false']"}, {"label": "title not a string", "expr": "validate_task({'title': 5})", "want": "['title must be a non-empty string']"}], "pat": "validation rules", "steps": ["Start an empty errors list", "If title is missing, add the 'required' error", "Otherwise, if title isn't a non-empty string, add that error", "If done is present but isn't a bool, add that error", "Return errors"]}, {"kind": "py", "title": "Retry with a limit", "task": "Write <code>retry(fn, attempts)<\/code>: call <code>fn()<\/code>; if it raises <code>ConnectionError<\/code>, try again, up to <code>attempts<\/code> calls in total. Return fn's result on success. If every attempt fails, re-raise the last error. Other error types should not be retried. <code>flaky(n)<\/code> is provided: it returns a function that fails n times, then returns \"ok\".", "starter": "def retry(fn, attempts):\n    pass\n", "solution": "def retry(fn, attempts):\n    for i in range(attempts):\n        try:\n            return fn()\n        except ConnectionError:\n            if i == attempts - 1:\n                raise\n", "hint": "Loop attempts times with try/except ConnectionError. On the last attempt, a bare raise re-raises the error.", "tests": [{"label": "fails twice, 3 attempts", "expr": "retry(flaky(2), 3)", "want": "'ok'"}, {"label": "fails 3 times, 3 attempts", "expr": "_raises(lambda: retry(flaky(3), 3), ConnectionError)", "want": "True"}, {"label": "calls only as needed", "expr": "(lambda f: (retry(f, 5), f.calls)[1])(flaky(1))", "want": "2"}, {"label": "other errors not retried", "expr": "(lambda f: (_raises(lambda: retry(f, 5), ValueError), f.calls)[1])(broken())", "want": "1"}], "prelude": "def flaky(n):\n    def f():\n        f.calls += 1\n        if f.calls <= n:\n            raise ConnectionError(\"server unreachable\")\n        return \"ok\"\n    f.calls = 0\n    return f\n\ndef broken():\n    def f():\n        f.calls += 1\n        raise ValueError(\"bad input\")\n    f.calls = 0\n    return f\n", "pat": "loop with retries", "steps": ["Loop up to attempts times", "Try calling fn() and return its result", "If ConnectionError happens on the last attempt, re-raise it", "Otherwise go round the loop again"]}, {"kind": "py", "scenario": true, "title": "Sync from a flaky partner API", "brief": "Our nightly sync from the partner's orders API keeps missing data. Their API is paginated and sometimes returns errors. Can you make it reliable? (Tom, Engineering Manager)", "clarify": {"q": "The partner's API sometimes answers with status 429. What does that mean?", "o": ["Too many requests: slow down and try again", "Your API key is wrong", "That page doesn't exist", "Their server is permanently down"], "a": 0, "why": "429 means you're being rate-limited. The right response is to wait and retry, not to give up or skip the page."}, "task": "<code>make_api(failures)<\/code> (provided) returns a fake API. <code>api.get(cursor)<\/code> returns <code>{\"status\": 200, \"body\": {\"items\": [...], \"next_cursor\": ...}}<\/code> or <code>{\"status\": 429, \"body\": None}<\/code>. Write <code>fetch_all(api, max_retries=3)<\/code>: start with cursor <code>None<\/code>, collect every item page by page until <code>next_cursor<\/code> is <code>None<\/code>. If a page fails, retry the same cursor up to <code>max_retries<\/code> more times; if it still fails, raise <code>RuntimeError<\/code>. Never skip a page silently.", "starter": "def fetch_all(api, max_retries=3):\n    items, cursor = [], None\n    \n", "solution": "def fetch_all(api, max_retries=3):\n    items, cursor = [], None\n    while True:\n        for attempt in range(max_retries + 1):\n            resp = api.get(cursor)\n            if resp[\"status\"] == 200:\n                break\n        else:\n            raise RuntimeError(f\"gave up on page {cursor or 'start'}\")\n        items.extend(resp[\"body\"][\"items\"])\n        cursor = resp[\"body\"][\"next_cursor\"]\n        if cursor is None:\n            return items\n", "hint": "Two loops: an outer loop over pages, an inner loop for retries. Python's for…else runs the else only if the loop didn't break, which is a neat place to raise.", "tests": [{"label": "no failures", "expr": "fetch_all(make_api())", "want": "[1, 2, 3, 4, 5]"}, {"label": "page c2 fails twice, then works", "expr": "fetch_all(make_api({'c2': 2}))", "want": "[1, 2, 3, 4, 5]"}, {"label": "retries only as needed (5 calls)", "expr": "(lambda a: (fetch_all(a), a.calls)[1])(make_api({'c2': 2}))", "want": "5"}, {"label": "page c3 never recovers", "expr": "_raises(lambda: fetch_all(make_api({'c3': 9})), RuntimeError)", "want": "True"}, {"label": "exactly 3 retries are enough", "expr": "fetch_all(make_api({'c2': 3}))", "want": "[1, 2, 3, 4, 5]"}], "reply": "The sync was losing data whenever the partner rate-limited us (HTTP 429). It now retries each page up to 3 times and, if a page still fails, stops with a clear error naming that page, so nothing is skipped silently. In production I'd also add a growing wait between retries and an alert on failure.", "prelude": "class FakeAPI:\n    def __init__(self, pages, failures):\n        self.pages = pages\n        self.failures = dict(failures)\n        self.calls = 0\n\n    def get(self, cursor=None):\n        self.calls += 1\n        key = cursor or \"start\"\n        if self.failures.get(key, 0) > 0:\n            self.failures[key] -= 1\n            return {\"status\": 429, \"body\": None}\n        items, nxt = self.pages[key]\n        return {\"status\": 200, \"body\": {\"items\": items, \"next_cursor\": nxt}}\n\ndef make_api(failures=None):\n    pages = {\"start\": ([1, 2], \"c2\"), \"c2\": ([3, 4], \"c3\"), \"c3\": ([5], None)}\n    return FakeAPI(pages, failures or {})\n", "pat": "loop with retries", "steps": ["Start an empty items list and cursor None", "Outer loop: one page at a time", "Inner loop: call api.get(cursor) up to max_retries + 1 times, stopping on status 200", "If every try failed, raise RuntimeError", "Add the page's items, move to next_cursor, and return when it is None"]}], "24": [{"kind": "py", "title": "Pull JSON out of a model reply", "task": "Models often wrap JSON in extra text or a code fence. Write <code>extract_json(reply)<\/code>: find the first <code>{<\/code> and the last <code>}<\/code>, parse what's between them (inclusive) with <code>json.loads<\/code>, and return the dict. Return <code>None<\/code> if there's no braces or it isn't valid JSON.", "starter": "import json\n\ndef extract_json(reply):\n    pass\n", "solution": "import json\n\ndef extract_json(reply):\n    start, end = reply.find(\"{\"), reply.rfind(\"}\")\n    if start == -1 or end < start:\n        return None\n    try:\n        return json.loads(reply[start:end + 1])\n    except json.JSONDecodeError:\n        return None\n", "hint": "str.find and str.rfind return -1 when not found. json.loads raises json.JSONDecodeError on bad JSON.", "tests": [{"label": "wrapped in text", "expr": "extract_json('Sure! Here it is: {\"name\": \"Asha\", \"age\": 30} Hope that helps.')", "want": "{'name': 'Asha', 'age': 30}"}, {"label": "in a code fence", "expr": "extract_json('```json\\n{\"ok\": true}\\n```')", "want": "{'ok': True}"}, {"label": "no JSON", "expr": "extract_json('I cannot help with that.')", "want": "None"}, {"label": "broken JSON", "expr": "extract_json('{\"a\": }')", "want": "None"}], "pat": "string search & parse", "steps": ["Find the first { and the last }", "If either is missing, return None", "Try json.loads on the text between them, inclusive", "If it raises JSONDecodeError, return None"]}, {"kind": "py", "title": "Keep the conversation under a limit", "task": "The API is stateless, so you resend history, but it can't grow forever. Write <code>trim_history(messages, max_messages)<\/code>: keep only the last <code>max_messages<\/code> messages, but the result must <b>start with a user message<\/b> (drop leading assistant messages). Don't modify the input list.", "starter": "def trim_history(messages, max_messages):\n    pass\n", "solution": "def trim_history(messages, max_messages):\n    kept = messages[-max_messages:] if max_messages > 0 else []\n    while kept and kept[0][\"role\"] != \"user\":\n        kept = kept[1:]\n    return kept\n", "hint": "Slice with [-max_messages:], then drop from the front while the first role isn't \"user\". Slicing makes a copy.", "tests": [{"label": "last 3 already start with user", "expr": "[m['content'] for m in trim_history(H, 3)]", "want": "['q2', 'a2', 'q3']"}, {"label": "last 2: drops the leading assistant", "expr": "[m['content'] for m in trim_history(H, 2)]", "wan
