|benchmark|reference|check (it )?against|old report|previous report|correct (report|version)"], ["checking the files and columns", "column|file|schema|missing|format|header|validat|check (each|every|the) (csv|file|input)|input check"], ["failing loudly, not a silently wrong report", "fail|error|stop|alert|loud|flag|warn|notify|raise|silent|report (the )?problem|tell (someone|us)|log"], ["how you'd know it's done", "match|schedul|monday|weekly|automat|cron|runs? (by itself|every)|same (numbers|total)|no manual|trust|verified|sign.?off"]]}], "7": [{"kind": "py", "title": "Bank account class", "task": "Write a class <code>BankAccount<\/code>: <code>BankAccount(100)<\/code> starts with <code>balance<\/code> 100. <code>deposit(x)<\/code> adds x. <code>withdraw(x)<\/code> subtracts x, but raises <code>ValueError<\/code> if x is more than the balance (and leaves the balance unchanged).", "starter": "class BankAccount:\n    def __init__(self, balance):\n        pass\n", "solution": "class BankAccount:\n    def __init__(self, balance):\n        self.balance = balance\n\n    def deposit(self, x):\n        self.balance += x\n\n    def withdraw(self, x):\n        if x > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= x\n", "hint": "Store the balance on self. raise ValueError(\"...\") stops the method before the subtraction.", "tests": [{"label": "starts at 100", "expr": "BankAccount(100).balance", "want": "100"}, {"label": "deposit 50, withdraw 20", "expr": "(lambda a: (a.deposit(50), a.withdraw(20), a.balance)[-1])(BankAccount(100))", "want": "130"}, {"label": "overdraw raises ValueError", "expr": "_raises(lambda: BankAccount(10).withdraw(50), ValueError)", "want": "True"}, {"label": "balance unchanged after failed withdraw", "expr": "(lambda a: (_raises(lambda: a.withdraw(50), ValueError), a.balance)[-1])(BankAccount(10))", "want": "10"}], "new": [["raise ValueError('msg')", "stop with an error you choose, with your own message"]], "pat": "class with methods", "steps": ["__init__: store the starting balance on self", "deposit: add x to self.balance", "withdraw: if x is more than the balance, raise ValueError", "withdraw: otherwise subtract x"], "free": true}, {"kind": "py", "title": "Stack class", "task": "Write a class <code>Stack<\/code> with <code>push(x)<\/code>, <code>pop()<\/code> (returns the top item), <code>peek()<\/code> (returns the top without removing it), <code>is_empty()<\/code> and <code>__len__<\/code>.", "starter": "class Stack:\n    def __init__(self):\n        self.items = []\n", "solution": "class Stack:\n    def __init__(self):\n        self.items = []\n\n    def push(self, x):\n        self.items.append(x)\n\n    def pop(self):\n        return self.items.pop()\n\n    def peek(self):\n        return self.items[-1]\n\n    def is_empty(self):\n        return len(self.items) == 0\n\n    def __len__(self):\n        return len(self.items)\n", "hint": "A Python list already behaves like a stack: append adds to the end, pop() removes from the end, [-1] reads the end.", "tests": [{"label": "push 1, 2 then pop", "expr": "(lambda s: (s.push(1), s.push(2), s.pop())[-1])(Stack())", "want": "2"}, {"label": "peek doesn't remove", "expr": "(lambda s: (s.push(7), s.peek(), len(s))[1:])(Stack())", "want": "(7, 1)"}, {"label": "new stack is empty", "expr": "Stack().is_empty()", "want": "True"}], "new": [["xs.pop()", "remove and return the last item (xs.pop(0) removes the first)"]], "pat": "class with methods", "steps": ["__init__: start with an empty list", "push: append to the list", "pop: remove and return the last item", "peek: return the last item without removing it", "is_empty and __len__: use len(self.items)"], "free": true}], "8": [{"kind": "sql", "title": "Filter and sort", "task": "From <code>employees<\/code>, return <code>name<\/code> and <code>salary<\/code> of people in the Sales department earning more than 50000. Highest salary first; break ties by name A to Z.", "starter": "SELECT \n", "solution": "SELECT name, salary FROM employees WHERE dept = 'Sales' AND salary > 50000 ORDER BY salary DESC, name;", "hint": "WHERE dept = 'Sales' AND salary > 50000, then ORDER BY salary DESC, name.", "ordered": true, "rows": 3}, {"kind": "sql", "title": "Find the NULLs", "task": "Return the <code>name<\/code> of every employee who has no manager.", "starter": "SELECT \n", "solution": "SELECT name FROM employees WHERE manager_id IS NULL;", "hint": "= NULL never matches. Use IS NULL.", "ordered": false, "rows": 3}, {"kind": "sql", "title": "IN and IS NOT NULL", "task": "Return <code>name<\/code> and <code>email<\/code> of customers in Hyderabad or Pune who have an email address.", "starter": "SELECT \n", "solution": "SELECT name, email FROM customers WHERE city IN ('Hyderabad', 'Pune') AND email IS NOT NULL;", "hint": "city IN ('Hyderabad', 'Pune') AND email IS NOT NULL.", "ordered": false, "new": [["x IN ('a', 'b')", "x is one of these values"]], "rows": 3}], "9": [{"kind": "sql", "title": "GROUP BY with HAVING", "task": "For each department with <b>at least 3<\/b> employees, return <code>dept<\/code>, the number of employees, and the average salary.", "starter": "SELECT \n", "solution": "SELECT dept, COUNT(*), AVG(salary) FROM employees GROUP BY dept HAVING COUNT(*) >= 3;", "hint": "Group by dept, then filter groups with HAVING COUNT(*) >= 3.", "ordered": false, "rows": 2}, {"kind": "sql", "title": "Big spenders", "task": "From <code>orders<\/code>, return <code>customer_id<\/code> and the total <code>amount<\/code> for customers whose total is over 100.", "starter": "SELECT \n", "solution": "SELECT customer_id, SUM(amount) FROM orders GROUP BY customer_id HAVING SUM(amount) > 100;", "hint": "SUM(amount) per customer_id, filtered with HAVING.", "ordered": false, "rows": 2}, {"kind": "sql", "title": "CASE labels", "task": "Return each order's <code>id<\/code> and a label: <code>'big'<\/code> if amount is 100 or more, otherwise <code>'small'<\/code>.", "starter": "SELECT \n", "solution": "SELECT id, CASE WHEN amount >= 100 THEN 'big' ELSE 'small' END FROM orders;", "hint": "CASE WHEN amount >= 100 THEN 'big' ELSE 'small' END", "ordered": false, "new": [["CASE WHEN cond THEN a ELSE b END", "if / else inside a query"]], "rows": 7}], "10": [{"kind": "sql", "title": "Anti-join", "task": "Return the <code>name<\/code> of every customer who has never placed an order.", "starter": "SELECT \n", "solution": "SELECT c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL;", "hint": "LEFT JOIN orders, then keep rows where the order side IS NULL.", "ordered": false, "rows": 1}, {"kind": "sql", "title": "Self join", "task": "Return each employee's <code>name<\/code> and their manager's name. Employees without a manager should still appear, with NULL as the manager.", "starter": "SELECT \n", "solution": "SELECT e.name, m.name FROM employees e LEFT JOIN employees m ON e.manager_id = m.id;", "hint": "Alias the table twice: employees e LEFT JOIN employees m ON e.manager_id = m.id.", "ordered": false, "rows": 10}, {"kind": "sql", "title": "Count including zero", "task": "Return every customer's <code>name<\/code> and how many orders they have placed. Customers with no orders must show <b>0<\/b>.", "starter": "SELECT \n", "solution": "SELECT c.name, COUNT(o.id) FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id, c.name;", "hint": "COUNT(*) counts the NULL row as 1. COUNT(o.id) skips NULLs and gives 0.", "ordered": false, "rows": 5}], "11": [{"kind": "sql", "title": "Top 2 salaries per department", "task": "Return <code>name<\/code>, <code>dept<\/code> and <code>salary<\/code> for employees whose salary is among the top 2 <b>distinct<\/b> salaries in their department. Ignore employees with no salary.", "starter": "SELECT \n", "solution": "WITH r AS (SELECT name, dept, salary, DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk FROM employees WHERE salary IS NOT NULL) SELECT name, dept, salary FROM r WHERE rnk <= 2;", "hint": "DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) inside a CTE, then WHERE rnk <= 2 outside.", "ordered": false, "new": [["DENSE_RANK() OVER (...)", "like RANK, but no gaps after ties"]], "rows": 7}, {"kind": "sql", "title": "Running total", "task": "Return <code>order_date<\/code>, <code>amount<\/code> and a running total of amount, ordered by date.", "starter": "SELECT \n", "solution": "SELECT order_date, amount, SUM(amount) OVER (ORDER BY order_date) FROM orders ORDER BY order_date;", "hint": "SUM(amount) OVER (ORDER BY order_date)", "ordered": true, "rows": 7}, {"kind": "sql", "title": "Second highest salary", "task": "Return the second highest <b>distinct<\/b> salary in the company as a single value. (LeetCode 176.)", "starter": "SELECT \n", "solution": "SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees);", "hint": "The max of everything below the max. Or DISTINCT salary ORDER BY salary DESC LIMIT 1 OFFSET 1.", "ordered": false, "rows": 1}], "12": [{"kind": "py", "title": "What groupby does underneath", "task": "pandas <code>groupby(\"category\")[\"amount\"].sum()<\/code> is this loop. Write <code>group_sum(rows, key, value)<\/code>: rows is a list of dicts; return a dict of each key's value to the sum of its values. (Practise real pandas in Colab today too.)", "starter": "def group_sum(rows, key, value):\n    pass\n", "solution": "def group_sum(rows, key, value):\n    out = {}\n    for r in rows:\n        out[r[key]] = out.get(r[key], 0) + r[value]\n    return out\n", "hint": "Same pattern as word count, but the key and value column names are parameters: r[key], r[value].", "tests": [{"label": "by category", "expr": "group_sum([{'c': 'a', 'v': 1}, {'c': 'b', 'v': 2}, {'c': 'a', 'v': 3}], 'c', 'v')", "want": "{'a': 4, 'b': 2}"}, {"label": "empty", "expr": "group_sum([], 'c', 'v')", "want": "{}"}], "pat": "hash map / set", "steps": ["Make an empty dict", "For each row, read its key and its number", "Add the number to that key's total (starting from 0)", "Return the dict"]}, {"kind": "py", "title": "pandas: filter rows, pick columns, sort", "task": "Write <code>big_orders(df, minimum)<\/code>: return the rows whose amount is at least <code>minimum<\/code>, keeping only the columns <code>id<\/code> and <code>amount<\/code>, sorted by amount from highest to lowest.<p class=\"hint\"><code>ORDERS<\/code> has columns id, category, amount (one is missing) and customer_id. <code>CUSTOMERS<\/code> has customer_id and city. pandas is imported as <code>pd<\/code>.<\/p>", "starter": "def big_orders(df, minimum):\n    pass\n", "solution": "def big_orders(df, minimum):\n    big = df[df[\"amount\"] >= minimum]\n    return big[[\"id\", \"amount\"]].sort_values(\"amount\", ascending=False)\n", "hint": "Three moves: a mask in square brackets to filter, double brackets to pick columns, then sort_values with ascending=False.", "tests": [{"label": "how many rows", "expr": "len(big_orders(ORDERS, 100))", "want": "3"}, {"label": "rows, highest first", "expr": "big_orders(ORDERS, 100).to_dict('records')", "want": "[{'id': 4, 'amount': 300.0}, {'id': 1, 'amount': 120.0}, {'id': 3, 'amount': 100.0}]"}, {"label": "only id and amount", "expr": "list(big_orders(ORDERS, 500).columns)", "want": "['id', 'amount']"}], "prelude": "import pandas as pd\nORDERS = pd.DataFrame({\"id\": [1, 2, 3, 4, 5, 6], \"category\": [\"toys\", \"books\", \"toys\", \"games\", \"books\", \"toys\"], \"amount\": [120.0, 40.0, 100.0, 300.0, None, 99.5], \"customer_id\": [1, 2, 1, 3, 2, 9]})\nCUSTOMERS = pd.DataFrame({\"customer_id\": [1, 2, 3], \"city\": [\"Pune\", \"Delhi\", \"Pune\"]})\n", "pkgs": true, "pat": "filter, select, sort", "steps": ["Build a True/False mask: amount is at least minimum", "Keep the rows where the mask is True", "Keep only the id and amount columns", "Sort by amount, highest first, and return it"]}, {"kind": "py", "title": "pandas: group and total", "task": "Write <code>revenue_by_category(df)<\/code>: return a dict of category to total amount. A missing amount counts as nothing.<p class=\"hint\"><code>ORDERS<\/code> has columns id, category, amount (one is missing) and customer_id. <code>CUSTOMERS<\/code> has customer_id and city. pandas is imported as <code>pd<\/code>.<\/p>", "starter": "def revenue_by_category(df):\n    pass\n", "solution": "def revenue_by_category(df):\n    return df.groupby(\"category\")[\"amount\"].sum().to_dict()\n", "hint": "groupby the category, pick the amount column, sum it, then .to_dict(). sum() skips missing values for you.", "tests": [{"label": "one category", "expr": "revenue_by_category(ORDERS)['games']", "want": "300.0"}, {"label": "all categories", "expr": "revenue_by_category(ORDERS)", "want": "{'books': 40.0, 'games': 300.0, 'toys': 319.5}"}, {"label": "no rows", "expr": "revenue_by_category(ORDERS[ORDERS['amount'] > 1000])", "want": "{}"}], "prelude": "import pandas as pd\nORDERS = pd.DataFrame({\"id\": [1, 2, 3, 4, 5, 6], \"category\": [\"toys\", \"books\", \"toys\", \"games\", \"books\", \"toys\"], \"amount\": [120.0, 40.0, 100.0, 300.0, None, 99.5], \"customer_id\": [1, 2, 1, 3, 2, 9]})\nCUSTOMERS = pd.DataFrame({\"customer_id\": [1, 2, 3], \"city\": [\"Pune\", \"Delhi\", \"Pune\"]})\n", "pkgs": true, "new": [["s.to_dict()", "turn a pandas Series into a plain dict"]], "pat": "group & aggregate", "steps": ["Group the rows by category", "Pick the amount column", "Sum it (missing values are skipped)", "Turn the result into a dict and return it"]}, {"kind": "py", "title": "pandas: clean, join, then aggregate", "task": "Write <code>city_revenue(orders, customers)<\/code>: drop orders with a missing amount, left-join the customers on <code>customer_id<\/code>, label orders whose customer isn't in the table as city <code>'Unknown'<\/code>, and return a list of <code>(city, total)<\/code> tuples with the highest total first.<p class=\"hint\"><code>ORDERS<\/code> has columns id, category, amount (one is missing) and customer_id. <code>CUSTOMERS<\/code> has customer_id and city. pandas is imported as <code>pd<\/code>.<\/p>", "starter": "def city_revenue(orders, customers):\n    pass\n", "solution": "def city_revenue(orders, customers):\n    clean = orders.dropna(subset=[\"amount\"])\n    joined = clean.merge(customers, on=\"customer_id\", how=\"left\")\n    joined[\"city\"] = joined[\"city\"].fillna(\"Unknown\")\n    totals = joined.groupby(\"city\")[\"amount\"].sum().sort_values(ascending=False)\n    return list(totals.items())\n", "hint": "Work in the order the task gives: dropna(subset=...), merge(..., how='left'), fillna on the city column, groupby and sum, sort_values, then list(totals.items()).", "tests": [{"label": "how many cities", "expr": "len(city_revenue(ORDERS, CUSTOMERS))", "want": "3"}, {"label": "totals, highest first", "expr": "city_revenue(ORDERS, CUSTOMERS)", "want": "[('Pune', 520.0), ('Unknown', 99.5), ('Delhi', 40.0)]"}, {"label": "inputs are left unchanged", "expr": "(city_revenue(ORDERS, CUSTOMERS), len(ORDERS), list(ORDERS.columns))[1:]", "want": "(6, ['id', 'category', 'amount', 'customer_id'])"}], "prelude": "import pandas as pd\nORDERS = pd.DataFrame({\"id\": [1, 2, 3, 4, 5, 6], \"category\": [\"toys\", \"books\", \"toys\", \"games\", \"books\", \"toys\"], \"amount\": [120.0, 40.0, 100.0, 300.0, None, 99.5], \"customer_id\": [1, 2, 1, 3, 2, 9]})\nCUSTOMERS = pd.DataFrame({\"customer_id\": [1, 2, 3], \"city\": [\"Pune\", \"Delhi\", \"Pune\"]})\n", "pkgs": true, "new": [["df.dropna()", "drop rows that have missing values"], ["df['c'].fillna(0)", "replace missing values with 0"]], "pat": "clean, join, aggregate", "steps": ["Drop the rows with a missing amount", "Left-join customers on customer_id", "Fill the missing cities with 'Unknown'", "Group by city and sum the amount", "Sort highest first and return (city, total) tuples"]}], "14": [{"kind": "py", "title": "Clean messy rows", "task": "Write <code>clean_rows(rows)<\/code>. Each row is a dict with string <code>id<\/code> and <code>amount<\/code>. Return a tuple <code>(good, bad)<\/code>: good is a list of <code>(int id, float amount)<\/code> tuples for rows that convert cleanly; bad is how many rows failed (wrong value or missing key). Never crash.", "starter": "def clean_rows(rows):\n    good, bad = [], 0\n    \n    return good, bad\n", "solution": "def clean_rows(rows):\n    good, bad = [], 0\n    for r in rows:\n        try:\n            good.append((int(r[\"id\"]), float(r[\"amount\"])))\n        except (ValueError, KeyError):\n            bad += 1\n    return good, bad\n", "hint": "Wrap the conversion in try/except (ValueError, KeyError) and count the failures.", "tests": [{"label": "one bad value, one missing key", "expr": "clean_rows([{'id': '1', 'amount': '9.5'}, {'id': '2', 'amount': 'abc'}, {'id': '3'}, {'id': '4', 'amount': '1'}])", "want": "([(1, 9.5), (4, 1.0)], 2)"}, {"label": "all good", "expr": "clean_rows([{'id': '7', 'amount': '0'}])", "want": "([(7, 0.0)], 0)"}], "pat": "try/except", "steps": ["Start an empty good list and bad = 0", "For each row, try converting id to int and amount to float", "If it works, append the (id, amount) tuple", "If ValueError or KeyError happens, add 1 to bad", "Return (good, bad)"]}, {"kind": "sql", "title": "Monthly totals", "task": "Return each month as <code>YYYY-MM<\/code> and the total order amount for that month, ordered by month.", "starter": "SELECT \n", "solution": "SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) FROM orders GROUP BY month ORDER BY month;", "hint": "In SQLite: strftime('%Y-%m', order_date) or substr(order_date, 1, 7).", "ordered": true, "new": [["strftime('%Y-%m', d)", "SQLite: a date as text like 2026-02 (other databases use DATE_TRUNC or TO_CHAR)"]], "rows": 3}, {"kind": "py", "scenario": true, "title": "Revenue that matches finance", "brief": "Hi, our monthly revenue from your dashboard is higher than what finance reports. I've attached the raw export. Can you find out why and give us numbers we can trust? (Priya, Head of Ops)", "clarify": {"q": "Your total is higher than finance's. What do you check first?", "o": ["Whether some orders appear more than once in the export", "Which Python version finance uses", "Whether to rewrite it in pandas", "Whether the column names are tidy"], "a": 0, "why": "Exports often repeat rows. Always ask what makes a record unique (here, order_id) before adding anything up."}, "task": "<code>ROWS<\/code> (provided) is the raw export: every value is a string. Write <code>monthly_revenue(rows)<\/code> returning a dict of <code>YYYY-MM<\/code> to total revenue, rounded to 2 decimals. Count each <code>order_id<\/code> once, skip customers whose name contains <code>TEST<\/code> (any case), skip blank amounts, strip <code>$<\/code>, commas and spaces, and let refunds (negative amounts) reduce revenue.", "starter": "def monthly_revenue(rows):\n    totals = {}\n    \n    return totals\n", "solution": "def monthly_revenue(rows):\n    totals, seen = {}, set()\n    for r in rows:\n        if r[\"order_id\"] in seen:\n            continue\n        seen.add(r[\"order_id\"])\n        if \"test\" in r[\"customer\"].lower():\n            continue\n        raw = r[\"amount\"].replace(\"$\", \"\").replace(\",\", \"\").strip()\n        if not raw:\n            continue\n        month = r[\"date\"][:7]\n        totals[month] = round(totals.get(month, 0) + float(raw), 2)\n    return totals\n", "hint": "Keep a set of order_ids you've already counted. Clean the amount string before float(). The month is date[:7].", "tests": [{"label": "the real export", "expr": "monthly_revenue(ROWS)", "want": "{'2026-01': 1500.5, '2026-02': 30.0}"}, {"label": "only duplicates", "expr": "monthly_revenue([{'order_id': '1', 'customer': 'A', 'date': '2026-03-01', 'amount': '10'}] * 3)", "want": "{'2026-03': 10.0}"}, {"label": "empty export", "expr": "monthly_revenue([])", "want": "{}"}], "reply": "Found it: the export lists some orders twice and includes a test account. Counting each order once, skipping test data and blank amounts, and subtracting refunds gives January $1,500.50 and February $30.00. One question back: should refunds reduce revenue? If finance excludes them, February becomes $80.00.", "prelude": "ROWS = [\n    {\"order_id\": \"1001\", \"customer\": \"Acme\", \"date\": \"2026-01-05\", \"amount\": \"$1,200.50\"},\n    {\"order_id\": \"1002\", \"customer\": \"Bolt\", \"date\": \"2026-01-19\", \"amount\": \"300\"},\n    {\"order_id\": \"1002\", \"customer\": \"Bolt\", \"date\": \"2026-01-19\", \"amount\": \"300\"},\n    {\"order_id\": \"1003\", \"customer\": \"TEST ACCOUNT\", \"date\": \"2026-01-20\", \"amount\": \"999\"},\n    {\"order_id\": \"1004\", \"customer\": \"Cora\", \"date\": \"2026-02-02\", \"amount\": \" 80 \"},\n    {\"order_id\": \"1005\", \"customer\": \"Acme\", \"date\": \"2026-02-14\", \"amount\": \"\"},\n    {\"order_id\": \"1006\", \"customer\": \"Dune\", \"date\": \"2026-02-20\", \"amount\": \"-50\"},\n]\n", "new": [["s.replace('a', 'b')", "replace text"], ["round(x, 2)", "round to 2 decimals"]], "pat": "dedupe & clean", "steps": ["Start an empty totals dict and an empty set of seen order ids", "Skip a row whose order_id is already seen, otherwise remember it", "Skip test customers and blank amounts", "Clean the amount (remove $, commas, spaces) and turn it into a float", "Add it to its month's total (date[:7]) and return the totals"]}, {"kind": "design", "scope": true, "title": "Scope it: \"the dashboard numbers look off\"", "task": "<b>From the Head of Sales:<\/b> \"Our revenue dashboard says one thing and finance says another. Fix it.\" You have read access to the orders database and the dashboard's SQL.", "questions": [["Which number, for which period, differs, and by how much?", true], ["How does finance define revenue: refunds, tax, test accounts?", true], ["Which one does leadership treat as the truth today?", true], ["Can we switch to a different BI tool?", false], ["Should the dashboard be dark mode?", false], ["Which SQL dialect is the most popular?", false]], "steps": ["Pick one month and get both numbers side by side", "Get finance's exact definition of revenue", "Read the dashboard SQL line by line against that definition", "Find the rows that explain the gap: duplicates, refunds, test data, time zones", "Fix the query and show the numbers now match", "Write a short note with the cause and the new definition"], "trade": [{"q": "The gap is 4%. Where do you look first?", "o": ["Rows counted twice by a JOIN, or orders that shouldn't count", "Rounding in the chart", "The database server's speed", "The dashboard's colours"], "a": 0, "why": "Most metric gaps come from definitions and JOINs that duplicate rows (Day 10), not from rounding."}, {"q": "You found the cause. How do you report it?", "o": ["One paragraph: what differed, why, the fix, and one question about the definition", "A 10-page technical document", "Just fix it and say nothing", "Send the SQL diff only"], "a": 0, "why": "Customers need the cause in plain words and a decision to make. The SQL is for engineers."}], "model": ["Clarify: which number, which period, how big the gap is, and finance's definition.", "Reproduce it on one month with both numbers side by side.", "Trace the dashboard SQL against the definition; find the rows that explain the gap.", "Fix it, show the numbers match, and confirm the definition with finance.", "Report in plain words: cause, fix, one open question."], "keys": [["which number and period, and finance's definition", "defin|which number|period|finance|what counts|how (do )?(they|finance) (count|calculate)|month|date range|difference|gap|which (figure|metric)"], ["reproducing the gap on one month", "reproduc|one month|side by side|compar|recreate|same period|line (them )?up|pick a (month|period)|small sample|isolate"], ["tracing the SQL for duplicates, refunds or test data", "join|duplicat|refund|test (data|account)|sql|query|double.?count|repeat(ed)? rows|cancel|time ?zone|filter|logic"], ["showing the fixed number matches", "match|fix|reconcil|agree|same number|tie out|verify|confirm|equal|line up"], ["a plain-words report of the cause", "report|explain|plain|note|tell|cause|document|write.?up|summar|email|share|communicat|reason"]]}], "15": [{"kind": "py", "title": "Group anagrams", "task": "Write <code>group_anagrams(words)<\/code>: return a list of groups, where each group is a list of words that are anagrams of each other. Any order is fine. (LeetCode 49.)", "starter": "from collections import defaultdict\n\ndef group_anagrams(words):\n    pass\n", "solution": "from collections import defaultdict\n\ndef group_anagrams(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[\"\".join(sorted(w))].append(w)\n    return list(groups.values())\n", "hint": "Use the sorted letters as the dict key.", "tests": [{"label": "eat, tea, tan, ate, nat, bat", "expr": "sorted(sorted(g) for g in group_anagrams(['eat', 'tea', 'tan', 'ate', 'nat', 'bat']))", "want": "[['ate', 'eat', 'tea'], ['bat'], ['nat', 'tan']]"}, {"label": "empty string", "expr": "group_anagrams([''])", "want": "[['']]"}], "pat": "hash map / set", "steps": ["Make a dict where every key maps to a list", "For each word, sort its letters to make the key", "Append the word to that key's list", "Return the dict's values as a list"]}, {"kind": "py", "title": "Top K frequent", "task": "Write <code>top_k_frequent(nums, k)<\/code>: return the k most frequent numbers, most frequent first. (LeetCode 347.)", "starter": "from collections import Counter\n\ndef top_k_frequent(nums, k):\n    pass\n", "solution": "from collections import Counter\n\ndef top_k_frequent(nums, k):\n    return [x for x, _ in Counter(nums).most_common(k)]\n", "hint": "Counter(nums).most_common(k) gives (number, count) pairs. Keep just the numbers.", "tests": [{"label": "[1,1,1,2,2,3], 2", "expr": "top_k_frequent([1, 1, 1, n    pass\n", "solution": "def first_repeat(nums):\n    seen = set()\n    for x in nums:\n        if x in seen:\n            return x\n        seen.add(x)\n    return None\n", "hint": "A set answers 'have I seen this?' instantly.", "tests": [{"label": "basic", "expr": "first_repeat([2, 1, 3, 1, 2])", "want": "1"}, {"label": "none", "expr": "first_repeat([1, 2, 3])", "want": "None"}, {"label": "empty", "expr": "first_repeat([])", "want": "None"}, {"label": "immediately", "expr": "first_repeat([5, 5])", "want": "5"}, {"label": "large input (must be fast)", "expr": "first_repeat(list(range(50000)) + [7])", "want": "7"}], "opt": true, "fuzz": ["first_repeat", "([R.randint(0, 8) for _ in range(R.randint(0, 8))],)"], "pat": "hash map / set", "steps": ["Make an empty set of values seen", "Go through the numbers in order", "If the number is already in the set, return it", "Otherwise add it. Return None at the end"]}, {"kind": "py", "title": "Pairs that differ by k", "task": "Write <code>count_pairs_diff(nums, k)<\/code>: count the pairs of positions <code>i &lt; j<\/code> where the two numbers differ by exactly <code>k<\/code> (k is at least 1).", "starter": "def count_pairs_diff(nums, k):\n    pass\n", "solution": "def count_pairs_diff(nums, k):\n    seen = {}\n    total = 0\n    for x in nums:\n        total += seen.get(x - k, 0) + seen.get(x + k, 0)\n        seen[x] = seen.get(x, 0) + 1\n    return total\n", "hint": "Count what came before, not every pair.", "tests": [{"label": "basic", "expr": "count_pairs_diff([1, 2, 2, 1], 1)", "want": "4"}, {"label": "none", "expr": "count_pairs_diff([1, 1], 3)", "want": "0"}, {"label": "empty", "expr": "count_pairs_diff([], 1)", "want": "0"}, {"label": "spread", "expr": "count_pairs_diff([3, 1, 4, 1, 5], 2)", "want": "3"}, {"label": "large input (must be fast)", "expr": "count_pairs_diff(list(range(30000)), 5)", "want": "29995"}], "opt": true, "fuzz": ["count_pairs_diff", "([R.randint(0, 6) for _ in range(R.randint(0, 8))], R.randint(1, 4))"], "pat": "hash map / set", "steps": ["Keep a dict counting how many times each value has appeared so far", "For each number x, add the counts of x - k and x + k", "Then record x", "Return the total"]}], "16": [{"kind": "py", "title": "Best time to buy and sell", "task": "Write <code>max_profit(prices)<\/code>: buy on one day and sell on a later day for the biggest profit. Return 0 if no profit is possible. (LeetCode 121.)", "starter": "def max_profit(prices):\n    pass\n", "solution": "def max_profit(prices):\n    lowest, best = float(\"inf\"), 0\n    for p in prices:\n        lowest = min(lowest, p)\n        best = max(best, p - lowest)\n    return best\n", "hint": "Track the lowest price so far. Today's profit is today's price minus that.", "tests": [{"label": "[7,1,5,3,6,4]", "expr": "max_profit([7, 1, 5, 3, 6, 4])", "want": "5"}, {"label": "falling prices", "expr": "max_profit([7, 6, 4, 3, 1])", "want": "0"}, {"label": "one day", "expr": "max_profit([5])", "want": "0"}, {"label": "large input (must be fast)", "expr": "max_profit(list(range(3000, 0, -1)) + [5000])", "want": "4999"}], "fuzz": ["max_profit", "([R.randint(1, 20) for _ in range(R.randint(1, 8))],)"], "new": [["min(xs)", "the smallest value; min(a, b) compares two values"]], "pat": "track best so far", "steps": ["Start lowest at infinity and best at 0", "For each price, update the lowest price seen", "Update best with price minus lowest", "Return best"]}, {"kind": "py", "title": "Longest substring without repeats", "task": "Write <code>longest_unique(s)<\/code>: the length of the longest substring with no repeated characters. Use a sliding window. (LeetCode 3.)", "starter": "def longest_unique(s):\n    pass\n", "solution": "def longest_unique(s):\n    seen, left, best = {}, 0, 0\n    for right, ch in enumerate(s):\n        if ch in seen and seen[ch] >= left:\n            left = seen[ch] + 1\n        seen[ch] = right\n        best = max(best, right - left + 1)\n    return best\n", "hint": "Remember each character's last index. On a repeat inside the window, move left past it.", "tests": [{"label": "abcabcbb", "expr": "longest_unique('abcabcbb')", "want": "3"}, {"label": "bbbbb", "expr": "longest_unique('bbbbb')", "want": "1"}, {"label": "pwwkew", "expr": "longest_unique('pwwkew')", "want": "3"}, {"label": "abba", "expr": "longest_unique('abba')", "want": "2"}, {"label": "empty", "expr": "longest_unique('')", "want": "0"}], "fuzz": ["longest_unique", "(''.join(R.choice('abc') for _ in range(R.randint(0, 10))),)"], "pat": "sliding window", "steps": ["Keep a dict of each character's last index, a left edge, and the best length", "Move right across the string one character at a time", "If the character was seen inside the window, move left just past it", "Record its index and update the best length", "Return the best length"]}, {"kind": "py", "title": "Two Sum II (sorted)", "task": "Write <code>two_sum_sorted(numbers, target)<\/code>: numbers is sorted ascending. Return the <b>1-based<\/b> positions <code>[i, j]<\/code> of the pair that adds to target, using two pointers and O(1) extra memory. (LeetCode 167.)", "starter": "def two_sum_sorted(numbers, target):\n    left, right = 0, len(numbers) - 1\n    \n", "solution": "def two_sum_sorted(numbers, target):\n    left, right = 0, len(numbers) - 1\n    while left < right:\n        s = numbers[left] + numbers[right]\n        if s == target:\n            return [left + 1, right + 1]\n        if s < target:\n            left += 1\n        else:\n            right -= 1\n", "hint": "Sum too small: move left up. Too big: move right down. Add 1 to each index when you return.", "tests": [{"label": "[2,7,11,15], 9", "expr": "two_sum_sorted([2, 7, 11, 15], 9)", "want": "[1, 2]"}, {"label": "[2,3,4], 6", "expr": "two_sum_sorted([2, 3, 4], 6)", "want": "[1, 3]"}, {"label": "[-1,0], -1", "expr": "two_sum_sorted([-1, 0], -1)", "want": "[1, 2]"}, {"label": "large input (must be fast)", "expr": "two_sum_sorted(list(range(1, 3 = pairs[ch]:\n                return False\n        else:\n            stack.append(ch)\n    return not stack\n", "hint": "Push openers. On a closer, the stack must be non-empty and its top must be the matching opener. At the end the stack must be empty.", "tests": [{"label": "()[]{}", "expr": "is_valid('()[]{}')", "want": "True"}, {"label": "(]", "expr": "is_valid('(]')", "want": "False"}, {"label": "([)]", "expr": "is_valid('([)]')", "want": "False"}, {"label": "starts with a closer", "expr": "is_valid(']')", "want": "False"}, {"label": "unclosed", "expr": "is_valid('((')", "want": "False"}], "fuzz": ["is_valid", "(''.join(R.choice('()[]{}') for _ in range(R.randint(0, 6))),)"], "pat": "stack", "steps": ["Make an empty stack", "For each character: if it's an opener, push it", "If it's a closer, the stack must be non-empty with the matching opener on top, else return False", "At the end, return whether the stack is empty"]}, {"kind": "py", "title": "Binary search", "task": "Write <code>search(nums, target)<\/code>: nums is sorted. Return target's index or -1, in O(log n). (LeetCode 704.)", "starter": "def search(nums, target):\n    pass\n", "solution": "def search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n", "hint": "lo, hi = 0, len(nums) - 1 and while lo <= hi. Move lo to mid + 1 or hi to mid - 1.", "tests": [{"label": "found", "expr": "search([-1, 0, 3, 5, 9, 12], 9)", "want": "4"}, {"label": "missing", "expr": "search([-1, 0, 3, 5, 9, 12], 2)", "want": "-1"}, {"label": "one element", "expr": "search([5], 5)", "want": "0"}, {"label": "empty", "expr": "search([], 1)", "want": "-1"}, {"label": "first item", "expr": "search([1, 2, 3], 1)", "want": "0"}, {"label": "100,000 items (must be O(log n))", "expr": "search(_Probe(range(0, 200000, 2)), icates", "expr": "count_below([2, 2, 2, 4], 2)", "want": "0"}, {"label": "empty", "expr": "count_below([], 3)", "want": "0"}, {"label": "2000 searches in 100,000 items (must be fast)", "expr": "sum(count_below(BIG, q) for q in range(0, 100000, 50))", "want": "99950000"}], "prelude": "BIG = list(range(100000))\n", "opt": true, "fuzz": ["count_below", "(sorted(R.randint(0, 9) for _ in range(R.randint(0, 8))), R.randint(-1, 10))"], "pat": "binary search", "steps": ["Set lo = 0 and hi = len(nums)", "While lo < hi, look at the middle", "If nums[mid] is less than x, the answer is further right: lo = mid + 1", "Otherwise hi = mid. Return lo"]}], "18": [{"kind": "py", "title": "Reverse a linked list", "task": "<code>ListNode<\/code>, <code>build(list)<\/code> and <code>to_list(head)<\/code> are provided. Write <code>reverse(head)<\/code> that reverses the list and returns the new head. (LeetCode 206.)", "starter": "def reverse(head):\n    prev = None\n    \n", "solution": "def reverse(head):\n    prev = None\n    while head:\n        nxt = head.next\n        head.next = prev\n        prev, head = head, nxt\n    return prev\n", "hint": "Save next, point current back at prev, then step both forward.", "tests": [{"label": "1..5", "expr": "to_list(reverse(build([1, 2, 3, 4, 5])))", "want": "[5, 4, 3, 2, 1]"}, {"label": "empty", "expr": "to_list(reverse(build([])))", "want": "[]"}, {"label": "one node", "expr": "to_list(reverse(build([7])))", "want": "[7]"}], "prelude": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef build(values):          # build([1, 2, 3]) -> head node\n    dummy = ListNode()\n    cur = dummy\n    for v in values:\n        cur.next = ListNode(v)\n        cur = cur.next\n    return dummy.next\n\ndef to_list(head):          # to_list(head) -> [1, 2, 3]\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n", "pat": "linked list pointers", "steps": ["Start prev as None", "While there is a current node", "Save the next node, then point the current node back at prev", "Move prev and current one step forward", "Return prev"]}, {"kind": "py", "title": "Merge two sorted lists", "task": "Write <code>merge(a, b)<\/code>: merge two sorted linked lists into one sorted list and return its head. Use a dummy node. (LeetCode 21.)", "starter": "def merge(a, b):\n    dummy = ListNode()\n    tail = dummy\n    \n", "solution": "def merge(a, b):\n    dummy = ListNode()\n    tail = dummy\n    while a and b:\n        if a.val <= b.val:\n            tail.next, a = a, a.next\n        else:\n            tail.next, b = b, b.next\n        tail = tail.next\n    tail.next = a or b\n    return dummy.next\n", "hint": "Attach the smaller head to tail and advance. When one list runs out, attach the rest of the other.", "tests": [{"label": "[1,2,4] + [1,3,4]", "expr": "to_list(merge(build([1, 2, 4]), build([1, 3, 4])))", "want": "[1, 1, 2, 3, 4, 4]"}, {"label": "both empty", "expr": "to_list(merge(build([]), build([])))", "want": "[]"}, {"label": "one empty", "expr": "to_list(merge(build([]), build([0])))", "want": "[0]"}], "prelude": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef build(values):          # build([1, 2, 3]) -> head node\n    dummy = ListNode()\n    cur = dummy\n    for v in values:\n        cur.next = ListNode(v)\n        cur = cur.next\n    return dummy.next\n\ndef to_list(head):          # to_list(head) -> [1, 2, 3]\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n", "pat": "linked list pointers", "steps": ["Make a dummy node and a tail pointer", "While both lists have nodes, attach the smaller one to tail and advance that list", "Move tail forward", "Attach whatever is left over", "Return dummy.next"]}, {"kind": "py", "title": "Fix the bug: cycle check crashes", "task": "This should return True if the list has a cycle. It crashes on a normal list. Read the AttributeError and fix it.", "starter": "def has_cycle(head):\n    slow = fast = head\n    while fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:\n            return True\n    return False\n", "solution": "def has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:\n            return True\n    return False\n", "hint": "fast jumps two steps, so it can become None. Check fast before fast.next.", "tests": [{"label": "no cycle, odd length", "expr": "has_cycle(build([1, 2, 3]))", "want": "False"}, {"label": "no cycle, even length", "expr": "has_cycle(build([1, 2]))", "want": "False"}, {"label": "empty", "expr": "has_cycle(None)", "want": "False"}, {"label": "with a cycle", "expr": "(lambda h: (setattr(h.next.next, 'next', h), has_cycle(h))[1])(build([1, 2, 3]))", "want": "True"}], "prelude": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef build(values):          # build([1, 2, 3]) -> head node\n    dummy = ListNode()\n    cur = dummy\n    for v in values:\n        cur.next = ListNode(v)\n        cur = cur.next\n    return dummy.next\n\ndef to_list(head):          # to_list(head) -> [1, 2, 3]\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n", "bug": true}, {"kind": "py", "title": "Power by halving", "task": "Write <code>power(x, n)<\/code>: return <code>x<\/code> raised to the whole number <code>n<\/code> (n is 0 or more) <em>without<\/em> using <code>**<\/code> or a loop of n steps. Use recursion that halves n each time: it must handle n = 1,000,000,000.", "starter": "def power(x, n):\n    pass\n", "solution": "def power(x, n):\n    if n == 0:\n        return 1\n    half = power(x, n // 2)\n    if n % 2 == 0:\n        return half * half\n    return half * half * x\n", "hint": "x**n = (x**(n/2))**2. Ask for the half once, not twice.", "tests": [{"label": "small", "expr": "power(2, 10)", "want": "1024"}, {"label": "zero exponent", "expr": "power(5, 0)", "want": "1"}, {"label": "odd exponent", "expr": "power(3, 5)", "want": "243"}, {"label": "one", "expr": "power(7, 1)", "want": "7"}, {"label": "base one, n = a billion (must be fast)", "expr": "power(1, 10 ** 9)", "want": "1"}, {"label": "base zero", "expr": "power(0, 4)", "want": "0"}], "opt": true, "fuzz": ["power", "(R.randint(0, 5), R.randint(0, 9))"], "pat": "recursion", "steps": ["Base case: n == 0 returns 1", "Ask for power(x, n // 2) once and keep the answer", "If n is even, square it", "If n is odd, square it and multiply by x"]}, {"kind": "py", "title": "Middle of the chain", "task": "Write <code>middle_value(head)<\/code>: <code>head<\/code> is the first node of a linked list (at least one node). Return the <code>val<\/code> of the middle node. If there are two middle nodes, return the second one.", "starter": "def middle_value(head):\n    pass\n", "solution": "def middle_value(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n    return slow.val\n", "hint": "When fast reaches the end, slow is in the middle.", "tests": [{"label": "odd length", "expr": "middle_value(build([1, 2, 3, 4, 5]))", "want": "3"}, {"label": "even length: second middle", "expr": "middle_value(build([1, 2, 3, 4, 5, 6]))", "want": "4"}, {"label": "one node", "expr": "middle_value(build([7]))", "want": "7"}, {"label": "two nodes", "expr": "middle_value(build([1, 2]))", "want": "2"}], "prelude": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef build(values):          # build([1, 2, 3]) -> head node\n    dummy = ListNode()\n    cur = dummy\n    for v in values:\n        cur.next = ListNode(v)\n        cur = cur.next\n    return dummy.next\n\ndef to_list(head):          # to_list(head) -> [1, 2, 3]\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n", "opt": true, "pat": "linked list pointers", "steps": ["Start slow and fast both at head", "Move slow one step and fast two steps", "Stop when fast has no next to jump to", "Return slow.val"]}], "19": [{"kind": "py", "title": "Max depth of a tree", "task": "<code>TreeNode<\/code>, <code>tree(list)<\/code> and <code>levels(root)<\/code> are provided. Write <code>max_depth(root)<\/code> recursively. (LeetCode 104.)", "starter": "def max_depth(root):\n    pass\n", "solution": "def max_depth(root):\n    if not root:\n        return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))\n", "hint": "Base case: None has depth 0. Otherwise 1 + the deeper child.", "tests": [{"label": "[3,9,20,null,null,15,7]", "expr": "max_depth(tree([3, 9, 20, None, None, 15, 7]))", "want": "3"}, {"label": "empty", "expr": "max_depth(None)", "want": "0"}, {"label": "[1,null,2]", "expr": "max_depth(tree([1, None, 2]))", "want": "2"}], "prelude": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef tree(values):           # tree([3, 9, 20, None, None, 15, 7]) -> root (LeetCode order)\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    q, i = deque([root]), 1\n    while q and i < len(values):\n        node = q.popleft()\n        if i < len(values) and values[i] is not None:\n            node.left = TreeNode(values[i]); q.append(node.left)\n        i += 1\n        if i < len(values) and values[i] is not None:\n            node.right = TreeNode(values[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef levels(root):           # levels(root) -> [3, 9, 20, 15, 7]\n    out, q = [], deque([root] if root else [])\n    while q:\n        n = q.popleft()\n        out.append(n.val)\n        if n.left: q.append(n.left)\n        if n.right: q.append(n.right)\n    return out\n", "pat": "recursion", "steps": ["If the node is None, return 0", "Get the depth of the left subtree", "Get the depth of the right subtree", "Return 1 plus the larger one"]}, {"kind": "py", "title": "Invert a tree", "task": "Write <code>invert(root)<\/code>: swap every node's left and right children and return the root. (LeetCode 226.)", "starter": "def invert(root):\n    pass\n", "solution": "def invert(root):\n    if root:\n        root.left, root.right = invert(root.right), invert(root.left)\n    return root\n", "hint": "Swap the children, recursing into each, and return root (even when it's None).", "tests": [{"label": "[4,2,7,1,3,6,9]", "expr": "levels(invert(tree([4, 2, 7, 1, 3, 6, 9])))", "want": "[4, 7, 2, 9, 6, 3, 1]"}, {"label": "empty", "expr": "invert(None)", "want": "None"}], "prelude": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef tree(values):           # tree([3, 9, 20, None, None, 15, 7]) -> root (LeetCode order)\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    q, i = deque([root]), 1\n    while q and i < len(values):\n        node = q.popleft()\n        if i < len(values) and values[i] is not None:\n            node.left = TreeNode(values[i]); q.append(node.left)\n        i += 1\n        if i < len(values) and values[i] is not None:\n            node.right = TreeNode(values[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef levels(root):           # levels(root) -> [3, 9, 20, 15, 7]\n    out, q = [], deque([root] if root else [])\n    while q:\n        n = q.popleft()\n        out.append(n.val)\n        if n.left: q.append(n.left)\n        if n.right: q.append(n.right)\n    return out\n", "pat": "recursion", "steps": ["If the node is None, return it", "Swap left and right, inverting each side", "Return the node"]}, {"kind": "py", "title": "Number of islands", "task": "Write <code>num_islands(grid)<\/code>: grid is a list of lists of <code>\"1\"<\/code> (land) and <code>\"0\"<\/code> (water). Count groups of land connected up, down, left or right. BFS or DFS. (LeetCode 200.)", "starter": "def num_islands(grid):\n    pass\n", "solution": "from collections import deque\n\ndef num_islands(grid):\n    if not grid:\n        return 0\n    rows, cols, count = len(grid), len(grid[0]), 0\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"1\":\n                count += 1\n                grid[r][c] = \"0\"\n                q = deque([(r, c)])\n                while q:\n                    i, j = q.popleft()\n                    for di, dj in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                        ni, nj = i + di, j + dj\n                        if 0 <= ni < rows and 0 <= nj < cols and grid[ni][nj] == \"1\":\n                            grid[ni][nj] = \"0\"\n                            q.append((ni, nj))\n    return count\n", "hint": "Loop over every cell. On land, count one island and flood it (mark it \"0\") so it isn't counted again.", "tests": [{"label": "one island", "expr": "num_islands([list('11110'), list('11010'), list('11000'), list('00000')])", "want": "1"}, {"label": "three islands", "expr": "num_islands([list('11000'), list('11000'), list('00100'), list('00011')])", "want": "3"}, {"label": "all water", "expr": "num_islands([list('000')])", "want": "0"}], "pat": "BFS/DFS", "steps": ["Set count to 0", "Go through every cell in the grid", "When a cell is land, add 1 and flood all the land connected to it, marking it as water", "Return count"]}, {"kind": "py", "title": "Count the leaves", "task": "Write <code>count_leaves(root)<\/code>: a leaf is a node with no children. Return how many leaves the tree has (an empty tree, <code>None<\/code>, has 0).", "starter": "def count_leaves(root):\n    pass\n", "solution": "def count_leaves(root):\n    if root is None:\n        return 0\n    if root.left is None and root.right is None:\n        return 1\n    return count_leaves(root.left) + count_leaves(root.right)\n", "hint": "Solve for the children, then combine at the node.", "tests": [{"label": "[3,9,20,null,null,15,7]", "expr": "count_leaves(tree([3, 9, 20, None, None, 15, 7]))", "want": "3"}, {"label": "empty", "expr": "count_leaves(None)", "want": "0"}, {"label": "single node", "expr": "count_leaves(tree([1]))", "want": "1"}, {"label": "[1,2,3,4,5]", "expr": "count_leaves(tree([1, 2, 3, 4, 5]))", "want": "3"}, {"label": "lopsided", "expr": "count_leaves(tree([1, None, 2, None, 3]))", "want": "1"}], "prelude": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef tree(values):           # tree([3, 9, 20, None, None, 15, 7]) -> root (LeetCode order)\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    q, i = deque([root]), 1\n    while q and i < len(values):\n        node = q.popleft()\n        if i < len(values) and values[i] is not None:\n            node.left = TreeNode(values[i]); q.append(node.left)\n        i += 1\n        if i < len(values) and values[i] is not None:\n            node.right = TreeNode(values[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef levels(root):           # levels(root) -> [3, 9, 20, 15, 7]\n    out, q = [], deque([root] if root else [])\n    while q:\n        n = q.popleft()\n        out.append(n.val)\n        if n.left: q.append(n.left)\n        if n.right: q.append(n.right)\n    return out\n", "opt": true, "pat": "recursion", "steps": ["Base case: no node means 0 leaves", "A node with no left and no right child is one leaf", "Otherwise add the leaves of the left and right sides"]}, {"kind": "py", "title": "Can I get there", "task": "Write <code>can_reach(graph, a, b)<\/code>: <code>graph<\/code> is a dict from each name to the list of names it connects to (a road works both ways, so both ends list each other). Return True if you can get from <code>a<\/code> to <code>b<\/code> by following connections. A place can always reach itself.", "starter": "def can_reach(graph, a, b):\n    pass\n", "solution": "from collections import deque\n\ndef can_reach(graph, a, b):\n    seen = {a}\n    queue = deque([a])\n    while queue:\n        node = queue.popleft()\n        if node == b:\n            return True\n        for nxt in graph.get(node, []):\n            if nxt not in seen:\n                seen.add(nxt)\n                queue.append(nxt)\n    return False\n", "hint": "Always mark a place as visited when you queue it, so loops can't trap you.", "tests": [{"label": "connected", "expr": "can_reach({'a': ['b'], 'b': ['a', 'c'], 'c': ['b']}, 'a', 'c')", "want": "True"}, {"label": "separate islands", "expr": "can_reach({'a': ['b'], 'b': ['a'], 'c': []}, 'a', 'c')", "want": "False"}, {"label": "itself", "expr": "can_reach({'a': []}, 'a', 'a')", "want": "True"}, {"label": "a loop", "expr": "can_reach({'a': ['b'], 'b': ['c'], 'c': ['a', 'd'], 'd': ['c']}, 'a', 'd')", "want": "True"}, {"label": "unknown place", "expr": "can_reach({'a': ['b'], 'b': ['a']}, 'a', 'z')", "want": "False"}, {"label": "long chain (must be fast)", "expr": "can_reach({i: [i - 1, i + 1] for i in range(1, 5000)}, 1, 4999)", "want": "True"}], "opt": true, "pat": "BFS/DFS", "steps": ["Make a queue holding the start and a set of visited places", "Take a place; if it is the target, return True", "Add each unvisited neighbour to the queue and the visited set", "If the queue empties, return False"]}], "20": [{"kind": "py", "title": "Climbing stairs", "task": "Write <code>climb(n)<\/code>: the number of ways to climb n steps taking 1 or 2 at a time. Must handle n = 40 fast. (LeetCode 70.)", "starter": "def climb(n):\n    pass\n", "solution": "def climb(n):\n    a, b = 1, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a\n", "hint": "f(n) = f(n-1) + f(n-2). Plain recursion is too slow for 40: keep just the last two values.", "tests": [{"label": "n = 2", "expr": "climb(2)", "want": "2"}, {"label": "n = 3", "expr": "climb(3)", "want": "3"}, {"label": "n = 40", "expr": "climb(40)", "want": "165580141"}, {"label": "large input (must be fast)", "expr": "climb(35)", "want": "14930352"}], "pat": "dynamic programming", "steps": ["The ways for 0 and 1 steps are both 1", "Each next step's ways = the previous two added together", "Loop n times keeping only the last two values", "Return the answer"]}, {"kind": "py", "title": "House robber", "task": "Write <code>rob(nums)<\/code>: the most money you can take without taking from two neighbouring houses. (LeetCode 198.)", "starter": "def rob(nums):\n    pass\n", "solution": "def rob(nums):\n    prev, cur = 0, 0\n    for x in nums:\n        prev, cur = cur, max(cur, prev + x)\n    return cur\n", "hint": "At each house: skip it (keep the best so far) or take it (best from two houses back + this one).", "tests": [{"label": "[1,2,3,1]", "expr": "rob([1, 2, 3, 1])", "want": "4"}, {"label": "[2,7,9,3,1]", "expr": "rob([2, 7, 9, 3, 1])", "want": "12"}, {"label": "empty", "expr": "rob([])", "want": "0"}, {"label": "[2,1,1,2]", "expr": "rob([2, 1, 1, 2])", "want": "4"}], "fuzz": ["rob", "([R.randint(0, 9) for _ in range(R.randint(1, 8))],)"], "pat": "dynamic programming", "steps": ["Track the best total up to the previous house and the one before it", "For each house, choose: skip it, or take it plus the best from two houses back", "Shift the two values forward", "Return the best"]}, {"kind": "py", "title": "Coin change", "task": "Write <code>coin_change(coins, amount)<\/code>: the fewest coins that make the amount, or -1 if it can't be made. (LeetCode 322.)", "starter": "def coin_change(coins, amount):\n    pass\n", "solution": "def coin_change(coins, amount):\n    dp = [0] + [float(\"inf\")] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a:\n                dp[a] = min(dp[a], dp[a - c] + 1)\n    return dp[amount] if dp[amount] != float(\"inf\") else -1\n", "hint": "dp[a] = fewest coins for amount a. dp[0] = 0. dp[a] = min(dp[a - c] + 1) over coins c.", "tests": [{"label": "[1,2,5], 11", "expr": "coin_change([1, 2, 5], 11)", "want": "3"}, {"label": "[2], 3", "expr": "coin_change([2], 3)", "want": "-1"}, {"label": "amount 0", "expr": "coin_change([1], 0)", "want": "0"}, {"label": "[186,419,83,408], 6249", "expr": "coin_change([186, 419, 83, 408], 6249)", "want": "20"}, {"label": "large input (must be fast)", "expr": "coin_change([1, 2, 5], 3000)", "want": "600"}], "fuzz": ["coin_change", "(R.sample([1, 2, 5, 7], R.randint(1, 3)), R.randint(0, 30))"], "pat": "dynamic programming", "steps": ["Make dp where dp[a] is the fewest coins for amount a: dp[0] = 0, the rest infinity", "For each amount a from 1 upward", "For each coin that fits, try dp[a - coin] + 1", "Return dp[amount], or -1 if it's still infinity"]}, {"kind": "py", "title": "Merge intervals", "task": "Write <code>merge_intervals(intervals)<\/code>: merge all overlapping <code>[start, end]<\/code> intervals and return them sorted by start. (LeetCode 56.)", "starter": "def merge_intervals(intervals):\n    pass\n", "solution": "def merge_intervals(intervals):\n    out = []\n    for s, e in sorted(intervals):\n        if out and s <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], e)\n        else:\n            out.append([s, e])\n    return out\n", "hint": "Sort by start. If the next start is within the last merged interval, extend its end; otherwise start a new one.", "tests": [{"label": "[[1,3],[2,6],[8,10],[15,18]]", "expr": "merge_intervals([[1, 3], [2, 6], [8, 10], [15, 18]])", "want": "[[1, 6], [8, 10], [15, 18]]"}, {"label": "touching", "expr": "merge_intervals([[1, 4], [4, 5]])", "want": "[[1, 5]]"}, {"label": "unsorted, nested", "expr": "merge_intervals([[5, 6], [1, 10]])", "want": "[[1, 10]]"}], "fuzz": ["merge_intervals", "([[a, a + R.randint(0, 4)] for a in [R.randint(0, 15) for _ in range(R.randint(1, 6))]],)"], "pat": "sort then scan", "steps": ["Sort the intervals by start", "For each interval, if it overlaps the last merged one, extend that one's end", "Otherwise add it as a new merged interval", "Return the merged list"]}, {"kind": "py", "title": "Cheapest way up", "task": "Write <code>min_cost_climb(cost)<\/code>: <code>cost[i]<\/code> is the price of standing on step <code>i<\/code>. You may start on step 0 or step 1 and climb 1 or 2 steps at a time. The top is just past the last step. Return the least total you can pay to reach the top. An empty list costs 0.", "starter": "def min_cost_climb(cost):\n    pass\n", "solution": "def min_cost_climb(cost):\n    a = b = 0\n    for i in range(2, len(cost) + 1):\n        a, b = b, min(b + cost[i - 1], a + cost[i - 2])\n    return b\n", "hint": "You only need the last two values.", "tests": [{"label": "basic", "expr": "min_cost_climb([10, 15, 20])", "want": "15"}, {"label": "longer", "expr": "min_cost_climb([1, 100, 1, 1, 1, 100, 1, 1, 100, 1])", "want": "6"}, {"label": "two steps", "expr": "min_cost_climb([5, 3])", "want": "3"}, {"label": "empty", "expr": "min_cost_climb([])", "want": "0"}, {"label": "large input (must be fast)", "expr": "min_cost_climb([3] * 100000)", "want": "150000"}], "opt": true, "fuzz": ["min_cost_climb", "([R.randint(0, 9) for _ in range(R.randint(0, 8))],)"], "pat": "dynamic programming", "steps": ["Let best[i] be the cheapest way to arrive at step i; best[0] and best[1] are 0", "Reach step i from i-1 (pay cost[i-1]) or from i-2 (pay cost[i-2])", "best[i] is the smaller of those", "Return best at the top (index len(cost))"]}, {"kind": "py", "title": "Can one person attend everything", "task": "Write <code>can_attend_all(meetings)<\/code>: <code>meetings<\/code> is a list of <code>[start, end]<\/code> times in any order. Return True if none of them overlap. A meeting that starts exactly when another ends is fine.", "starter": "def can_attend_all(meetings):\n    pass\n", "solution": "def can_attend_all(meetings):\n    ordered = sorted(meetings)\n    for i in range(1, len(ordered)):\n        if ordered[i][0] < ordered[i - 1][1]:\n            return False\n    return True\n", "hint": "After sorting, only neighbours can overlap.", "tests": [{"label": "overlap", "expr": "can_attend_all([[0, 30], [5, 10], [15, 20]])", "want": "False"}, {"label": "fine", "expr": "can_attend_all([[7, 10], [2, 4]])", "want": "True"}, {"label": "touching", "expr": "can_attend_all([[1, 3], [3, 5]])", "want": "True"}, {"label": "empty", "expr": "can_attend_all([])", "want": "True"}, {"label": "one", "expr": "can_attend_all([[1, 2]])", "want": "True"}], "opt": true, "fuzz": ["can_attend_all", "([(lambda a: [a, a + R.randint(1, 3)])(R.randint(0, 9)) for _ in range(R.randint(0, 5))],)"], "pat": "sort then scan", "steps": ["Sort the meetings by start time", "Compare each meeting with the one before it", "If it starts before the previous one ends, return False", "Return True at the end"]}], "21": [{"kind": "py", "title": "Mock 1: minimum in a rotated array", "task": "<b>Timed: 25 minutes, talk aloud.<\/b> A sorted array of unique numbers was rotated (e.g. <code>[3,4,5,1,2]<\/code>). Write <code>find_min(nums)<\/code> in O(log n). (LeetCode 153.)", "starter": "def find_min(nums):\n    pass\n", "solution": "def find_min(nums):\n    lo, hi = 0, len(nums) - 1\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if nums[mid] > nums[hi]:\n            lo = mid + 1\n        else:\n            hi = mid\n    return nums[lo]\n", "hint": "Compare nums[mid] with nums[hi]. If mid is bigger, the minimum is to the right of mid.", "tests": [{"label": "[3,4,5,1,2]", "expr": "find_min([3, 4, 5, 1, 2])", "want": "1"}, {"label": "[4,5,6,7,0,1,2]", "expr": "find_min([4, 5, 6, 7, 0, 1, 2])", "want": "0"}, {"label": "not rotated", "expr": "find_min([11, 13, 15, 17])", "want": "11"}, {"label": "one item", "expr": "find_min([5])", "want": "5"}, {"label": "big input", "expr": "find_min(list(range(500000, 1000000)) + list(range(500000)))", "want": "0"}, {"label": "100,000 items (must be O(log n))", "expr": "find_min(_Probe(list(range(50000, 100000)) + list(range(50000))))", "want": "0"}], "limit": 200000, "fuzz": ["find_min", "((lambda xs, k: xs[k:] + xs[:k])(sorted(R.sample(range(-30, 30), R.randint(1, 9))), R.randint(0, 8)),)"], "mock": true, "pat": "binary search", "steps": ["Set lo and hi at the two ends", "While lo < hi, find mid", "If nums[mid] > nums[hi], the minimum is to the right of mid", "Otherwise it is at mid or to its left", "Return nums[lo]"]}, {"kind": "py", "title": "Mock 2: subarray sum equals k", "task": "<b>Timed: 35 minutes.<\/b> A new pattern: prefix sums. Write <code>subarray_sum(nums, k)<\/code>: how many contiguous subarrays add up to k? Numbers can be negative, so a sliding window won't work. Aim for O(n). (LeetCode 560.)", "starter": "def subarray_sum(nums, k):\n    pass\n", "solution": "def subarray_sum(nums, k):\n    count, total = 0, 0\n    seen = {0: 1}\n    for x in nums:\n        total += x\n        count += seen.get(total - k, 0)\n        seen[total] = seen.get(total, 0) + 1\n    return count\n", "hint": "Keep a running total and a dict of how often each running total has appeared. If total - k appeared before, those subarrays end here.", "tests": [{"label": "[1,1,1], 2", "expr": "subarray_sum([1, 1, 1], 2)", "want": "2"}, {"label": "[1,2,3], 3", "expr": "subarray_sum([1, 2, 3], 3)", "want": "2"}, {"label": "negatives", "expr": "subarray_sum([1, -1, 0], 0)", "want": "3"}, {"label": "big input, O(n) needed", "expr": "subarray_sum([0] * 3000, 0)", "want": "4501500"}, {"label": "large input (must be fast)", "expr": "subarray_sum([1] * 2000, 2)", "want": "1999"}], "limit": 400000, "fuzz": ["subarray_sum", "([R.randint(-2, 3) for _ in range(R.randint(1, 8))], R.randint(-2, 5))"], "mock": true, "pat": "prefix sums", "steps": ["Keep a running total and a dict counting each total seen, starting with {0: 1}", "For each number, add it to the running total", "Add how many times (total - k) has been seen", "Record the current total in the dict", "Return the count"]}, {"kind": "design", "scope": true, "title": "Scope it: \"which leads should we call first?\"", "task": "<b>From a sales manager:<\/b> \"We get 500 leads a week and only have time to call 100. Can you tell us which ones to call?\" You have last year's leads with whether each one bought.", "questions": [["What counts as success: a meeting, a sale, or revenue?", true], ["What do we know about each lead when it arrives?", true], ["How will the team use the list: once a week or as leads arrive?", true], ["Should we use the newest deep learning model?", false], ["Can we buy a list of other companies' customers?", false], ["What colour should the score be?", false]], "steps": ["Agree what a good lead means, using last year's outcomes", "Look at which lead details went with buying (SQL GROUP BY)", "Start with a simple rule or score, not a model", "Check it on last year's data: how many buyers in the top 100?", "Ship it as a sorted list the team already uses", "Measure for a month and compare with how they picked before"], "trade": [{"q": "A simple scoring rule finds 60% of last year's buyers in the top 100. Next step?", "o": ["Ship it, measure real results, and improve from there", "Spend two months on a perfect model first", "Throw it away because it's not 100%", "Score every lead the same"], "a": 0, "why": "A simple version in use beats a perfect one on a laptop. Compare it with the baseline they have today."}, {"q": "How do you know it actually helped?", "o": ["Compare the conversion of called leads before and after", "Ask the reps if they like it", "Count how many leads were scored", "Check the code has no errors"], "a": 0, "why": "Outcomes are the measure: did more calls turn into sales than before?"}], "model": ["Clarify: what success means, what's known per lead, and how the list is used.", "Use history: last year's leads and outcomes show what predicts buying.", "Start simple: a rule or score you can explain, checked on past data.", "Ship it where the team already works; a baseline comparison proves value.", "Measure conversion before and after, then improve."], "keys": [["what success means", "success|sale|convert|conversion|meeting|revenue|buy|bought|win|close|goal|outcome you want|what (counts|good)|deal|purchase|response"], ["using last year's outcomes", "history|last year|past|outcome|historical|previous|old (leads|data)|earlier|labell?ed|who (bought|converted)|track record"], ["starting with a simple rule or score", "simple|rule|score|basic|start small|baseline model|straightforward|few (signals|features)|logistic|heuristic|points"], ["comparing with how they pick today", "baseline|compar|before|today|current(ly)?|existing|how (they|reps) (pick|choose)|versus|\\bvs\\b|gut feel|manual"], ["measuring after it ships", "measur|track|conversion|monitor|test|experiment|a/?b|pilot|result|follow.?up|feedback|learn"]]}, {"kind": "py", "title": "Longest streak", "task": "Write <code>longest_streak(nums)<\/code>: return the length of the longest run of consecutive whole numbers that you can form from <code>nums<\/code> (any order, repeats allowed). For example 100, 4, 200, 1, 3, 2 contains 1, 2, 3, 4, so the answer is 4. It must run in O(n).", "starter": "def longest_streak(nums):\n    pass\n", "solution": "def longest_streak(nums):\n    values = set(nums)\n    best = 0\n    for x in values:\n        if x - 1 not in values:\n            length = 1\n            while x + length in values:\n                length += 1\n            best = max(best, length)\n    return best\n", "hint": "Only start counting at the beginning of a streak.", "tests": [{"label": "basic", "expr": "longest_streak([100, 4, 200, 1, 3, 2])", "want": "4"}, {"label": "with repeats", "expr": "longest_streak([0, 3, 7, 2, 5, 8, 4, 6, 0, 1])", "want": "9"}, {"label": "empty", "expr": "longest_streak([])", "want": "0"}, {"label": "all apart", "expr": "longest_streak([10, 20, 30])", "want": "1"}, {"label": "large input (must be fast)", "expr": "longest_streak(list(range(100000)))", "want": "100000"}], "opt": true, "fuzz": ["longest_streak", "([R.randint(0, 9) for _ in range(R.randint(0, 8))],)"], "pat": "hash map / set", "steps": ["Put the numbers in a set", "Only start counting from a number whose predecessor (x - 1) is not in the set", "Count upward while the next number is in the set", "Keep the longest count"]}, {"kind": "py", "title": "Brackets to add", "task": "Write <code>min_adds_to_balance(s)<\/code>: <code>s<\/code> contains only <code>(<\/code> and <code>)<\/code>. Return the fewest brackets you must insert (anywhere) to make it balanced, so every <code>(<\/code> is closed by a later <code>)<\/code>.", "starter": "def min_adds_to_balance(s):\n    pass\n", "solution": "def min_adds_to_balance(s):\n    open_count = adds = 0\n    for ch in s:\n        if ch == '(':\n            open_count += 1\n        elif open_count > 0:\n            open_count -= 1\n        else:\n            adds += 1\n    return adds + open_count\n", "hint": "A counter is enough: you never need the brackets themselves.", "tests": [{"label": "one missing close", "expr": "min_adds_to_balance('())')", "want": "1"}, {"label": "two missing", "expr": "min_adds_to_balance('(((')", "want": "3"}, {"label": "balanced", "expr": "min_adds_to_balance('()()')", "want": "0"}, {"label": "wrong order", "expr": "min_adds_to_balance(')(')", "want": "2"}, {"label": "empty", "expr": "min_adds_to_balance('')", "want": "0"}], "opt": true, "fuzz": ["min_adds_to_balance", "(''.join(R.choice('()') for _ in range(R.randint(0, 9))),)"], "pat": "stack", "steps": ["Count open brackets not yet closed", "A ) with nothing open needs one added ( : count an add", "A ) with something open closes it", "Add the leftover open brackets at the end"]}], "23": [{"kind": "py", "title": "Validate a request body", "task": "This is what Pydantic does for you. Write <code>validate_task(body)<\/code>: return a list of error strings (empty if valid). Rules: <code>title<\/code> is required (error <code>\"title is required\"<\/code>) and must be a non-empty string (<code>\"title must be a non-empty string\"<\/code>); <code>done<\/code> is optional but must be a bool if present (<code>\"done must be true or false\"<\/code>).", "starter": "def validate_task(body):\n    errors = []\n    \n    return errors\n", "solution": "def validate_task(body):\n    errors = []\n    if \"title\" not in body:\n        errors.append(\"title is required\")\n    elif not isinstance(body[\"title\"], str) or not body[\"title\"].strip():\n        errors.append(\"title must be a non-empty string\")\n    if \"done\" in body and not isinstance(body[\"done\"], bool):\n        errors.append(\"done must be true or false\")\n    return errors\n", "hint": "Check \"title\" in body first, then isinstance(body[\"title\"], str). Use isinstance(x, bool) for done.", "tests": [{"label": "valid", "expr": "validate_task({'title': 'Buy milk', 'done': False})", "want": "[]"}, {"label": "missing title", "expr": "validate_task({})", "want": "['title is required']"}, {"label": "blank title, bad done", "expr": "validate_task({'title': '  ', 'done': 'yes'})", "want": "['title must be a non-empty string', 'done must be true or false']"}, {"label": "title not a string", "expr": "validate_task({'title': 5})", "want": "['title must be a non-empty string']"}], "new": [["isinstance(x, int)", "True if x is an int"]], "pat": "validation rules", "steps": ["Start an empty errors list", "If title is missing, add the 'required' error", "Otherwise, if title isn't a non-empty string, add that error", "If done is present but isn't a bool, add that error", "Return errors"]}, {"kind": "py", "title": "Retry with a limit", "task": "Write <code>retry(fn, attempts)<\/code>: call <code>fn()<\/code>; if it raises <code>ConnectionError<\/code>, try again, up to <code>attempts<\/code> calls in total. Return fn's result on success. If every attempt fails, re-raise the last error. Other error types should not be retried. <code>flaky(n)<\/code> is provided: it returns a function that fails n times, then returns \"ok\".", "starter": "def retry(fn, attempts):\n    pass\n", "solution": "def retry(fn, attempts):\n    for i in range(attempts):\n        try:\n            return fn()\n        except ConnectionError:\n            if i == attempts - 1:\n                raise\n", "hint": "Loop attempts times with try/except ConnectionError. On the last attempt, a bare raise re-raises the error.", "tests": [{"label": "fails twice, 3 attempts", "expr": "retry(flaky(2), 3)", "want": "'ok'"}, {"label": "fails 3 times, 3 attempts", "expr": "_raises(lambda: retry(flaky(3), 3), ConnectionError)", "want": "True"}, {"label": "calls only as needed", "expr": "(lambda f: (retry(f, 5), f.calls)[1])(flaky(1))", "want": "2"}, {"label": "other errors not retried", "expr": "(lambda f: (_raises(lambda: retry(f, 5), ValueError), f.calls)[1])(broken())", "want": "1"}], "prelude": "def flaky(n):\n    def f():\n        f.calls += 1\n        if f.calls <= n:\n            raise ConnectionError(\"server unreachable\")\n        return \"ok\"\n    f.calls = 0\n    return f\n\ndef broken():\n    def f():\n        f.calls += 1\n        raise ValueError(\"bad input\")\n    f.calls = 0\n    return f\n", "pat": "loop with retries", "steps": ["Loop up to attempts times", "Try calling fn() and return its result", "If ConnectionError happens on the last attempt, re-raise it", "Otherwise go round the loop again"]}, {"kind": "py", "scenario": true, "title": "Sync from a flaky partner API", "brief": "Our nightly sync from the partner's orders API keeps missing data. Their API is paginated and sometimes returns errors. Can you make it reliable? (Tom, Engineering Manager)", "clarify": {"q": "The partner's API sometimes answers with status 429. What does that mean?", "o": ["Too many requests: slow down and try again", "Your API key is wrong", "That page doesn't exist", "Their server is permanently down"], "a": 0, "why": "429 means you're being rate-limited. The right response is to wait and retry, not to give up or skip the page."}, "task": "<code>make_api(failures)<\/code> (provided) returns a fake API. <code>api.get(cursor)<\/code> returns <code>{\"status\": 200, \"body\": {\"items\": [...], \"next_cursor\": ...}}<\/code> or <code>{\"status\": 429, \"body\": None}<\/code>. Write <code>fetch_all(api, max_retries=3)<\/code>: start with cursor <code>None<\/code>, collect every item page by page until <code>next_cursor<\/code> is <code>None<\/code>. If a page fails, retry the same cursor up to <code>max_retries<\/code> more times; if it still fails, raise <code>RuntimeError<\/code>. Never skip a page silently.", "starter": "def fetch_all(api, max_retries=3):\n    items, cursor = [], None\n    \n", "solution": "def fetch_all(api, max_retries=3):\n    items, cursor = [], None\n    while True:\n        for attempt in range(max_retries + 1):\n            resp = api.get(cursor)\n            if resp[\"status\"] == 200:\n                break\n        else:\n            raise RuntimeError(f\"gave up on page {cursor or 'start'}\")\n        items.extend(resp[\"body\"][\"items\"])\n        cursor = resp[\"body\"][\"next_cursor\"]\n        if cursor is None:\n            return items\n", "hint": "Two loops: an outer loop over pages, an inner loop for retries. Python's for…else runs the else only if the loop didn't break, which is a neat place to raise.", "tests": [{"label": "no failures", "expr": "fetch_all(make_api())", "want": "[1, 2, 3, 4, 5]"}, {"label": "page c2 fails twice, then works", "expr": "fetch_all(make_api({'c2': 2}))", "want": "[1, 2, 3, 4, 5]"}, {"label": "retries only as needed (5 calls)", "expr": "(lambda a: (fetch_all(a), a.calls)[1])(make_api({'c2': 2}))", "want": "5"}, {"label": "page c3 never recovers", "expr": "_raises(lambda: fetch_all(make_api({'c3': 9})), RuntimeError)", "want": "True"}, {"label": "exactly 3 retries are enough", "expr": "fetch_all(make_api({'c2': 3}))", "want": "[1, 2, 3, 4, 5]"}], "reply": "The sync was losing data whenever the partner rate-limited us (HTTP 429). It now retries each page up to 3 times and, if a page still fails, stops with a clear error naming that page, so nothing is skipped silently. In production I'd also add a growing wait between retries and an alert on failure.", "prelude": "class FakeAPI:\n    def __init__(self, pages, failures):\n        self.pages = pages\n        self.failures = dict(failures)\n        self.calls = 0\n\n    def get(self, cursor=None):\n        self.calls += 1\n        key = cursor or \"start\"\n        if self.failures.get(key, 0) > 0:\n            self.failures[key] -= 1\n            return {\"status\": 429, \"body\": None}\n        items, nxt = self.pages[key]\n        return {\"status\": 200, \"body\": {\"items\": items, \"next_cursor\": nxt}}\n\ndef make_api(failures=None):\n    pages = {\"start\": ([1, 2], \"c2\"), \"c2\": ([3, 4], \"c3\"), \"c3\": ([5], None)}\n    return FakeAPI(pages, failures or {})\n", "new": [["xs.extend(ys)", "add every item of ys to xs"], ["RuntimeError('msg')", "a general error type to raise"]], "pat": "loop with retries", "steps": ["Start an empty items list and cursor None", "Outer loop: one page at a time", "Inner loop: call api.get(cursor) up to max_retries + 1 times, stopping on status 200", "If every try failed, raise RuntimeError", "Add the page's items, move to next_cursor, and return when it is None"]}], "24": [{"kind": "py", "title": "Pull JSON out of a model reply", "task": "Models often wrap JSON in extra text or a code fence. Write <code>extract_json(reply)<\/code>: find the first <code>{<\/code> and the last <code>}<\/code>, parse what's between them (inclusive) with <code>json.loads<\/code>, and return the dict. Return <code>None<\/code> if there's no braces or it isn't valid JSON.", "starter": "import json\n\ndef extract_json(reply):\n    pass\n", "solution": "import json\n\ndef extract_json(reply):\n    start, end = reply.find(\"{\"), reply.rfind(\"}\")\n    if start == -1 or end < start:\n        return None\n    try:\n        return json.loads(reply[start:end + 1])\n    except json.JSONDecodeError:\n        return None\n", "hint": "str.find and str.rfind return -1 when not found. json.loads raises json.JSONDecodeError on bad JSON.", "tests": [{"label": "wrapped in text", "expr": "extract_json('Sure! Here it is: {\"name\": \"Asha\", \"age\": 30} Hope that helps.')", "want": "{'name': 'Asha', 'age': 30}"}, {"label": "in a code fence", "expr": "extract_json('```json\\n{\"ok\": true}\\n```')", "want": "{'ok': True}"}, {"label": "no JSON", "expr": "extract_json('I cannot help with that.')", "want": "None"}, {"label": "broken JSON", "expr": "extract_json('{\"a\": }')", "want": "None"}], "new": [["s.find('x')", "index of the first x, or -1"], ["s.rfind('x')", "index of the last x, or -1"]], "pat": "string search & parse", "steps": ["Find the first { and the last }", "If either is missing, return None", "Try json.loads on the text between them, inclusive", "If it raises JSONDecodeError, return None"]}, {"kind": "py", "title": "Keep the conversation under a limit", "task": "The API is stateless, so you resend history, but it can't grow forever. Write <code>trim_history(messages, max_messages)<\/code>: keep only the last <code>max_messages<\/code> messages, but the result must <b>start with a user message<\/b> (drop leading assistant messages). Don't modify the input list.", "starter": "def trim_history(messages, max_messages):\n    pass\n", "solution": "def trim_history(messages, max_messages):\n    kept = messages[-max_messages:] if max_messages > 0 else []\n    while kept and kept[0][\"role\"] != \"user\":\n        kept = kept[1:]\n    return kept\n", "hint": "Slice with [-max_messages:], then drop from the front while the first role isn't \"user\". Slicing makes a copy.", "tests": [{"label": "last 3 already start with user", "expr": "[m['content'] for m in trim_history(H, 3)]", "want": "['q2', 'a2', 'q3']"}, {"label": "last 2: drops the leading assistant", "expr": "[m['content'] for m in trim_history(H, 2)]", "want": "['q3']"}, {"label": "last 4: drops the leading assistant", "expr": "[m['content'] for m in trim_history(H, 4)]", "want": "['q2', 'a2', 'q3']"}, {"label": "input unchanged", "expr": "(trim_history(H, 2), len(H))[1]", "want": "5"}], "prelude": "H = [\n    {'role': 'user', 'content': 'q1'},\n    {'role': 'assistant', 'content': 'a1'},\n    {'role': 'user', 'content': 'q2'},\n    {'role': 'assistant', 'content': 'a2'},\n    {'role': 'user', 'content': 'q3'},\n]\n", "pat": "slicing", "steps": ["Take the last max_messages messages with a slice", "While the first kept message isn't from the user, drop it", "Return what's left"]}, {"kind": "py", "title": "Redact personal data before calling the model", "task": "<b>Compliance requirement:<\/b> no personal data may be sent to the LLM. Write <code>redact(text)<\/code> that replaces email addresses with <code>[EMAIL]<\/code>, Indian mobile numbers (10 digits starting 6–9, optionally prefixed by <code>+91<\/code> with an optional space) with <code>[PHONE]<\/code>, and PAN numbers (5 capital letters, 4 digits, 1 capital letter) with <code>[PAN]<\/code>. Everything else stays the same. All values in the tests are made up.", "starter": "import re\n\ndef redact(text):\n    pass\n", "solution": "import re\n\ndef redact(text):\n    text = re.sub(r\"[\\w.+-]+@[\\w-]+(\\.[\\w-]+)+\", \"[EMAIL]\", text)\n    text = re.sub(r\"(\\+91 ?)?\\b[6-9]\\d{9}\\b\", \"[PHONE]\", text)\n    text = re.sub(r\"\\b[A-Z]{5}\\d{4}[A-Z]\\b\", \"[PAN]\", text)\n    retur
