<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ShipCode · Break it into steps. Code it. Ship it.</title><meta name="description" content="A 30-day trainer for aspiring forward deployed and AI engineers: learn to break any problem into steps and write real Python and SQL, with in-browser labs, drills and redos from scratch."><meta property="og:title" content="ShipCode · Break it into steps. Code it. Ship it."><meta property="og:description" content="30 days of guided problem breakdown, real code labs and redos from scratch."><meta name="theme-color" content="#2B50C8"><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%232B50C8%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2242%22%20font-family%3D%22monospace%22%20font-size%3D%2228%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%3E%26gt%3B_%3C/text%3E%3C/svg%3E"><style>html,body{margin:0}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one centered 680px column, fixed bottom tab bar; drills open in a full-screen sheet. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --fg:#141B26; --muted:#5B667A; --line:#DCE1EA;
  --accent:#2B50C8; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --ok:#1C7C54; --ok-soft:#DDF2E7; --bad:#B93A27; --bad-soft:#FBE3DE; --warn:#95560B; --warn-soft:#F9ECD8;
  --code:#ECEFF5;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --fg:#E5E9F0; --muted:#98A3B5; --line:#283242;
  --accent:#8DA8F6; --accent-ink:#0E131B; --accent-soft:#1E2946;
  --ok:#5CC796; --ok-soft:#13302A; --bad:#F08A78; --bad-soft:#3A1E1A; --warn:#E8A65E; --warn-soft:#382713;
  --code:#1C2431; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --fg:#E5E9F0; --muted:#98A3B5; --line:#283242;
  --accent:#8DA8F6; --accent-ink:#0E131B; --accent-soft:#1E2946;
  --ok:#5CC796; --ok-soft:#13302A; --bad:#F08A78; --bad-soft:#3A1E1A; --warn:#E8A65E; --warn-soft:#382713;
  --code:#1C2431; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code);padding:1px 5px;border-radius:4px}
pre{margin:0;background:var(--code);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:.84rem;line-height:1.55;white-space:pre}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.col{max-width:680px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .col{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;flex:1}
.brand span{font-family:var(--f-mono);font-weight:500;color:var(--accent);margin-right:4px}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums}
.stat svg{width:16px;height:16px}
.stat.streak{color:var(--warn)} .stat.xp{color:var(--accent)}

main{padding-block:20px 24px}
.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:44px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.small{padding:7px 12px;min-height:36px;font-size:.88rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:.76rem;padding:3px 9px;border-radius:99px;background:var(--code);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

.pace{border-left:3px solid var(--accent)}
.pace.behind{border-left-color:var(--warn);background:var(--warn-soft)}
.pace.ahead{border-left-color:var(--ok)}
.pacebar{height:8px;background:var(--line);border-radius:99px;position:relative;overflow:hidden}
.pacebar .fill{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:99px}
.pacebar .target{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.onboard .row .btn{flex:1 1 220px;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.onboard .btn small{font-weight:400;color:var(--muted)}

.lesson p{max-width:66ch}
.drills-dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks li{border-top:1px solid var(--line)}
.tasks li:first-child{border-top:0}
.tasks label{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:10px 0;cursor:pointer;align-items:start}
.tasks input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.tasks .kind{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.tasks .gate .kind{color:var(--ok)}
.tasks input:checked + span .txt{color:var(--muted);text-decoration:line-through}
.daynav{display:flex;justify-content:space-between;gap:10px}

/* path */
.week{display:flex;flex-direction:column;gap:8px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--fg)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--accent-soft)}
.node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.prow.done .node{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.prow.current .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.prow.target .ptitle::after{content:"today's target";margin-left:8px;font-family:var(--f-mono);font-size:.68rem;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.ptitle{font-weight:500;min-width:0}
.pmeta{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* reference tables */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td:first-child{font-family:var(--f-mono);color:var(--accent);white-space:nowrap}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
pre .hl{color:var(--bad);font-weight:500} pre .note{color:var(--muted)}
.sync{font-family:var(--f-mono);font-size:.8rem}
.confirm{background:var(--bad-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .col{display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;color:var(--muted);text-decoration:none;font-size:.74rem;font-weight:500}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}

/* drill sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.sheet-head{display:flex;align-items:center;gap:12px;padding-block:12px}
.xbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;line-height:1}
.sprog{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.sprog span{display:block;height:100%;background:var(--ok);transition:width .25s}
.sheet-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:8px 16px;min-height:0}
.qkind{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.q{font-size:1.15rem;font-weight:600;font-family:var(--f-display)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:.9rem;min-height:52px}
.opt .k{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
textarea.code{width:100%;min-height:96px;font-family:var(--f-mono);font-size:.95rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical}
textarea.code:focus{border-color:var(--accent);outline:none}
.hint{font-size:.82rem;color:var(--muted)}
.sheet-foot{padding-block:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b.t{font-family:var(--f-display);font-size:1.05rem}
.fb.ok b.t{color:var(--ok)} .fb.bad b.t{color:var(--bad)}
.fb pre{background:var(--surface)}
.summary{align-items:center;text-align:center;justify-content:center;flex:1;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-size:3rem;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}

[hidden]{display:none!important}
/* motivation */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.hero h1{font-size:clamp(2rem,7vw,2.8rem)}
.lead{font-size:1.06rem;line-height:1.6}
.how{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:h}
.how li{display:grid;grid-template-columns:34px 1fr;gap:4px 12px;counter-increment:h}
.how li::before{content:counter(h);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500}
.how b{font-family:var(--f-display)} .how span{color:var(--muted);font-size:.95rem}
.field{display:flex;flex-direction:column;gap:8px}
.chipbtn{font:inherit;font-size:.88rem;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:40px}
.chipbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dayhead{display:flex;flex-direction:column;gap:8px}
.dayhead .can{font-size:1.02rem} .dayhead .can b{color:var(--ok)}
.dayhead .why{color:var(--muted);font-size:.93rem;border-left:3px solid var(--line);padding-left:10px}
.session{border:2px solid var(--accent)}
.sbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.sbar span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.parts li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.parts li:first-child{border-top:0}
.pk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.parts li.done .pk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.parts li.done .pn{color:var(--muted)}
.parts li.next .pk{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.parts li.next .pn{font-weight:600}
.pt{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.big-cta{min-height:52px;font-size:1.02rem}
.lesson>summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;gap:10px}
.lesson>summary::-webkit-details-marker{display:none}
.lesson[open]>summary{margin-bottom:4px}
.selfcheck{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer;padding-top:4px}
.selfcheck input{width:20px;height:20px;accent-color:var(--ok)}
.labrow.passed{border-color:var(--ok-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;text-align:center}
.stats b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;max-width:220px}
.heat span{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat span.on{background:var(--ok)} .heat span.today{outline:2px solid var(--accent);outline-offset:1px}
.skills{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.skills li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.93rem}
.sk{font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:99px;background:var(--code);color:var(--muted);white-space:nowrap}
.sk.ok{background:var(--ok-soft);color:var(--ok)}
.skills.locked{opacity:.65;border-top:1px dashed var(--line);padding-top:10px}
.celebrate{align-items:center;text-align:center;gap:14px;padding-top:16px}
.celebrate .stats{width:100%}
.celebrate .tomorrow,.celebrate .share,.celebrate .lvl{width:100%;text-align:left}
.share{display:flex;flex-direction:column;gap:8px}
.burst{width:84px;height:84px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-size:2.4rem;font-weight:800;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.levelup{background:var(--accent-soft);border-radius:12px;padding:12px 18px;width:100%}
.levelup h2{color:var(--accent)}
.fb.pass{animation:pop .35s ease-out both}
.nudge{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.92rem;margin-top:8px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.burst,.fb.pass{animation:none}}
/* labs */
.warm{border-left:3px solid var(--warn)}
.labs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.labrow{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;min-height:48px}
.labrow:hover{border-color:var(--accent)}
.lk{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.lt{font-weight:600;min-width:0}
.expect summary,.card details summary,details.tables summary{cursor:pointer;font-weight:600}
.expect ul{margin-top:8px}
.phasebar{flex:1;display:flex;gap:4px;min-width:0}
.phasebar span{flex:1;text-align:center;font-family:var(--f-mono);font-size:.68rem;padding:4px 2px;border-radius:6px;background:var(--line);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phasebar span.on{background:var(--accent);color:var(--accent-ink)} .phasebar span.done{background:var(--ok-soft);color:var(--ok)}
.plan{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.plan .empty{list-style:none;margin-left:-22px}
.pool{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.stepbtn{width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:.92rem;min-height:44px}
.stepbtn:hover{border-color:var(--accent)} .stepbtn.right{border-color:var(--ok);background:var(--ok-soft)} .stepbtn.wrong{border-color:var(--bad);background:var(--bad-soft)}
input.code{width:100%;font-family:var(--f-mono);font-size:.95rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);min-height:48px}
input.code:focus{border-color:var(--accent);outline:none}
textarea.code.small{min-height:80px}
.ed{display:grid;grid-template-columns:auto 1fr;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ed:focus-within{border-color:var(--accent)}
.gutter{margin:0;padding:12px 8px;background:var(--code);color:var(--muted);text-align:right;user-select:none;overflow:hidden;border-radius:0;font-size:.85rem;line-height:1.5;min-width:2.6em;height:340px}
.codearea{display:block;width:100%;height:340px;resize:vertical;border:0;outline:none;padding:12px;font-family:var(--f-mono);font-size:.85rem;line-height:1.5;background:transparent;color:var(--fg);white-space:pre;overflow:auto;tab-size:4}
.tests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tests li{display:grid;grid-template-columns:20px 1fr;gap:8px;min-width:0}
.tests li div{min-width:0;display:flex;flex-direction:column;gap:4px}
.tests .mark{font-weight:700} .tests .pass .mark{color:var(--ok)} .tests .fail .mark{color:var(--bad)}

/* ---------- Content: 30 days ---------- */
const WEEKS=[{n:1,title:"Python from zero",from:1,to:7},{n:2,title:"Data: SQL, pandas, PySpark",from:8,to:14},{n:3,title:"Interview problem solving",from:15,to:21},{n:4,title:"AI engineering and deployment",from:22,to:30}];

const DAYS=[
{t:"Setup and first programs",
 lesson:"Python runs your file from top to bottom. <code>input()</code> always returns text (a <code>str</code>), so convert it with <code>int()</code> or <code>float()</code> before doing math. f-strings put variables straight into text.",
 ex:`name = input("Name: ")
age = int(input("Age: "))
print(f"Hi {name}, next year you'll be {age + 1}")
print(7 // 2, 7 % 2, 7 / 2)   # 3 1 3.5`,
 build:"Install the latest stable Python 3 from python.org and VS Code, then write 10 tiny scripts: tip calculator, Celsius to Fahrenheit, age in days, simple interest.",
 solve:["HackerRank: Say \"Hello, World!\" with Python","HackerRank: Arithmetic Operators","HackerRank: Python: Division"],
 gate:"Write a script that asks for two numbers and prints their sum, difference and average, with nothing open but your editor.",
 drills:[
  M("The user types 20. What is the type of x?",["int","str","float","It raises an error"],1,"<code>input()</code> always returns a string. Wrap it in <code>int()</code> to get a number.",`x = input("Age: ")`),
  T("Print <b>Hello, </b> followed by the variable <code>name</code>, using an f-string.",[`print(f"Hello, {name}")`,`print(f"Hello {name}")`],`print(f"Hello, {name}")`,"An f-string starts with <code>f</code> before the quote, and variables go inside <code>{ }</code>."),
  M("What does this print?",["3 1 3.5","3.5 1 3","3 0 3.5","4 1 3.5"],0,"<code>//</code> is floor division, <code>%</code> is the remainder, and <code>/</code> always returns a float.",`print(7 // 2, 7 % 2, 7 / 2)`),
  T("Convert the string <code>s</code> to an integer and store it in <code>n</code>.",[`n = int(s)`],`n = int(s)`,"<code>int()</code> converts text like <code>\"42\"</code> into the number 42."),
  M("This crashes. What's the fix?",["print(age + \"1\")","print(int(age) + 1)","print(age.int() + 1)","print(str(age) + 1)"],1,"The TypeError says you can't add an int to a str. Convert <code>age</code> to a number first.",`age = input("Age: ")
print(age + 1)

TypeError: can only concatenate str (not "int") to str`)
 ]},
{t:"Conditions and loops",
 lesson:"<code>if/elif/else</code> runs exactly one branch. A <code>for</code> loop walks over anything iterable; <code>range(start, stop, step)</code> stops <em>before</em> stop. A <code>while</code> loop repeats until its condition becomes false.",
 ex:`for n in range(1, 16):
    if n % 15 == 0:
        print("FizzBuzz")
    elif n % 3 == 0:
        print("Fizz")
    elif n % 5 == 0:
        print("Buzz")
    else:
        print(n)`,
 build:"Number guessing game; multiplication table printer; sum of the digits of a number.",
 solve:["LC 412 Fizz Buzz","HackerRank: Python If-Else","HackerRank: Loops","LC 1281 Subtract the Product and Sum of Digits of an Integer"],
 gate:"FizzBuzz from a blank file in under 5 minutes, with no errors on the first run.",
 drills:[
  M("What does this print?",["1 4 7","1 3 6 9","1 4 7 10","0 3 6 9"],0,"Start at 1 and step by 3. It stops before 10, so 10 is excluded.",`for i in range(1, 10, 3):
    print(i)`),
  T("Write a loop that prints 0, 1, 2, 3, 4 using <code>range</code> and the variable <code>i</code>.",[`for i in range(5): print(i)`,`for i in range(0, 5): print(i)`],`for i in range(5):
    print(i)`,"<code>range(5)</code> gives 0 to 4. The loop body is indented under the <code>for</code> line."),
  M("In FizzBuzz, which check must come first?",["n % 3 == 0","n % 5 == 0","n % 15 == 0","The order doesn't matter"],2,"15 is divisible by both 3 and 5. If you check 3 first, 15 prints \"Fizz\" and never reaches the FizzBuzz branch."),
  M("What does this print?",["True","False","5","It raises an error"],1,"<code>x &gt; 3</code> is True but <code>x &lt; 4</code> is False, and <code>and</code> needs both to be True.",`x = 5
print(x > 3 and x < 4)`),
  M("What does this print?",["3","1","0","-1"],2,"The loop runs while n &gt; 0: 3→2→1→0. At 0 the condition fails and the loop exits.",`n = 3
while n > 0:
    n -= 1
print(n)`)
 ]},
{t:"Strings and lists",
 lesson:"Strings and lists share indexing and slicing: <code>s[start:stop:step]</code>, with stop excluded. Strings can't be changed in place. List methods like <code>sort()</code> change the list itself and return <code>None</code>.",
 ex:`s = "  Hello World  "
words = s.strip().lower().split()   # ['hello', 'world']
print(" ".join(words[::-1]))        # world hello
nums = [3, 1, 2]
nums.sort()                         # nums is now [1, 2, 3]
evens = [x for x in range(10) if x % 2 == 0]`,
 build:"A word counter for a paragraph; remove duplicates from a list while keeping order.",
 solve:["LC 344 Reverse String","LC 1768 Merge Strings Alternately","LC 125 Valid Palindrome","LC 58 Length of Last Word"],
 gate:"Explain what s[::-1], ' '.join(words) and [x*2 for x in xs if x > 0] do without running them.",
 drills:[
  M("What does this print?",["pyt","yth","ytho","pyth"],1,"Indexes 1, 2 and 3 are y, t and h. Index 4 is excluded.",`s = "python"
print(s[1:4])`),
  M("What does this print?",["['a', 'b', 'c']","['a', 'b', '', 'c']","['a,b,,c']","['a', 'b', None, 'c']"],1,"Two commas in a row produce an empty string between them.",`print("a,b,,c".split(","))`),
  T("Join the list <code>words</code> into one string <code>s</code> with a space between each word.",[`s = " ".join(words)`],`s = " ".join(words)`,"<code>join</code> is a method on the separator string and takes the list as its argument."),
  T("Using a list comprehension, make <code>sq</code> the squares of every number in <code>nums</code>.",[],`sq = [x * x for x in nums]`,"The pattern is <code>[expression for item in list]</code>. <code>x**2</code> works too.",{re:/^sq=\[(\w+)(?:\*\*2|\*\1)for\1innums\]$/}),
  M("What does this print?",["[1, 2, 3]","[3, 1, 2]","None","It raises an error"],2,"<code>sort()</code> sorts in place and returns None. Use <code>sorted(xs)</code> to get a new list.",`xs = [3, 1, 2]
ys = xs.sort()
print(ys)`)
 ]},
{t:"Dicts, sets and your first pattern",
 lesson:"A dict maps keys to values, and looking up a key is nearly instant however big the dict is. That turns many O(n²) \"check every pair\" problems into a single pass. A set is like a dict with only keys, which makes it ideal for \"have I seen this already?\"",
 ex:`def two_sum(nums, target):
    seen = {}                      # value -> index
    for i, x in enumerate(nums):
        if target - x in seen:
            return [seen[target - x], i]
        seen[x] = i`,
 build:"A character frequency counter; find the elements two lists have in common.",
 solve:["LC 1 Two Sum","LC 217 Contains Duplicate","LC 242 Valid Anagram","LC 383 Ransom Note"],
 gate:"Two Sum with a dict from a blank file, then explain why it's O(n) while the double loop is O(n²).",
 drills:[
  T("Increase the count for word <code>w</code> in the dict <code>counts</code>, starting from 0 if it's missing.",[`counts[w] = counts.get(w, 0) + 1`],`counts[w] = counts.get(w, 0) + 1`,"<code>.get(key, default)</code> returns the default instead of raising KeyError."),
  M("What happens?",["It prints None","It prints 0","KeyError: 'b'","It prints an empty string"],2,"Square brackets on a missing key raise KeyError. Use <code>d.get('b')</code> to get None instead.",`d = {"a": 1}
print(d["b"])`),
  M("In the one-pass Two Sum, what do you store in the dict?",["index → value","value → index","value → count","target → index"],1,"You look up <code>target - x</code> by value and need its index back."),
  M("What does this print?",["5","3","2","It raises an error"],1,"A set keeps only unique items: {1, 2, 3}.",`print(len(set([1, 1, 2, 3, 3])))`),
  T("Import <code>Counter</code> from the standard library.",[`from collections import Counter`],`from collections import Counter`,"<code>Counter(list)</code> counts everything in one line. It's in <code>collections</code>.")
 ]},
{t:"Functions and reading errors",
 lesson:"A function takes inputs and returns a value. If it has no <code>return</code>, it gives back <code>None</code>. When code crashes, Python prints a traceback: read the <b>last line</b> first, then find the last line that points at <b>your</b> file. The Errors tab has the full guide.",
 ex:`def safe_int(text, default=0):
    try:
        return int(text)
    except ValueError:
        return default

print(safe_int("42"), safe_int("abc"))   # 42 0`,
 build:"Rewrite Days 1–4 as functions. Then break code on purpose to trigger 8 different errors from the Errors tab, and fix each one.",
 solve:["LC 1480 Running Sum of 1d Array","LC 1672 Richest Customer Wealth","LC 9 Palindrome Number"],
 gate:"Given any traceback, point to the error type, your file's line and the fix within 2 minutes.",
 drills:[
  M("What does this print?",["6","3","None","It raises an error"],2,"The function computes x*2 but never returns it, so the call gives None.",`def f(x):
    x * 2
print(f(3))`),
  M("A traceback is 20 lines long. Where do you look first?",["The first line","The last line","The middle","The longest line"],1,"The last line holds the error type and message. Then go up to the last line in your own file."),
  M("Which except clause catches <code>int(\"abc\")</code>?",["except TypeError","except KeyError","except ValueError","except SyntaxError"],2,"The type (str) is fine, but the value can't become an int, so Python raises ValueError."),
  M("What does <code>greet()</code> return?",["\"Hi \"","\"Hi there\"","None","TypeError: missing argument"],1,"With no argument passed, the default value \"there\" is used.",`def greet(name="there"):
    return "Hi " + name`),
  M("What does this error mean?",["You misspelled a variable","Lines inside a block aren't indented consistently","A module is missing","You divided by zero"],1,"Python uses indentation to define blocks. Use 4 spaces and never mix tabs with spaces.",`IndentationError: expected an indented block after 'if' statement on line 3`)
 ]},
{t:"Files, modules, pip and venv",
 lesson:"Give every project its own virtual environment so its libraries don't clash with other projects. Activate it, then <code>pip install</code>. Open files with <code>with open()</code> so they close automatically.",
 ex:`# terminal
python -m venv .venv
.venv\\Scripts\\activate      # Windows (Mac/Linux: source .venv/bin/activate)
pip install requests

# python
import csv, json
with open("expenses.csv") as f:
    rows = list(csv.DictReader(f))   # each row is a dict of strings
total = sum(float(r["amount"]) for r in rows)
with open("out.json", "w") as f:
    json.dump({"total": total}, f)`,
 build:"Read an expenses CSV, print totals by category and save them as JSON. Then fetch a public API with requests and print one field.",
 solve:["HackerRank: Find a String","HackerRank: Lists"],
 gate:"Create a venv, install a library and import it, from memory, in a fresh folder.",
 drills:[
  T("Create a virtual environment named <code>.venv</code> from the terminal.",[],`python -m venv .venv`,"<code>-m venv</code> runs Python's built-in venv module.",{re:/^(python3?|py)-mvenv\.venv$/}),
  M("What's the fix?",["Restart your computer","Activate your venv, then pip install requests","Rename your file to requests.py","Use import Requests"],1,"The library isn't installed in the environment that's running your code.",`ModuleNotFoundError: No module named 'requests'`),
  T("Open <code>data.csv</code> for reading as <code>f</code> using a <code>with</code> block (first line only).",[],`with open("data.csv") as f:`,"<code>with</code> closes the file for you, even if an error happens.",{re:/^withopen\('data\.csv'(,'r')?\)asf:$/}),
  M("What's the difference between json.load and json.loads?",["None","load reads from a file; loads reads from a string","loads is faster","load is for lists only"],1,"The s stands for string. The same goes for dump and dumps."),
  M("Each row from csv.DictReader is…",["a list of numbers","a dict whose keys are the header names and whose values are strings","a tuple","a pandas row"],1,"Every value is text, so convert with float() or int() before doing math.")
 ]},
{t:"Classes and Week 1 review",review:true,
 lesson:"A class bundles data with the functions that use it. <code>__init__</code> runs when you create an object, and <code>self</code> is that object. <code>@dataclass</code> writes <code>__init__</code> and a readable print format for you.",
 ex:`from dataclasses import dataclass

@dataclass
class Task:
    title: str
    done: bool = False

t = Task("Learn classes")
t.done = True
print(t)   # Task(title='Learn classes', done=True)`,
 build:"A to-do command-line app (add, list, done, delete) that saves to JSON, using a Task class.",
 solve:["Redo any 5 problems from this week in a blank file, 15 minutes each"],
 gate:"Week 1 test: all 5 redos pass with no help. If any fail, repeat that day before moving on.",
 drills:[
  M("Inside a method, what is <code>self</code>?",["The class itself","The specific object the method was called on","A global variable","The parent class"],1,"<code>a.method()</code> passes <code>a</code> in as self automatically."),
  T("Write the first line of an <code>__init__</code> method that takes <code>name</code>.",[`def __init__(self, name):`],`def __init__(self, name):`,"There are two underscores on each side, and <code>self</code> always comes first."),
  M("What does this print?",["5","0","None","It raises an error"],1,"a and b are separate objects, so changing a.n doesn't touch b.n.",`class A:

a = A(); b = A()
a.n = 5

  M("What does @dataclass generate for you?",["A database table","__init__ and __repr__ (plus equality)","A REST API","Type checking at runtime"],1,"It saves you writing boilerplate. Type hints are still not enforced at runtime.")
 ]},
{t:"SQL basics",
 lesson:"You write SQL as SELECT, FROM, WHERE, but it <b>runs</b> as FROM → WHERE → SELECT → ORDER BY → LIMIT. NULL means \"no value\", so test it with <code>IS NULL</code>, never <code>= NULL</code>.",
 ex:`SELECT name, salary
FROM employees
WHERE dept = 'Sales' AND manager_id IS NOT NULL
ORDER BY salary DESC
LIMIT 5;`,
 build:"Create a SQLite database from your Day 6 expenses CSV and query it from Python with sqlite3.",
 solve:["LC 1757 Recyclable and Low Fat Products","LC 584 Find Customer Referee","LC 595 Big Countries","LC 1148 Article Views I","LC 1683 Invalid Tweets"],
 gate:"Write five filtering queries against your own table without checking syntax.",
 drills:[
  T("Select the <code>name</code> of users older than 30 from table <code>users</code>.",[`SELECT name FROM users WHERE age > 30`],`SELECT name FROM users WHERE age > 30;`,"Clause order: SELECT, then FROM, then WHERE.",{sql:true}),
  M("Which correctly finds rows where email is missing?",["WHERE email = NULL","WHERE email IS NULL","WHERE email == ''","WHERE NOT email"],1,"Any comparison with NULL using = gives unknown, so it matches nothing."),
  M("Which clause does the database run first?",["SELECT","WHERE","FROM","ORDER BY"],2,"It has to know which table it's reading before it can filter or select."),
  T("Get the 5 highest-paid rows from <code>emp</code> (all columns, by <code>salary</code>).",[`SELECT * FROM emp ORDER BY salary DESC LIMIT 5`],`SELECT * FROM emp ORDER BY salary DESC LIMIT 5;`,"Sort first with DESC for highest first, then LIMIT.",{sql:true})
 ]},
{t:"SQL aggregation",
 lesson:"GROUP BY collapses rows into one row per group, and aggregates like COUNT, SUM and AVG summarize each group. WHERE filters rows <b>before</b> grouping; HAVING filters groups <b>after</b>.",
 ex:`SELECT dept, COUNT(*) AS n, AVG(salary) AS avg_sal
FROM employees
WHERE active = 1
GROUP BY dept
HAVING COUNT(*) >= 5;`,
 build:"Monthly spend per category, plus the categories that went over budget, using HAVING.",
 solve:["LC 596 Classes More Than 5 Students","LC 1251 Average Selling Price","LC 1211 Queries Quality and Percentage","LC 1141 User Activity for the Past 30 Days I"],
 gate:"Explain the difference between WHERE and HAVING with an example.",
 drills:[
  M("You want departments with more than 10 people. Where does <code>COUNT(*) &gt; 10</code> go?",["WHERE","HAVING","SELECT","ORDER BY"],1,"WHERE runs before groups exist. HAVING filters the groups."),
  T("Count employees per <code>dept</code> in table <code>emp</code>.",[],`SELECT dept, COUNT(*) FROM emp GROUP BY dept;`,"Every non-aggregated column in SELECT must appear in GROUP BY.",{sql:true,re:/^SELECTDEPT,COUNT\(\*\)(AS\w+)?FROMEMPGROUPBYDEPT$/}),
  M("What's the difference between COUNT(email) and COUNT(*)?",["None","COUNT(email) skips NULL emails","COUNT(*) skips NULLs","COUNT(email) counts distinct emails"],1,"Use COUNT(DISTINCT email) if you want unique values."),
  M("You get the error <i>\"column 'name' must appear in the GROUP BY clause\"</i>. What's the fix?",["Add name to GROUP BY or wrap it in an aggregate like MAX(name)","Remove GROUP BY","Use DISTINCT","Rename the column"],0,"Each group returns one row, so the database needs to know which single name to show."),
  T("Write a CASE expression: <code>'big'</code> when <code>amount</code> &gt; 100, otherwise <code>'small'</code>.",[`CASE WHEN amount > 100 THEN 'big' ELSE 'small' END`],`CASE WHEN amount > 100 THEN 'big' ELSE 'small' END`,"CASE is SQL's if/else. Don't forget END.",{sql:true})
 ]},
{t:"SQL joins",
 lesson:"A join matches rows from two tables on a condition. INNER keeps only rows that match. LEFT keeps every row from the left table and fills the right side with NULL where there's no match, which is how you find \"customers with no orders\".",
 ex:`SELECT c.name
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
WHERE o.id IS NULL;`,
 build:"Add a customers table and a transactions table; find customers with zero transactions.",
 solve:["LC 175 Combine Two Tables","LC 1378 Replace Employee ID With The Unique Identifier","LC 1581 Customer Who Visited but Did Not Make Any Transactions","LC 197 Rising Temperature","LC 570 Managers with at Least 5 Direct Reports"],
 gate:"Solve the anti-join problem two ways: with LEFT JOIN and with NOT EXISTS.",
 drills:[
  M("Which join keeps every row from the first table, even those with no match?",["INNER JOIN","LEFT JOIN","CROSS JOIN","SELF JOIN"],1,"Unmatched rows get NULL in the right table's columns."),
  T("Find names of customers with no orders. Use aliases <code>c</code> (customers) and <code>o</code> (orders), joining on <code>c.id = o.customer_id</code>.",[`SELECT c.name FROM customers c LEFT JOIN orders o ON c.id = o.customer_id WHERE o.id IS NULL`,`SELECT c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL`],`SELECT c.name
FROM customers c
LEFT JOIN orders o ON c.id = o.customer_id
WHERE o.id IS NULL;`,"This is the anti-join pattern: LEFT JOIN, then keep the rows where the right side is NULL.",{sql:true}),
  M("A customer has 3 orders. After an INNER JOIN of customers to orders, how many rows does that customer have?",["1","3","0","It depends on SELECT"],1,"A one-to-many join repeats the customer once per order. Watch for this when you SUM afterwards."),
  M("When do you need a self join?",["Joining a table to a backup copy","When rows reference other rows in the same table, like an employee's manager","When there's no foreign key","Never, it's an anti-pattern"],1,"Alias the table twice: <code>employees e JOIN employees m ON e.manager_id = m.id</code>.")
 ]},
{t:"CTEs and window functions",
 lesson:"Window functions calculate across related rows without collapsing them. PARTITION BY sets the groups and ORDER BY sets the order inside each group. You can't filter on a window function in WHERE, so wrap the query in a CTE first.",
 ex:`WITH ranked AS (
  SELECT name, dept, salary,
         DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk
  FROM employees
)
SELECT * FROM ranked WHERE rnk <= 3;`,
 build:"Top 2 spends per category; a running total by date.",
 solve:["LC 176 Second Highest Salary","LC 178 Rank Scores","LC 184 Department Highest Salary","LC 185 Department Top Three Salaries","LC 180 Consecutive Numbers"],
 gate:"Write \"top N per group\" in a blank editor in under 10 minutes.",
 drills:[
  M("Salaries are 100, 100, 90. What do RANK and DENSE_RANK give the 90?",["RANK 3, DENSE_RANK 2","RANK 2, DENSE_RANK 3","Both 2","Both 3"],0,"RANK skips numbers after a tie; DENSE_RANK doesn't."),
  T("Number rows within each <code>dept</code> from highest to lowest <code>salary</code>.",[`ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC)`],`ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC)`,"PARTITION BY = per group, ORDER BY = order within the group.",{sql:true}),
  M("Why does <code>WHERE ROW_NUMBER() OVER (...) = 1</code> fail?",["Syntax typo","Window functions are computed after WHERE runs","ROW_NUMBER needs GROUP BY","It works fine"],1,"Compute it in a CTE or subquery, then filter in the outer query."),

 ]},

{t:"Two pointers and sliding window",
 lesson:"Two pointers start at both ends of sorted data and walk inward. A sliding window grows on the right and shrinks on the left while keeping a condition true.",
 ex:`def longest_unique(s):
    seen, left, best = {}, 0, 0
    for right, ch in enumerate(s):
        if ch in seen and seen[ch] >= left:
            left = seen[ch] + 1
        seen[ch] = right
        best = max(best, right - left + 1)
    return best`,

{t:"Stacks and binary search",
 lesson:"A stack is last-in, first-out, which suits matching brackets and \"next greater\" questions. Binary search halves a sorted range at every step, so it's O(log n).",
 ex:`def binary_search(nums, target):
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] == target:
            return mid
        if nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1`,

{t:"Trees and graphs (BFS/DFS)",
 lesson:"Tree problems are solved with recursion: solve for the children, then combine the answers at the node. Graphs and grids use BFS (a queue, level by level) or DFS (recursion or a stack), always with a visited check.",
 ex:`from collections import deque
def num_islands(grid):
    rows, cols, count = len(grid), len(grid[0]), 0
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == "1":
                count += 1
                q = deque([(r, c)]); grid[r][c] = "0"
                while q:
                    i, j = q.popleft()
                    for di, dj in ((1,0),(-1,0),(0,1),(0,-1)):
                        ni, nj = i + di, j + dj
                        if 0 <= ni < rows and 0 <= nj < cols and grid[ni][nj] == "1":
                            grid[ni][nj] = "0"; q.append((ni, nj))
    return count`,

{t:"Heaps, intervals and intro to DP",
 lesson:"<code>heapq</code> gives you a min-heap: the smallest item is always at <code>h[0]</code>. Interval problems start by sorting on start time. Dynamic programming is recursion plus remembering answers you've already computed.",
 ex:`def coin_change(coins, amount):
    dp = [0] + [float("inf")] * amount
    for a in range(1, amount + 1):
        for c in coins:
            if c <= a:
                dp[a] = min(dp[a], dp[a - c] + 1)
    return dp[amount] if dp[amount] != float("inf") else -1`,

WORKDIR /app

COPY . .
